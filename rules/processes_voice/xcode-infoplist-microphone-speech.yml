rules:
  - id: lexcode.voice.xcode-infoplist-microphone-speech
    languages: [generic]
    severity: INFO
    message: Sets INFOPLIST_KEY_$KEY in an Xcode project, the build setting Xcode writes into the generated Info.plist as the permission prompt shown before the app records from the microphone or sends speech for recognition, which is processing a human voice (processes_voice).
    # The build-setting copy of the keys lexcode.voice.ios-plist-microphone-speech reads. A setting may
    # carry an SDK condition; an empty value declares nothing and is left out. Each build configuration
    # that sets a key is its own match.
    pattern-regex: '(?m)^[ \t]*+"?INFOPLIST_KEY_(?<KEY>NSMicrophoneUsageDescription|NSSpeechRecognitionUsageDescription)(?:\[[^\]\n]*+\])?"?[ \t]*+=[ \t]*+(?!""[ \t]*+;|;)'
    paths:
      include:
        - "project.pbxproj"
        - "xcode-infoplist-microphone-speech.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/Tests/**"
        - "**/UITests/**"
    metadata:
      activity: processes_voice
      mentioned: performs
      definition: https://lexlint.io/activities/processes-voice
      provenance: ungovr-original
      license: MIT
