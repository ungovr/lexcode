rules:
  - id: lexcode.voice.ios-plist-microphone-speech
    languages: [xml]
    severity: INFO
    message: Declares $K in an Apple app's Info.plist, the permission prompt the system shows before the app records from the microphone or sends speech for recognition, which may be processing a human voice (processes_voice).
    # An app carries a usage description only for an API it calls: without it the call is refused or the
    # app is stopped. Speech recognition transcribes a voice. Microphone capture is recording a voice, as
    # the microphone-capture rules in the other languages hold. Background audio playback, Siri intents
    # (the system hears the voice and hands the app structured data) and the music library are left out.
    patterns:
      - pattern: <key>$K</key>
      - metavariable-regex:
          metavariable: $K
          regex: ^(NSMicrophoneUsageDescription|NSSpeechRecognitionUsageDescription)$
    paths:
      # Xcode's older templates name the file <Target>-Info.plist.
      include:
        - "Info.plist"
        - "*-Info.plist"
        - "ios-plist-microphone-speech.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/Tests/**"
        - "**/UITests/**"
    metadata:
      activity: processes_voice
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/processes-voice
      provenance: ungovr-original
      license: MIT
