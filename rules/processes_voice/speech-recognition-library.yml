rules:
  - id: lexcode.voice.speech-recognition-library
    languages: [javascript, typescript]
    severity: INFO
    message: Starts speech recognition through an app library, which listens to a person speaking and turns it into text (processes_voice).
    patterns:
      - pattern-either:
          - pattern: ExpoSpeechRecognitionModule.start(...)
          - pattern: SpeechRecognition.startListening(...)
          - patterns:
              - pattern: Voice.start(...)
              - pattern-inside: |
                  import Voice from "@react-native-voice/voice";
                  ...
    metadata:
      activity: processes_voice
      mentioned: performs
      definition: https://lexlint.io/activities/processes-voice
      provenance: ungovr-original
      license: MIT
