rules:
  - id: lexcode.tracking.cs-tracking-cookie
    languages: [csharp]
    severity: INFO
    message: Writes a cookie whose name marks it as an analytics, advertising or visitor-identifier cookie, which is tracking devices (tracks_devices).
    patterns:
      - pattern-either:
          # ASP.NET Core: a cookie appended to the response (HttpResponse.Cookies).
          - pattern: $R.Cookies.Append($N, $V, ...)
          # ASP.NET (System.Web): a response cookie, constructed or target-typed. The namespace is
          # not imported implicitly, so it is written fully qualified: the engine resolves `using`
          # and aliases, and the app's own class of the same name is not read as it. A
          # System.Net.Cookie is not matched: it is an outbound HTTP client's cookie jar (a
          # CookieContainer), which sets nothing on a visitor's browser or device.
          - pattern: new System.Web.HttpCookie($N, $V, ...)
          - pattern: System.Web.HttpCookie $C = new($N, $V, ...);
          # With an object initializer (which `new T(...)` alone does not match): the value given
          # to the constructor, or set as Value in the initializer.
          - pattern: 'new System.Web.HttpCookie($N, $V, ...) { ... }'
          - pattern: 'new System.Web.HttpCookie($N) { ..., Value = $V, ... }'
      - metavariable-regex:
          metavariable: $N
          regex: (?i)^@?"(_ga(_.*)?|_gid|_gat(_.*)?|_gcl_.*|_fbp|_fbc|_hjid|_hjSessionUser.*|ajs_(anonymous|user)_id|mp_.*_mixpanel|ph_.*_posthog|amplitude_id.*|_uetvid|_uetsid|_clck|_clsk|__utm.|ai_user|ai_session|(visitor|tracking|anonymous|device|browser)_?(id|token|uuid)|fingerprint)"$
      # A cookie written with an empty or null value is being removed (the standard way to
      # withdraw a tracking cookie on a consent change), not set.
      - metavariable-regex:
          metavariable: $V
          regex: ^(?!(?:""|@""|null|string\.Empty|String\.Empty)$)
      - focus-metavariable: $N
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
