rules:
  - id: lexcode.tracking.js-fingerprint
    languages: [javascript, typescript]
    severity: INFO
    message: Fingerprints the visitor's browser or device with a fingerprinting library, which is tracking devices (tracks_devices).
    pattern-either:
      - pattern: FingerprintJS.load(...)
      - pattern: Fingerprint2.get(...)
      - pattern: Fingerprint2.getV18(...)
      - pattern: new ClientJS()
      - pattern: new Fingerprint2(...)
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
