rules:
  - id: lexcode.tracking.java-analytics-calls
    languages: [java]
    severity: INFO
    message: Sends visits or events to a third-party analytics, attribution or crash-reporting service (Firebase Analytics and Crashlytics, Segment, Mixpanel, Amplitude, AppsFlyer, Adjust, Meta app events, Sentry for Android or Google Analytics) that follows the device with its own id, which is tracking devices (tracks_devices). Starting an Android crash-reporting SDK counts too, because a crash-reporting service is one of the counterparties this activity names.
    patterns:
      - pattern-either:
          - pattern-regex: '(?s)\A(?=.*Firebase).*'
          - pattern-regex: '(?s)\A(?=.*Mixpanel).*'
          - pattern-regex: '(?s)\A(?=.*com\.segment).*'
          - pattern-regex: '(?s)\A(?=.*Amplitude).*'
          - pattern-regex: '(?s)\A(?=.*AppsFlyerLib).*'
          - pattern-regex: '(?s)\A(?=.*AdjustConfig).*'
          - pattern-regex: '(?s)\A(?=.*AppEventsLogger).*'
          - pattern-regex: '(?s)\A(?=.*SentryAndroid).*'
          - pattern-regex: '(?s)\A(?=.*Bugsnag).*'
          - pattern-regex: '(?s)\A(?=.*google-analytics).*'
      - pattern-either:
          - pattern: FirebaseAnalytics.getInstance(...)
          - pattern: (FirebaseAnalytics $F).logEvent(...)
          - pattern: (FirebaseAnalytics $F).setUserId(...)
          - pattern: (FirebaseAnalytics $F).setUserProperty(...)
          - pattern: SentryAndroid.init(...)
          - pattern: Bugsnag.start(...)
          - pattern: FirebaseCrashlytics.getInstance().setUserId(...)
          - pattern: (FirebaseCrashlytics $C).setUserId(...)
          - pattern: MixpanelAPI.getInstance(...)
          - pattern: new MixpanelAPI(...)
          - pattern: (MixpanelAPI $M).track(...)
          - pattern: AppEventsLogger.newLogger(...)
          - pattern: AppsFlyerLib.getInstance().init(...)
          - pattern: AppsFlyerLib.getInstance().start(...)
          - pattern: new AdjustConfig(...)
          - pattern: '"=~/.*google-analytics\.com\/(g\/|mp\/)?collect.*/"'
          - patterns:
              - pattern-either:
                  - pattern: TrackMessage.builder(...)
                  - pattern: IdentifyMessage.builder(...)
                  - pattern: ScreenMessage.builder(...)
                  - pattern: PageMessage.builder(...)
              - pattern-inside: |
                  import com.segment.analytics.messages.$X;
                  ...
          - patterns:
              - pattern-either:
                  - pattern: new Amplitude(...)
                  - pattern: (Amplitude $A).track(...)
                  - pattern: (Amplitude $A).logEvent(...)
              - pattern-either:
                  - pattern-inside: |
                      import com.amplitude.android.Amplitude;
                      ...
                  - pattern-inside: |
                      import com.amplitude.api.Amplitude;
                      ...
                  - pattern-inside: |
                      import com.amplitude.Amplitude;
                      ...
          - patterns:
              - pattern-either:
                  - pattern: Analytics.with(...)
                  - pattern: new Analytics.Builder(...)
                  - pattern: Analytics.builder(...)
                  - pattern: (Analytics $A).track(...)
                  - pattern: (Analytics $A).identify(...)
                  - pattern: (Analytics $A).screen(...)
              - pattern-inside: |
                  import com.segment.analytics.Analytics;
                  ...
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
