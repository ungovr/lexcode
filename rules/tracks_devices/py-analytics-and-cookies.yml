rules:
  - id: lexcode.tracking.py-analytics-and-cookies
    languages: [python]
    severity: INFO
    message: Sends events to a third-party analytics service or sets an analytics or visitor-identifier cookie, which is tracking devices (tracks_devices).
    pattern-either:
      - pattern: posthog.capture(...)
      - pattern: posthog.identify(...)
      - pattern: Posthog(...)
      - pattern: Mixpanel(...)
      - pattern: Amplitude(...)
      - pattern: segment.analytics.track(...)
      - patterns:
          - pattern-either:
              - pattern: analytics.track(...)
              - pattern: analytics.identify(...)
              - pattern: analytics.page(...)
          - pattern-either:
              - pattern-inside: |
                  import segment.analytics as analytics
                  ...
              - pattern-inside: |
                  import analytics
                  ...
      - patterns:
          - pattern-either:
              - pattern: $R.set_cookie("$N", ...)
              - pattern: $R.set_cookie(key="$N", ...)
          - metavariable-regex:
              metavariable: $N
              regex: (?i)^(_ga(_.*)?|_gid|_gat(_.*)?|_gcl_.*|_fbp|_fbc|_hjid|_hjSessionUser.*|ajs_(anonymous|user)_id|mp_.*_mixpanel|ph_.*_posthog|amplitude_id.*|_uetvid|_uetsid|_clck|_clsk|__utm.|(visitor|tracking|anonymous|device)_?id|fingerprint)$
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
