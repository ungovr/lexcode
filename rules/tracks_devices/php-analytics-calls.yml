rules:
  - id: lexcode.tracking.php-analytics-calls
    languages: [php]
    severity: INFO
    message: Sends visits or events from the server to a third-party analytics or advertising service (Segment, PostHog, Mixpanel, Matomo, Amplitude, the Google Analytics Measurement Protocol or the Meta Conversions API) that follows the visitor with its own id, which is tracking devices (tracks_devices).
    # One branch per vendor, each with its own import guard, so one vendor's import cannot admit
    # another's call and an app's own class of the same short name is not read as the vendor's.
    # The engine's `use X;` also matches `use X as Y;`, so each short-name branch steps aside where
    # the class is aliased and the short name may be the app's own.
    pattern-either:
      # Segment (segmentio/analytics-php).
      - patterns:
          - pattern-either:
              - pattern: \Segment\Segment::$M(...)
              - patterns:
                  - pattern: Segment::$M(...)
                  - pattern-inside: |
                      use Segment\Segment;
                      ...
                  - pattern-not-inside: |
                      use Segment\Segment as $AL;
                      ...
              - patterns:
                  - pattern: $A::$M(...)
                  - pattern-inside: |
                      use Segment\Segment as $A;
                      ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(init|track|identify|page|screen|group|alias)$
      # PostHog (posthog/posthog-php).
      - patterns:
          - pattern-either:
              - pattern: \PostHog\PostHog::$M(...)
              - patterns:
                  - pattern: PostHog::$M(...)
                  - pattern-inside: |
                      use PostHog\PostHog;
                      ...
                  - pattern-not-inside: |
                      use PostHog\PostHog as $AL;
                      ...
              - patterns:
                  - pattern: $A::$M(...)
                  - pattern-inside: |
                      use PostHog\PostHog as $A;
                      ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(init|capture|identify|alias|groupIdentify)$
      # Mixpanel (mixpanel/mixpanel-php), a class in the global namespace: fully qualified,
      # imported, aliased, or bare in a file with no namespace. A one-segment `use Mixpanel;`
      # pattern also matches `use App\X\Mixpanel;`, so the plain import of the global class is
      # checked on the file's text, as php-phar-build checks Phar's. (The aliased form does not
      # match an app's namespace, measured on Opengrep 1.33.1.)
      - pattern: \Mixpanel::getInstance(...)
      - patterns:
          - pattern: Mixpanel::getInstance(...)
          - pattern-regex: '(?s)\A(?=.*\buse\s+\\?Mixpanel\s*;).*'
      - patterns:
          - pattern: Mixpanel::getInstance(...)
          - pattern-not-inside: |
              namespace $NS;
              ...
          - pattern-not-inside: |
              use Mixpanel;
              ...
      - patterns:
          - pattern: $A::getInstance(...)
          - pattern-inside: |
              use Mixpanel as $A;
              ...
      # Matomo (matomo/matomo-php-tracker), and its older Piwik name, in the global namespace.
      # The import is checked on the file's text, as Mixpanel's is.
      - patterns:
          - pattern-either:
              - pattern: new \MatomoTracker(...)
              - pattern: new \PiwikTracker(...)
              - patterns:
                  - pattern-either:
                      - pattern: new MatomoTracker(...)
                      - pattern: new PiwikTracker(...)
                  - pattern-not-inside: |
                      namespace $NS;
                      ...
                  - pattern-not-inside: |
                      use MatomoTracker;
                      ...
                  - pattern-not-inside: |
                      use PiwikTracker;
                      ...
              - patterns:
                  - pattern: new MatomoTracker(...)
                  - pattern-regex: '(?s)\A(?=.*\buse\s+\\?MatomoTracker\s*;).*'
              - patterns:
                  - pattern: new $A(...)
                  - pattern-inside: |
                      use MatomoTracker as $A;
                      ...
      # Amplitude (zumba/amplitude-php).
      - patterns:
          - pattern-either:
              - pattern: \Zumba\Amplitude\Amplitude::getInstance(...)
              - pattern: new \Zumba\Amplitude\Amplitude(...)
              - patterns:
                  - pattern-either:
                      - pattern: Amplitude::getInstance(...)
                      - pattern: new Amplitude(...)
                  - pattern-inside: |
                      use Zumba\Amplitude\Amplitude;
                      ...
                  - pattern-not-inside: |
                      use Zumba\Amplitude\Amplitude as $AL;
                      ...
              - patterns:
                  - pattern-either:
                      - pattern: $A::getInstance(...)
                      - pattern: new $A(...)
                  - pattern-inside: |
                      use Zumba\Amplitude\Amplitude as $A;
                      ...
      # Meta Conversions API (facebook/php-business-sdk): server-side pixel events.
      - patterns:
          - pattern-either:
              - pattern: new \FacebookAds\Object\ServerSide\EventRequest(...)
              - patterns:
                  - pattern: new EventRequest(...)
                  - pattern-inside: |
                      use FacebookAds\Object\ServerSide\EventRequest;
                      ...
                  - pattern-not-inside: |
                      use FacebookAds\Object\ServerSide\EventRequest as $AL;
                      ...
              - patterns:
                  - pattern: new $A(...)
                  - pattern-inside: |
                      use FacebookAds\Object\ServerSide\EventRequest as $A;
                      ...
      # Google Analytics Measurement Protocol: a hit sent to the collect endpoint. Matched on the
      # string's text, which is cheaper than testing every string in every file.
      - pattern-regex: '["''](?:https?:)?(?://)?(?:www\.|ssl\.|region1\.)?google-analytics\.com/(?:mp/|g/|debug/mp/)?collect\b'
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
