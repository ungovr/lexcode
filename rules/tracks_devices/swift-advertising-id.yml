rules:
  - id: lexcode.tracking.swift-advertising-id
    languages: [swift]
    severity: INFO
    message: Reads the iOS advertising identifier (the IDFA, through AdSupport) or asks the person for permission to track them across other companies' apps and sites (App Tracking Transparency), which is tracking devices (tracks_devices).
    # Both frameworks come only from their own import, so each type is written module-qualified:
    # the engine resolves `import AdSupport` and `import AppTrackingTransparency`, and an app's own
    # ASIdentifierManager or ATTrackingManager in a file without the import is not read as Apple's.
    # Reading the tracking authorization status alone, with no request and no identifier read, is
    # not matched, and neither is the deprecated isAdvertisingTrackingEnabled flag.
    pattern-either:
      # The IDFA read, head-first: the engine does not resolve a module-qualified head of a chain
      # under `try` or `await`, so the shared manager is matched inside the property read.
      - patterns:
          - pattern: AdSupport.ASIdentifierManager.shared()
          - pattern-inside: $X.advertisingIdentifier
      # The request in all its shapes: a trailing closure, a labeled completion handler and the
      # async form (a direct static call, which the engine resolves under `await` and `try`).
      - pattern: AppTrackingTransparency.ATTrackingManager.requestTrackingAuthorization(...)
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
