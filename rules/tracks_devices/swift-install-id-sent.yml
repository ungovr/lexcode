# An install ID the app makes for itself (a random UUID kept in its own defaults or Keychain) and
# sends with its requests identifies one device across visits as the vendor's identifier does, so
# it is read beside swift-device-id-sent, which follows identifierForVendor. The mint and the send
# usually sit in different files (Wikipedia for iOS mints in one extension and sends from a
# service), and taint does not cross a file, so the send is read by its names: a request header
# whose name says it carries an install or device ID, or a header filled from a value named as an
# install ID. A query item is swift-install-id-query-sent's, which follows it to the request.
#
# - Header names: `X-...-Install-Id`, `X-...-Device-Id` or `-Device-UUID`, and
#   `X-...-App-Instance-Id` (or `-UUID`), in any case. A name that also says request, trace,
#   correlation, transaction, idempotency, message, session or nonce is left out, since those
#   change with each request or visit.
# - `X-<ACRONYM>-UUID`, the acronym in capitals, two to five letters and nothing else
#   (Wikipedia's `X-WMF-UUID`, which it fills from `xWMFUUID` in one of its two sends, so the
#   value's name cannot carry it): a name that holds only the vendor and a UUID names nothing the
#   request is about, so the UUID is the client's. An acronym for an account, request or document
#   (`X-ORG-UUID`, `X-USR-UUID`, `X-REQ-UUID`) is left out. A header named for any other UUID
#   (`X-Workspace-UUID`, `X-Organization-UUID`, `X-Cmux-Workspace-UUID`) is not read: most name
#   the account, project or document the request is about.
# - `Installation-Id` is not read: it is GitHub's (and other platforms') name for an app's
#   installation in an organization (`X-GitHub-Installation-Id`), not a device.
# - A header named `X-Device-Id` is read though a query item named `device_id` is not (in the query
#   rule): a header describes the client that sends it, and in real Swift code it carries the
#   phone's own ID, while a query item names the resource the request is about, which in an app
#   that drives cameras, locks or other hardware is that device.
# - A value named as an install ID (`installID`, `appInstallId`, `installID.uuidString`) put into
#   a header, whatever the header's name.
#
# Keeping the ID only on the device (a defaults or Keychain write) is not a send and is not matched.
# A header given in a dictionary (`allHTTPHeaderFields = [...]`, Alamofire's `HTTPHeaders`) is not read
# (rules/README.md, "Known Swift gaps").
# A header set from the vendor identifier is swift-device-id-sent's, and may match here too when its
# name says device ID; a session token is not matched (see the definition's exclusion).
rules:
  - id: lexcode.tracking.swift-install-id-sent
    languages: [swift]
    severity: INFO
    message: Sends an install or device ID the app keeps for itself in a request header (one named for it, or filled from a value named as an install ID), which identifies one device across visits and is tracking devices (tracks_devices).
    pattern-either:
      # a header named for an install or device ID
      - patterns:
          - pattern-either:
              - pattern: '$R.setValue($V, forHTTPHeaderField: $H)'
              - pattern: '$R.addValue($V, forHTTPHeaderField: $H)'
              # inside an extension of URLRequest, on the request itself
              - pattern: 'setValue($V, forHTTPHeaderField: $H)'
              - pattern: 'addValue($V, forHTTPHeaderField: $H)'
          - metavariable-regex:
              metavariable: $H
              regex: '^"(?:(?i:x-(?![\w-]*(?:request|trace|correlation|transaction|idempotency|message|session|nonce))(?:[a-z0-9]+-)*(?:install-?id|device-?(?:id|uuid)|app-?instance-?(?:id|uuid)))|X-(?!(?:ORG|USR|USER|ACCT|REQ|MSG|TXN|SID|DOC)-)[A-Z]{2,5}-UUID)"$'
      # any header filled from a value named as an install ID
      - patterns:
          - pattern-either:
              - pattern: '$R.setValue($V, forHTTPHeaderField: $H)'
              - pattern: '$R.addValue($V, forHTTPHeaderField: $H)'
              # inside an extension of URLRequest, on the request itself
              - pattern: 'setValue($V, forHTTPHeaderField: $H)'
              - pattern: 'addValue($V, forHTTPHeaderField: $H)'
          - metavariable-regex:
              metavariable: $V
              regex: '(?i)^(?:self\.)?(?:app_?)?install_?(?:id|uuid)(?:\??\.uuidString)?$'
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
