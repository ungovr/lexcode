rules:
  - id: lexcode.tracking.js-advertising-id
    languages: [javascript, typescript]
    severity: INFO
    message: Reads the device's advertising identifier or asks permission to track the person across apps, which is tracking devices (tracks_devices).
    pattern-either:
      - pattern: getAdvertisingId(...)
      - pattern: $A.getAdvertisingId(...)
      - pattern: requestTrackingPermissionsAsync(...)
      - pattern: $A.requestTrackingPermissionsAsync(...)
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
