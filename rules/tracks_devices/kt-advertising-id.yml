rules:
  - id: lexcode.tracking.kt-advertising-id
    languages: [kotlin]
    severity: INFO
    message: Reads an identifier that follows one Android device (the advertising id, the IMEI, MEID or subscriber id, the hardware serial or the Firebase installation id), which is tracking devices (tracks_devices).
    pattern-either:
      # The Google advertising id client, in Google's or AndroidX's package.
      - patterns:
          - pattern: AdvertisingIdClient.getAdvertisingIdInfo(...)
          - pattern-either:
              - pattern-inside: |
                  import com.google.android.gms.ads.identifier.AdvertisingIdClient
                  ...
              - pattern-inside: |
                  import com.google.android.gms.ads.identifier.*
                  ...
              - pattern-inside: |
                  import androidx.ads.identifier.AdvertisingIdClient
                  ...
      # Privileged hardware identifiers (the names are generic, so the file has to import TelephonyManager).
      - patterns:
          - pattern-either:
              - pattern: $T.imei
              - pattern: $T.getImei(...)
              - pattern: $T.meid
              - pattern: $T.getMeid(...)
              - pattern: $T.deviceId
              - pattern: $T.getDeviceId(...)
              - pattern: $T.subscriberId
              - pattern: $T.getSubscriberId(...)
              - pattern: $T.simSerialNumber
              - pattern: $T.getSimSerialNumber(...)
          - pattern-either:
              - pattern-inside: |
                  import android.telephony.TelephonyManager
                  ...
              - pattern-inside: |
                  import android.telephony.*
                  ...
      # Names that belong to one vendor or to Android.
      - pattern: Build.getSerial()
      - pattern: FirebaseInstallations.getInstance().id
      - pattern: FirebaseInstallations.getInstance().getId()
      - pattern: FirebaseInstanceId.getInstance().id
      - pattern: FirebaseInstanceId.getInstance().getId()
      - pattern: Firebase.installations.id
      - pattern: Firebase.installations.getId()
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
