rules:
  - id: lexcode.tracking.xcode-infoplist-tracking-request
    languages: [generic]
    severity: INFO
    message: Sets INFOPLIST_KEY_NSUserTrackingUsageDescription in an Xcode project, the build setting Xcode writes into the generated Info.plist as the App Tracking Transparency prompt an app must show before it reads the advertising identifier or tracks the person across other companies' apps and sites, which is tracking devices (tracks_devices).
    # The build-setting copy of the key lexcode.tracking.ios-plist-tracking-request reads. A setting may
    # carry an SDK condition; an empty value declares nothing and is left out. Each build configuration
    # that sets it is its own match.
    pattern-regex: '(?m)^[ \t]*+"?INFOPLIST_KEY_NSUserTrackingUsageDescription(?:\[[^\]\n]*+\])?"?[ \t]*+=[ \t]*+(?!""[ \t]*+;|;)'
    paths:
      include:
        - "project.pbxproj"
        - "xcode-infoplist-tracking-request.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/Tests/**"
        - "**/UITests/**"
    metadata:
      activity: tracks_devices
      mentioned: performs
      definition: https://lexlint.io/activities/tracks-devices
      provenance: ungovr-original
      license: MIT
