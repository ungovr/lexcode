# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 10 to 14 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return in a method or block lambda that also makes one of the calls below (in a
# statement, a for-each header or an if header), or a return that names a field the class sets from
# one of them. Not followed: a result one method stores at run time and another returns, a field
# derived from such a field, a call in a while header or a for initializer, and a return in a lambda
# nested in a streaming callback. The calls are the sources without their argument and name checks.
# How the scope is written, and why, is in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.generate.java-model-result-returned
    languages: [java]
    severity: INFO
    message: Returns the output of a Gemini call from a method, which may be generating content with AI that reaches users (generates_content).
    mode: taint
    pattern-sources:
      - pattern: $C.models.generateContent(...)
      - pattern: $C.models.generateContentStream(...)
      - pattern: $C.chats.create(...)
      - patterns:
          - pattern: ($T $M).$F(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^([\w.]+\.)?(GenerativeModel|ChatSession)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(generateContent|generateContentStream|generateContentAsync|sendMessage|sendMessageStream)$
    pattern-propagators:
      - pattern: $S.forEach($X -> ...)
        from: $S
        to: $X
      - pattern: $S.forEachOrdered($X -> ...)
        from: $S
        to: $X
      - pattern: $S.subscribe($X -> ...)
        from: $S
        to: $X
      - pattern: $S.map($X -> ...)
        from: $S
        to: $X
      - pattern: $S.flatMap($X -> ...)
        from: $S
        to: $X
      - pattern: $S.doOnNext($X -> ...)
        from: $S
        to: $X
      - pattern: $S.ifPresent($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenApply($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenAccept($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onPartialResponse($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onNext($X -> ...)
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern: return $X;
          - pattern-either:
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.generateContent(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKR.generateContent(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKR.generateContent(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKR.generateContent(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.generateContentStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKR.generateContentStream(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKR.generateContentStream(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKR.generateContentStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.generateContentAsync(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKR.generateContentAsync(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKR.generateContentAsync(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKR.generateContentAsync(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.sendMessage(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKR.sendMessage(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKR.sendMessage(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKR.sendMessage(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.sendMessageStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKR.sendMessageStream(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKR.sendMessageStream(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKR.sendMessageStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKC.chats.create(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKC.chats.create(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKC.chats.create(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  (...) -> {
                    ...
                    $SINKC.chats.create(...);
                    ...
                  }
              - patterns:
                  - pattern: return $X;
                  - pattern-either:
                      - pattern-inside: |
                          class $SINKCLS {
                            ...
                            $SINKT $SINKV = <... $SINKR.generateContent(...) ...>;
                            ...
                          }
                      - pattern-inside: |
                          class $SINKCLS {
                            ...
                            $SINKT $SINKV = <... $SINKR.generateContentStream(...) ...>;
                            ...
                          }
                      - pattern-inside: |
                          class $SINKCLS {
