rules:
  - id: lexcode.generate.java-model-result-returned
    languages: [java]
    severity: INFO
    message: Returns the output of a Gemini call from a method, which may be generating content with AI that reaches users (generates_content).
    mode: taint
    pattern-sources:
      - pattern: $C.models.generateContent(...)
      - pattern: $C.models.generateContentStream(...)
      - pattern: $C.chats.create(...)
      - patterns:
          - pattern: ($T $M).$F(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^([\w.]+\.)?(GenerativeModel|ChatSession)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(generateContent|generateContentStream|generateContentAsync|sendMessage|sendMessageStream)$
    pattern-propagators:
      - pattern: $S.forEach($X -> ...)
        from: $S
        to: $X
      - pattern: $S.forEachOrdered($X -> ...)
        from: $S
        to: $X
      - pattern: $S.subscribe($X -> ...)
        from: $S
        to: $X
      - pattern: $S.map($X -> ...)
        from: $S
        to: $X
      - pattern: $S.flatMap($X -> ...)
        from: $S
        to: $X
      - pattern: $S.doOnNext($X -> ...)
        from: $S
        to: $X
      - pattern: $S.ifPresent($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenApply($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenAccept($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onPartialResponse($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onNext($X -> ...)
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern: return $X;
          - pattern-not-inside: |
              @GetMapping(...)
              $R $F(...) {
                ...
              }
          - pattern-not-inside: |
              @GetMapping
              $R $F(...) {
                ...
              }
          - pattern-not-inside: |
              @PostMapping(...)
              $R $F(...) {
                ...
              }
          - pattern-not-inside: |
              @PostMapping
              $R $F(...) {
                ...
              }
          - pattern-not-inside: |
              @PutMapping(...)
              $R $F(...) {
                ...
              }
          - pattern-not-inside: |
              @PutMapping
              $R $F(...) {
                ...
