rules:
  - id: lexcode.generate.cs-genai-to-response
    languages: [csharp]
    severity: INFO
    message: Sends a Gemini response, whose kind the code does not fix, back in an HTTP response, a page or a hub message, which is generating content with AI that reaches users (generates_content).
    mode: taint
    # A library type is written fully qualified: the engine resolves a file's using lines (an
    # alias too), so the pattern also matches the short form under using, and never an app's own
    # class of the same short name. A type reached only through a global using in another file
    # is missed (rules/README.md).
    # Only a call that generates is a source here: a typed client calling its generating method,
    # an HTTP call to a Gemini model's address, or the call that sends a request message built for
    # one. A client or request object is not output, and a client obtained from a factory or the
    # service container into a local is the companion signal rule's (the engine cannot type it).
    pattern-sources:
      # The Google Gen AI SDK (Google.GenAI): Models.GenerateContentAsync on a Client. Client is
      # not a vendor-named short name, so it is read qualified only.
      - pattern: (Google.GenAI.Client $C).Models.GenerateContentAsync(...)
      - pattern: (Google.GenAI.Client $C).Models.GenerateContentStreamAsync(...)
      # Vertex AI: the PredictionServiceClient's generate calls.
      - pattern: (Google.Cloud.AIPlatform.V1.PredictionServiceClient $C).GenerateContent(...)
      - pattern: (Google.Cloud.AIPlatform.V1.PredictionServiceClient $C).GenerateContentAsync(...)
      - pattern: (Google.Cloud.AIPlatform.V1.PredictionServiceClient $C).StreamGenerateContent(...)
      # Mscc.GenerativeAI: a GenerativeModel.
      - pattern: (Mscc.GenerativeAI.GenerativeModel $C).GenerateContent(...)
      - pattern: (Mscc.GenerativeAI.GenerativeModel $C).GenerateContentStream(...)
      # The Gemini models called over HTTP with no SDK (#13205), keyed on the hosts
      # cs-genai-model-address names: generateContent and streamGenerateContent on the Gemini API
      # or on Vertex AI (a regional aiplatform host). The call is the source, not the address: a
      # page that only shows the endpoint generates nothing. The address is read to its end, so the
      # model list, a model's metadata, countTokens and embedContent are not sources. It is read as
      # cs-genai-model-address reads it: written as a literal, joined with + or formatted with
      # string.Format, a value standing for the model, the region, the project or a query value
      # such as the key; written at the call, held in a local before the send or in a member of the
      # same class, or carried by the engine from a const, a readonly field or a local. An address
      # held in another class or file is not followed; the signal rule reads the declaration there.
      - patterns:
          - pattern-either: &gemini-posts
              - pattern: $HTTP.PostAsync($URL, ...)
              - pattern: $HTTP.PostAsJsonAsync($URL, ...)
              - pattern: $HTTP.PostAsJsonAsync<$T>($URL, ...)
              - pattern: '$HTTP.PostAsync(..., requestUri: $URL, ...)'
              - pattern: '$HTTP.PostAsJsonAsync(..., requestUri: $URL, ...)'
              - pattern: '$HTTP.PostAsJsonAsync<$T>(..., requestUri: $URL, ...)'
          - metavariable-regex:
              metavariable: $URL
              regex: &gemini-address '^(?:(?:System\.)?[Ss]tring\.Format\(\s*)?(?:\$@?|@\$?)?"https://(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-|\{(?:[^{}"]|"[^"]*")*\}-|"\s*\+\s*(?:[^"]|"[^"]*")*?\s*\+\s*\$?@?"-)?aiplatform\.googleapis\.com)/(?:[^"?{]|\{(?:[^{}"]|"[^"]*")*\}|"\s*\+\s*(?:[^"]|"[^"]*")*?\s*\+\s*\$?@?")*:(?:stream)?[gG]enerateContent(?:\?(?:[^"{]|\{(?:[^{}"]|"[^"]*")*\}|"\s*\+\s*(?:[^"]|"[^"]*")*?\s*\+\s*\$?@?")*(?:"\s*\+(?:[^"]|"[^"]*")*|\{(?:[^{}"]|"[^"]*")*)?)?(?:"\s*(?:,.*\))?)?$'
      # The address held in a local (declared or assigned before the send in the same block) or
      # in a member of the same class (a field, a const, an expression-bodied property or an
      # auto-property), and sent by that name.
      - patterns:
          - pattern-either: &gemini-holders
              - pattern-inside: |
                  var $URL = $ADDR;
                  ...
              - pattern-inside: |
                  $TYPE $URL = $ADDR;
                  ...
              - pattern-inside: |
                  $URL = $ADDR;
                  ...
              - pattern-inside: |
                  class $CLASS { ... $TYPE $URL = $ADDR; ... }
              - pattern-inside: |
                  class $CLASS { ... $TYPE $URL => $ADDR; ... }
              - pattern-inside: |
                  class $CLASS { ... $TYPE $URL { get; } = $ADDR; ... }
              - pattern-inside: |
                  class $CLASS { ... $TYPE $URL { get; set; } = $ADDR; ... }
          - pattern-either: *gemini-posts
          - metavariable-regex:
              metavariable: $ADDR
              regex: *gemini-address
      # A value the engine carries from a const (joined from consts too), a readonly field or a
      # local in the same file.
      - pattern: $HTTP.PostAsync("=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/", ...)
      - pattern: $HTTP.PostAsJsonAsync("=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/", ...)
      - pattern: $HTTP.PostAsJsonAsync<$T>("=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/", ...)
      # A request message for the same addresses, with or without an initializer, positional or
      # named, or declared with target-typed new(), is a request object: it carries REQUEST, and
      # the result of the Send it goes through is the source. System.Net.Http is imported
      # implicitly, so the short form is read as well. A GET message drops: GET is HttpMethod.Get or new
      # HttpMethod("GET"), short or qualified, found by a regex over the whole message expression,
      # as in cs-video-reply-to-response, each pinned by a negative. Any other method counts, HEAD
      # and OPTIONS included.
      - label: REQUEST
        patterns:
          - pattern-either: &gemini-messages
              - pattern: new System.Net.Http.HttpRequestMessage($VERB, $URL) { ... }
              - pattern: new HttpRequestMessage($VERB, $URL) { ... }
              - pattern: 'new System.Net.Http.HttpRequestMessage(..., requestUri: $URL, ...) { ... }'
              - pattern: 'new HttpRequestMessage(..., requestUri: $URL, ...) { ... }'
              - pattern: System.Net.Http.HttpRequestMessage $V = new($VERB, $URL) { ... };
              - pattern: HttpRequestMessage $V = new($VERB, $URL) { ... };
              - pattern: 'System.Net.Http.HttpRequestMessage $V = new(..., requestUri: $URL, ...) { ... };'
              - pattern: 'HttpRequestMessage $V = new(..., requestUri: $URL, ...) { ... };'
          - metavariable-regex:
              metavariable: $URL
              regex: *gemini-address
          - pattern-not-regex: HttpMethod\.Get\b|new\s+(?:System\.Net\.Http\.)?HttpMethod\s*\(\s*"GET"\s*\)
      - label: REQUEST
        patterns:
          - pattern-either: *gemini-holders
          - pattern-either: *gemini-messages
          - metavariable-regex:
              metavariable: $ADDR
              regex: *gemini-address
          - pattern-not-regex: HttpMethod\.Get\b|new\s+(?:System\.Net\.Http\.)?HttpMethod\s*\(\s*"GET"\s*\)
      - label: REQUEST
        patterns:
          - pattern-either:
              - pattern: new System.Net.Http.HttpRequestMessage($VERB, "=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/") { ... }
              - pattern: new HttpRequestMessage($VERB, "=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/") { ... }
              - pattern: HttpRequestMessage $V = new($VERB, "=~/^https:\/\/(?:generativelanguage\.googleapis\.com|(?:[a-z0-9-]+-)?aiplatform\.googleapis\.com)\/\S*:(?:stream)?[gG]enerateContent(?:\?.*)?$/") { ... };
          - pattern-not-regex: HttpMethod\.Get\b|new\s+(?:System\.Net\.Http\.)?HttpMethod\s*\(\s*"GET"\s*\)
      - requires: REQUEST
        patterns:
          - pattern: $CLIENT.$SEND(...)
          - metavariable-regex:
              metavariable: $SEND
              regex: ^Send(Async)?$
    pattern-propagators:
      # Output written to a file carries on in the path, which a file result then hands to the
      # person. System.IO is imported implicitly, so the short form is read as well.
      - pattern: System.IO.File.WriteAllBytes($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllBytes($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllBytesAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllBytesAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllText($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllText($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllTextAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllTextAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      # A stream copied into another carries on in the copy.
      - pattern: $SRC.CopyToAsync($DEST, ...)
        from: $SRC
        to: $DEST
        by-side-effect: true
      # Output gathered into a builder or a list is sent on with it.
      - pattern: $SB.Append($V)
        from: $V
        to: $SB
        by-side-effect: true
      - pattern: $L.Add($V)
        from: $V
        to: $L
        by-side-effect: true
      - pattern: $L.AddRange($V)
        from: $V
        to: $L
        by-side-effect: true
    pattern-sinks:
      # Copied into every C# generation rule; test/unit/cs-reply-sinks.test.ts holds the nine copies
      # to one set (the four signal rules add one wiring regex to the Blazor sink), so an edit here
      # goes into all nine (#13207).
      # ASP.NET Core MVC and Web API: a public action of a controller or a view component is the
      # response, whether it returns, streams with yield return, or is written as an expression
      # body. A controller is a class named like one (the framework's own convention, any base),
      # or one marked [ApiController] or [Controller], whatever its name and base. The attribute
      # is read qualified (which also matches it under a using or an alias) and short (a file
      # whose Microsoft.AspNetCore.Mvc using is a global one elsewhere). A private helper's value
      # is not the response.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $CTRL : $BASE { ... }
                  - metavariable-regex:
                      metavariable: $CTRL
                      regex: ^\w*(Controller|ViewComponent)$
              - pattern-inside: |
                  [Microsoft.AspNetCore.Mvc.ApiController]
                  class $CTRL { ... }
              - pattern-inside: |
                  [ApiController]
                  class $CTRL { ... }
              - pattern-inside: |
                  [Microsoft.AspNetCore.Mvc.Controller]
                  class $CTRL { ... }
              - pattern-inside: |
                  [Controller]
                  class $CTRL { ... }
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      public $R $ACTION(...) { ... }
                  - pattern-either:
                      - pattern: return $X;
                      - pattern: yield return $X;
              - patterns:
                  - pattern: public $R $ACTION(...) => $X;
                  # The expression-body pattern also binds a block body; only an expression counts.
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^[^{]
                  # It binds a one-statement block too ({ Log(x); } as => Log(x)), so the action
                  # must return a value.
                  - metavariable-regex:
                      metavariable: $R
                      regex: ^(?!(void|Task|ValueTask)$)
          - focus-metavariable: $X
      # Minimal APIs: a route handler's value is the response.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$MAP($ROUTE, ...)
                  - pattern: return $X;
              # The engine binds only an expression lambda here, never a block one, which the
              # return branch above reads.
              - pattern: $APP.$MAP($ROUTE, (...) => $X)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete|Methods)?$
          - focus-metavariable: $X
      # The Results and TypedResults helpers build a response anywhere (Microsoft.AspNetCore.Http
      # is imported implicitly in a web project, so the short form is read as well).
      - patterns:
          - pattern-either:
              - pattern: Microsoft.AspNetCore.Http.Results.$RM(...)
              - pattern: Microsoft.AspNetCore.Http.TypedResults.$RM(...)
              - pattern: Results.$RM(...)
              - pattern: TypedResults.$RM(...)
          - metavariable-regex:
              metavariable: $RM
              regex: ^(Ok|Text|Content|Json|File|Stream|Bytes|Created|Accepted|ServerSentEvents)$
      # Writing the response body directly, from a controller, middleware or a handler.
      - patterns:
          - pattern-either:
              - pattern: $CTX.Response.$W(...)
              - pattern: Response.$W(...)
              - pattern: (Microsoft.AspNetCore.Http.HttpResponse $RESP).$W(...)
              - pattern: (HttpResponse $RESP).$W(...)
              - pattern: $CTX.Response.Body.$W(...)
              - pattern: Response.Body.$W(...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(WriteAsync|WriteAsJsonAsync|SendFileAsync)$
      - patterns:
          - pattern-either:
              - pattern: $SRC.CopyToAsync($CTX.Response.Body, ...)
              - pattern: $SRC.CopyToAsync(Response.Body, ...)
          - focus-metavariable: $SRC
      # MVC view data is rendered by the view.
      - patterns:
          - pattern-either:
              - pattern: ViewBag.$P = $X
              - pattern: ViewData[$K] = $X
              - pattern: TempData[$K] = $X
          - focus-metavariable: $X
      # Razor Pages: a page model's property is rendered by its page. A local is not a property.
      - patterns:
          - pattern-inside: |
              class $PAGE : Microsoft.AspNetCore.Mvc.RazorPages.PageModel { ... }
          - pattern: $P = $X
          - metavariable-regex:
              metavariable: $P
              regex: ^(this\.)?[A-Z]
          - focus-metavariable: $X
      # Blazor: a component's state is rendered by its markup. __RazorCode is the class lexcode
      # writes for the @code blocks of a .razor file (its C# copy).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.ComponentBase { ... }
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.OwningComponentBase { ... }
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.LayoutComponentBase { ... }
              - pattern-inside: |
                  class __RazorCode { ... }
          - pattern-either:
              - pattern: $F = $X
              - pattern: $F.Add($X)
          - focus-metavariable: $X
      # SignalR: a message to connected clients, from a hub (its base may be the app's own) or
      # through a hub context.
      - pattern: Clients.$WHO.SendAsync(...)
      - pattern: Clients.$WHO(...).SendAsync(...)
      - pattern: $HUB.Clients.$WHO.SendAsync(...)
      - pattern: $HUB.Clients.$WHO(...).SendAsync(...)
      # A hub's own methods: a strongly typed client call, or the value a hub method returns or
      # streams to its caller.
      - patterns:
          # Written without its type argument, the base also matches a strongly typed Hub<T>;
          # written with one, it matches nothing.
          - pattern-inside: |
              class $HUBC : Microsoft.AspNetCore.SignalR.Hub { ... }
          - pattern-either:
              - pattern: Clients.$WHO.$CM(...)
              - pattern: Clients.$WHO(...).$CM(...)
              - patterns:
                  - pattern-inside: |
                      public $R $HM(...) { ... }
                  - pattern-either:
                      - pattern: return $X;
                      - pattern: yield return $X;
                  - focus-metavariable: $X
      # .NET MAUI: a control's text on the screen of the person using the app.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $SCREEN : Microsoft.Maui.Controls.ContentPage { ... }
              - pattern-inside: |
                  class $SCREEN : ContentPage { ... }
          - pattern: $V.Text = $X
          - focus-metavariable: $X
    metadata:
      activity: generates_content
      mentioned: performs
      definition: https://lexlint.io/activities/generates-content
      provenance: ungovr-original
      license: MIT
