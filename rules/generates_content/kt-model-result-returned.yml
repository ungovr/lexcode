# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 18 to 27 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or an expression body in a function whose body makes one of the calls
# below, or a return or expression body that names a val set from one of them, at the top level, in
# a class or in a function, and declared before it. Not followed: a result one function stores at
# run time and another returns, a val derived from such a val, a member declared before the val it
# returns, and a call in a default parameter. The calls are the sources without their argument and
# name checks. How the scope is written, and why, is in CONTRIBUTING.md, Cost. A chat's sendMessage
# is in scope through startChat(...) or the val the chat is set in.
rules:
  - id: lexcode.generate.kt-model-result-returned
    languages:
      - kotlin
    severity: INFO
    message: Returns the output of a Gemini call from a function, which may be generating content with AI that reaches users (generates_content).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.genai\.).*
          - pattern-either:
              - pattern: $C.models.generateContent(...)
              - pattern: $C.models.generateContentStream(...)
              - pattern: $C.chats.create(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.ai\.client\.generativeai\.).*
          - pattern-either:
              - pattern: $M.generateContent(...)
              - pattern: $M.generateContentStream(...)
              - pattern: $M.startChat(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.firebase\.vertexai\.).*
          - pattern-either:
              - pattern: $M.generateContent(...)
              - pattern: $M.generateContentStream(...)
              - pattern: $M.startChat(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.firebase\.ai\.).*
          - pattern-either:
              - pattern: $M.generateContent(...)
              - pattern: $M.generateContentStream(...)
              - pattern: $M.startChat(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.cloud\.vertexai\.).*
          - pattern-either:
              - pattern: $M.generateContent(...)
              - pattern: $M.generateContentStream(...)
              - pattern: $M.startChat(...)
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      fun $SINKFN(...) {
                        $...SINKBODY
                      }
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKR.generateContent(...)
                        - pattern: $SINKR.generateContentStream(...)
                        - pattern: $SINKR.startChat(...)
                        - pattern: $SINKC.chats.create(...)
              - patterns:
                  - pattern: return $X
                  - pattern-either: &valscopes
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.generateContent(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.generateContentStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.startChat(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKC.chats.create(...) ...>
                          ...
                  - metavariable-pattern:
                      metavariable: $X
                      pattern-either:
                        - pattern: $SINKV
                        - pattern: this.$SINKV
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R {
                          ...
                        }
                    - pattern: |
                        @$A
                        fun $F(...): $R {
                          ...
                        }
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern-not-inside: |
              { $P -> ... }
          - pattern-not-inside: |
              { $P, $Q -> ... }
          - pattern-not-inside: |
              { $P, $Q, $W -> ... }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(...) = $X
              - pattern-inside: |
                  fun $F(...): $R = $X
          - metavariable-pattern:
              metavariable: $X
              pattern-either: *sinkcalls
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
      - patterns:
          - pattern-either:
              - pattern: |
                  fun $F(...) = $X
              - pattern: |
                  fun $F(...): $R = $X
          - pattern-either: *valscopes
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - pattern: $SINKV
                - pattern: this.$SINKV
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
    metadata:
      activity: generates_content
      mentioned: performs
      definition: https://lexlint.io/activities/generates-content
      provenance: ungovr-original
      license: MIT
      strength: signal
