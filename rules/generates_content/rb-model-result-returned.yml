# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 48 to 56 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or a yield in a method whose body makes one of the calls below. Not
# followed: a result one method stores at run time and another returns, and a call in a default
# parameter. The calls are the sources without their argument and name checks. How the scope is
# written, and why, is in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.generate.rb-model-result-returned
    languages: [ruby]
    severity: INFO
    message: Returns the output of a Langchain.rb model or a Gemini call from a method, which may be generating content with AI that reaches users (generates_content).
    mode: taint
    pattern-sources:
      - pattern: Langchain::LLM::$K.new(...)
      # A vector store's ask (question: is its keyword) retrieves passages and has its LLM
      # write the answer: retrieval-augmented generation. The block form streams the answer. The
      # receiver is a store object; a bare class name (Faq.ask) is an app's own class method,
      # while a store held in a constant (STORE.ask) is still a store.
      - patterns:
          - pattern: '$S.ask(..., question: ..., ...)'
          - metavariable-regex:
              metavariable: $S
              regex: ^(?!(?:::)?(?:[A-Z]\w*::)*[A-Z][a-z]\w*$)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $S.ask(..., question: ..., ...) do |$X|
                    ...
                  end
              - pattern-inside: '$S.ask(..., question: ..., ...) { |$X| ... }'
          - pattern: $X
          - metavariable-regex:
              metavariable: $S
              regex: ^(?!(?:::)?(?:[A-Z]\w*::)*[A-Z][a-z]\w*$)
      - pattern: '$C.generate_content(..., contents: ..., ...)'
      - pattern: '$C.generate_content({ ..., contents: ..., ... })'
      - pattern: '$C.stream_generate_content(..., contents: ..., ...)'
      - pattern: '$C.stream_generate_content({ ..., contents: ..., ... })'
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $C.stream_generate_content(...) do |$X, ...|
                    ...
                  end
              - pattern-inside: '$C.stream_generate_content(...) { |$X, ...| ... }'
          - pattern: $X
    pattern-propagators:
      - pattern: $OUT = <... $R.dig(...) ...>
        from: $R
        to: $OUT
      - pattern: |
          $S.each do |$X|
            ...
          end
        from: $S
        to: $X
      - pattern: '$S.each { |$X| ... }'
        from: $S
        to: $X
    pattern-sanitizers:
      - pattern: $L.embed(...)
      # The client's configured defaults (model names, temperature) are settings, not output.
      - pattern: $L.defaults
      - pattern: Langchain::Vectorsearch::$K.new(...)
      - pattern: $S.similarity_search(...)
      - pattern: $S.similarity_search_by_vector(...)
    pattern-sinks:
      - patterns:
          - pattern: yield $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: 'Langchain::LLM::$SINKK.new(...)'
                        - pattern: $SINKC.ask(...)
                        - pattern: $SINKC.generate_content(...)
                        - pattern: $SINKC.stream_generate_content(...)
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
          - pattern-either:
              - pattern: return $V
              - pattern: return $V.$M(...)
              - pattern: return $V.$M(...).$N
              - pattern: return $V.$M(...).$N(...)
              - pattern: return $V[...]
              - pattern: 'return { ..., $K: $V, ... }'
              - pattern: 'return { ..., $K: $V.$M(...), ... }'
          - metavariable-regex:
              metavariable: $V
              regex: ^@?[a-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*[?!]?)*$
          - focus-metavariable: $V
    metadata:
      activity: generates_content
      mentioned: performs
      definition: https://lexlint.io/activities/generates-content
      provenance: ungovr-original
      license: MIT
      strength: signal
