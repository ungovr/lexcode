# The sink is a return in a function that builds a chat model or calls one, not every return in the
# file: that made the taint pass grow several times faster than the file, 15 to 25 s on a 900 KB
# file where a scan gives one rule 30 s per file (#13034). A model built at module level reaches a
# function through a call on it (invoke, stream and the others below), and a factory returns the
# model it builds, so the narrower sink keeps those matches. How the scope is written, and why, is
# in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.generate.js-model-result-returned
    languages: [javascript, typescript]
    severity: INFO
    message: Returns the output of a LangChain chat model or a Gemini call from a function, which may be generating content with AI that reaches users (generates_content).
    mode: taint
    pattern-sources:
      - pattern: new ChatOpenAI(...)
      - pattern: new AzureChatOpenAI(...)
      - pattern: new ChatAnthropic(...)
      - pattern: new ChatGoogleGenerativeAI(...)
      - pattern: new ChatVertexAI(...)
      - pattern: new ChatGroq(...)
      - pattern: new ChatMistralAI(...)
      - pattern: new ChatOllama(...)
      - pattern: new ChatBedrockConverse(...)
      - pattern: new ChatBedrock(...)
      - pattern: new ChatCohere(...)
      - pattern: new ChatTogetherAI(...)
      - pattern: new ChatFireworks(...)
      - pattern: new ChatDeepSeek(...)
      - pattern: new ChatXAI(...)
      - pattern: new ChatPerplexity(...)
      - pattern: new ChatNVIDIA(...)
      - pattern: new ChatHuggingFace(...)
      - pattern: initChatModel(...)
      - pattern: $M.generateContent(...)
      - pattern: $M.generateContentStream(...)
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... new ChatOpenAI(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function (...) {
                    ...
                    <... new ChatOpenAI(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... new AzureChatOpenAI(...) ...>;
                    ...
                  }
              - pattern-inside: |
