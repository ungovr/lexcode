    pattern-sanitizers:
      - patterns:
          - pattern: $RES.$M(...)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|ctx|c|context)(\s*\.\s*(status|code|type|header|set|setHeader|contentType|append)\([^()]*\))*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(json|send|end|write|text|html|jsonp)$
      - pattern: new Response(...)
      - pattern: new NextResponse(...)
      - pattern: Response.json(...)
      - pattern: NextResponse.json(...)
      - pattern: ctx.body = ...
      - patterns:
          - pattern: $WS.send(...)
          - metavariable-regex:
              metavariable: $WS
              regex: ^(ws|socket|webSocket|websocket|conn|connection)$
      - patterns:
          - pattern: $S.pipe($R)
          - metavariable-regex:
              metavariable: $R
              regex: ^(res|resp|response|reply)$
          - focus-metavariable: $S
