# Not a taint rule on purpose: the cost is that a value passed through a helper method before the
# call is not followed; the request's own messages list, or a field read straight off the request
# object, is. The bar is the JS, Python and Ruby rules': a messages or history LIST from the request
# reaches the model call. A single typed message inside a fixed prompt is a one-shot tool, not a
# chatbot, so it does not match. The model call is named by the request type or the client in it
# (a Spring AI ChatClient prompt, a Prompt, an OpenAI or Anthropic params builder, a LangChain4j
# model), so a "messages" builder of some other kind does not match.
rules:
  - id: lexcode.chatbot.java-request-messages-to-model
    languages: [java]
    severity: INFO
    message: Passes the conversation a client sent in a request to a language model, which is deploying a chatbot (deploys_chatbot).
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RET $F(..., @RequestBody $T $P, ...) {
                ...
              }
          - pattern-inside: |
              $RET $F(..., @Payload $T $P, ...) {
                ...
              }
          - pattern-inside: |
              @POST
              $RET $F(..., $T $P, ...) {
                ...
              }
      # The call is named by what is in it, then its argument is the request's own messages: a field
      # read off the request object (request.getMessages()) or the request body itself, when that is the list.
      - pattern-either:
          - patterns:
              - pattern: $B.messages($X)
              # Literal anchor inside the match (the model call), so the engine skips files with no such call.
              - pattern-regex: '\.messages\('
              - metavariable-regex:
                  metavariable: $B
                  regex: '(?s)^.*(CreateParams|Request\.builder|\.prompt\(\)|ChatCompletion|Converse).*$'
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    - pattern-either:
                        - patterns:
                            - pattern: <... $P.$A() ...>
                            - metavariable-regex:
                                metavariable: $A
                                regex: ^(get)?([Mm]essages|[Hh]istory|[Cc]onversation|[Cc]hatHistory|[Cc]hatMessages)$
                        - patterns:
                            - pattern: $P
                            - metavariable-regex:
                                metavariable: $P
                                regex: ^(messages|history|conversation|chatHistory|chatMessages)$
          - patterns:
              - pattern: new Prompt($X, ...)
              - pattern-regex: 'new\s+Prompt\('
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    - pattern-either:
                        - patterns:
                            - pattern: <... $P.$A() ...>
                            - metavariable-regex:
                                metavariable: $A
                                regex: ^(get)?([Mm]essages|[Hh]istory|[Cc]onversation|[Cc]hatHistory|[Cc]hatMessages)$
                        - patterns:
                            - pattern: $P
                            - metavariable-regex:
                                metavariable: $P
                                regex: ^(messages|history|conversation|chatHistory|chatMessages)$
          - patterns:
              - pattern-either:
                  - pattern: $M.chat($X)
                  - pattern: $M.generate($X)
              - pattern-regex: '\.(chat|generate)\('
              - metavariable-regex:
                  metavariable: $M
                  regex: (?i)^(this\.)?\w*(model|llm|chat|assistant|ai)\w*$
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    - pattern-either:
                        - patterns:
                            - pattern: <... $P.$A() ...>
                            - metavariable-regex:
                                metavariable: $A
                                regex: ^(get)?([Mm]essages|[Hh]istory|[Cc]onversation|[Cc]hatHistory|[Cc]hatMessages)$
                        - patterns:
                            - pattern: $P
                            - metavariable-regex:
                                metavariable: $P
                                regex: ^(messages|history|conversation|chatHistory|chatMessages)$
    metadata:
      activity: deploys_chatbot
      mentioned: performs
      definition: https://lexlint.io/activities/deploys-chatbot
      provenance: ungovr-original
      license: MIT
