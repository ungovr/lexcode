rules:
  - id: lexcode.chatbot.py-history-turns
    languages: [python]
    severity: INFO
    message: Appends the user's message to a running history, sends the history to a language model and stores the reply back in it, which is deploying a chatbot (deploys_chatbot).
    patterns:
      - pattern-either:
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = $C.chat.completions.create(..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = await $C.chat.completions.create(..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = $C.messages.create(..., max_tokens=..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = await $C.messages.create(..., max_tokens=..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = litellm.completion(..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = await litellm.completion(..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = ollama.chat(..., messages=$H, ...)
              ...
              $H.append($Z)
          - pattern: |
              $H.append({"role": "user", ...})
              ...
              $R = await ollama.chat(..., messages=$H, ...)
              ...
              $H.append($Z)
      - metavariable-pattern:
          metavariable: $Z
          patterns:
            - pattern: $ANY
            - pattern-not: '{"role": "user", ...}'
    metadata:
      activity: deploys_chatbot
      mentioned: performs
      definition: https://lexlint.io/activities/deploys-chatbot
      provenance: ungovr-original
      license: MIT
