# The Rust form of the other languages' history-turns rules: the model's earlier answer goes back
# into the conversation as an assistant turn, so the next call answers in the light of it. The
# rules in other languages read the order (user turn pushed, model called, reply pushed); in Rust
# the assistant turn has its own constructor, so the turn is read where it is built from a value:
# async-openai's assistant message builder (`ChatCompletionRequestAssistantMessageArgs::default()
# .content(reply)`) and ollama-rs's `ChatMessage::assistant(reply)`. A few-shot example written as a
# string literal is a fixed prompt, not a conversation, and does not match.
#
# Each branch needs a file that names its crate. On Opengrep 1.33.1 the engine does not resolve a
# `use` whose group nests a path (`use async_openai::{types::{...}, Client};`), which is how
# async-openai's and ollama-rs's own examples import these types, so a crate-path pattern would miss
# them; the type is matched by its name inside the match and the crate by a whole-file check, one
# greedy literal per branch (CONTRIBUTING.md). An app's own `ChatMessage` in a file that does not
# name ollama-rs does not match.
rules:
  - id: lexcode.chatbot.rs-history-turns
    languages: [rust]
    severity: INFO
    message: Puts the model's earlier reply back into the conversation as an assistant turn, which is deploying a chatbot (deploys_chatbot).
    pattern-either:
      - patterns:
          - pattern: $B.content($X)
          - metavariable-regex:
              metavariable: $B
              regex: '(?s)^(\w+::)*ChatCompletionRequestAssistantMessageArgs::default\(\)'
          - metavariable-regex:
              metavariable: $X
              regex: '(?s)^(?!\s*(r#*)?"|\s*String::from\(\s*(r#*)?").*$'
          - pattern-regex: '(?s)\A(?=.*\basync_openai\b).*'
      - patterns:
          - pattern: $CM::assistant($X)
          - metavariable-regex:
              metavariable: $CM
              regex: '^(\w+::)*ChatMessage$'
          - metavariable-regex:
              metavariable: $X
              regex: '(?s)^(?!\s*(r#*)?"|\s*String::from\(\s*(r#*)?").*$'
          - pattern-regex: '(?s)\A(?=.*\bollama_rs\b).*'
    metadata:
      activity: deploys_chatbot
      mentioned: performs
      definition: https://lexlint.io/activities/deploys-chatbot
      provenance: ungovr-original
      license: MIT
