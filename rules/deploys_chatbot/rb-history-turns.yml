rules:
  - id: lexcode.chatbot.rb-history-turns
    languages: [ruby]
    severity: INFO
    message: Sends a running history that holds the user's turns to a language model and stores the reply back in it, which is deploying a chatbot (deploys_chatbot).
    patterns:
      # The anchor is the model call: its method name and the messages: key are what the engine can
      # prefilter files on, so the rule only reads the files that make such a call.
      - pattern-either:
          - pattern: '$C.$M(..., messages: $H, ...)'
          - pattern: '$C.$M(parameters: {..., messages: $H, ...})'
          - pattern: '$C.chat({..., messages: $H, ...})'
      - pattern-either:
          - pattern-inside: |
              def $F(...)
                ...
                <... $H << {..., role: "user", ...} ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H << {..., "role" => "user", ...} ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H << {..., :role => "user", ...} ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H.push({..., role: "user", ...}) ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H.push({..., "role" => "user", ...}) ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H.push({..., :role => "user", ...}) ...>
                ...
              end
      - pattern-either:
          - pattern-inside: |
              def $F(...)
                ...
                <... $H << $Z ...>
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                <... $H.push($Z) ...>
                ...
              end
      - metavariable-regex:
          metavariable: $Z
          regex: (?s)^(?!\s*\{[^}]*(\brole:|["':]role["']?\s*=>)\s*["']user["']).*$
    metadata:
      activity: deploys_chatbot
      mentioned: performs
      definition: https://lexlint.io/activities/deploys-chatbot
      provenance: ungovr-original
      license: MIT
