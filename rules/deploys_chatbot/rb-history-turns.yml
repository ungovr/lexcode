rules:
  - id: lexcode.chatbot.rb-history-turns
    languages: [ruby]
    severity: INFO
    message: Appends the user's message to a running history, sends the history to a language model and stores the reply back in it, which is deploying a chatbot (deploys_chatbot).
    # Same order as the Python rule: the user's turn is pushed, the history goes to the model, then
    # the reply is pushed back. A prompt built in steps and sent once (a system line plus a user line,
    # few-shot examples) pushes nothing after the call and does not match.
    patterns:
      # The anchor is the model call, so the engine only reads the files that make one.
      - pattern-either:
          - pattern: '$C.$M(..., messages: $H, ...)'
          - pattern: '$C.$M(parameters: {..., messages: $H, ...})'
          - pattern: '$C.chat({..., messages: $H, ...})'
      - pattern-either:
          - pattern-inside: |
              def $F(...)
                ...
                $H << $U
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                $H.push($U)
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                $H << $U
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                $H.push($U)
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                $H << $U
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              def $F(...)
                ...
                $H.push($U)
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H << $U
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H.push($U)
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H << $U
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H.push($U)
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H << $U
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              loop do
                ...
                $H.push($U)
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H << $U
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H.push($U)
                ...
                <... $C.$M(..., messages: $H, ...) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H << $U
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H.push($U)
                ...
                <... $C.$M(parameters: {..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H << $U
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H << $Z
                ...
              end
          - pattern-inside: |
              while $COND
                ...
                $H.push($U)
                ...
                <... $C.chat({..., messages: $H, ...}) ...>
                ...
                $H.push($Z)
                ...
              end
      - metavariable-regex:
          metavariable: $U
          regex: '(?s)^\s*\{[^}]*(\brole:|["\x27:]role["\x27]?\s*=>)\s*["\x27]user["\x27].*$'
      - metavariable-regex:
          metavariable: $Z
          regex: '(?s)^(?!\s*\{[^}]*(\brole:|["\x27:]role["\x27]?\s*=>)\s*["\x27]user["\x27]).*$'
      # Literal anchor inside the match (the model call), so the engine skips files with no such call.
      - pattern-regex: '(&?\.(?:\s|\\|#[^\n]*+)*+(chat|converse\w*|chat_completions?|complete)\b(?!\s*&?\.)|&?\.(?:\s|\\|#[^\n]*+)*+messages(?:\s|\\|#[^\n]*+)*+(\(|&?\.(?:\s|\\|#[^\n]*+)*+(create|stream)\b|(?<=\s)parameters)|completions(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+create\b|&?\.(?:\s|\\|#[^\n]*+)*+responses(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+create\b)'
    metadata:
      activity: deploys_chatbot
      mentioned: performs
      definition: https://lexlint.io/activities/deploys-chatbot
      provenance: ungovr-original
      license: MIT
