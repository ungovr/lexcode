rules:
  - id: lexcode.personal.py-model-field
    languages: [python]
    severity: INFO
    message: Declares a stored field for an email, phone number, date of birth, government identifier or IP address on a database model, which is processing personal data (processes_personal_data).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $F = Column(...)
                  - pattern: $F = mapped_column(...)
                  - pattern: "$F: $T = mapped_column(...)"
                  - pattern: $F = models.CharField(...)
                  - pattern: $F = models.DateField(...)
                  - pattern: |
                      class $C(SQLModel, table=True):
                          ...
                          $F: $T
                          ...
                  - pattern: |
                      class $C(SQLModel, table=True):
                          ...
                          $F: $T = $V
                          ...
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer)_?e_?mail|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?ip(_?address)?|client_?ip|remote_?(addr|ip|address))$
              - focus-metavariable: $F
          - patterns:
              - pattern-either:
                  - pattern: $F = models.EmailField(...)
                  - pattern: $F = PhoneNumberField(...)
                  - pattern: $F = models.GenericIPAddressField(...)
                  - pattern: $F = models.IPAddressField(...)
              - focus-metavariable: $F
    metadata:
      activity: processes_personal_data
      mentioned: performs
      definition: https://lexlint.io/activities/processes-personal-data
      provenance: ungovr-original
      license: MIT
