rules:
  - id: lexcode.personal.rs-password-hash
    languages: [rust]
    severity: INFO
    message: Hashes or checks a person's sign-in password for storage (argon2, scrypt or pbkdf2 through the password-hash API, bcrypt, rust-argon2's encoded hashes or password-auth), which is keeping user accounts and so processing personal data (processes_personal_data).
    # A password hash in PHC or bcrypt form exists to be stored against an account and checked
    # at sign-in. A key derived from a passphrase to encrypt a file (argon2's hash_password_into,
    # rust-argon2's hash_raw) is not an account, and is not matched. Each item is written by
    # its crate path, which the engine resolves through `use`, grouped `use` and `use ... as`,
    # so an app's own hash or verify function is not read as bcrypt's.
    pattern-either:
      # The password-hash API (RustCrypto): the PHC string generated or parsed, and the
      # PasswordHasher and PasswordVerifier methods on an Argon2 instance built in the chain
      # or bound to a local first.
      - pattern: argon2::PasswordHash::generate(...)
      - pattern: argon2::PasswordHash::new(...)
      - pattern: argon2::password_hash::PasswordHash::generate(...)
      - pattern: argon2::password_hash::PasswordHash::new(...)
      - pattern: password_hash::PasswordHash::generate(...)
      - pattern: password_hash::PasswordHash::new(...)
      - pattern: argon2::Argon2::default().hash_password(...)
      - pattern: argon2::Argon2::default().verify_password(...)
      - pattern: argon2::Argon2::new(...).hash_password(...)
      - pattern: argon2::Argon2::new(...).verify_password(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  let $A = argon2::Argon2::default();
                  ...
              - pattern-inside: |
                  let $A = argon2::Argon2::new(...);
                  ...
          - pattern-either:
              - pattern: $A.hash_password(...)
              - pattern: $A.verify_password(...)
      - pattern: scrypt::Scrypt.hash_password(...)
      - pattern: pbkdf2::Pbkdf2.hash_password(...)
      # bcrypt.
      - pattern: bcrypt::hash(...)
      - pattern: bcrypt::hash_with_result(...)
      - pattern: bcrypt::hash_with_salt(...)
      - pattern: bcrypt::verify(...)
      # rust-argon2 (crate rust-argon2, imported as argon2): the encoded form only.
      - pattern: argon2::hash_encoded(...)
      - pattern: argon2::verify_encoded(...)
      # password-auth.
      - pattern: password_auth::generate_hash(...)
      - pattern: password_auth::verify_password(...)
    metadata:
      activity: processes_personal_data
      mentioned: performs
      definition: https://lexlint.io/activities/processes-personal-data
      provenance: ungovr-original
      license: MIT
