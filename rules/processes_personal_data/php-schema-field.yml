rules:
  - id: lexcode.personal.php-schema-field
    languages: [php]
    severity: INFO
    message: Declares a stored column for an email, phone number, date of birth, government identifier, IP address or device address in a Laravel migration or a Doctrine DBAL schema, which is processing personal data (processes_personal_data).
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $T->$M($F, ...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(string|char|text|tinyText|mediumText|longText|date|dateTime|dateTimeTz|integer|bigInteger|unsignedBigInteger|binary|ipAddress|addColumn)$
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^['"](e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer|unconfirmed|billing)_?e_?mail|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?(sign_?in_?|login_?)?ip(_?address)?|current_?sign_?in_?ip|client_?ip|remote_?(addr|ip|address))['"]$
          # Laravel's address column types, with or without a name (ipAddress() names it ip_address).
          - pattern: $T->ipAddress()
          - pattern: $T->macAddress(...)
      # The table variable a migration closure or a DBAL schema is written with.
      - metavariable-regex:
          metavariable: $T
          regex: ^\$(table|t|tbl|blueprint)$
    metadata:
      activity: processes_personal_data
      mentioned: performs
      definition: https://lexlint.io/activities/processes-personal-data
      provenance: ungovr-original
      license: MIT
