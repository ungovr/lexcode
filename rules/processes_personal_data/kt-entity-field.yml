rules:
  - id: lexcode.personal.kt-entity-field
    languages: [kotlin]
    severity: INFO
    message: Declares a stored field for an email, phone number, date of birth, government identifier or IP address on a persistent class (JPA, Hibernate, Room or Spring Data MongoDB), which is processing personal data (processes_personal_data).
    patterns:
      - pattern-either:
          # A column in the primary constructor.
          - pattern: |
              @Entity(...)
              class $C(..., val $F: $T, ...)
          - pattern: |
              @Entity(...)
              class $C(..., var $F: $T, ...)
          - pattern: |
              @Embeddable(...)
              class $C(..., val $F: $T, ...)
          - pattern: |
              @Embeddable(...)
              class $C(..., var $F: $T, ...)
          - pattern: |
              @MappedSuperclass(...)
              class $C(..., val $F: $T, ...)
          - pattern: |
              @MappedSuperclass(...)
              class $C(..., var $F: $T, ...)
          - pattern: |
              @Document(...)
              class $C(..., val $F: $T, ...)
          - pattern: |
              @Document(...)
              class $C(..., var $F: $T, ...)
          # A column in the class body.
          - patterns:
              - pattern-either:
                  - pattern: 'val $F: $T'
                  - pattern: 'var $F: $T'
                  - pattern: 'val $F: $T = $V'
                  - pattern: 'var $F: $T = $V'
              - pattern-either:
                  - pattern-inside: |
                      @Entity(...)
                      class $C(...) {
                        ...
                      }
                  - pattern-inside: |
                      @Embeddable(...)
                      class $C(...) {
                        ...
                      }
                  - pattern-inside: |
                      @MappedSuperclass(...)
                      class $C(...) {
                        ...
                      }
                  - pattern-inside: |
                      @Document(...)
                      class $C(...) {
                        ...
                      }
              - pattern-not-inside: |
                  fun $M(...) {
                    ...
                  }
              - pattern-not-inside: |
                  object $O {
                    ...
                  }
      # A field the persistence layer is told to skip (JPA @Transient, Room @Ignore), written on the
      # parameter, on the backing field or on the getter.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: |
                    class $C(..., @$A val $F: $T, ...)
                - pattern: |
                    class $C(..., @$A var $F: $T, ...)
            - metavariable-regex:
                metavariable: $A
                regex: ^(Transient|Ignore)$
      - pattern-not: |
          @Transient
          val $F: $T
      - pattern-not: |
          @Transient
          var $F: $T
      - pattern-not: |
          @Transient
          val $F: $T = $V
      - pattern-not: |
          @Transient
          var $F: $T = $V
      - pattern-not: |
          @Ignore
          val $F: $T
      - pattern-not: |
          @Ignore
          var $F: $T
      - pattern-not: |
          @Ignore
          val $F: $T = $V
      - pattern-not: |
          @Ignore
          var $F: $T = $V
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer)_?e_?mail|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?ip(_?address)?|client_?ip|remote_?(addr|ip|address))$
      - focus-metavariable: $F
    metadata:
      activity: processes_personal_data
      mentioned: performs
      definition: https://lexlint.io/activities/processes-personal-data
      provenance: ungovr-original
      license: MIT
