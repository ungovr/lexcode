rules:
  - id: lexcode.personal.cs-schema-field
    languages: [csharp]
    severity: INFO
    message: Declares a stored column for an email, phone number, date of birth, government identifier or IP address in schema code (an EF Core migration or model configuration, or a FluentMigrator migration), which is processing personal data (processes_personal_data).
    patterns:
      - pattern-either:
          # EF Core migrations: a column of a table being created (the anonymous object's member
          # names the column), or a column added to a table. The migration builder is the
          # parameter of a generated Up or Down method, typed through its `using` (which a generated
          # migration always writes). A column only counts inside the builder's CreateTable, so an
          # anonymous object read from another library's row (row.Column<string>("email")) does not.
          - patterns:
              - pattern-inside: (Microsoft.EntityFrameworkCore.Migrations.MigrationBuilder $MB).CreateTable(...)
              - pattern: 'new { ..., $N = $TB.Column<$T>(...), ... }'
              - metavariable-regex:
                  metavariable: $N
                  regex: (?i)^(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer|billing|normalized|unconfirmed)_?e_?mail(_?address)?|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?(login_?)?ip(_?address)?|(client|customer|user)_?ip(_?address)?|remote_?(addr|ip|address))$
              - focus-metavariable: $N
          - patterns:
              - pattern-either:
                  - pattern: '(Microsoft.EntityFrameworkCore.Migrations.MigrationBuilder $MB).AddColumn<$T>(name: $N, ...)'
                  - pattern: (Microsoft.EntityFrameworkCore.Migrations.MigrationBuilder $MB).AddColumn<$T>($N, ...)
              - metavariable-regex:
                  metavariable: $N
                  regex: (?i)^@?"(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer|billing|normalized|unconfirmed)_?e_?mail(_?address)?|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?(login_?)?ip(_?address)?|(client|customer|user)_?ip(_?address)?|remote_?(addr|ip|address))"$
              - focus-metavariable: $N
          # EF Core model configuration: a property mapped, or indexed, by a lambda naming it. The
          # builder is reached through chains (modelBuilder.Entity<T>().Property(...)) that carry no
          # type of their own, so the call must sit inside one reached from a typed builder.
          - patterns:
              - pattern-either:
                  # A configuration class's EntityTypeBuilder<T> (typed through its parameter), and
                  # the owned-type builders nested in its calls.
                  - patterns:
                      - pattern-inside: (Microsoft.EntityFrameworkCore.Metadata.Builders.EntityTypeBuilder $EB).$CALL(...)
                      - pattern-either:
                          - pattern: $B.Property($X => $X.$F)
                          - pattern: $B.HasIndex($X => $X.$F)
                  # A DbContext's ModelBuilder: modelBuilder.Entity<T>().Property(...), and the
                  # builder lambda of modelBuilder.Entity<T>(e => ...).
                  - pattern: (Microsoft.EntityFrameworkCore.ModelBuilder $MB).Entity<$T>().Property($X => $X.$F)
                  - pattern: (Microsoft.EntityFrameworkCore.ModelBuilder $MB).Entity<$T>().HasIndex($X => $X.$F)
                  - patterns:
                      - pattern-inside: (Microsoft.EntityFrameworkCore.ModelBuilder $MB).Entity<$T>(...)
                      - pattern-either:
                          - pattern: $B.Property($X => $X.$F)
                          - pattern: $B.HasIndex($X => $X.$F)
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer|billing|normalized|unconfirmed)_?e_?mail(_?address)?|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?(login_?)?ip(_?address)?|(client|customer|user)_?ip(_?address)?|remote_?(addr|ip|address))$
              - focus-metavariable: $F
          # FluentMigrator: a column of a table being created or altered, named by a string or by
          # nameof. Its fluent chains carry no type, so the call must sit in a FluentMigrator
          # migration class, or in a method given FluentMigrator's table builder (the shape of an
          # entity-builder class that maps a table).
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      class $MC : FluentMigrator.Migration { ... }
                  - pattern-inside: |
                      class $MC : FluentMigrator.ForwardOnlyMigration { ... }
                  - pattern-inside: |
                      class $MC : FluentMigrator.AutoReversingMigration { ... }
                  - pattern-inside: |
                      $RT $MM(..., FluentMigrator.Builders.Create.Table.CreateTableExpressionBuilder $TB, ...) { ... }
              - pattern-either:
                  - pattern: $T.WithColumn($N)
                  - pattern: $T.AddColumn($N)
              - metavariable-regex:
                  metavariable: $N
                  regex: (?i)^(@?"|nameof\((\w+\.)*)(e_?mail|email_?(address|addr)?|(user|contact|work|primary|customer|billing|normalized|unconfirmed)_?e_?mail(_?address)?|phone(_?(number|no|num))?|mobile(_?(number|phone|no))?|telephone|date_?of_?birth|dob|birth_?(date|day)|birthday|ssn|social_?security(_?(number|no))?|national_?(id|insurance)(_?number)?|passport(_?(number|no))?|tax_?(id|number)|drivers?_?licen[sc]e(_?(number|no))?|ip_?(address|addr)?|last_?(login_?)?ip(_?address)?|(client|customer|user)_?ip(_?address)?|remote_?(addr|ip|address))("|\))$
              - focus-metavariable: $N
      # Not a person's data: the columns of a store's sending mail account, the mailbox and SMTP
      # login the app sends its own mail from (nopCommerce's EmailAccount.Email, DisplayName and
      # Username), are the operator's own (decided on #13215). A column is set aside when its
      # table or class is named for a mail account (EmailAccount, MailAccount or SmtpAccount,
      # singular or plural; never every name holding "Account", so a CustomerAccount or UserAccount
      # stays in) and its file maps sending settings (a Host, Port, SmtpServer, EnableSsl or
      # UseDefaultCredentials column or property) and names no owner (a UserId, CustomerId,
      # OwnerId, MemberId or AccountHolder column or property). Comments count, being file text. A mailbox a person connects in a mail client carries
      # an owner and stays personal data; so does a mail account whose file shows no sending
      # setting. The file is the unit because a column's table and its siblings are not in one
      # node the engine can bind in every form; a migration that also creates a table with an
      # owner keeps its mail account's columns. The name is read from the table name of an EF Core
      # CreateTable or AddColumn, the entity type of an EntityTypeBuilder<T> parameter or a
      # modelBuilder.Entity<T>, and in FluentMigrator a nameof(EmailAccount.X) column or a
      # Table("EmailAccount") / Table(nameof(EmailAccount)) earlier in the chain.
      - pattern-not-inside:
          patterns:
            - pattern-regex: '(?s)\A(?=.*(?i:(?<![a-z])(?:smtp_?)?(?:host(?:_?name)?|port)(?![a-z])|smtp_?(?:server|user(?:_?name)?|password|login|settings?)|enable_?ssl|use_?ssl|use_?tls|use_?default_?credentials))(?!.*(?i:(?<![a-z])(?:user|customer|owner|member|person|profile|app_?user|application_?user)_?id(?![a-z])|account_?holder)).*'
            - pattern-either:
                - pattern: '$ACMB.CreateTable(name: "=~/(?i)^(e_?mail|mail|smtp)_?accounts?$/", ...)'
                - pattern: '$ACMB.CreateTable("=~/(?i)^(e_?mail|mail|smtp)_?accounts?$/", ...)'
                - pattern: '$ACMB.AddColumn<$ACTY>(..., table: "=~/(?i)^(e_?mail|mail|smtp)_?accounts?$/", ...)'
                - pattern: '$ACMB.AddColumn<$ACTY>($ACN, "=~/(?i)^(e_?mail|mail|smtp)_?accounts?$/", ...)'
                # The engine binds T only from a short generic pattern (a namespaced one matches only
                # a namespaced parameter); the column arms above already hold the namespaced gate.
                - patterns:
                    - pattern: |
                        $ACR $ACM(..., EntityTypeBuilder<$ACA> $ACB, ...) { ... }
                    - metavariable-regex:
                        metavariable: $ACA
                        regex: ^(\w+\.)*(?i:(e_?mail|mail|smtp)_?accounts?)$
                - patterns:
                    - pattern-either:
                        - pattern: (Microsoft.EntityFrameworkCore.ModelBuilder $ACMB).Entity<$ACA>(...)
                        - pattern: (Microsoft.EntityFrameworkCore.ModelBuilder $ACMB).Entity<$ACA>().$ACP(...)
                    - metavariable-regex:
                        metavariable: $ACA
                        regex: ^(\w+\.)*(?i:(e_?mail|mail|smtp)_?accounts?)$
                - patterns:
                    - pattern: nameof($ACE.$ACX)
                    - metavariable-regex:
                        metavariable: $ACE
                        regex: ^(\w+\.)*(?i:(e_?mail|mail|smtp)_?accounts?)$
                - patterns:
                    - pattern-either:
                        - pattern: $ACC.WithColumn($ACQ)
                        - pattern: $ACC.AddColumn($ACQ)
                    - metavariable-regex:
                        metavariable: $ACC
                        regex: (?s)^.*\bTable\(\s*(@?"|nameof\((\w+\.)*)(?i:(e_?mail|mail|smtp)_?accounts?)("|\))\s*\)
    metadata:
      activity: processes_personal_data
      mentioned: performs
      definition: https://lexlint.io/activities/processes-personal-data
      provenance: ungovr-original
      license: MIT
