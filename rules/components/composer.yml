ecosystem: composer
entries:

  # Authentication and user management SDKs
  - match: "devdojo/auth"
    enables: [processes_personal_data]
    says: "The auth package to make authentication in your laravel applications easy to use."
    source: https://packagist.org/packages/devdojo/auth

  # Feed readers
  - match: "simplepie/simplepie"
    enables: [aggregates_content]
    says: "A simple Atom/RSS parsing library for PHP"
    source: https://packagist.org/packages/simplepie/simplepie

  # Email, SMS and push senders
  - match: "phpmailer/phpmailer"
    enables: [automated_outreach]
    says: "PHPMailer is a full-featured email creation and transfer class for PHP"
    source: https://packagist.org/packages/phpmailer/phpmailer
  - match: "symfony/mailer"
    enables: [automated_outreach]
    says: "Helps sending emails"
    source: https://packagist.org/packages/symfony/mailer

  # Bundled cryptography
  - match: "phpseclib/phpseclib"
    enables: [ships_encryption]
    says: "PHP Secure Communications Library - Pure-PHP implementations of RSA, AES, SSH2, SFTP, X.509 etc."
    source: https://packagist.org/packages/phpseclib/phpseclib
