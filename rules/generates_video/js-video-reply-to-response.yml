rules:
  - id: lexcode.video.js-video-reply-to-response
    languages: [javascript, typescript]
    severity: INFO
    message: Hands a clip rendered by a video model back in an HTTP response, which is generating video with AI that reaches users (generates_video).
    mode: taint
    pattern-sources:
      - pattern: "$C.videos.create({..., prompt: ..., ...})"
      - pattern: "$C.videos.createAndPoll({..., prompt: ..., ...})"
      - pattern: $C.models.generateVideos(...)
      - pattern: $C.textToVideo.create(...)
      - pattern: $C.imageToVideo.create(...)
      - patterns:
          - pattern: experimental_generateVideo(...)
          - pattern-inside: |
              import { ..., experimental_generateVideo, ... } from "ai";
              ...
    pattern-sinks:
      - patterns:
          - pattern: $RES.$M(...)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|ctx|c|context)(\s*\.\s*(status|code|type|header|set|setHeader|contentType|append)\([^()]*\))*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(json|send|end|write|text|html|jsonp)$
      - pattern: new Response(...)
      - pattern: new NextResponse(...)
      - pattern: Response.json(...)
      - pattern: NextResponse.json(...)
      - pattern: ctx.body = ...
      - patterns:
          - pattern: $WS.send(...)
          - metavariable-regex:
              metavariable: $WS
              regex: ^(ws|socket|webSocket|websocket|conn|connection)$
      - patterns:
          - pattern: $S.pipe($R)
          - metavariable-regex:
              metavariable: $R
              regex: ^(res|resp|response|reply)$
          - focus-metavariable: $S
    metadata:
      activity: generates_video
      mentioned: performs
      definition: https://lexlint.io/activities/generates-video
      provenance: ungovr-original
      license: MIT
