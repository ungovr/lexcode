rules:
  - id: lexcode.video.php-video-reply-to-response
    languages: [php]
    severity: INFO
    message: Sends a clip a video model made back in an HTTP response, a view or a broadcast, which is generating video with AI that reaches users (generates_video).
    mode: taint
    # Every source starts with a whole-file anchor (CONTRIBUTING.md, Cost), so the engine skips
    # a file that cannot hold the call instead of parsing it.
    pattern-sources:
      # OpenAI's Videos API on a client object. An Eloquent videos relation also has create, and
      # may keep a prompt column, so the receiver has to look like a model client.
      - patterns:
          - pattern-regex: (?s)\A(?=.*->\s*videos\s*\(\s*\)\s*->\s*create).*
          - pattern: "$C->videos()->create([..., 'prompt' => $P, ...])"
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^\$.*(client|openai|open_ai|sora)
      # The openai-php/laravel facade, fully qualified or imported (under its own name or an alias).
      - patterns:
          - pattern-regex: (?s)\A(?=.*OpenAI).*
          - pattern-either:
              - pattern: \OpenAI\Laravel\Facades\OpenAI::videos()->create(...)
              - patterns:
                  - pattern-inside: |
                      use OpenAI\Laravel\Facades\OpenAI;
                      ...
                  - pattern: OpenAI::videos()->create(...)
              - patterns:
                  - pattern-inside: |
                      use OpenAI\Laravel\Facades\OpenAI as $A;
                      ...
                  - pattern: $A::videos()->create(...)
    pattern-propagators:
      # A record updated with the model's output carries it to whatever shows or broadcasts the record.
      - pattern: "$REC->update([..., $K => $V, ...])"
        from: $V
        to: $REC
        by-side-effect: true
      - pattern: "$REC->fill([..., $K => $V, ...])"
        from: $V
        to: $REC
        by-side-effect: true
      # Output written to a file or a storage disk carries on in the path, which a download, a
      # file response or a storage URL then hands to the person.
      - pattern: file_put_contents($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: Storage::put($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: Storage::disk(...)->put($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
    pattern-sinks:
      # Plain PHP writes the response body with echo, print and printf. A console command's
      # output goes to the terminal of whoever runs it, so it does not count.
      - patterns:
          - pattern-either:
              - pattern: echo ...;
              - pattern: print(...)
              - pattern: printf(...)
          - pattern-not-inside: |
              class $CMD extends Command {
                ...
              }
      # Laravel: the response and view helpers, the Response, View and Inertia facades, and a broadcast.
      - pattern: response(...)
      - pattern: response()->$RM(...)
      - pattern: view(...)
      - pattern: view(...)->with(...)
      - pattern: inertia(...)
      - pattern: broadcast(...)
      - patterns:
          - pattern: $FACADE::$FM(...)
          - metavariable-regex:
              metavariable: $FACADE
              regex: ^\\?(Illuminate\\Support\\Facades\\)?(Response|View|Inertia)$
          - metavariable-regex:
              metavariable: $FM
              regex: ^(json|make|stream|streamJson|eventStream|view|render)$
      # Symfony and PSR-7: a response built with the text, or the controller's json, render and
      # stream and file helpers (Livewire's stream too).
      - patterns:
          - pattern: new $RESP(...)
          - metavariable-regex:
              metavariable: $RESP
              regex: ^\\?([A-Za-z_]\w*\\)*(Response|JsonResponse|StreamedResponse|StreamedJsonResponse|EventStreamResponse|BinaryFileResponse|HtmlResponse|TextResponse)$
      - patterns:
          - pattern: $this->$TM(...)
          - metavariable-regex:
              metavariable: $TM
              regex: ^(json|render|stream|file)$
      - pattern: $RESPONSE->setContent(...)
      - pattern: $RESPONSE->getBody()->write(...)
      # A Laravel controller action's value is the response: a public method of a class named
      # like a controller. A private helper's value is not.
      - patterns:
          - pattern-inside: |
              class $CTRL extends $BASE {
                ...
              }
          - metavariable-regex:
              metavariable: $CTRL
              regex: ^\w*Controller$
          - pattern-inside: |
              public function $ACTION(...) {
                ...
              }
          - pattern: return $X;
          - focus-metavariable: $X
      # A Laravel route closure's value is the response.
      - patterns:
          - pattern-inside: Route::$VERB($PATH, function (...) { ... })
          - pattern: return $X;
          - focus-metavariable: $X
      # A Livewire component's property is rendered by its view.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $LW extends \Livewire\Component {
                    ...
                  }
              - patterns:
                  - pattern-inside: |
                      use Livewire\Component;
                      ...
                  - pattern-inside: |
                      class $LW extends Component {
                        ...
                      }
          - pattern: $this->$PROP = $X
          - focus-metavariable: $X
    metadata:
      activity: generates_video
      mentioned: performs
      definition: https://lexlint.io/activities/generates-video
      provenance: ungovr-original
      license: MIT
