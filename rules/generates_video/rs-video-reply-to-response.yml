rules:
  - id: lexcode.video.rs-video-reply-to-response
    languages: [rust]
    severity: INFO
    message: Sends a clip a video model made back in an HTTP response, a socket or an app window, which is generating video with AI that reaches users (generates_video).
    mode: taint
    # A library item is written by its full crate path, once: the engine resolves a file's use
    # lines (grouped, aliased with `use <crate> as <alias>`, and a glob such as
    # `use loco_rs::prelude::*`), so the pattern also matches the short form, and never an
    # app's own item of the same short name in a file without that use (Decision 14).
    # A client's methods are matched through the chain from the client (`$C.chat().create(...)`),
    # since the engine does not know a Rust receiver's type. A method name that apps also use
    # (`prompt`, `generate`, `sample`) is a source only when the value it is called on, or the
    # request it is sent with, carries a label set by the library's own constructor.
    # A call inside a macro body (`format!`, `json!`, `select!`) is invisible to the engine, so
    # `Json(json!({ "reply": reply }))` is not followed (Decision 6, rules/README.md).
    pattern-sources:
      # async-openai: OpenAI's Videos API (Sora): a clip remixed, and the clip's bytes downloaded.
      # `create`, `edit` and `extend` are names a video host's client may give an upload, so they
      # are sources only when sent with async-openai's own request, built with its Args builder
      # (OPENAI_VIDEO_REQUEST, which no sink accepts).
      - pattern: $C.videos().remix(...)
      - pattern: $C.videos().download_content(...)
      - label: OPENAI_VIDEO_REQUEST
        pattern-either:
          - pattern: async_openai::types::CreateVideoRequestArgs::default()
          - pattern: async_openai::types::videos::CreateVideoRequestArgs::default()
          - pattern: async_openai::types::CreateVideoEditRequestArgs::default()
          - pattern: async_openai::types::videos::CreateVideoEditRequestArgs::default()
          - pattern: async_openai::types::CreateVideoExtendRequestArgs::default()
          - pattern: async_openai::types::videos::CreateVideoExtendRequestArgs::default()
          # The short form, for async-openai's documented `use async_openai::{types::{...}, Client}`.
          - patterns:
              - pattern-regex: '(?s)\A(?=.*\buse\s+async_openai\b).*'
              - pattern-either:
                  - pattern: CreateVideoRequestArgs::default()
                  - pattern: CreateVideoEditRequestArgs::default()
                  - pattern: CreateVideoExtendRequestArgs::default()
      - requires: OPENAI_VIDEO_REQUEST
        patterns:
          - pattern-either:
              - pattern: $C.videos().create(...)
              - pattern: $C.videos().edit(...)
              - pattern: $C.videos().extend(...)
      # AWS Bedrock Runtime: a video model (Nova Reel, Luma) started by id.
      - patterns:
          - pattern: $B.model_id($ID)
          - metavariable-pattern:
              metavariable: $B
              pattern: $C.start_async_invoke()
          - metavariable-regex:
              metavariable: $ID
              regex: '(?i)^"[^"]*(nova-reel|luma\.)[^"]*"$'
      # A video model called over HTTP (reqwest's post or get): OpenAI's Videos API, Google's Veo (predictLongRunning on the Gemini API or Vertex AI), Runway's text_to_video and image_to_video, and Luma's Dream Machine. The call is the source, not the address: a settings page that only shows the endpoint generates nothing.
      - patterns:
          - pattern-either:
              - pattern: $HTTP.post($URL)
              - pattern: $HTTP.get($URL)
          - metavariable-regex:
              metavariable: $URL
              regex: '^&?(?:format!\(\s*)?"https://(?:api\.openai\.com/v1/videos|generativelanguage\.googleapis\.com/[^"]*:predictLongRunning|[^"]*aiplatform\.googleapis\.com/[^"]*veo[^"]*:predictLongRunning|api\.(?:dev\.)?runwayml\.com/v1/(?:text|image)_to_video|api\.lumalabs\.ai/dream-machine/v1/generations)'
    pattern-propagators:
      # Output gathered into a string, a buffer or a list is sent on with it.
      - pattern: $S.push_str($X)
        from: $X
        to: $S
        by-side-effect: true
      - pattern: $S.push($X)
        from: $X
        to: $S
        by-side-effect: true
      - pattern: $S.extend($X)
        from: $X
        to: $S
        by-side-effect: true
      - pattern: $S.extend_from_slice($X)
        from: $X
        to: $S
        by-side-effect: true
    pattern-sinks:
      # axum: the Json and Html extractors-as-responses, a body, a server-sent event, a WebSocket
      # message, and any value turned into a response (`IntoResponse`, axum's and Poem's trait).
      - pattern: axum::Json(...)
      - pattern: axum::response::Json(...)
      - pattern: axum::response::Html(...)
      - pattern: axum::body::Body::from(...)
      - pattern: axum::response::sse::Event::default().data(...)
      - pattern: axum::response::sse::Event::default().json_data(...)
      - pattern: axum::response::sse::Sse::new(...)
      - pattern: axum::extract::ws::Message::Text(...)
      - pattern: axum::extract::ws::Message::Binary(...)
      - patterns:
          - pattern: $X.into_response()
          - focus-metavariable: $X
      # actix-web: the Json responder, and a response builder's body, JSON or stream. The builder
      # is read from its constructor, so reqwest's `.body(...)` on an outgoing request is not a
      # response.
      - pattern: actix_web::web::Json(...)
      - patterns:
          - pattern-either:
              - pattern: $B.body($X)
              - pattern: $B.json($X)
              - pattern: $B.streaming($X)
          - metavariable-pattern:
              metavariable: $B
              pattern-either:
                - pattern: actix_web::HttpResponse::$S()
                - pattern: actix_web::HttpResponse::build(...)
                - pattern: actix_web::HttpResponseBuilder::new(...)
          - focus-metavariable: $X
      # The http crate's response builder, as hyper, axum and Poem re-export it, and hyper's and
      # http's own response and body types.
      - patterns:
          - pattern: $B.body($X)
          - metavariable-pattern:
              metavariable: $B
              pattern-either:
                - pattern: http::Response::builder()
                - pattern: hyper::Response::builder()
                - pattern: axum::response::Response::builder()
                - pattern: axum::http::Response::builder()
                - pattern: poem::Response::builder()
          - focus-metavariable: $X
      # `http::Response::new(...)` is left out: as a pattern of its own, a path that starts with
      # `http` makes the engine fail on a file holding a `// https://` comment between attributes
      # (Opengrep 1.33.1, "Common.Impossible"; lemmy's diesel_utils/src/pagination.rs), and
      # apps build that response through a builder or hyper's or axum's own type.
      - pattern: hyper::Response::new(...)
      - pattern: hyper::Body::from(...)
      - pattern: http_body_util::Full::new(...)
      # Rocket: the Json responder, the raw content responders and an event stream's event.
      - pattern: rocket::serde::json::Json(...)
      - pattern: rocket::response::content::RawHtml(...)
      - pattern: rocket::response::content::RawText(...)
      - pattern: rocket::response::content::RawJson(...)
      - pattern: rocket::response::stream::Event::data(...)
      - pattern: rocket::response::stream::Event::json(...)
      # warp: a JSON or HTML reply, a server-sent event and a WebSocket message.
      - pattern: warp::reply::json(...)
      - pattern: warp::reply::html(...)
      - pattern: warp::sse::Event::default().data(...)
      - pattern: warp::ws::Message::text(...)
      - pattern: warp::ws::Message::binary(...)
      # Poem and poem-openapi: the response payloads and a server-sent event.
      - pattern: poem::web::Json(...)
      - pattern: poem::web::Html(...)
      - pattern: poem::web::sse::Event::message(...)
      - pattern: poem_openapi::payload::Json(...)
      - pattern: poem_openapi::payload::PlainText(...)
      - pattern: poem_openapi::payload::Html(...)
      - pattern: poem_openapi::payload::Binary(...)
      # Loco: a controller's format helpers, through the controller module or Loco's prelude.
      - pattern: loco_rs::controller::format::json(...)
      - pattern: loco_rs::controller::format::text(...)
      - pattern: loco_rs::controller::format::html(...)
      - pattern: loco_rs::prelude::format::json(...)
      - pattern: loco_rs::prelude::format::text(...)
      - pattern: loco_rs::prelude::format::html(...)
      # A WebSocket message through tungstenite, on its own or through tokio-tungstenite.
      - pattern: tungstenite::Message::Text(...)
      - pattern: tungstenite::Message::Binary(...)
      - pattern: tokio_tungstenite::tungstenite::Message::Text(...)
      - pattern: tokio_tungstenite::tungstenite::Message::Binary(...)
      # The same response types in their short form, for a file that imports them through a path
      # inside a `use` group (`use axum::{response::Html, Json}`), which the engine does not resolve
      # (rules/README.md); each of these crates' own documentation imports that way. A short form
      # counts only in a file whose `use` lines name one of the web crates: a greedy whole-file check,
      # one literal per check (group-common amendment, 2026-11-15). One guard serves every short form:
      # per-crate guards (RawHtml for Rocket only, and so on) cost about twice as much over lemmy
      # (9.1 s against 4.4 s for this rule alone), and in a file that imports a web framework these
      # names are its response types.
      - patterns:
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*\buse\s+axum\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+rocket\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+poem\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+poem_openapi\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+hyper\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+tungstenite\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+tokio_tungstenite\b).*'
          - pattern-either:
              - pattern: Json(...)
              - pattern: Html(...)
              - pattern: PlainText(...)
              - pattern: Binary(...)
              - pattern: RawHtml(...)
              - pattern: RawText(...)
              - pattern: RawJson(...)
              - pattern: Event::data(...)
              - pattern: Event::json(...)
              - pattern: Event::message(...)
              - pattern: Event::default().data(...)
              - pattern: Event::default().json_data(...)
              - pattern: Sse::new(...)
              - pattern: Body::from(...)
              - pattern: Message::Text(...)
              - pattern: Message::Binary(...)
      - patterns:
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*\buse\s+axum\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+rocket\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+poem\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+poem_openapi\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+hyper\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+tungstenite\b).*'
              - pattern-regex: '(?s)\A(?=.*\buse\s+tokio_tungstenite\b).*'
          - pattern: $B.body($X)
          - metavariable-pattern:
              metavariable: $B
              pattern: Response::builder()
          - focus-metavariable: $X
      # Tauri: a command's value is handed to the app's own window, and an event's payload goes
      # to the front end listening for it (Tauri's Emitter; socketioxide's emit reaches a
      # connected client the same way).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  #[tauri::command]
                  fn $CMD(...) -> $R { ... }
              - pattern-inside: |
                  #[tauri::command]
                  async fn $CMD(...) -> $R { ... }
          - pattern: Ok($X)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: $W.emit($EVENT, $X)
              - pattern: $W.emit_all($EVENT, $X)
              - pattern: $W.emit_to($TARGET, $EVENT, $X)
          - focus-metavariable: $X
    metadata:
      activity: generates_video
      mentioned: performs
      definition: https://lexlint.io/activities/generates-video
      provenance: ungovr-original
      license: MIT
