rules:
  - id: lexcode.outreach.rb-sms-call-push-send
    languages: [ruby]
    severity: INFO
    message: Sends a text, places a call or pushes a notification, where the code does not show whether a person just asked for it, which may be sending automated outreach (automated_outreach).
    patterns:
      - pattern-either:
          # A text with no body: (a content template) counts; one with a body counts unless the body
          # is a one-time code, a verification, or a password or PIN message, which a person just
          # asked for. Only the body is read: a promo code, or a recipient named verified_phone,
          # says nothing about that.
          - patterns:
              - pattern: '$C.messages.create(..., to: $TO, ...)'
              - pattern-not: '$C.messages.create(..., body: $B, ...)'
          - patterns:
              - pattern: '$C.messages.create(..., to: $TO, ...)'
              - pattern: '$C.messages.create(..., body: $B, ...)'
              - metavariable-regex:
                  metavariable: $B
                  regex: '(?is)^(?!.*(?:verif|one[- ]?time|\botp\b|passcode|password|\bpin\b|(?<!promo )(?<!discount )(?<!coupon )(?<!referral )(?<!gift )(?<!zip )\bcode\b))'
          - pattern: '$C.calls.create(..., to: $TO, ...)'
          - pattern: Webpush.payload_send(...)
          - pattern: Rpush::$K::Notification.create!(...)
          - pattern: Rpush::$K::Notification.create(...)
          - pattern: $X.send_sms(...)
          - pattern: send_sms(...)
          - pattern: '$S.publish(..., phone_number: $N, ...)'
          - pattern: $V.sms.send(...)
          - pattern: Telnyx::Message.create(...)
      # Literal anchor inside the match: it lets the engine skip files with no send call.
      - pattern-regex: '(&?\.(?:\s|\\|#[^\n]*+)*+(messages|calls)(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+create\b|Webpush(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+payload_send|Rpush::\w+::Notification(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+create|send_sms|&?\.(?:\s|\\|#[^\n]*+)*+publish\b|&?\.(?:\s|\\|#[^\n]*+)*+sms(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+send\b|Telnyx::Message(?:\(\s*\))?(?:\s|\\|#[^\n]*+)*+&?\.(?:\s|\\|#[^\n]*+)*+create)'
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
      strength: signal
