# Signal strength, as in every other language: one text, call or push is as often the one a person
# just asked for (a code, an order update) as a message the software decided to send. The loop, timer
# and bulk shapes are the evidence rules; this one is the worth-a-look row. A text whose body names a
# code, a one-time password or a verification is left out, since it answers the person's own sign-in.
#
# The sends: Twilio's outbound message and call (the `twilio` crate), an SNS text to a phone number,
# a web-push message, an APNs notification (a2) and an FCM message, each where it is built, and an
# HTTP POST to Twilio's messages or calls API by its literal address. Crate items are written by
# their crate path, resolved through a plain or single-level grouped `use` and an alias; a `use`
# whose group nests a path is not resolved on Opengrep 1.33.1.
rules:
  - id: lexcode.outreach.rs-sms-call-push-send
    languages: [rust]
    severity: INFO
    message: Sends a text, places a call or pushes a notification, where the code does not show whether a person just asked for it, which may be sending automated outreach (automated_outreach).
    pattern-either:
      - patterns:
          - pattern: twilio::OutboundMessage::new($FROM, $TO, $BODY)
          - metavariable-regex:
              metavariable: $BODY
              regex: (?is)^(?!.*(code|otp|verif|passcode|password|\bpin\b)).*$
      - pattern: twilio::OutboundCall::new(...)
      # Twilio's OpenAPI-generated client (the `openapi` crate Twilio's guide builds from its
      # specification, under any crate name): `create_message` and `create_call` in the generated
      # api20100401 message and call modules, by path or imported, in a file that names the module.
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*\bapi20100401_message_api\b).*'
          - pattern-either:
              - pattern: create_message($TWCFG, $TWP)
              - pattern: $TWM::create_message($TWCFG, $TWP)
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*\bapi20100401_call_api\b).*'
          - pattern-either:
              - pattern: create_call($TWCFG, $TWP)
              - pattern: $TWM::create_call($TWCFG, $TWP)
      # SNS: the phone number and the message are set in either order, with other builder calls
      # (`subject`) between them, and as setters (`set_phone_number`, `set_message`). The match is
      # the later of the two calls, read with the chain before it; the code exclusion applies to the
      # message as it does to Twilio's body (in the second form it reads the whole chain, so a code
      # word anywhere in it leaves the call out).
      - patterns:
          - pattern-either:
              - pattern: $CHAIN.message($BODY)
              - pattern: $CHAIN.set_message($BODY)
          - metavariable-regex:
              metavariable: $CHAIN
              regex: (?s)^.*\.publish\(\s*\).*\.(set_)?phone_number\(
          - metavariable-regex:
              metavariable: $BODY
              regex: (?is)^(?!.*(code|otp|verif|passcode|password|\bpin\b)).*$
      - patterns:
          - pattern-either:
              - pattern: $CHAIN.phone_number($TO)
              - pattern: $CHAIN.set_phone_number($TO)
          - metavariable-regex:
              metavariable: $CHAIN
              regex: (?is)^(?!.*(code|otp|verif|passcode|password|\bpin\b)).*\.publish\(\s*\).*\.(set_)?message\(
      - pattern: web_push::WebPushMessageBuilder::new(...)
      - pattern: a2::DefaultNotificationBuilder::new()
      - pattern: fcm::MessageBuilder::new(...)
      - patterns:
          - pattern: $H.post($URL)
          - metavariable-regex:
              metavariable: $URL
              regex: (?is)^r?#*".*api\.twilio\.com/.*/(Messages|Calls).*
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
      strength: signal
