rules:
  - id: lexcode.outreach.send-in-scheduled-job-go
    languages: [go]
    severity: INFO
    message: Sends an email or text from a timer or cron job that no user action triggers, which is sending automated outreach (automated_outreach).
    patterns:
      - pattern-either:
          - pattern-inside: |
              for range $T.C {
                  ...
              }
          - pattern-inside: |
              for range time.Tick(...) {
                  ...
              }
          - pattern-inside: |
              for _ = range $T.C {
                  ...
              }
          - pattern-inside: |
              select {
              case <-$T.C:
                  ...
              }
          - pattern-inside: |
              $CR.AddFunc(...)
          - pattern-inside: |
              $CR.AddJob(...)
      - pattern-either:
          - pattern: smtp.SendMail(...)
          - pattern: $D.DialAndSend(...)
          - pattern: $A.Api.CreateMessage(...)
          - pattern: $A.Api.CreateCall(...)
          - pattern: $A.SendEmail(...)
          - pattern: $A.SendRawEmail(...)
          - pattern: $A.SendTemplatedEmail(...)
          - pattern: $A.Emails.Send(...)
          - patterns:
              - pattern: $A.Send(...)
              - metavariable-regex:
                  metavariable: $A
                  regex: (?i)^(\w*sendgrid\w*|sg|mg|\w*mailgun\w*|\w*mailer|\w*dialer|d)$
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
