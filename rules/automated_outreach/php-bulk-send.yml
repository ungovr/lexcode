rules:
  - id: lexcode.outreach.php-bulk-send
    languages: [php]
    severity: INFO
    message: Sends one message to many recipients in a single batch call, push multicast or campaign send, which is sending automated outreach (automated_outreach).
    # Laravel's Notification facade counts when its first argument reads as many notifiables (a plural
    # name, all(), get(), cursor()); Laravel documents it for a collection of users, and a single
    # notifiable is php-send-in-loop's or nothing. Filament's Notification toast and an app's own
    # Notification class are other classes and do not match.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: \Illuminate\Support\Facades\Notification::$NM($TO, ...)
              - pattern: \Notification::$NM($TO, ...)
              - patterns:
                  - pattern-inside: |
                      use Illuminate\Support\Facades\Notification;
                      ...
                  - pattern: Notification::$NM($TO, ...)
              - patterns:
                  - pattern-inside: |
                      use Illuminate\Support\Facades\Notification as $NA;
                      ...
                  - pattern: $NA::$NM($TO, ...)
          - metavariable-regex:
              metavariable: $NM
              regex: ^(send|sendNow)$
          - metavariable-regex:
              metavariable: $TO
              regex: '(?is)^.*(s|s\(\)|::all\(\)|->get\(\)|->cursor\(\)|->lazy\(\)|list|collection)$'
      # Amazon SES bulk sends.
      - pattern: $S->sendBulkTemplatedEmail(...)
      - pattern: $S->sendBulkEmail(...)
      # Firebase Cloud Messaging multicast (kreait/firebase-php).
      - pattern: $F->sendMulticast(...)
      - patterns:
          - pattern-either:
              - pattern: $F->sendAll(...)
              - pattern: $F->sendEach(...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(\$this->|\$)\w*(firebase|fcm|messaging)\w*$
      # Mailchimp campaign send, Twilio Notify, Postmark and Resend batches, Brevo campaign send.
      - pattern: $M->campaigns->send(...)
      - pattern: $T->notify->v1->services(...)->notifications->create(...)
      - pattern: $P->sendEmailBatch(...)
      - pattern: $P->sendEmailBatchWithTemplates(...)
      - pattern: $R->batch->send(...)
      - pattern: $B->sendEmailCampaignNow(...)
      # A Mailgun batch: one send with per-recipient variables.
      - pattern: "$MG->messages()->send($D, [..., 'recipient-variables' => $V, ...])"
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
