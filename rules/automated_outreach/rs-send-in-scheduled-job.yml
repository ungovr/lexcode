# A timer or a cron job runs with no person asking: a send inside one is a message the software
# initiates. The timers: a tokio interval ticked in a loop, a tokio-cron-scheduler job, and a
# clokwerk schedule. A polling loop that only sleeps (`tokio::time::sleep`) is not a timer here,
# because a retry loop that backs off between attempts at ONE message has the same shape.
#
# A send in the error branch of the job (`if let Err(e) = run_job().await { send_alert_email(..) }`,
# or the arm `Err(e) => send_alert_email(..)` of a `match`) mails an operator about the failure,
# which is an alert and not outreach; it is left out, as the Java and Kotlin rules leave out a send
# in a catch block. Only the branch's body is left out, so a send that is the scrutinee itself
# (`if let Err(e) = mailer.send(msg).await`: the timer sends and handles its failure), a send in the
# `else` and a send in the `Ok` arm are kept. On Opengrep 1.33.1 a `match` pattern of one arm
# matches that arm among any number of arms in any position (measured: two to five arms, `Err`
# first, middle or last), so one pattern covers every layout. Any send in an `Err` branch is left
# out, except inside an iteration over the timer's recipients (a `for`, a `while let Some(s)`, or
# the one-parameter closure of `map`, `then`, `filter_map`, `flat_map` or a `for_each` form) when a
# call in the branch takes the item as its first argument (`Err(_) => send_email(&s.email, ..)`): a
# fallback to each recipient is outreach. rs-send-in-loop reads the `for`, `while let` and
# `for_each` forms itself and has no error-branch exclusion; the `map` closure handed to
# `join_all` is read by no other rule, so without this a per-recipient fallback there was lost
# (#13301 review A3). An alert to the operator that names the item later (`send_alert_email(&admin,
# &job.name)`) is still left out, and a fallback whose recipient is not the item itself (a field
# bound to a `let` first), or whose closure takes a tuple or a pattern, is missed. A `for` inside
# the `Err` branch (the batch failed, so mail every subscriber) is left out here and is
# rs-send-in-loop's match.
#
# The sends are rs-send-in-loop's. tokio-cron-scheduler's Job is written by its crate path, which
# the engine resolves through `use tokio_cron_scheduler::{Job, JobScheduler}` and an alias; a
# `use` whose group nests a path is not resolved on Opengrep 1.33.1. A send inside a macro body is
# not seen (rules/README.md).
rules:
  - id: lexcode.outreach.rs-send-in-scheduled-job
    languages: [rust]
    severity: INFO
    message: Sends an email, text, call, push notification or direct message from a timer or cron job that no user action triggers, which is sending automated outreach (automated_outreach).
    patterns:
      - pattern-either:
          - pattern-inside: |
              loop {
                ...
                $TICKER.tick().await;
                ...
              }
          - pattern-inside: tokio_cron_scheduler::Job::new(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_async(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_repeated(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_repeated_async(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_cron_job(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_cron_job_async(...)
          - pattern-inside: $SCHED.every($EVERY).at($AT).run(...)
          - pattern-inside: $SCHED.every($EVERY).run(...)
      # The exclusions' ranges are the error branch's body only (focus-metavariable), never the
      # scrutinee, an `else` or another arm. A branch inside an iteration over the timer's
      # recipients (a `for`, a `while let Some(..)`, or the closure of an iterator or stream
      # adapter such as `map` feeding a `join_all`) whose body makes a call whose first argument
      # names the item (`Err(_) => send_email(&s.email, ..)`, a fallback to each subscriber) is
      # outreach, not an alert, so it is not left out; an alert naming the item later
      # (`send_alert_email(&admin, &job.name)`) is.
      - pattern-not-inside:
          patterns:
            - pattern: |
                if let Err($ERR) = $RES { $...BODY }
            - pattern-not-inside:
                patterns:
                  - pattern-either:
                      - pattern-inside: |
                          for $ITEM in $ITEMS { ... }
                      - pattern-inside: |
                          while let Some($ITEM) = $ITEMS { ... }
                      - patterns:
                          - pattern-either:
                              - pattern-inside: $ITEMS.$ADAPT(|$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT(move |$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT($LIMIT, |$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT($LIMIT, move |$ITEM| $CB)
                          - metavariable-regex:
                              metavariable: $ADAPT
                              regex: ^(map|then|filter_map|flat_map|for_each|for_each_concurrent|try_for_each|try_for_each_concurrent)$
                  - pattern: |
                      if let Err($ERR2) = $RES2 { $...BODY2 }
                  - metavariable-pattern:
                      metavariable: $...BODY2
                      pattern-either:
                        - pattern: $SF(<... $ITEM ...>, ...)
                        - pattern: $SX.$SF(<... $ITEM ...>, ...)
            - focus-metavariable: $...BODY
      # One arm in the pattern matches that arm among any number of arms, in any position.
      - pattern-not-inside:
          patterns:
            - pattern: |
                match $RES { Err($ERR) => $BODY }
            - pattern-not-inside:
                patterns:
                  - pattern-either:
                      - pattern-inside: |
                          for $ITEM in $ITEMS { ... }
                      - pattern-inside: |
                          while let Some($ITEM) = $ITEMS { ... }
                      - patterns:
                          - pattern-either:
                              - pattern-inside: $ITEMS.$ADAPT(|$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT(move |$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT($LIMIT, |$ITEM| $CB)
                              - pattern-inside: $ITEMS.$ADAPT($LIMIT, move |$ITEM| $CB)
                          - metavariable-regex:
                              metavariable: $ADAPT
                              regex: ^(map|then|filter_map|flat_map|for_each|for_each_concurrent|try_for_each|try_for_each_concurrent)$
                  - pattern: |
                      match $RES2 { Err($ERR2) => $BODY2 }
                  - metavariable-pattern:
                      metavariable: $BODY2
                      pattern-either:
                        - pattern: $SF(<... $ITEM ...>, ...)
                        - pattern: $SX.$SF(<... $ITEM ...>, ...)
            - focus-metavariable: $BODY
      - pattern-either:
          - patterns:
              - pattern: $T.send(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: '(?i)^&?(\w+\.)*(?!\w*mailbox)\w*(mail|smtp)\w*$'
          - patterns:
              - pattern: $SG.send(...)
              - metavariable-regex:
                  metavariable: $SG
                  regex: '(?i)^&?(\w+\.)*(sg|\w*sendgrid\w*)$'
          - pattern: $C.send_email()
          - pattern: $R.emails.send(...)
          - patterns:
              - pattern-either:
                  - pattern: $N(...)
                  - pattern: $X.$N(...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^send_(\w+_)?(email|mail|sms|text_message|push|push_notification|notification|reminder|digest|newsletter|alert)s?$
          - pattern: twilio::OutboundMessage::new(...)
          - pattern: twilio::OutboundCall::new(...)
          - pattern: web_push::WebPushMessageBuilder::new(...)
          - pattern: a2::DefaultNotificationBuilder::new()
          - pattern: fcm::MessageBuilder::new(...)
          - pattern: $C.publish().phone_number(...)
          - patterns:
              - pattern: $H.post($URL)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?is)^r?#*".*(api\.resend\.com/emails|api\.sendgrid\.com/v3/mail/send|api\.postmarkapp\.com/email|api\.mailgun\.net/v3|mandrillapp\.com/api|api\.brevo\.com/v3/smtp/email|api\.twilio\.com/.*/(Messages|Calls)).*
          - patterns:
              - pattern: $BOT.send_message($CHAT, ...)
              - metavariable-regex:
                  metavariable: $BOT
                  regex: '(?i)^&?(self\.)?\w*bot$'
          - pattern: $U.direct_message(...)
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
