# A timer or a cron job runs with no person asking: a send inside one is a message the software
# initiates. The timers: a tokio interval ticked in a loop, a tokio-cron-scheduler job, and a
# clokwerk schedule. A polling loop that only sleeps (`tokio::time::sleep`) is not a timer here,
# because a retry loop that backs off between attempts at ONE message has the same shape.
#
# A send in the error branch of the job (`if let Err(e) = run_job().await { send_alert_email(..) }`,
# or the arm `Err(e) => send_alert_email(..)` of a `match`) mails an operator about the failure,
# which is an alert and not outreach; it is left out, as the Java and Kotlin rules leave out a send
# in a catch block. Only the branch's body is left out, so a send that is the scrutinee itself
# (`if let Err(e) = mailer.send(msg).await`: the timer sends and handles its failure), a send in the
# `else` and a send in the `Ok` arm are kept. On Opengrep 1.33.1 a Rust `match` pattern cannot hold
# an ellipsis among its arms, so the arms are spelled out: two arms with `Err` first or last, and
# three with `Err` last. A `match` of four arms or more, or one whose `Err` arm sits in the middle
# of three, is a known residual.
#
# The sends are rs-send-in-loop's. tokio-cron-scheduler's Job is written by its crate path, which
# the engine resolves through `use tokio_cron_scheduler::{Job, JobScheduler}` and an alias; a
# `use` whose group nests a path is not resolved on Opengrep 1.33.1. A send inside a macro body is
# not seen (rules/README.md).
rules:
  - id: lexcode.outreach.rs-send-in-scheduled-job
    languages: [rust]
    severity: INFO
    message: Sends an email, text, call, push notification or direct message from a timer or cron job that no user action triggers, which is sending automated outreach (automated_outreach).
    patterns:
      - pattern-either:
          - pattern-inside: |
              loop {
                ...
                $TICKER.tick().await;
                ...
              }
          - pattern-inside: tokio_cron_scheduler::Job::new(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_async(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_repeated(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_repeated_async(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_cron_job(...)
          - pattern-inside: tokio_cron_scheduler::Job::new_cron_job_async(...)
          - pattern-inside: $SCHED.every($EVERY).at($AT).run(...)
          - pattern-inside: $SCHED.every($EVERY).run(...)
      # The exclusions' ranges are the error branch's body only (focus-metavariable), never the
      # scrutinee, an `else` or another arm.
      - pattern-not-inside:
          patterns:
            - pattern: |
                if let Err($ERR) = $RES { $...BODY }
            - focus-metavariable: $...BODY
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    match $RES { $P => $A, Err($ERR) => $BODY }
                - pattern: |
                    match $RES { Err($ERR) => $BODY, $P => $A }
                - pattern: |
                    match $RES { $P => $A, $Q => $C, Err($ERR) => $BODY }
            - focus-metavariable: $BODY
      - pattern-either:
          - patterns:
              - pattern: $T.send(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: '(?i)^&?(\w+\.)*(?!\w*mailbox)\w*(mail|smtp)\w*$'
          - patterns:
              - pattern: $SG.send(...)
              - metavariable-regex:
                  metavariable: $SG
                  regex: '(?i)^&?(\w+\.)*(sg|\w*sendgrid\w*)$'
          - pattern: $C.send_email()
          - pattern: $R.emails.send(...)
          - patterns:
              - pattern-either:
                  - pattern: $N(...)
                  - pattern: $X.$N(...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^send_(\w+_)?(email|mail|sms|text_message|push|push_notification|notification|reminder|digest|newsletter|alert)s?$
          - pattern: twilio::OutboundMessage::new(...)
          - pattern: twilio::OutboundCall::new(...)
          - pattern: web_push::WebPushMessageBuilder::new(...)
          - pattern: a2::DefaultNotificationBuilder::new()
          - pattern: fcm::MessageBuilder::new(...)
          - pattern: $C.publish().phone_number(...)
          - patterns:
              - pattern: $H.post($URL)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?is)^r?#*".*(api\.resend\.com/emails|api\.sendgrid\.com/v3/mail/send|api\.postmarkapp\.com/email|api\.mailgun\.net/v3|mandrillapp\.com/api|api\.brevo\.com/v3/smtp/email|api\.twilio\.com/.*/(Messages|Calls)).*
          - patterns:
              - pattern: $BOT.send_message($CHAT, ...)
              - metavariable-regex:
                  metavariable: $BOT
                  regex: '(?i)^&?(self\.)?\w*bot$'
          - pattern: $U.direct_message(...)
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
