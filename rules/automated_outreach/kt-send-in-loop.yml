rules:
  - id: lexcode.outreach.kt-send-in-loop
    languages: [kotlin]
    severity: INFO
    message: Sends an email, text, call or push notification once per recipient in a loop, which is sending automated outreach (automated_outreach).
    # A loop over relays, hosts or retry attempts sends ONE message to ONE person; the iterable's name
    # (relay, host, retry, attempt, smtp, fallback ...), a literal numeric range (`1..3`) and a loop
    # variable named for an attempt rule those out, as in java-send-in-loop. The loops are `for (x in xs)`
    # (braced or not) and the collection calls forEach, forEachIndexed, map, mapNotNull, flatMap and
    # onEach, also on a nullable receiver (`xs?.forEach`); `$L.$FE(...)` matches a trailing-lambda call.
    # A queue publish is not a send: the mail receivers are matched by name (mail, smtp), so a JMS or
    # Kafka template inside a loop stays quiet.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  for ($V in $L) $BODY
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b)).*$'
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?s)^(?!\s*\d+\s*(\.\.|until|downTo)\s*\d+\s*$).*$'
              - metavariable-regex:
                  metavariable: $V
                  regex: '(?is)^(?!.*(attempt|retr|tries)).*$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $L.$FE(...)
                  - pattern-inside: |
                      $L?.$FE(...)
              - metavariable-regex:
                  metavariable: $FE
                  regex: ^(forEach|forEachIndexed|map|mapIndexed|mapNotNull|flatMap|onEach|onEachIndexed)$
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b)).*$'
      - pattern-either:
          - pattern: Transport.send(...)
          - patterns:
              - pattern: $M.send(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '(?i)^(this\.)?\w*(mail|smtp)\w*$'
          - patterns:
              - pattern-either:
                  - pattern: $X.$N(...)
                  - pattern: $N(...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^send\w*(Email|Mail|RawEmail|TemplatedEmail|Sms|SMS|Text|TextMessage|Push|PushNotification|Notification|Reminder|Digest|Newsletter|Alert)s?$
          - patterns:
              - pattern: $SG.api(...)
              - metavariable-regex:
                  metavariable: $SG
                  regex: (?i)^(this\.)?(sg|sendgrid\w*)$
          - patterns:
              - pattern: Message.creator(...).create(...)
              - pattern-regex: '(?s)import\s+com\.twilio\..*'
          - patterns:
              - pattern: Call.creator(...).create(...)
              - pattern-regex: '(?s)import\s+com\.twilio\..*'
          - pattern: FirebaseMessaging.getInstance().send(...)
          - patterns:
              - pattern: $FM.send(...)
              - metavariable-regex:
                  metavariable: $FM
                  regex: (?i)^(this\.)?(\w*firebase\w*|fcm\w*)$
          - patterns:
              - pattern: $R.emails().send(...)
              - metavariable-regex:
                  metavariable: $R
                  regex: (?i)^(this\.)?\w*resend\w*$
          - patterns:
              - pattern: $P.deliverMessage(...)
              - pattern-regex: '(?s)import\s+com\.postmarkapp\..*'
      # Literal anchor inside the match: it lets the engine skip files with no send call.
      - pattern-regex: '(Transport\.send|\.send\(|\bsend\w*(Email|Mail|RawEmail|TemplatedEmail|Sms|SMS|Text|TextMessage|Push|PushNotification|Notification|Reminder|Digest|Newsletter|Alert)s?\b|\.api\(|\.creator\(|\.deliverMessage\()'
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
