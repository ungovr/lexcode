# rs-send-in-loop's send, made in the app's own function that a loop in another function of the
# same file calls once per item: `for sub in subscribers { notify(&sub).await }` with the mail sent in
# `notify`, or a delivery worker that polls a queue (`loop { match try_execute_task(..).await {..} }`)
# and sends in the task function. The engine's taint and patterns do not cross a function, so the
# two functions are matched as a pair of items in one file (free functions, or methods of one
# `impl` called through `self.` or `Self::`). Each loop form is written once per call form.
#
# The caller's item pattern names the call (`<... $F(...) ...>` inside the loop), so a pair is
# formed only for a function the loop calls, and the caller must come first: a sender written
# before its caller would make every function of the file start a pair, a cost that grows with the
# square of the file's functions, so that order is a known residual. The call is read in a statement
# of the loop's body, and the loop in a statement of the caller's body, not nested in another block.
#
# The loops are rs-send-in-loop's (`for`, `while let`, and `for_each`, `for_each_concurrent` and
# `try_for_each_concurrent` with a block closure), with its exclusions by name (relays, hosts,
# retries, attempts, administrators, a literal range), and a `loop` that polls or ticks: its body
# sleeps or ticks a timer and never breaks or returns. A `loop` that breaks or returns is a retry of
# one message until it goes through, and a `loop` that neither sleeps nor ticks is an event loop
# answering what arrives (a sign-up's confirmation sent as the sign-up comes in); neither is read.
# A sleep only in an `Err` arm or an `if let Err` body is a backoff after a failure, not polling,
# and a loop that awaits `accept()`, `recv()` or `next()` waits on what arrives, so an accept loop
# that sleeps after a failed accept is an event loop too.
# Binding that loop's body would pair it with every later function, so the polling check is a text
# regex for a function holding such a loop, whose range runs to the end of the file: the sender
# must come after the first polling function, and an event loop that calls a sender written after
# a polling function is read too, a known over-match. The regex balances braces and steps over line
# and block comments, strings, raw strings with up to two hashes and char literals, so a `return`
# in a comment or a `'}'` does not end the loop; a block comment nested in another or a raw string
# with three hashes or more is read as code. A call inside a macro body (`tokio::select! { }`) is
# not seen by the engine, so a loop whose call sits there is not read. A function named for a
# send (`send_email`, `send_reminder`) called in a loop is rs-send-in-loop's own match, so a send
# inside one is not matched again here.
#
# Not read: a sender written before its caller, called from another file or through a trait object,
# a free function calling a method of an `impl` (or the reverse), a bot's message (rs-send-in-loop
# reads those in the loop itself), and a timer job's closure (rs-send-in-scheduled-job).
rules:
  - id: lexcode.outreach.rs-send-in-called-function
    languages: [rust]
    severity: INFO
    message: Sends an email, text, call or push notification from the app's own function that a loop over recipients or a polling delivery worker calls once per item, which is sending automated outreach (automated_outreach).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fn $W(...) { ... loop { ... <... $F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... loop { ... <... self.$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... loop { ... <... Self::$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
              # A polling loop, read from the text: a function whose body holds a `loop` whose
              # body sleeps or ticks outside an `Err` arm or `if let Err` body, and never breaks,
              # returns or awaits accept(), recv() or next(). Groups: tk a comment, string, raw
              # string or char literal (stepped over whole), ch one character or tk, pb and lb
              # balanced parentheses and braces, ea an Err arm or `if let Err` body, sb a block
              # that sleeps or ticks outside ea, nb a block with no way out. The regex's range
              # runs from that function to the end of the file, and the sender's item must lie in
              # it, so the sender comes after the first polling function of the file. A pattern
              # binding the caller's loop body would pair it with every later function.
              - pattern: |
                  fn $F(...) { ... }
              - pattern-regex: '(?s)(?<![\w.])fn\s[^{;]*(?=\{(?:(?&ch)|(?&lb))*?(?<![\w.])loop\s*(?=(?&sb))(?&nb))(?(DEFINE)(?<tk>//[^\n]*|/\*[\s\S]*?\*/|(?<!\w)r"[^"]*"|(?<!\w)r#"[\s\S]*?"#|(?<!\w)r##"[\s\S]*?"##|"(?:[^"\\]|\\[\s\S])*"|''(?:[^''\\\n]|\\(?:u\{[0-9a-fA-F]{1,6}\}|[\s\S]))\'')(?<ch>(?>(?&tk)|[^{}]))(?<pb>\((?:(?>(?&tk)|[^()])|(?&pb))*\))(?<lb>\{(?:(?&ch)|(?&lb))*\})(?<ea>(?<![\w:])Err\s*(?&pb)\s*=>\s*(?:(?&lb)|(?:(?&pb)|(?&lb)|(?>(?&tk)|[^,{}()]))*)|(?<![\w:])if\s+let\s+Err\s*(?&pb)\s*=(?:(?&pb)|(?>(?&tk)|[^{;()]))*(?&lb))(?<sb>\{(?:(?>(?&ea)|(?&ch))|(?&lb))*?(?:(?<!\w)(?:sleep|tick)\s*\(|(?&sb))(?:(?&ch)|(?&lb))*\})(?<nb>\{(?:(?!(?<![\w.])(?:break|return)(?!\w)|\.(?:accept|recv|next)\s*\(\s*\)\s*\.await)(?&ch)|(?&nb))*\})).*'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fn $W(...) { ... for $V in $L { ... <... $F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... for $V in $L { ... <... self.$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... for $V in $L { ... <... Self::$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b|admin))(?!\s*\d+\s*\.\.=?\s*\d+\s*$).*$'
              - metavariable-regex:
                  metavariable: $V
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b|admin)).*$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fn $W(...) { ... while let $PAT = $L { ... <... $F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... while let $PAT = $L { ... <... self.$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... while let $PAT = $L { ... <... Self::$F(...) ...>; ... } ... }
                      ...
                      fn $F(...) { ... }
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b|admin)).*$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each(|$A| { ... <... $F(...) ...>; ... }); ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each(|$A| { ... <... self.$F(...) ...>; ... }); ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each(|$A| { ... <... Self::$F(...) ...>; ... }); ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each_concurrent($LIMIT, |$A| async move { ... <... $F(...) ...>; ... }).await; ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each_concurrent($LIMIT, |$A| async move { ... <... self.$F(...) ...>; ... }).await; ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.for_each_concurrent($LIMIT, |$A| async move { ... <... Self::$F(...) ...>; ... }).await; ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.try_for_each_concurrent($LIMIT, |$A| async move { ... <... $F(...) ...>; ... }).await?; ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.try_for_each_concurrent($LIMIT, |$A| async move { ... <... self.$F(...) ...>; ... }).await?; ... }
                      ...
                      fn $F(...) { ... }
                  - pattern-inside: |
                      fn $W(...) { ... $L.try_for_each_concurrent($LIMIT, |$A| async move { ... <... Self::$F(...) ...>; ... }).await?; ... }
                      ...
                      fn $F(...) { ... }
              - metavariable-regex:
                  metavariable: $L
                  regex: '(?is)^(?!.*(relay|host|server|retr|attempt|backoff|endpoint|smtp|fallback|provider|transport|mirror|failover|\bports?\b|admin)).*$'
      - metavariable-regex:
          metavariable: $F
          regex: ^(?!send_(\w+_)?(email|mail|sms|text_message|push|push_notification|notification|reminder|digest|newsletter|alert)s?$)
      - pattern-inside: |
          fn $F(...) { ... }
      - pattern-either:
          - patterns:
              - pattern: $T.send(...)
              - metavariable-regex:
                  metavariable: $T
                  regex: '(?i)^&?(\w+\.)*(?!\w*mailbox)\w*(mail|smtp)\w*$'
          - patterns:
              - pattern: $SG.send(...)
              - metavariable-regex:
                  metavariable: $SG
                  regex: '(?i)^&?(\w+\.)*(sg|\w*sendgrid\w*)$'
          - pattern: $C.send_email()
          - pattern: $R.emails.send(...)
          - patterns:
              - pattern-either:
                  - pattern: $N(...)
                  - pattern: $X.$N(...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^send_(\w+_)?(email|mail|sms|text_message|push|push_notification|notification|reminder|digest|newsletter|alert)s?$
          - pattern: twilio::OutboundMessage::new(...)
          - pattern: twilio::OutboundCall::new(...)
          # Twilio's OpenAPI-generated client (the `openapi` crate Twilio's guide builds from its
          # specification, under any crate name): `create_message` and `create_call` in the generated
          # api20100401 message and call modules, by path or imported, in a file that names the module.
          - patterns:
              - pattern-regex: '(?ms)\A(?=.*\bapi20100401_message_api\b).*'
              - pattern-either:
                  - pattern: create_message($TWCFG, $TWP)
                  - pattern: $TWM::create_message($TWCFG, $TWP)
          - patterns:
              - pattern-regex: '(?ms)\A(?=.*\bapi20100401_call_api\b).*'
              - pattern-either:
                  - pattern: create_call($TWCFG, $TWP)
                  - pattern: $TWM::create_call($TWCFG, $TWP)
          - pattern: web_push::WebPushMessageBuilder::new(...)
          - pattern: a2::DefaultNotificationBuilder::new()
          - pattern: fcm::MessageBuilder::new(...)
          - pattern: $C.publish().phone_number(...)
          - patterns:
              - pattern: $H.post($URL)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?is)^r?#*".*(api\.resend\.com/emails|api\.sendgrid\.com/v3/mail/send|api\.postmarkapp\.com/email|api\.mailgun\.net/v3|mandrillapp\.com/api|api\.brevo\.com/v3/smtp/email|api\.twilio\.com/.*/(Messages|Calls)).*
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
