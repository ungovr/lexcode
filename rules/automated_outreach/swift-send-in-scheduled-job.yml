rules:
  - id: lexcode.outreach.swift-send-in-scheduled-job
    languages: [swift]
    severity: INFO
    message: Sends an email, text, push notification or direct message from a scheduled job, a repeating timer or a task that wakes on an interval, which no person's action triggers, which is sending automated outreach (automated_outreach).
    # The schedule shapes: a Vapor Queues scheduled job (AsyncScheduledJob, ScheduledJob, as a struct
    # or a class, module-qualified only so an app's own protocol of that name does not match), a
    # repeating Foundation Timer (`repeats: true`, in its module-qualified and short forms, since
    # Foundation comes through Vapor, UIKit and SwiftUI), and a `while` loop whose body sleeps
    # (`Task.sleep`), which is how a Swift server runs a periodic task in-process. A `while` loop
    # that counts attempts or backs off is a retry of ONE message and does not match. A queued job
    # (AsyncJob) runs off a person's request and is the signal rule swift-send-in-background-job.
    # The send set is swift-send-in-loop's: a post to a bot's own channel, a local notification and a
    # silent push are not messages to people.
    patterns:
      - pattern-either:
          - pattern-inside: |
              struct $K: Queues.AsyncScheduledJob { ... }
          - pattern-inside: |
              struct $K: Queues.ScheduledJob { ... }
          - pattern-inside: |
              class $K: Queues.AsyncScheduledJob { ... }
          - pattern-inside: |
              class $K: Queues.ScheduledJob { ... }
          - pattern-inside: 'Foundation.Timer.scheduledTimer(withTimeInterval: $I, repeats: true, ...)'
          - pattern-inside: 'Timer.scheduledTimer(withTimeInterval: $I, repeats: true, ...)'
          - patterns:
              - pattern-inside: |
                  while $C { $...BODY }
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: '(?s).*\bTask\s*\.\s*sleep\b'
              - metavariable-regex:
                  metavariable: $...BODY
                  regex: '(?is)^(?!.*(attempt|retr|backoff|tries)).*$'
              - metavariable-regex:
                  metavariable: $C
                  regex: '(?is)^(?!.*(attempt|retr|backoff|tries)).*$'
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $X.$N(...)
                  - pattern: $N(...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^(?!\w*(Local|Background|LiveActivity|VoIP|FileProvider|Complication|PushToTalk))send\w*(Email|Mail|Sms|SMS|Text|TextMessage|Push|PushNotification|Notification|Reminder|Digest|Newsletter|Alert|DM|Dm|DirectMessage)s?$
          - patterns:
              - pattern: $M.send(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: '(?i)^([\w.]*\.)?\w*(mail|smtp|sendgrid|mailgun|postmark)\w*(\(\))?(\.client)?$'
          - pattern: $A.apns.send(...)
          - pattern: 'AWSSNS.PublishInput(..., phoneNumber: $P, ...)'
          - patterns:
              - pattern-regex: '(?s)\bimport\s+(DiscordBM|DiscordHTTP)\b.*'
              - pattern: $C.createDm(...)
      # Literal anchor inside the match: it lets the engine skip files with no send call.
      - pattern-regex: '(\bsend\w*\s*\(|\.send\s*\(|phoneNumber\s*:|\.createDm\s*\()'
    metadata:
      activity: automated_outreach
      mentioned: performs
      definition: https://lexlint.io/activities/automated-outreach
      provenance: ungovr-original
      license: MIT
