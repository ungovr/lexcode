rules:
  - id: lexcode.crawl.swift-fetch-extracted-link
    languages: [swift]
    severity: INFO
    message: Fetches a link taken from a page it has read (an anchor's href, an image's src), which is following links from site to site, crawling the web (crawls_web).
    mode: taint
    # The link is read from a parsed page: SwiftSoup's `attr` and `absUrl`, Kanna's and Fuzi's
    # subscript, Fuzi's `attr`. Each library is one branch with its own import guard, so a JSON
    # dictionary's `["href"]` (an API's own pagination links) in a file without an HTML parser is
    # not a source, and one library's import never admits another's call.
    pattern-sources:
      - patterns:
          - pattern-inside: |
              import SwiftSoup
              ...
          - pattern-either:
              - pattern: $E.attr($A)
              - pattern: $E.absUrl($A)
          - metavariable-regex:
              metavariable: $A
              regex: '^"(abs:)?(href|src)"$'
      - patterns:
          - pattern-inside: |
              import Kanna
              ...
          - pattern: $E[$A]
          - metavariable-regex:
              metavariable: $A
              regex: '^"(abs:)?(href|src)"$'
      - patterns:
          - pattern-inside: |
              import Fuzi
              ...
          - pattern-either:
              - pattern: $E[$A]
              - pattern: $E.attr($A)
          - metavariable-regex:
              metavariable: $A
              regex: '^"(abs:)?(href|src)"$'
    # A crawl frontier: links appended to a queue or inserted into a set are fetched from it later.
    pattern-propagators:
      - pattern: $Q.append($V)
        from: $V
        to: $Q
      - pattern: '$Q.append(contentsOf: $V)'
        from: $V
        to: $Q
      - pattern: $Q.insert($V)
        from: $V
        to: $Q
    # A link joined onto the app's own server (a loopback host) is the app reading its own pages.
    pattern-sinks:
      # The address given to a download.
      - patterns:
          - pattern-either:
              - pattern: '$S.data(from: $X, ...)'
              - pattern: '$S.bytes(from: $X, ...)'
              - pattern: '$S.download(from: $X, ...)'
              - pattern: '$S.dataTask(with: $X, ...)'
              - pattern: '$S.downloadTask(with: $X, ...)'
              - pattern: 'Foundation.URLRequest(url: $X, ...)'
              - pattern: 'URLRequest(url: $X, ...)'
              - patterns:
                  - pattern: 'String(contentsOf: $X, ...)'
                  - metavariable-regex:
                      metavariable: $X
                      regex: '(?s)^(?!.*(?:(?<![A-Za-z])[fF]ile|File|(?<![A-Za-z])[pP]ath|Path|[bB]undle|(?<![A-Za-z])[lL]ocal|Local|[dD]ocument|[dD]irectory|(?<![A-Za-z])[cC]ache|Cache|[rR]esource|(?<![A-Za-z])tmp|[tT]emp(?:orary)?(?![a-z]))).*$'
              - patterns:
                  - pattern: 'Foundation.Data(contentsOf: $X, ...)'
                  - metavariable-regex:
                      metavariable: $X
                      regex: '(?s)^(?!.*(?:(?<![A-Za-z])[fF]ile|File|(?<![A-Za-z])[pP]ath|Path|[bB]undle|(?<![A-Za-z])[lL]ocal|Local|[dD]ocument|[dD]irectory|(?<![A-Za-z])[cC]ache|Cache|[rR]esource|(?<![A-Za-z])tmp|[tT]emp(?:orary)?(?![a-z]))).*$'
              - patterns:
                  - pattern: 'Data(contentsOf: $X, ...)'
                  - metavariable-regex:
                      metavariable: $X
                      regex: '(?s)^(?!.*(?:(?<![A-Za-z])[fF]ile|File|(?<![A-Za-z])[pP]ath|Path|[bB]undle|(?<![A-Za-z])[lL]ocal|Local|[dD]ocument|[dD]irectory|(?<![A-Za-z])[cC]ache|Cache|[rR]esource|(?<![A-Za-z])tmp|[tT]emp(?:orary)?(?![a-z]))).*$'
              - pattern: 'AsyncHTTPClient.HTTPClientRequest(url: $X)'
              - patterns:
                  - pattern: '$C.get(url: $X, ...)'
                  - metavariable-regex:
                      metavariable: $C
                      regex: '^(?:self\.)?(?![\w.]*(?:(?<![a-z])[dD]b|DB|[dD]atabase|[sS]ql|SQL|[pP]ool|[rR]edis|[cC]ache|[qQ]ueue|[sS]tore|[sS]torage|[kK]eychain))[\w.]*(?:[hH]ttp|HTTP|[cC]lient)[\w.]*$'
              - pattern: '$R.client.get($X, ...)'
              - pattern: 'Alamofire.AF.request($X, ...)'
              - pattern: 'Alamofire.AF.download($X, ...)'
              - pattern: 'Kanna.HTML(url: $X, ...)'
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $X
              regex: '(?s)^(?!.*"https?://(?:localhost|127\.|0\.0\.0\.0|\[::1\])).*$'
      # Taint does not pass through Swift's optional binding, so a link bound with `guard let` or
      # `if let` (`guard let url = URL(string: href)`) is read at the binding: its value is the sink
      # when a later statement downloads the bound name. This sees a binding whose value is a call
      # (`URL(string: href)`); one whose value is a bare name or a field is not seen
      # (rules/README.md).
      - patterns:
          - pattern-either:
              - pattern: |
                  guard let $H = $X else { ... }
                  ...
                  $STMT
              - pattern: |
                  guard let $H = $X, ... else { ... }
                  ...
                  $STMT
              - pattern: |
                  guard $COND, let $H = $X, ... else { ... }
                  ...
                  $STMT
              - pattern: |
                  if let $H = $X {
                    ...
                    $STMT
                    ...
                  }
              - pattern: |
                  if let $H = $X, $COND {
                    ...
                    $STMT
                    ...
                  }
              - pattern: |
                  if $COND, let $H = $X {
                    ...
                    $STMT
                    ...
                  }
          - metavariable-pattern:
              metavariable: $STMT
              patterns:
                - pattern-either:
                    - pattern: '$S.data(from: <... $H ...>, ...)'
                    - pattern: '$S.bytes(from: <... $H ...>, ...)'
                    - pattern: '$S.download(from: <... $H ...>, ...)'
                    - pattern: '$S.dataTask(with: <... $H ...>, ...)'
                    - pattern: '$S.downloadTask(with: <... $H ...>, ...)'
                    - pattern: 'URLRequest(url: <... $H ...>, ...)'
                    - pattern: 'String(contentsOf: <... $H ...>, ...)'
                    - pattern: 'Data(contentsOf: <... $H ...>, ...)'
                    - pattern: 'HTTPClientRequest(url: <... $H ...>)'
                    - patterns:
                        - pattern: '$C.get(url: <... $H ...>, ...)'
                        - metavariable-regex:
                            metavariable: $C
                            regex: '^(?:self\.)?(?![\w.]*(?:(?<![a-z])[dD]b|DB|[dD]atabase|[sS]ql|SQL|[pP]ool|[rR]edis|[cC]ache|[qQ]ueue|[sS]tore|[sS]torage|[kK]eychain))[\w.]*(?:[hH]ttp|HTTP|[cC]lient)[\w.]*$'
                    - pattern: '$R.client.get(<... $H ...>, ...)'
                    - pattern: 'AF.request(<... $H ...>, ...)'
                    - pattern: 'AF.download(<... $H ...>, ...)'
                    - pattern: 'HTML(url: <... $H ...>, ...)'
          - focus-metavariable: $X
          - metavariable-regex:
              metavariable: $X
              regex: '(?s)^(?!.*"https?://(?:localhost|127\.|0\.0\.0\.0|\[::1\])).*$'
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
