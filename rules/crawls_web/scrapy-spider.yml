rules:
  - id: lexcode.crawl.scrapy-spider
    languages: [python]
    severity: INFO
    message: Defines a Scrapy spider that crawls from start URLs or start requests, which is crawling the web (crawls_web).
    pattern-either:
      - pattern: |
          class $C(scrapy.Spider):
              ...
              start_urls = ...
              ...
      - pattern: |
          class $C(scrapy.Spider):
              ...
              def start_requests(...):
                  ...
              ...
      - pattern: |
          class $C(Spider):
              ...
              start_urls = ...
              ...
      - pattern: |
          class $C(Spider):
              ...
              def start_requests(...):
                  ...
              ...
      - pattern: |
          class $C(CrawlSpider):
              ...
              start_urls = ...
              ...
      - pattern: |
          class $C(scrapy.spiders.CrawlSpider):
              ...
              start_urls = ...
              ...
      - pattern: |
          class $C(CrawlSpider):
              ...
              def start_requests(...):
                  ...
              ...
      - pattern: |
          class $C(SitemapSpider):
              ...
              sitemap_urls = ...
              ...
      - pattern: |
          class $C(scrapy.spiders.SitemapSpider):
              ...
              sitemap_urls = ...
              ...
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
