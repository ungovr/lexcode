# A scraping service or scraping proxy fetches other sites' pages on the app's behalf, a
# counterparty the activity names. Two shapes:
# - Firecrawl's Rust SDK asked to scrape, crawl, map or batch-scrape, in a file with a
#   `use firecrawl` line. Its own examples import with a nested group
#   (`use firecrawl::{crawl::CrawlOptions, FirecrawlApp};`), which the engine does not resolve, so
#   the client is known by the import rather than by its type; an app's own `crawl_url` in a file
#   without it is not the service.
# - A string literal (plain, raw, or the template of `format!`) naming a scraping or fetch API's
#   endpoint (ScrapingBee, ScraperAPI, Zyte, Crawlbase, Scrapfly, ScrapingAnt, Bright Data, Jina
#   Reader, Browserless, Firecrawl's REST API) or a scraping proxy's host (Bright Data's
#   superproxy, ScraperAPI's and Zyte's proxies), with or without credentials before the host. The
#   regex is the matcher, since the literal is the evidence whichever client sends it; a link to a
#   service's marketing site is not its API.
rules:
  - id: lexcode.crawl.rs-scraping-service
    languages: [rust]
    severity: INFO
    message: Asks a scraping service or scraping proxy to fetch, crawl or map pages of other sites, which is crawling the web (crawls_web).
    pattern-either:
      - patterns:
          - pattern-regex: (?s)\A(?=.*\buse\s+firecrawl\b).*
          - pattern-either:
              - pattern: $F.scrape_url(...)
              - pattern: $F.crawl_url(...)
              - pattern: $F.async_crawl_url(...)
              - pattern: $F.map_url(...)
              - pattern: $F.batch_scrape_urls(...)
      - pattern-regex: (?:r#*)?"(?:https?://)?(?:[^"\s/@]*@)?(?:api\.firecrawl\.dev|app\.scrapingbee\.com/api|api\.scraperapi\.com|proxy-server\.scraperapi\.com|api\.zyte\.com/v1/extract|proxy\.zyte\.com|api\.crawlbase\.com|api\.scrapfly\.io/scrape|api\.scrapingant\.com|api\.brightdata\.com/request|brd\.superproxy\.io|r\.jina\.ai/|[\w-]+\.browserless\.io)
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
