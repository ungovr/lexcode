rules:
  - id: lexcode.crawl.fetch-loop-over-urls-go
    languages: [go]
    severity: INFO
    message: Fetches each URL in a list held in a variable, which may be crawling sites the operator does not run (crawls_web).
    patterns:
      - pattern-either:
          - pattern-inside: |
              for _, $URL := range $L {
                  ...
              }
          - pattern-inside: |
              for $I, $URL := range $L {
                  ...
              }
      - pattern-either:
          - pattern: http.Get($URL)
          - pattern: http.Head($URL)
          - pattern: http.NewRequest($M, $URL, ...)
          - pattern: http.NewRequestWithContext($CTX, $M, $URL, ...)
          - patterns:
              - pattern: $C.Get($URL)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^(\w*[cC]lient|\w*[hH]ttp\w*)$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
      strength: signal
      host_metavar: $URL
