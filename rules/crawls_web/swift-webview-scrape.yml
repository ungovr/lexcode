rules:
  - id: lexcode.crawl.swift-webview-scrape
    languages: [swift]
    severity: INFO
    message: Loads page after page into a WKWebView with no person choosing them and pulls each page's markup, text or links out with JavaScript, which is crawling the web (crawls_web).
    # A web view is usually a person browsing: an in-app browser, a reader mode, a sign-in page.
    # The lint definition sets that apart from "automated software that visits and downloads web
    # pages", so this rule reads only a web view fed by the code itself, in one of two shapes:
    # - a navigation callback that reads each finished page, in a file whose loads take the next
    #   address off the front of a list (`webView.load(URLRequest(url: queue.removeFirst()))`);
    # - a `for` loop over addresses whose element is the address loaded into the web view, and
    #   whose body reads the page.
    # A reader mode or a sign-in page that reads the page a person opened loads no address off a
    # list and from no loop's element, so it is not matched; nor is a loop that polls or retries
    # the one page it was given, nor a script that writes the page (`document.body.innerHTML = ...`).
    #
    # Gaps, recorded here and in rules/README.md:
    # - A next address taken off the list into a variable first (`let next = queue.removeFirst()`)
    #   is not seen.
    # - The file-level checks read text: a loop whose body opens a brace before it builds the
    #   request (`guard ... else { continue }` first) is not seen, and in a file that does load a
    #   list's elements in a loop, a navigation callback that reads the page counts as part of
    #   that crawl.
    # These checks are whole-file look-aheads because the two scopes as separate branches, each
    # with its own condition, cost about 24 s on a 900 KB file against 3.9 s for this form, a
    # bare rule taking 3.8 s (Opengrep 1.33.1).
    #
    # WebKit comes only with its own import, and a web view is reached through properties and
    # delegate parameters the engine cannot type, so the file's `import WebKit` stands in for the
    # type. The script must read the whole document (its HTML, its text, or its list of links); a
    # title, a scroll height or one element the app's own page script exposes is not matched. The
    # engine compares a callback's name and parameter types, not its argument labels, so
    # `didCommit` reads as `didFinish` does. A script held in a variable is not read.
    patterns:
      - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:@\w+\s+)*import\s+(?:\w+\s+)?WebKit\b).*'
      # The file feeds the web view itself: a load that takes the next address off the front of a
      # list (a crawl queue; taking it off the end, `history.removeLast()`, is how an in-app browser
      # goes back a page), or a `for` loop that builds a request from its own element.
      - pattern-either:
          - pattern-regex: '(?s)\A(?=.*\.load\(\s*URLRequest\(\s*url:\s*[\w.]+\.(?:removeFirst|popFirst)\(\)).*'
          - pattern-regex: '(?s)\A(?=.*for\s+(\w+)\s+in\s[^{\n]*\{[^}]*URLRequest\(\s*url:\s*\1\b).*'
      - pattern-either:
          - pattern: $V.evaluateJavaScript($JS, ...)
          - pattern: $V.callAsyncJavaScript($JS, ...)
      - pattern-either:
          # A navigation callback that receives the finished navigation.
          - patterns:
              - pattern-inside: |
                  func webView(_ $W: $T, didFinish $N: $NT) { ... }
              - metavariable-regex:
                  metavariable: $NT
                  regex: '^WKNavigation!?$'
          # A loop whose element is the address loaded, in the request itself or in a request built
          # from it earlier in the body; the page is read in the same body.
          - pattern-inside: |
              for $U in $L {
                ...
                $W.load(URLRequest(url: $U))
                ...
              }
          - pattern-inside: |
              for $U in $L {
                ...
                let $R = URLRequest(url: $U)
                ...
                $W.load($R)
                ...
              }
      # The script reads the whole document: its HTML or text (not followed by an assignment, which
      # writes the page), a serialization of it, or its list of links.
      - metavariable-regex:
          metavariable: $JS
          regex: '(?s)^#*"(?:"")?.*(?:document\.(?:documentElement|body|all\[0\])\.(?:outerHTML|innerHTML|innerText|textContent)(?!\s*\+?=(?!=))|XMLSerializer\(\)\.serializeToString\(\s*document|document\.getElementsByTagName\(\s*\\?[''"]html\\?[''"]\s*\)\[0\]\.(?:outer|inner)HTML(?!\s*\+?=(?!=))|document\.links|document\.querySelectorAll\(\s*\\?[''"]a(?:\[href\])?\\?[''"]\s*\)).*$'
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
