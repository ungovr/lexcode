rules:
  - id: lexcode.crawl.cs-html-of-fetched-page
    languages: [csharp]
    severity: INFO
    message: Downloads a web page and reads its HTML (HtmlAgilityPack, AngleSharp), which is scraping a site the operator may not run (crawls_web).
    patterns:
      - pattern-either:
          # HtmlAgilityPack's HtmlWeb downloads the page itself. The type is written in full: the
          # engine resolves `using` lines and aliases for C#, and infers a local's type from
          # `new HtmlWeb()` or target-typed `new()`, so a project's own `HtmlWeb` in another
          # namespace is not taken for it.
          - patterns:
              - pattern-either:
                  - pattern: (HtmlAgilityPack.HtmlWeb $W).Load($URL, ...)
                  - pattern: (HtmlAgilityPack.HtmlWeb $W).LoadFromWebAsync($URL, ...)
                  - pattern: (HtmlAgilityPack.HtmlWeb $W).LoadFromBrowser($URL, ...)
              # A plain string literal is a web address, not a file name, and so is a raw one
              # (`"""..."""`). An interpolated one is printed without its braces, so it cannot be
              # judged and stays matched.
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?s)^(?!(?>"{3,}+\s*+|@?")(?!https?://)).*$
          # AngleSharp's browsing context opens an address and its loader downloads it. The context
          # comes from `BrowsingContext.New(...)`, whose type the engine does not infer, so the file
          # must name AngleSharp's namespace (a `using` line at the start of a line, aliased or not,
          # or a type written out in full on a line that does not open with a comment, before any
          # `//` or `/*` on that line; neither counts inside a block comment, told by the next
          # comment mark after it being a `*/`, as in cs-browser-fetch). A lambda
          # builds a page from HTML the app holds (see below), a cancellation token is a database
          # connection's OpenAsync, and a plain literal that is not an http or https address
          # (`about:blank`, a relative path) is not a page on another site. An interpolated address
          # is printed without its braces, so it cannot be judged and stays matched.
          - patterns:
              - pattern-regex: '(?s)(?m:^\x{FEFF}?[ \t]*(?:global[ \t]+)?using[ \t]+(?:static[ \t]+)?(?:\w+[ \t]*=[ \t]*)?(?:global::)?AngleSharp\b|^(?!\x{FEFF}?[ \t]*(?://|/?\*))(?:"(?:[^"\\\n]|\\.)*+"|(?!//|/\*)[^\n"])*?(?<![\w.])AngleSharp\.\w)(?!(?:[^*/]++|\*(?!/)|/(?!\*))*+\*/).*'
              - pattern: $C.OpenAsync($URL, ...)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?s)^(?!.*=>)(?!(?i:\w*(token|ct)$))(?!(?>"{3,}+\s*+|@?")(?!https?://)).*$
          # A page fetched inside the parser call itself.
          - patterns:
              - pattern-either: &parsers
                  - pattern: (HtmlAgilityPack.HtmlDocument $D).LoadHtml($SRC)
                  - pattern: (HtmlAgilityPack.HtmlDocument $D).Load($SRC, ...)
                  - pattern: (AngleSharp.Html.Parser.HtmlParser $P).ParseDocument($SRC)
                  - pattern: (AngleSharp.Html.Parser.HtmlParser $P).ParseDocumentAsync($SRC, ...)
                  - pattern: (AngleSharp.Html.Parser.IHtmlParser $P).ParseDocument($SRC)
                  - pattern: (AngleSharp.Html.Parser.IHtmlParser $P).ParseDocumentAsync($SRC, ...)
                  - patterns:
                      - pattern-regex: '(?s)(?m:^\x{FEFF}?[ \t]*(?:global[ \t]+)?using[ \t]+(?:static[ \t]+)?(?:\w+[ \t]*=[ \t]*)?(?:global::)?AngleSharp\b|^(?!\x{FEFF}?[ \t]*(?://|/?\*))(?:"(?:[^"\\\n]|\\.)*+"|(?!//|/\*)[^\n"])*?(?<![\w.])AngleSharp\.\w)(?!(?:[^*/]++|\*(?!/)|/(?!\*))*+\*/).*'
                      - pattern: $C.OpenAsync($R => $R.Content($SRC, ...))
              # The download's address, read with its quotes and braces here: a plain literal, or an
              # interpolated one that starts with text, that is not an http or https address (a path
              # relative to the client's BaseAddress, `pages/{id}`) is the app's own. One that starts with an
              # interpolation (`$"{baseUrl}/listing/{id}"`) is built on a base the code holds and stays matched.
              # A raw literal (`"""..."""`, `$"""..."""`, on one line or several) is read the same way.
              - metavariable-regex:
                  metavariable: $SRC
                  regex: &download_not_relative (?s)^(?!.*\bGet(String|Stream|ByteArray)?Async\(\s*(?:(?>"{3,}+\s*+|@?")(?!https?://)|(?>\$++"{3,}+\s*+|(?:\$@?|@\$)")(?!https?://|\{))).*$
              - metavariable-pattern:
                  metavariable: $SRC
                  patterns: &http_get
                    # The engine reads this value apart from its file, so a declared type and the
                    # file's `using` lines are not seen here: a client is known by `new HttpClient()`
                    # (System.Net.Http is imported implicitly, so in full or by its short name), by
                    # `CreateClient(...)` on a factory, or by a receiver named for an HTTP client. A
                    # cache, a store or a session with a GetStringAsync of its own (IDistributedCache)
                    # is not one. An HttpClient under another name is missed. WebClient is read in
                    # the branches below, where the file's `using` lines are seen. cs-feed-read holds
                    # this block word for word (test/unit/cs-crawl-shared-blocks.test.ts).
                    - pattern-either:
                        - pattern: (System.Net.Http.HttpClient $HC).$GET($URL, ...)
                        - pattern: (HttpClient $HC).$GET($URL, ...)
                        - patterns:
                            - pattern: $HC.$GET($URL, ...)
                            - metavariable-regex:
                                metavariable: $HC
                                regex: ^((this\.)?_?(?!(?i:\w*(cache|store|storage|redis|blob|queue|session|context|accessor|config|settings)))\w*([cC]lient|[hH]ttp\w*)|[\w.]+\.CreateClient\([^)]*\))$
                    - metavariable-regex:
                        metavariable: $GET
                        regex: ^Get(String|Stream|ByteArray)?Async$
          # A page fetched into a variable, then parsed. The fetch is read from the assigned value.
          - patterns:
              - pattern-inside: |
                  var $SRC = $FETCH;
                  ...
              - pattern-either: *parsers
              # The download's address, read with its quotes and braces here: a plain literal, or an
              # interpolated one that starts with text, that is not an http or https address (a path
              # relative to the client's BaseAddress, `pages/{id}`) is the app's own. One that starts with an
              # interpolation (`$"{baseUrl}/listing/{id}"`) is built on a base the code holds and stays matched.
              # A raw literal (`"""..."""`, `$"""..."""`, on one line or several) is read the same way.
              - metavariable-regex:
                  metavariable: $FETCH
                  regex: *download_not_relative
              - metavariable-pattern:
                  metavariable: $FETCH
                  patterns: *http_get
          # A page fetched with System.Net.WebClient, in the parser call or into a variable the line
          # before. No namespace imports WebClient's implicitly, so its type is written in full and
          # read at this level, where the file's `using` lines are seen: an app's own `WebClient` in
          # another namespace is not taken for it. The client is built inline, or held in a field, a
          # parameter or a local built with `new`. The address filter is the one above, on the
          # address itself.
          - patterns:
              - pattern-either:
                  - pattern-inside: (HtmlAgilityPack.HtmlDocument $D).LoadHtml(...)
                  - pattern-inside: (HtmlAgilityPack.HtmlDocument $D).Load(...)
                  - pattern-inside: (AngleSharp.Html.Parser.HtmlParser $P).ParseDocument(...)
                  - pattern-inside: (AngleSharp.Html.Parser.HtmlParser $P).ParseDocumentAsync(...)
                  - pattern-inside: (AngleSharp.Html.Parser.IHtmlParser $P).ParseDocument(...)
                  - pattern-inside: (AngleSharp.Html.Parser.IHtmlParser $P).ParseDocumentAsync(...)
                  - patterns:
                      - pattern-regex: '(?s)(?m:^\x{FEFF}?[ \t]*(?:global[ \t]+)?using[ \t]+(?:static[ \t]+)?(?:\w+[ \t]*=[ \t]*)?(?:global::)?AngleSharp\b|^(?!\x{FEFF}?[ \t]*(?://|/?\*))(?:"(?:[^"\\\n]|\\.)*+"|(?!//|/\*)[^\n"])*?(?<![\w.])AngleSharp\.\w)(?!(?:[^*/]++|\*(?!/)|/(?!\*))*+\*/).*'
                      - pattern-inside: $C.OpenAsync($R => $R.Content(...))
              - pattern-either:
                  - pattern: new System.Net.WebClient().$GET($URL, ...)
                  - pattern: (System.Net.WebClient $WC).$GET($URL, ...)
              - metavariable-regex: &webclient_reads
                  metavariable: $GET
                  regex: ^(DownloadString|DownloadData|OpenRead)(TaskAsync)?$
              - metavariable-regex: &not_a_relative_literal
                  metavariable: $URL
                  regex: (?s)^(?!(?:(?>"{3,}+\s*+|@?")(?!https?://)|(?>\$++"{3,}+\s*+|(?:\$@?|@\$)")(?!https?://|\{))).*$
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      var $SRC = <... new System.Net.WebClient().$GET($URL, ...) ...>;
                      ...
                  - pattern-inside: |
                      var $SRC = <... (System.Net.WebClient $WC).$GET($URL, ...) ...>;
                      ...
              - pattern-either: *parsers
              - metavariable-regex: *webclient_reads
              - metavariable-regex: *not_a_relative_literal
      # Not a page on another site: loopback hosts, a file address, and a path relative to the app
      # itself (an HttpClient whose BaseAddress is the app's own server), in a plain or a raw
      # literal. A string read from inside a value comes without its quotes, so the quote is optional.
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?![$@]{0,2}(?>"{3,}+\s*+|"?)(https?://(localhost|127\.|0\.0\.0\.0|\[::1\])|file:|/(?!/))).*$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
      host_metavar: $URL
