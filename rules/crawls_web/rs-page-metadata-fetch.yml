# A page downloaded to read its title, description and Open Graph tags: webpage's
# `Webpage::from_url` and opengraph's `scrape` fetch the address themselves. That is fetching a
# page from a site the operator does not run by automated means, whether one page per link a
# person posts (a link preview) or many: the lint definition sets no condition of scale
# (controller ruling, 11-15), so the finding is evidence whether the address is a literal or a
# link held in a variable, and the rule reads no host. Written by crate path, so an app's own
# `Webpage` under `use crate::...` is not taken for it; parsing HTML the app already holds
# (`HTML::from_string`) fetches nothing. A loopback or file address is the app's own.
rules:
  - id: lexcode.crawl.rs-page-metadata-fetch
    languages: [rust]
    severity: INFO
    message: Downloads a web page to read its title, description and Open Graph tags (webpage, opengraph), which is fetching a page from a site the operator may not run (crawls_web).
    patterns:
      - pattern-either:
          - pattern: webpage::Webpage::from_url($URL, ...)
          - pattern: opengraph::scrape($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?!&?(?:r#*)?"(https?://(localhost|127\.|0\.0\.0\.0|\[::1\])|file:)).*$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
