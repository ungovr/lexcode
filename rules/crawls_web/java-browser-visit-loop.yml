rules:
  - id: lexcode.crawl.java-browser-visit-loop
    languages: [java]
    severity: INFO
    message: Drives a headless browser to open page after page in a loop, which is crawling the web (crawls_web).
    patterns:
      - pattern-either:
          - pattern-inside: |
              for ($T $X : $L) {
                ...
              }
          - pattern-inside: |
              for (...; ...; ...) {
                ...
              }
          - pattern-inside: |
              while ($C) {
                ...
              }
          - pattern-inside: |
              do {
                ...
              } while ($C);
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $L.$M($X -> $BODY)
                  - pattern-inside: |
                      $L.$M(($T $X) -> $BODY)
                  - pattern-inside: |
                      $L.$M($X -> { ... })
                  - pattern-inside: |
                      $L.$M(($T $X) -> { ... })
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(forEach|forEachOrdered|map|flatMap|mapToObj|peek|filter|ifPresent)$
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $D.get($URL)
                  - pattern: $D.navigate().to($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(\w*[dD]river|wd|browser|\w*[hH]eadless\w*)$
          - patterns:
              - pattern: $D.navigate($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(page|p|tab|\w+Page)$
          - patterns:
              - pattern: $D.getPage($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(\w*[wW]ebClient|\w*[hH]tmlUnit\w*)$
          - pattern: (WebDriver $D).get($URL)
          - pattern: (WebDriver $D).navigate().to($URL)
          - pattern: (Page $D).navigate($URL)
          - pattern: (WebClient $D).getPage($URL)
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?!"https?://(localhost|127\.|0\.0\.0\.0|\[::1\]))(?!String\.format\("https?://(localhost|127\.|0\.0\.0\.0|\[::1\]))(?![\w.()]+\s+\+\s).*$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
      host_metavar: $URL
