rules:
  - id: lexcode.crawl.java-jsoup-fetch
    languages: [java]
    severity: INFO
    message: Downloads a web page from a site the operator may not run with Jsoup, which is scraping and crawling the web (crawls_web).
    patterns:
      - pattern-either:
          - pattern: Jsoup.connect($URL)
          - pattern: Jsoup.parse(new URL($URL), ...)
          - pattern: Jsoup.parse(java.net.URI.create($URL).toURL(), ...)
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?!"https?://(localhost|127\.|0\.0\.0\.0|\[::1\])).*$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
      host_metavar: $URL
