rules:
  - id: lexcode.crawl.kt-browser-visit-loop
    languages: [kotlin]
    severity: INFO
    message: Drives a headless browser to open page after page in a loop, which is crawling the web (crawls_web).
    patterns:
      # A pre-filter: the browser receiver below is a metavariable with a regular expression, which
      # has no literal of its own, so without this the engine parses every Kotlin file. It names a
      # token of every call the arms below can match (one token per call), and the receiver words
      # of the `get` arm.
      - pattern-regex: '(\.navigate\(|\bgetPage\b|(?i:driver|headless)\w*\.get\(|\bwd\.get\(|\bbrowser\.get\()'
      - pattern-either:
          - pattern-inside: |
              for ($X in $L) $BODY
          - pattern-inside: |
              while ($C) $BODY
          - pattern-inside: |
              do {
                ...
              } while ($C)
          - pattern-inside: |
              repeat($N) { ... }
          - pattern-inside: |
              repeat($N) { $P -> ... }
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $L.$M { ... }
                  - pattern-inside: |
                      $L.$M { $P -> ... }
                  - pattern-inside: |
                      $L.$M { $P, $Q -> ... }
                  - pattern-inside: |
                      $L?.$M { ... }
                  - pattern-inside: |
                      $L?.$M { $P -> ... }
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(forEach|forEachIndexed|map|mapNotNull|flatMap|mapIndexed|filter|onEach|onEachIndexed|collect|collectLatest|flatMapMerge|flatMapConcat|mapLatest|transform|asyncMap)$
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $D.get($URL)
                  - pattern: $D.navigate().to($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(\w*[dD]river|wd|browser|\w*[hH]eadless\w*)$
          - patterns:
              - pattern: $D.navigate($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(page|p|tab|\w+Page)$
          - patterns:
              - pattern: $D.getPage($URL)
              - metavariable-regex:
                  metavariable: $D
                  regex: ^(this\.)?(\w*[wW]ebClient|\w*[hH]tmlUnit\w*)$
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?!"https?://(localhost|127\.|0\.0\.0\.0|\[::1\]))(?!"\$)(?![\w.()]+\s+\+\s).*$
    metadata:
      activity: crawls_web
      mentioned: performs
      definition: https://lexlint.io/activities/crawls-web
      provenance: ungovr-original
      license: MIT
      host_metavar: $URL
