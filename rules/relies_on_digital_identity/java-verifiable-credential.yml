rules:
  - id: lexcode.identity.java-verifiable-credential
    languages: [java]
    severity: INFO
    message: Asks for or verifies a credential from a person's digital identity wallet (an Android digital credential request, a W3C verifiable credential or an SD-JWT), which is relying on a digital identity (relies_on_digital_identity).
    pattern-either:
      - pattern: new GetDigitalCredentialOption(...)
      - patterns:
          - pattern-either:
              - pattern: VerifiableCredential.fromJson(...)
              - pattern: VerifiableCredential.fromMap(...)
              - pattern: VerifiablePresentation.fromJson(...)
              - pattern: VerifiablePresentation.fromMap(...)
          - pattern-inside: |
              import com.danubetech.verifiablecredentials.$C;
              ...
      - patterns:
          - pattern-either:
              - pattern: new SDObjectDecoder(...)
              - pattern: SDJWT.parse(...)
          - pattern-inside: |
              import com.authlete.sd.$C;
              ...
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
