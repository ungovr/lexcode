rules:
  - id: lexcode.identity.js-digital-credentials-api
    languages: [javascript, typescript]
    severity: INFO
    message: Asks the person's wallet for a digital credential through the browser's Digital Credentials API, which is relying on a digital identity (relies_on_digital_identity).
    pattern: "navigator.credentials.get({..., digital: ..., ...})"
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
