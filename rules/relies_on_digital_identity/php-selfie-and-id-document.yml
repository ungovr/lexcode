rules:
  - id: lexcode.identity.php-selfie-and-id-document
    languages: [php]
    severity: INFO
    message: 'Holds a face or selfie image beside an image of a photo ID, the shape of document-and-selfie identity verification, whose result the app acts on (relies_on_digital_identity). The verifier usually matches the face to the ID photo, so ask about processes_biometrics too.'
    # No literal anchor of its own. Two sets of whole-file regexes keep the engine's pre-filter: the
    # file must hold a string that starts with a face name and one that starts with an ID-document
    # name, as the metavariable tests below require. The array patterns bind every element of every
    # array, which on a large generated array (an SDK's API model of several hundred KB) costs tens of
    # seconds, so a file without both names is not read at all. A name that only sits inside a longer
    # one (an API model's 'PeerLivenessDetection') does not open the file.
    patterns:
      - pattern-either:
          - pattern-regex: '(?is)\A(?=.*[''"]selfie).*'
          - pattern-regex: '(?is)\A(?=.*[''"]liveness).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?image).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?photo).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?img).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?pic).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?capture).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?snapshot).*'
          - pattern-regex: '(?is)\A(?=.*[''"]face_?scan).*'
      - pattern-either:
          - pattern-regex: '(?is)\A(?=.*[''"]photo_?id).*'
          - pattern-regex: '(?is)\A(?=.*[''"]id_?(?:document|doc|card|photo|image|img|scan|front|back)).*'
          - pattern-regex: '(?is)\A(?=.*[''"]identity_?(?:document|doc|card)).*'
          - pattern-regex: '(?is)\A(?=.*[''"]identification_?(?:image|photo|document|doc|card)).*'
          - pattern-regex: '(?is)\A(?=.*[''"]passport_?(?:image|photo|scan|page|front)).*'
          - pattern-regex: '(?is)\A(?=.*[''"]drivers?_?licen[cs]e).*'
          - pattern-regex: '(?is)\A(?=.*[''"]document_?(?:image|photo|front|back|scan)).*'
      # One array literal (validation rules, fillable columns, a request payload) holds a face name and
      # an ID-document name, each as a key or as a string element
      - pattern-either:
          - pattern: '[..., $FACE => $V, ...]'
          - pattern: '[..., $FACE, ...]'
      - metavariable-regex:
          metavariable: $FACE
          regex: '(?i)^([''"])(?:selfie|liveness|face_?(?:image|photo|img|picture|pic|capture|snapshot|scan))\w*\1$'
      - pattern-either:
          - pattern-inside: '[..., $DOC => $W, ...]'
          - pattern-inside: '[..., $DOC, ...]'
      - metavariable-regex:
          metavariable: $DOC
          regex: '(?i)^([''"])(?:photo_?id_?(?:image|img|photo|card|doc|document|scan|front|back|upload|file)|id_?(?:document|doc|card|photo|image|img|scan|front|back)|identity_?(?:document|doc|card)|identification_?(?:image|photo|document|doc|card)|passport_?(?:image|photo|scan|page|front)|drivers?_?licen[cs]e_?(?:image|photo|scan|front|back)|document_?(?:image|photo|front|back|scan))\w*\1$'
      - focus-metavariable: $FACE
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
