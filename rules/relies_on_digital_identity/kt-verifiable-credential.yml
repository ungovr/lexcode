rules:
  - id: lexcode.identity.kt-verifiable-credential
    languages: [kotlin]
    severity: INFO
    message: Asks for or verifies a credential from a person's digital identity wallet (an Android digital credential request, a W3C verifiable credential or an SD-JWT), which is relying on a digital identity (relies_on_digital_identity).
    pattern-either:
      - pattern: GetDigitalCredentialOption(...)
      - patterns:
          - pattern-either:
              - pattern: VerifiableCredential.fromJson(...)
              - pattern: VerifiableCredential.fromMap(...)
              - pattern: VerifiablePresentation.fromJson(...)
              - pattern: VerifiablePresentation.fromMap(...)
          - pattern-either:
              - pattern-inside: |
                  import com.danubetech.verifiablecredentials.VerifiableCredential
                  ...
              - pattern-inside: |
                  import com.danubetech.verifiablecredentials.VerifiablePresentation
                  ...
              - pattern-inside: |
                  import com.danubetech.verifiablecredentials.*
                  ...
      - patterns:
          - pattern-either:
              - pattern: SDObjectDecoder(...)
              - pattern: SDJWT.parse(...)
          - pattern-either:
              - pattern-inside: |
                  import com.authlete.sd.SDObjectDecoder
                  ...
              - pattern-inside: |
                  import com.authlete.sd.SDJWT
                  ...
              - pattern-inside: |
                  import com.authlete.sd.*
                  ...
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
