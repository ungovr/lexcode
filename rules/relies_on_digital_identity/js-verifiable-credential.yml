rules:
  - id: lexcode.identity.js-verifiable-credential
    languages: [javascript, typescript]
    severity: INFO
    message: Verifies a verifiable credential or presentation from a person's wallet, which is relying on a digital identity (relies_on_digital_identity).
    patterns:
      - pattern-either:
          - pattern: verifyCredential(...)
          - pattern: $V.verifyCredential(...)
          - pattern: verifyPresentation(...)
          - pattern: $V.verifyPresentation(...)
          - pattern: vc.verify(...)
      - pattern-either:
          - pattern-inside: |
              import {...} from "did-jwt-vc";
              ...
          - pattern-inside: |
              import * as $NS from "@digitalbazaar/vc";
              ...
          - pattern-inside: |
              import $NS from "@digitalbazaar/vc";
              ...
          - pattern-inside: |
              import {...} from "@digitalbazaar/vc";
              ...
          - pattern-inside: |
              import {...} from "@veramo/core";
              ...
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
