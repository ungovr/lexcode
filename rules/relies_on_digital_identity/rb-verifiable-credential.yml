rules:
  - id: lexcode.identity.rb-verifiable-credential
    languages: [ruby]
    severity: INFO
    message: Verifies a verifiable credential or presentation from a person's digital identity wallet (an OpenID4VP verifier or an SD-JWT verifier), which is relying on a digital identity (relies_on_digital_identity).
    pattern-either:
      - pattern: OpenID4VP::Verifier.new(...)
      - pattern: ::OpenID4VP::Verifier.new(...)
      - pattern: SDJWT::Verifier.new(...)
      - pattern: ::SDJWT::Verifier.new(...)
      - pattern: SdJwt::Verifier.new(...)
      - pattern: ::SdJwt::Verifier.new(...)
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
