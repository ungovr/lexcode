rules:
  - id: lexcode.identity.rb-idv-vendor-api-call
    languages: [ruby]
    severity: INFO
    message: Calls an identity-verification vendor's API (Persona, Veriff, Onfido, Jumio, Yoti, Sumsub and similar), which is relying on a digital identity (relies_on_digital_identity).
    patterns:
      - pattern-regex: (?i)(?<=["'`])https?://(?:[a-z0-9-]*api[a-z0-9-]*\.(?:[a-z0-9-]+\.)*(?:withpersona\.com|veriff\.(?:com|me)|onfido\.com|jumio\.com|netverify\.com|yoti\.com|sumsub\.com|idenfy\.com|au10tix\.com|ondato\.com|incode\.com|trulioo\.com|idnow\.io)|(?:[a-z0-9-]+\.)*(?:withpersona\.com|veriff\.(?:com|me)|onfido\.com|jumio\.(?:com|ai)|netverify\.com|yoti\.com|sumsub\.com|idenfy\.com|au10tix\.com|ondato\.com|incode\.com|trulioo\.com|idnow\.io)/(?:[^\s"'`]*/)?(?:api|v[0-9]+)(?=/))[^\s"'`]*
      - pattern-either:
          - pattern-inside: Faraday.$M(...)
          - pattern-inside: HTTParty.$M(...)
          - pattern-inside: RestClient.$M(...)
          - pattern-inside: RestClient::Request.execute(...)
          - pattern-inside: RestClient::Resource.new(...)
          - pattern-inside: Net::HTTP.$M(...)
          - pattern-inside: Typhoeus.$M(...)
          - pattern-inside: Typhoeus::Request.new(...)
          - pattern-inside: HTTP.$M(...)
          - pattern-inside: Excon.$M(...)
          - pattern-inside: URI(...)
          - pattern-inside: URI.parse(...)
          - pattern-inside: $O.get(...)
          - pattern-inside: $O.post(...)
          - pattern-inside: $O.put(...)
          - pattern-inside: $O.patch(...)
          - pattern-inside: $O.delete(...)
          - pattern-inside: $O.request(...)
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
