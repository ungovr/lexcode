# A verifier for a credential a person presents from a digital identity wallet: an ISO 18013-5 mobile
# driving licence read with SpruceID's isomdl (the reader's session), an SD-JWT presentation checked
# with sd-jwt-rs's verifier, and a W3C verifiable credential parsed for verification or verified with
# SpruceID's ssi. Issuing a credential (SDJWTIssuer, ssi's signing) and building a holder's
# presentation (SDJWTHolder, isomdl's device side) is not relying on one and is not read.
#
# isomdl's own examples import the reader through a nested group
# (`use isomdl::{presentation::{reader::SessionManager, ..}, ..}`), which the engine does not resolve,
# so its session and sd-jwt-rs's verifier also carry short forms, each read only in a file whose
# `use` line for the crate names the item.
rules:
  - id: lexcode.identity.rs-verifiable-credential
    languages: [rust]
    severity: INFO
    message: Verifies a mobile driving licence, an SD-JWT presentation or a verifiable credential from a person's digital identity wallet (isomdl's reader, sd-jwt-rs's verifier or SpruceID's ssi), which is relying on a digital identity (relies_on_digital_identity).
    pattern-either:
      - pattern: isomdl::presentation::reader::SessionManager::establish_session(...)
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+isomdl::[^;]*\bSessionManager\b).*'
          - pattern: SessionManager::establish_session(...)
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+isomdl::[^;]*\breader\b).*'
          - pattern: reader::SessionManager::establish_session(...)
      - pattern: sd_jwt_rs::SDJWTVerifier::new(...)
      - pattern: sd_jwt_rs::verifier::SDJWTVerifier::new(...)
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+sd_jwt_rs::[^;]*\bSDJWTVerifier\b).*'
          - pattern: SDJWTVerifier::new(...)
      - pattern: ssi::claims::vc::v1::data_integrity::any_credential_from_json_str(...)
      - pattern: ssi::claims::vc::v2::data_integrity::any_credential_from_json_str(...)
      - pattern: ssi::claims::VerificationParameters::from_resolver(...)
      - pattern: ssi::vc::Credential::from_json(...)
      - pattern: ssi::vc::Presentation::from_json(...)
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
