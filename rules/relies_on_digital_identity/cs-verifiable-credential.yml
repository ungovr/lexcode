rules:
  - id: lexcode.identity.cs-verifiable-credential
    languages: [csharp]
    severity: INFO
    message: Asks a person's digital identity wallet for a verifiable credential through Microsoft Entra Verified ID, or acts on the verified presentation it returns, which is relying on a digital identity (relies_on_digital_identity).
    # The request service's own operation and status names, as whole strings or as the last segment of
    # an address the app builds ($"{endpoint}createPresentationRequest"). Issuing a credential
    # (createIssuanceRequest, issuance_successful) is not relying on one and is not read.
    pattern-either:
      - pattern-regex: (?<=[/"}])createPresentationRequest(?=")
      - pattern-regex: (?<=")presentation_verified(?=")
    metadata:
      activity: relies_on_digital_identity
      mentioned: performs
      definition: https://lexlint.io/glossary#relies-on-a-digital-identity
      provenance: ungovr-original
      license: MIT
