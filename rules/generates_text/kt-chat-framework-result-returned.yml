# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 18 to 27 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or an expression body in a function whose body makes one of the calls
# below, or a return or expression body that names a val set from one of them, at the top level, in
# a class or in a function, and declared before it. Not followed: a result one function stores at
# run time and another returns, a val derived from such a val, a member declared before the val it
# returns, and a call in a default parameter. The calls are the sources without their argument and
# name checks. How the scope is written, and why, is in CONTRIBUTING.md, Cost. prompt(...). ...
# .call() is in scope through call(...), and chat { ... } through chat(...).
rules:
  - id: lexcode.text.kt-chat-framework-result-returned
    languages:
      - kotlin
    severity: INFO
    message: Returns text written by a LangChain4j, Spring AI, Ollama4j or llama.cpp chat model from a function, which may be generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern-either:
              - pattern: $M.chat(...)
              - pattern: $M.chat { ... }
          - metavariable-regex:
              metavariable: $M
              regex: (?i)^(this\.)?_?\w*(model|llm|assistant|ollama|gpt)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern-either:
              - pattern: model.generate(...)
              - pattern: chatModel.generate(...)
              - pattern: chatLanguageModel.generate(...)
              - pattern: languageModel.generate(...)
              - pattern: llm.generate(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern-either:
              - pattern: chatModel.call(...)
              - pattern: llm.call(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern: $M.stream($P, ...)
          - metavariable-regex:
              metavariable: $M
              regex: (?i)^(this\.)?_?\w*(model|llm|assistant|ollama|gpt)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern-either:
              - pattern: $C.prompt(...). ... .call()
              - pattern: $C.prompt(...). ... .stream()
      - patterns:
          - pattern-regex: (?s)\A(?=.*io\.github\.ollama4j\.).*
          - pattern-either:
              - pattern: ollamaAPI.generate(...)
              - pattern: ollamaAPI.chat(...)
              - pattern: ollamaApi.generate(...)
              - pattern: ollamaApi.chat(...)
              - pattern: ollama.generate(...)
              - pattern: ollama.chat(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*de\.kherud\.llama\.).*
          - pattern-either:
              - pattern: model.generate(...)
              - pattern: model.complete(...)
              - pattern: llamaModel.generate(...)
              - pattern: llamaModel.complete(...)
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      fun $SINKFN(...) {
                        $...SINKBODY
                      }
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKR.chat(...)
                        - pattern: $SINKR.generate(...)
                        - pattern: $SINKR.call(...)
                        - pattern: $SINKR.stream(...)
                        - pattern: $SINKR.complete(...)
              - patterns:
                  - pattern: return $X
                  - pattern-either: &valscopes
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.chat(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.generate(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.call(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.stream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.complete(...) ...>
                          ...
                  - metavariable-pattern:
                      metavariable: $X
                      pattern-either:
                        - pattern: $SINKV
                        - pattern: this.$SINKV
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R {
                          ...
                        }
                    - pattern: |
                        @$A
                        fun $F(...): $R {
                          ...
                        }
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern-not-inside: |
              { $P -> ... }
          - pattern-not-inside: |
              { $P, $Q -> ... }
          - pattern-not-inside: |
              { $P, $Q, $W -> ... }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(...) = $X
              - pattern-inside: |
                  fun $F(...): $R = $X
          - metavariable-pattern:
              metavariable: $X
              pattern-either: *sinkcalls
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
      - patterns:
          - pattern-either:
              - pattern: |
                  fun $F(...) = $X
              - pattern: |
                  fun $F(...): $R = $X
          - pattern-either: *valscopes
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - pattern: $SINKV
                - pattern: this.$SINKV
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
      strength: signal
