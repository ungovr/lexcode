rules:
  - id: lexcode.text.java-chat-reply-to-response
    languages: [java]
    severity: INFO
    message: Sends text written by a chat or completion model back in an HTTP response, a socket or a screen, which is generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - pattern: $C.chat().completions().create(...)
      - pattern: $C.chat().completions().createStreaming(...)
      - patterns:
          - pattern-either:
              - pattern: $C.responses().$M((ResponseCreateParams $P))
              - pattern: $C.responses().$M(ResponseCreateParams.builder(). ... .build())
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|createStreaming)$
      - patterns:
          - pattern-either:
              - pattern: $C.completions().$M((CompletionCreateParams $P))
              - pattern: $C.completions().$M(CompletionCreateParams.builder(). ... .build())
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|createStreaming)$
      - patterns:
          - pattern-either:
              - pattern: $C.messages().$M((MessageCreateParams $P))
              - pattern: $C.messages().$M(MessageCreateParams.builder(). ... .build())
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|createStreaming)$
      - patterns:
          - pattern-either:
              - pattern: $C.messages().$M((BetaMessageCreateParams $P))
              - pattern: $C.messages().$M(BetaMessageCreateParams.builder(). ... .build())
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|createStreaming)$
      - patterns:
          - pattern-either:
              - pattern: $C.invokeModel(InvokeModelRequest.builder(). ... .modelId($ID). ... .build())
              - pattern: $C.invokeModelWithResponseStream(InvokeModelWithResponseStreamRequest.builder(). ... .modelId($ID). ... .build())
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(claude|llama|titan-text|nova-(lite|micro|pro|premier)|mistral|command|jamba|deepseek|qwen)[^"]*"$
      - patterns:
          - pattern: ($T $M).$F(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^([\w.]+\.)?(OpenAIClient|OpenAIAsyncClient|ChatCompletionsClient|ChatCompletionsAsyncClient|BedrockRuntimeClient|BedrockRuntimeAsyncClient|\w*ChatModel|\w*ChatLanguageModel|OllamaAPI|Ollama|LlamaModel)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(getChatCompletions|getChatCompletionsStream|getChatCompletionsWithResponse|getCompletions|getCompletionsStream|complete|completeStream|converse|converseStream|chat|generate|generateAsync|call|stream|chatComplete)$
      - pattern: $C.prompt(...). ... .call()
      - pattern: $C.prompt(...). ... .stream()
      - patterns:
          - pattern: |
              void onPartialResponse(String $T) {
                ...
              }
          - focus-metavariable: $T
      - patterns:
          - pattern: |
              void onNext(String $T) {
                ...
              }
          - pattern-inside: |
              new StreamingResponseHandler<$M>() {
                ...
              }
          - focus-metavariable: $T
      - patterns:
          - pattern: $TS.onPartialResponse(($T) -> ...)
          - focus-metavariable: $T
      - patterns:
          - pattern: LambdaStreamingResponseHandler.onNext(($T) -> ...)
          - focus-metavariable: $T
    pattern-propagators:
      - pattern: $S.forEach($X -> ...)
        from: $S
        to: $X
      - pattern: $S.forEachOrdered($X -> ...)
        from: $S
        to: $X
      - pattern: $S.subscribe($X -> ...)
        from: $S
        to: $X
      - pattern: $S.map($X -> ...)
        from: $S
        to: $X
      - pattern: $S.flatMap($X -> ...)
        from: $S
        to: $X
      - pattern: $S.doOnNext($X -> ...)
        from: $S
        to: $X
      - pattern: $S.ifPresent($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenApply($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenAccept($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onPartialResponse($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onNext($X -> ...)
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A(...)
                  $R $F(...) {
                    ...
                  }
              - pattern-inside: |
                  @$A
                  $R $F(...) {
                    ...
                  }
          - metavariable-regex:
              metavariable: $A
              regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern: return $X;
          - metavariable-regex:
              metavariable: $X
              regex: '^(?!(ResponseEntity|Response|ServerResponse)\.)'
          - focus-metavariable: $X
      - pattern: ResponseEntity.ok($X)
      - pattern: ResponseEntity.$S(...).body($X)
      - pattern: ResponseEntity.$S(...).$T(...).body($X)
      - pattern: ResponseEntity.$S(...).$T(...).$U(...).body($X)
      - pattern: new ResponseEntity<>($X, ...)
      - pattern: new ResponseEntity<$T>($X, ...)
      - pattern: ServerResponse.$S(...).bodyValue($X)
      - pattern: ServerResponse.$S(...).$T(...).bodyValue($X)
      - pattern: ServerResponse.$S(...).body($X, ...)
      - pattern: ServerResponse.$S(...).$T(...).body($X, ...)
      - pattern: Response.ok($X)
      - pattern: Response.$S(...).entity($X)
      - pattern: Response.$S(...).$T(...).entity($X)
      - patterns:
          - pattern: $RESP.getWriter().$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: $RESP.getOutputStream().$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println)$
      - patterns:
          - pattern: (PrintWriter $O).$M(..., $X, ...)
          - pattern-inside: |
              $R $F(..., HttpServletResponse $RESP, ...) {
                ...
              }
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: (ServletOutputStream $O).$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println)$
      - patterns:
          - pattern: $SRC.transferTo($RESP.getOutputStream())
          - focus-metavariable: $SRC
      - patterns:
          - pattern: $U.copy($SRC, $RESP.getOutputStream())
          - focus-metavariable: $SRC
      - pattern: (SseEmitter $E).send($X)
      - pattern: (ResponseBodyEmitter $E).send($X)
      - pattern: (WebSocketSession $S).sendMessage(new TextMessage($X))
      - pattern: (WebSocketSession $S).sendMessage(new BinaryMessage($X))
      - pattern: $S.getBasicRemote().sendText($X)
      - pattern: $S.getBasicRemote().sendBinary($X)
      - pattern: $S.getAsyncRemote().sendText($X)
      - pattern: $S.getAsyncRemote().sendBinary($X)
      - patterns:
          - pattern: ($TT $T).$M(..., $X)
          - metavariable-regex:
              metavariable: $TT
              regex: ^(SimpMessagingTemplate|SimpMessageSendingOperations|SimpMessagingOperations)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(convertAndSend|convertAndSendToUser)$
      - patterns:
          - pattern: $S.next($X)
          - pattern-inside: Flux.create(...)
      - pattern: (ChannelHandlerContext $C).writeAndFlush($X)
      - patterns:
          - pattern: $C.$M($X)
          - metavariable-regex:
              metavariable: $C
              regex: ^(ctx|context)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(result|json|html)$
      - pattern: (RoutingContext $C).json($X)
      - pattern: $C.response().end($X)
      - pattern: $C.response().write($X)
      - pattern: $C.response().$H(...).end($X)
      - pattern: (HttpServerResponse $R).end($X)
      - pattern: (HttpServerResponse $R).write($X)
      - pattern: (Model $M).addAttribute(..., $X)
      - pattern: (ModelMap $M).addAttribute(..., $X)
      - pattern: (RedirectAttributes $M).addFlashAttribute(..., $X)
      - pattern: (ModelAndView $M).addObject(..., $X)
      - pattern: new ModelAndView(..., $X)
      - pattern: (HttpServletRequest $R).setAttribute($K, $X)
      - pattern: $V.setText($X)
      - pattern: Toast.makeText($CTX, $X, ...)
      - pattern: Snackbar.make($V, $X, ...)
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
