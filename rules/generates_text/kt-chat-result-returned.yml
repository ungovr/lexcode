# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 18 to 27 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or an expression body in a function whose body makes one of the calls
# below, or a return or expression body that names a val set from one of them, at the top level, in
# a class or in a function, and declared before it. Not followed: a result one function stores at
# run time and another returns, a val derived from such a val, a member declared before the val it
# returns, and a call in a default parameter. The calls are the sources without their argument and
# name checks. How the scope is written, and why, is in CONTRIBUTING.md, Cost.
# chat().completions().create(...) and completions().create(...) are in scope through
# completions(...), and a trailing-lambda call such as converse { ... } through converse(...).
rules:
  - id: lexcode.text.kt-chat-result-returned
    languages:
      - kotlin
    severity: INFO
    message: Returns text written by a chat or completion model from a function, which may be generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.openai\.).*
          - pattern-either:
              - pattern: $C.chat().completions().create(...)
              - pattern: $C.chat().completions().createStreaming(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.openai\.).*
          - pattern-either:
              - pattern: client.responses().create(...)
              - pattern: client.responses().createStreaming(...)
              - pattern: client.completions().create(...)
              - pattern: client.completions().createStreaming(...)
              - pattern: openai.responses().create(...)
              - pattern: openai.responses().createStreaming(...)
              - pattern: openai.completions().create(...)
              - pattern: openai.completions().createStreaming(...)
              - pattern: openAI.responses().create(...)
              - pattern: openAI.responses().createStreaming(...)
              - pattern: openAI.completions().create(...)
              - pattern: openAI.completions().createStreaming(...)
              - pattern: openAIClient.responses().create(...)
              - pattern: openAIClient.responses().createStreaming(...)
              - pattern: openAIClient.completions().create(...)
              - pattern: openAIClient.completions().createStreaming(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.anthropic\.).*
          - pattern-either:
              - pattern: client.messages().create(...)
              - pattern: client.messages().createStreaming(...)
              - pattern: client.beta().messages().create(...)
              - pattern: client.beta().messages().createStreaming(...)
              - pattern: anthropic.messages().create(...)
              - pattern: anthropic.messages().createStreaming(...)
              - pattern: anthropic.beta().messages().create(...)
              - pattern: anthropic.beta().messages().createStreaming(...)
              - pattern: anthropicClient.messages().create(...)
              - pattern: anthropicClient.messages().createStreaming(...)
              - pattern: anthropicClient.beta().messages().create(...)
              - pattern: anthropicClient.beta().messages().createStreaming(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.aallam\.openai\.).*
          - pattern-either:
              - pattern: $O.chatCompletion(...)
              - pattern: $O.chatCompletions(...)
              - pattern: $O.completion(...)
              - pattern: $O.completions(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.azure\.ai\.openai\.).*
          - pattern-either:
              - pattern: $C.getChatCompletions(...)
              - pattern: $C.getChatCompletionsStream(...)
              - pattern: $C.getChatCompletionsWithResponse(...)
              - pattern: $C.getCompletions(...)
              - pattern: $C.getCompletionsStream(...)
              - pattern: $C.getCompletionsWithResponse(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.azure\.ai\.inference\.).*
          - pattern-either:
              - pattern: $C.complete(...)
              - pattern: $C.completeStream(...)
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(this\.)?_?\w*(client|model|inference|chat|llm)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*\.services\.bedrockruntime\.).*
          - pattern-either:
              - pattern: $C.converse(...)
              - pattern: $C.converse { ... }
              - pattern: $C.converseStream(...)
              - pattern: $C.converseStream { ... }
      - patterns:
          - pattern-regex: (?s)\A(?=.*\.services\.bedrockruntime\.).*
          - pattern-either:
              - pattern: $C.invokeModel { ...; modelId = $ID; ... }
              - pattern: InvokeModelRequest { ...; modelId = $ID; ... }
              - pattern: InvokeModelRequest.builder(). ... .modelId($ID). ... .build()
              - pattern: $C.invokeModelWithResponseStream { ...; modelId = $ID; ... }
              - pattern: InvokeModelWithResponseStreamRequest { ...; modelId = $ID; ... }
              - pattern: InvokeModelWithResponseStreamRequest.builder(). ... .modelId($ID). ... .build()
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(claude|llama|titan-text|nova-(lite|micro|pro|premier)|mistral|command|jamba|deepseek|qwen)[^"]*"$
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      fun $SINKFN(...) {
                        $...SINKBODY
                      }
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKC.responses().$SINKM(...)
                        - pattern: $SINKC.messages().$SINKM(...)
                        - pattern: $SINKR.chatCompletion(...)
                        - pattern: $SINKR.chatCompletions(...)
                        - pattern: $SINKR.completion(...)
                        - pattern: $SINKR.completions(...)
                        - pattern: $SINKR.getChatCompletions(...)
                        - pattern: $SINKR.getChatCompletionsStream(...)
                        - pattern: $SINKR.getChatCompletionsWithResponse(...)
                        - pattern: $SINKR.getCompletions(...)
                        - pattern: $SINKR.getCompletionsStream(...)
                        - pattern: $SINKR.getCompletionsWithResponse(...)
                        - pattern: $SINKR.complete(...)
                        - pattern: $SINKR.completeStream(...)
                        - pattern: $SINKR.converse(...)
                        - pattern: $SINKR.converseStream(...)
                        - pattern: $SINKR.invokeModel(...)
                        - pattern: $SINKR.invokeModelWithResponseStream(...)
                        - pattern: 'InvokeModelRequest { ... }'
                        - pattern: 'InvokeModelWithResponseStreamRequest { ... }'
                        - pattern: InvokeModelRequest.builder()
                        - pattern: InvokeModelWithResponseStreamRequest.builder()
              - patterns:
                  - pattern: return $X
                  - pattern-either: &valscopes
                      - pattern-inside: |
                          val $SINKV = <... $SINKC.responses().$SINKM(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKC.messages().$SINKM(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.chatCompletion(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.chatCompletions(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.completion(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.completions(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getChatCompletions(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getChatCompletionsStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getChatCompletionsWithResponse(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getCompletions(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getCompletionsStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getCompletionsWithResponse(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.complete(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.completeStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.converse(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.converseStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.invokeModel(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.invokeModelWithResponseStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelRequest { ... } ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelWithResponseStreamRequest { ... } ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelRequest.builder() ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelWithResponseStreamRequest.builder() ...>
                          ...
                  - metavariable-pattern:
                      metavariable: $X
                      pattern-either:
                        - pattern: $SINKV
                        - pattern: this.$SINKV
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R {
                          ...
                        }
                    - pattern: |
                        @$A
                        fun $F(...): $R {
                          ...
                        }
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern-not-inside: |
              { $P -> ... }
          - pattern-not-inside: |
              { $P, $Q -> ... }
          - pattern-not-inside: |
              { $P, $Q, $W -> ... }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(...) = $X
              - pattern-inside: |
                  fun $F(...): $R = $X
          - metavariable-pattern:
              metavariable: $X
              pattern-either: *sinkcalls
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
      - patterns:
          - pattern-either:
              - pattern: |
                  fun $F(...) = $X
              - pattern: |
                  fun $F(...): $R = $X
          - pattern-either: *valscopes
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - pattern: $SINKV
                - pattern: this.$SINKV
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
      strength: signal
