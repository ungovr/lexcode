                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.call(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.stream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.chatComplete(...);
                    ...
                  }
              - patterns:
                  - pattern: return $X;
                  - pattern-either:
                      - pattern-inside: |
                          class $SINKCLS {
                            ...
                            $SINKT $SINKV = <... $SINKC.responses().$SINKM(...) ...>;
                            ...
