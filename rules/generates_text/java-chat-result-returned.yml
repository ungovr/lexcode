# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 10 to 14 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return in a method that also makes one of the calls below, or a return that
# names a field the class sets from one of them. The calls are the sources without their argument
# and name checks, so every source call is in the scope. A result one method stores at run time and
# another returns is not followed. How the scope is written, and why, is in CONTRIBUTING.md, Cost.
# chat().completions().create(...) is in scope through completions(...).
rules:
  - id: lexcode.text.java-chat-result-returned
    languages: [java]
    severity: INFO
    message: Returns text written by a chat or completion model from a method, which may be generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - pattern: $C.chat().completions().create(...)
      - pattern: $C.chat().completions().createStreaming(...)
      - patterns:
          - pattern-either:
              - pattern: $C.$K().$M(($PT $P))
              - pattern: $C.$K().$M($PT.builder(). ... .build())
          - metavariable-regex:
              metavariable: $K
              regex: ^(responses|completions|messages)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(create|createStreaming)$
          - metavariable-regex:
              metavariable: $PT
              regex: ^(ResponseCreateParams|CompletionCreateParams|MessageCreateParams|BetaMessageCreateParams)$
      - patterns:
          - pattern-either:
              - pattern: $C.invokeModel(InvokeModelRequest.builder(). ... .modelId($ID). ... .build())
              - pattern: $C.invokeModelWithResponseStream(InvokeModelWithResponseStreamRequest.builder(). ... .modelId($ID). ... .build())
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(claude|llama|titan-text|nova-(lite|micro|pro|premier)|mistral|command|jamba|deepseek|qwen)[^"]*"$
      - patterns:
          - pattern: ($T $M).$F(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^([\w.]+\.)?(OpenAIClient|OpenAIAsyncClient|ChatCompletionsClient|ChatCompletionsAsyncClient|BedrockRuntimeClient|BedrockRuntimeAsyncClient|\w*ChatModel|\w*ChatLanguageModel|OllamaAPI|Ollama|LlamaModel)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(getChatCompletions|getChatCompletionsStream|getChatCompletionsWithResponse|getCompletions|getCompletionsStream|complete|completeStream|converse|converseStream|chat|generate|generateAsync|call|stream|chatComplete)$
      - pattern: $C.prompt(...). ... .call()
      - pattern: $C.prompt(...). ... .stream()
      - patterns:
          - pattern: |
              void onPartialResponse(String $T) {
                ...
              }
          - focus-metavariable: $T
      - patterns:
          - pattern: |
              void onNext(String $T) {
                ...
              }
          - pattern-inside: |
              new StreamingResponseHandler<$M>() {
                ...
              }
          - focus-metavariable: $T
      - patterns:
          - pattern: $TS.onPartialResponse(($T) -> ...)
          - focus-metavariable: $T
      - patterns:
          - pattern: LambdaStreamingResponseHandler.onNext(($T) -> ...)
          - focus-metavariable: $T
    pattern-propagators:
      - pattern: $S.forEach($X -> ...)
        from: $S
        to: $X
      - pattern: $S.forEachOrdered($X -> ...)
        from: $S
        to: $X
      - pattern: $S.subscribe($X -> ...)
        from: $S
        to: $X
      - pattern: $S.map($X -> ...)
        from: $S
        to: $X
      - pattern: $S.flatMap($X -> ...)
        from: $S
        to: $X
      - pattern: $S.doOnNext($X -> ...)
        from: $S
        to: $X
      - pattern: $S.ifPresent($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenApply($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenAccept($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onPartialResponse($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onNext($X -> ...)
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern: return $X;
          - pattern-either:
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKC.responses().$SINKM(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKC.completions().$SINKM(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKC.messages().$SINKM(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.invokeModel(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.invokeModelWithResponseStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.getChatCompletions(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.getChatCompletionsStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.getChatCompletionsWithResponse(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.getCompletions(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.getCompletionsStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.complete(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.completeStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.converse(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.converseStream(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    $SINKR.chat(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
