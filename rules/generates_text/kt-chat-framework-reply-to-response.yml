rules:
  - id: lexcode.text.kt-chat-framework-reply-to-response
    languages:
      - kotlin
    severity: INFO
    message: Sends text written by a LangChain4j, Spring AI, Ollama4j or llama.cpp chat model back in an HTTP response, a socket or a screen, which is generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern-either:
              - pattern: $M.chat(...)
              - pattern: $M.chat { ... }
          - metavariable-regex:
              metavariable: $M
              regex: (?i)^(this\.)?_?\w*(model|llm|assistant|ollama|gpt)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern-either:
              - pattern: model.generate(...)
              - pattern: chatModel.generate(...)
              - pattern: chatLanguageModel.generate(...)
              - pattern: languageModel.generate(...)
              - pattern: llm.generate(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern-either:
              - pattern: chatModel.call(...)
              - pattern: llm.call(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern: $M.stream(...)
          - metavariable-regex:
              metavariable: $M
              regex: (?i)^(this\.)?_?\w*(model|llm|assistant|ollama|gpt)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern-either:
              - pattern: $C.prompt(...). ... .call()
              - pattern: $C.prompt(...). ... .stream()
      - patterns:
          - pattern-regex: (?s)\A(?=.*io\.github\.ollama4j\.).*
          - pattern-either:
              - pattern: ollamaAPI.generate(...)
              - pattern: ollamaAPI.chat(...)
              - pattern: ollamaApi.generate(...)
              - pattern: ollamaApi.chat(...)
              - pattern: ollama.generate(...)
              - pattern: ollama.chat(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*de\.kherud\.llama\.).*
          - pattern-either:
              - pattern: model.generate(...)
              - pattern: model.complete(...)
              - pattern: llamaModel.generate(...)
              - pattern: llamaModel.complete(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern: |
              override fun onPartialResponse($T: String) {
                ...
              }
          - focus-metavariable: $T
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern: $TS.onPartialResponse { $T -> ... }
          - focus-metavariable: $T
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern: $TS.onPartialResponse { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
          - focus-metavariable: $IT
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern-either:
              - pattern: model.chat($Q) { $T -> ... }
              - pattern: chatModel.chat($Q) { $T -> ... }
          - focus-metavariable: $T
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern: |
              override fun onNext($T: String) {
                ...
              }
          - pattern-inside: |
              object : StreamingResponseHandler<$M> {
                ...
              }
          - focus-metavariable: $T
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A(...)
                  fun $F(...): $R {
                    ...
                  }
              - pattern-inside: |
                  @$A
                  fun $F(...): $R {
                    ...
                  }
          - metavariable-regex:
              metavariable: $A
              regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern: return $X
          - pattern-not-inside: |
              $C { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A(...)
                  fun $F(...) = $X
              - pattern-inside: |
                  @$A(...)
                  fun $F(...): $R = $X
              - pattern-inside: |
                  @$A
                  fun $F(...) = $X
              - pattern-inside: |
                  @$A
                  fun $F(...): $R = $X
          - metavariable-regex:
              metavariable: $A
              regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - focus-metavariable: $X
      - pattern: ResponseEntity.ok($X)
      - pattern: ResponseEntity.$S(...). ... .body($X)
      - pattern: ResponseEntity($X, ...)
      - pattern: ResponseEntity<$T>($X, ...)
      - pattern: ServerResponse.$S(...). ... .bodyValue($X)
      - pattern: ServerResponse.$S(...). ... .bodyValueAndAwait($X)
      - pattern: ServerResponse.$S(...). ... .body($X, ...)
      - pattern: ServerResponse.$S(...). ... .bodyAndAwait($X, ...)
      - pattern: Response.ok($X)
      - pattern: Response.$S(...). ... .entity($X)
      - pattern: Response(...).body($X)
      - pattern: call.respond(..., $X, ...)
      - pattern: call.respondText(..., $X, ...)
      - pattern: call.respondBytes(..., $X, ...)
      - pattern: Frame.Text($X)
      - pattern: Frame.Binary(..., $X)
      - pattern: $C.response().end($X)
      - pattern: $C.response().write($X)
      - pattern: $C.response().$H(...).end($X)
      - pattern: ctx.result($X)
      - pattern: ctx.json($X)
      - pattern: ctx.html($X)
      - pattern: $S.basicRemote.sendText($X)
      - pattern: $S.asyncRemote.sendText($X)
      - pattern: $S.basicRemote.sendBinary($X)
      - pattern: $S.asyncRemote.sendBinary($X)
      - patterns:
          - pattern: $RESP.writer.$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $RESP
              regex: (?i)^(this\.)?\w*(resp|response|res)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: $RESP.outputStream.$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $RESP
              regex: (?i)^(this\.)?\w*(resp|response|res)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println)$
      - patterns:
          - pattern-either:
              - pattern: out.$M(..., $X, ...)
              - pattern: writer.$M(..., $X, ...)
              - pattern: pw.$M(..., $X, ...)
              - pattern: printWriter.$M(..., $X, ...)
          - pattern-inside: |
              fun $F(..., $RESP: HttpServletResponse, ...) {
                ...
              }
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: $SRC.transferTo($RESP.outputStream)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: $SRC.copyTo($RESP.outputStream)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: $U.copy($SRC, $RESP.outputStream)
          - focus-metavariable: $SRC
      - pattern: emitter.send(..., $X, ...)
      - pattern: sseEmitter.send(..., $X, ...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.messaging\.simp\.).*
          - pattern-either:
              - pattern: $T.convertAndSend(..., $X, ...)
              - pattern: $T.convertAndSendToUser(..., $X, ...)
      - pattern: $S.sendMessage(TextMessage($X))
      - pattern: $S.sendMessage(BinaryMessage($X))
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.).*
          - pattern-either:
              - pattern: $R.addAttribute(..., $X, ...)
              - pattern: $R.addFlashAttribute(..., $X, ...)
              - pattern: $R.addObject(..., $X, ...)
              - pattern: $R.setAttribute(..., $X, ...)
          - metavariable-regex:
              metavariable: $R
              regex: (?i)^(this\.)?_?(\w*(model|mav|attributes|req|request)|ra)$
      - pattern: ModelAndView(..., $X)
      - pattern: $V.setText($X)
      - pattern: $V.text = $X
      - pattern: Toast.makeText($CTX, $X, ...)
      - pattern: Snackbar.make($V, $X, ...)
      - pattern: Text(text = $X, ...)
      - pattern: Text($X, ...)
      - patterns:
          - pattern-either:
              - pattern: $S.value = $X
              - pattern: $S.postValue($X)
              - pattern: $S.emit($X)
              - pattern: $S.tryEmit($X)
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^(this\.)?_?\w*(state|message|reply|response|answer|result|output|text|summary|story|caption)\w*$
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
