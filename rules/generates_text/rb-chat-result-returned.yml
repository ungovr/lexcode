# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 48 to 56 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or a yield in a method whose body makes one of the calls below. Not
# followed: a result one method stores at run time and another returns, and a call in a default
# parameter. The calls are the sources without their argument and name checks. How the scope is
# written, and why, is in CONTRIBUTING.md, Cost. chat.completions.create(...) and RubyLLM.chat(...)
# are in scope through chat(...).
rules:
  - id: lexcode.text.rb-chat-result-returned
    languages: [ruby]
    severity: INFO
    message: Returns text written by a chat or completion model from a method, which may be generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - pattern: '$C.chat(parameters: ...)'
      - pattern: '$C.completions(parameters: ...)'
      - pattern: $C.chat.completions.create(...)
      - pattern: '$C.responses.create(parameters: ...)'
      - pattern: '$C.responses.create(..., model: ..., ...)'
      - pattern: $C.responses.stream(...)
      - pattern: '$C.messages.create(..., max_tokens: ..., ...)'
      - pattern: '$C.messages.stream(..., max_tokens: ..., ...)'
      - pattern: $C.converse(...)
      - pattern: $C.converse_stream(...)
      - pattern: '$C.chat(..., messages: ..., ...)'
      - pattern: '$C.complete(..., prompt: ..., ...)'
      - pattern: RubyLLM.chat(...)
    pattern-propagators:
      - pattern: $OUT = <... $R.dig(...) ...>
        from: $R
        to: $OUT
      - pattern: |
          $S.each do |$X|
            ...
          end
        from: $S
        to: $X
      - pattern: '$S.each { |$X| ... }'
        from: $S
        to: $X
      - pattern: |
          $S.ask(...) do |$X|
            ...
          end
        from: $S
        to: $X
      - pattern: '$S.ask(...) { |$X| ... }'
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern: yield $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKC.chat(...)
                        - pattern: $SINKC.completions(...)
                        - pattern: $SINKC.converse(...)
                        - pattern: $SINKC.converse_stream(...)
                        - pattern: $SINKC.complete(...)
                        - pattern: $SINKC.responses.$SINKM(...)
                        - pattern: $SINKC.messages.$SINKM(...)
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
          - pattern-either:
              - pattern: return $V
              - pattern: return $V.$M(...)
              - pattern: return $V.$M(...).$N
              - pattern: return $V.$M(...).$N(...)
              - pattern: return $V[...]
              - pattern: 'return { ..., $K: $V, ... }'
              - pattern: 'return { ..., $K: $V.$M(...), ... }'
          - metavariable-regex:
              metavariable: $V
              regex: ^@?[a-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*[?!]?)*$
          - focus-metavariable: $V
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
      strength: signal
