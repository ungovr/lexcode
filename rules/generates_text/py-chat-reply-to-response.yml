rules:
  - id: lexcode.text.py-chat-reply-to-response
    languages: [python]
    severity: INFO
    message: Sends text written by a chat or completion model back in an HTTP response, which is generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.chat.completions.parse(...)
      - pattern: $C.beta.chat.completions.parse(...)
      - pattern: $C.messages.create(..., max_tokens=..., ...)
      - pattern: $C.messages.stream(..., max_tokens=..., ...)
      - pattern: litellm.completion(...)
      - pattern: litellm.acompletion(...)
      - pattern: openai.ChatCompletion.create(...)
      - pattern: openai.ChatCompletion.acreate(...)
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
    pattern-sinks:
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(\w+\.)*(jsonify|JSONResponse|ORJSONResponse|UJSONResponse|HTMLResponse|PlainTextResponse|StreamingResponse|EventSourceResponse|Response|make_response|HttpResponse|JsonResponse|StreamingHttpResponse|render_template|send_file)$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A.$M(...)
                  def $F(...):
                    ...
              - pattern-inside: |
                  @$A.$M(...)
                  async def $F(...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|route|api_route|head|options)$
          - pattern: return $X
          - focus-metavariable: $X
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: ^(ws|websocket|socket)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(send_text|send_json|send_bytes)$
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
