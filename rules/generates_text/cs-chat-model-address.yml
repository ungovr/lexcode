rules:
  - id: lexcode.text.cs-chat-model-address
    languages: [csharp]
    severity: INFO
    message: Holds or sends to the address of a hosted text model's generation API (OpenAI's chat completions, completions or Responses API, Anthropic's Messages API, or Mistral's, Groq's or DeepSeek's chat endpoint), which may be generating text with AI that reaches users (generates_text).
    # An app that calls a hosted model with HttpClient and no SDK keeps the model's address in a
    # string: written at the call, or held in a const, a field, a static or instance property or a
    # local and sent from there (#13205). Often the address sits in a defaults class and the call in
    # a helper in another file (nopCommerce's ArtificialIntelligenceDefaults and
    # ArtificialIntelligenceHttpClient), and the engine follows a value only within a file, so the
    # declaration is matched on its own. That is why this is a signal: an address held or sent says
    # a model writes text, not that the text reaches a person. cs-chat-reply-to-response is the
    # evidence rule, for a send whose reply the same file hands back.
    # The hosts are the ones the other languages' text rules name (rs-chat-reply-to-response), and
    # an address is read to its end: the generation endpoint itself, with an optional trailing
    # slash or query. Listing models, embeddings, a response retrieved or cancelled by id and
    # Anthropic's token counter are other addresses. A lookalike host (api.openai.com.example.net)
    # does not match, since the path must follow the host's own name.
    # Matched: a member that holds the address (a const, a static or instance field, an
    # auto-property's initializer, an expression-bodied property or a getter that returns it), and
    # a call that sends to it (PostAsync, PostAsJsonAsync, a request message that is not a GET, and
    # a Uri built from it, which a client takes as its BaseAddress or a message as its RequestUri).
    # A local declaration is not matched on its own: a local counts when it is sent, as a log
    # message held in a local is not. A comment, a log line or an exception message that quotes the
    # address is never a match.
    # Two branches read the address. The first reads the source text of a literal (plain, verbatim
    # or interpolated) where it is written; the second reads a value the engine carries from a
    # const, a readonly field or a local in the same file to the call. The engine tests that value
    # against each literal part of an interpolated string, so its regex has no optional trailing
    # slash: "https://api.openai.com/v1/responses/" is the first part of a by-id address.
    # A GET request message drops: GET /v1/chat/completions lists stored completions. GET is
    # HttpMethod.Get or new HttpMethod("GET"), found by a regex over the whole message expression,
    # as in cs-video-reply-to-response. A member that holds a generation address but is only read
    # by a GET, or a Uri built for a GET message, still counts (a known gap).
    # No whole-file anchor: the member and call shapes give no literal to the engine's pre-filter,
    # and a C# lookahead would put C# in the large-file notice; the cost is measured instead.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $HTTP.PostAsync($URL, ...)
              - pattern: $HTTP.PostAsJsonAsync($URL, ...)
              - pattern: $HTTP.PostAsJsonAsync<$T>($URL, ...)
              - pattern: '$HTTP.PostAsync(..., requestUri: $URL, ...)'
              - pattern: '$HTTP.PostAsJsonAsync(..., requestUri: $URL, ...)'
              - pattern: '$HTTP.PostAsJsonAsync<$T>(..., requestUri: $URL, ...)'
              # A request message, with or without an initializer, positional or named, or a
              # declaration with target-typed new(). System.Net.Http is imported implicitly, so
              # the short form is read as well.
              - patterns:
                  - pattern-either:
                      - pattern: new System.Net.Http.HttpRequestMessage($VERB, $URL) { ... }
                      - pattern: new HttpRequestMessage($VERB, $URL) { ... }
                      - pattern: 'new System.Net.Http.HttpRequestMessage(..., requestUri: $URL, ...) { ... }'
                      - pattern: 'new HttpRequestMessage(..., requestUri: $URL, ...) { ... }'
                      - pattern: System.Net.Http.HttpRequestMessage $V = new($VERB, $URL) { ... };
                      - pattern: HttpRequestMessage $V = new($VERB, $URL) { ... };
                      - pattern: 'System.Net.Http.HttpRequestMessage $V = new(..., requestUri: $URL, ...) { ... };'
                      - pattern: 'HttpRequestMessage $V = new(..., requestUri: $URL, ...) { ... };'
                  - pattern-not-regex: HttpMethod\.Get\b|new\s+(?:System\.Net\.Http\.)?HttpMethod\s*\(\s*"GET"\s*\)
              # System is imported implicitly, so the short form is read as well.
              - pattern: new System.Uri($URL, ...)
              - pattern: new Uri($URL, ...)
              # A const, a field or an auto-property's initializer. A local inside a method,
              # constructor or accessor is left to the send branches.
              - patterns:
                  - pattern: $TYPE $NAME = $URL;
                  - pattern-not-inside: $R $F(...) { ... }
              # An expression-bodied property: the engine reads its body as an expression
              # statement, which in C# only such a body can be when it is a bare literal.
              - pattern: $URL;
              # A getter, or a method, that returns it.
              - pattern: return $URL;
          - metavariable-regex:
              metavariable: $URL
              # The source text: an optional $ or @ prefix, and no closing quote on an
              # interpolated string as the engine binds it.
              regex: ^(?:\$@?|@\$?)?"https://(?:api\.openai\.com/v1/(?:chat/completions|completions|responses)|api\.anthropic\.com/v1/messages|api\.mistral\.ai/v1/chat/completions|api\.groq\.com/openai/v1/chat/completions|api\.deepseek\.com/(?:v1/)?chat/completions)/?(?:\?[^"]*)?"?$
      # A const, a readonly field or a local sent from the same file. The value is written once
      # here per shape: the engine's string-value pattern cannot take a metavariable.
      - patterns:
          - pattern-either:
              - pattern: $HTTP.PostAsync("=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/", ...)
              - pattern: $HTTP.PostAsJsonAsync("=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/", ...)
              - pattern: $HTTP.PostAsJsonAsync<$T>("=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/", ...)
              - patterns:
                  - pattern-either:
                      - pattern: new System.Net.Http.HttpRequestMessage($VERB, "=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/") { ... }
                      - pattern: new HttpRequestMessage($VERB, "=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/") { ... }
                      - pattern: HttpRequestMessage $V = new($VERB, "=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/") { ... };
                  - pattern-not-regex: HttpMethod\.Get\b|new\s+(?:System\.Net\.Http\.)?HttpMethod\s*\(\s*"GET"\s*\)
              - pattern: new Uri("=~/^https:\/\/(?:api\.openai\.com\/v1\/(?:chat\/completions|completions|responses)|api\.anthropic\.com\/v1\/messages|api\.mistral\.ai\/v1\/chat\/completions|api\.groq\.com\/openai\/v1\/chat\/completions|api\.deepseek\.com\/(?:v1\/)?chat\/completions)(?:\?.*)?$/", ...)
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
      strength: signal
