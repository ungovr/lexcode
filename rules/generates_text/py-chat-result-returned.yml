# The sink is a return in a function that also calls the model, not every return in the file: that
# made the taint pass grow several times faster than the file, 15 to 25 s on a 900 KB file where a
# scan gives one rule 30 s per file (#13034). The flow this rule follows starts at a call in the
# same function, so the narrower sink keeps its matches. How the scope is written, and why, is in
# CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.text.py-chat-result-returned
    languages: [python]
    severity: INFO
    message: Returns text written by a chat or completion model from a function, which may be generating text with AI that reaches users (generates_text).
    mode: taint
    pattern-sources:
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.chat.completions.parse(...)
      - pattern: $C.beta.chat.completions.parse(...)
      - pattern: $C.messages.create(..., max_tokens=..., ...)
      - pattern: $C.messages.stream(..., max_tokens=..., ...)
      - pattern: litellm.completion(...)
      - pattern: litellm.acompletion(...)
      - pattern: openai.ChatCompletion.create(...)
      - pattern: openai.ChatCompletion.acreate(...)
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: return $X
              - pattern: yield $X
          - pattern-either:
              - pattern-inside: |
                  def $SINKFN(...):
                    ...
                    <... $SINKC.chat.completions.$SINKM(...) ...>
                    ...
              - pattern-inside: |
                  def $SINKFN(...):
                    ...
                    <... $SINKC.messages.$SINKM(...) ...>
                    ...
              - pattern-inside: |
                  def $SINKFN(...):
                    ...
                    <... litellm.$SINKM(...) ...>
                    ...
              - pattern-inside: |
                  def $SINKFN(...):
                    ...
                    <... openai.ChatCompletion.$SINKM(...) ...>
                    ...
              - pattern-inside: |
                  def $SINKFN(...):
                    ...
                    <... ollama.$SINKM(...) ...>
                    ...
              - patterns:
                  - pattern-inside: |
                      async def $SINKFN(...):
                        $...SINKBODY
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKC.chat.completions.$SINKM(...)
                        - pattern: $SINKC.messages.$SINKM(...)
                        - pattern: litellm.$SINKM(...)
                        - pattern: openai.ChatCompletion.$SINKM(...)
                        - pattern: ollama.$SINKM(...)
              - patterns:
                  - pattern-inside: |
                      lambda $...SINKARGS: $SINKLAMBDA
                  - metavariable-pattern:
                      metavariable: $SINKLAMBDA
                      pattern-either: *sinkcalls
          - pattern-not-inside: |
              @$A.$M(...)
              def $F(...):
                ...
          - pattern-not-inside: |
              @$A.$M(...)
              async def $F(...):
                ...
          - focus-metavariable: $X
    pattern-sanitizers:
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(\w+\.)*(jsonify|JSONResponse|ORJSONResponse|UJSONResponse|HTMLResponse|PlainTextResponse|StreamingResponse|EventSourceResponse|Response|make_response|HttpResponse|JsonResponse|StreamingHttpResponse|render_template|send_file)$
    metadata:
      activity: generates_text
      mentioned: performs
      definition: https://lexlint.io/activities/generates-text
      provenance: ungovr-original
      license: MIT
      strength: signal
