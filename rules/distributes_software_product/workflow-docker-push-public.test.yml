# lexcode-expect: 11
# Workflow steps that push an image to a public registry: Docker Hub (a name with no registry
# host, or docker.io / index.docker.io), GitHub Container Registry or Quay.
name: image
on:
  push:
    tags: ["v*"]
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/example/relay:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          tags: example/relay:latest
          push: true
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            123456789012.dkr.ecr.us-east-1.amazonaws.com/relay:latest
            quay.io/example/relay:latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/relay:latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: "docker.io/example/relay:latest,registry.example.com/relay:latest"
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags:
            - index.docker.io/example/relay:latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ github.repository }}:latest
      - run: docker push example/relay:${{ github.ref_name }}
      - run: |
          docker build -t ghcr.io/example/relay:latest .
          docker image push --quiet ghcr.io/example/relay:latest
      - run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --push -t quay.io/example/relay:latest .
      - name: buildx with a line continuation
        run: |
          docker buildx build \
            --tag ${{ github.repository_owner }}/relay:latest \
            --push .
