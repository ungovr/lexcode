# lexcode-expect: 9
# Workflow steps that push an image to a private registry or to one the file does not name.
name: image
on:
  push:
    tags: ["v*"]
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 123456789012.dkr.ecr.us-east-1.amazonaws.com/relay:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          tags: |
            gcr.io/example-project/relay:latest
            europe-west1-docker.pkg.dev/example-project/images/relay:latest
          push: true
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: example.azurecr.io/relay:latest,registry.example.com/relay:latest
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
      - run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR"
          docker push "$ECR/relay:latest"
      - run: docker buildx build --push -t localhost:5000/relay:latest .
      - run: docker buildx bake --push
