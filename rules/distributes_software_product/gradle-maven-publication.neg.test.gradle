// lexcode-expect: 0
// Publications that stay inside the company or the local machine: a publish to the team's own
// repository, to the organization's GitHub Packages and to the local Maven cache, with no signing.
// The Sonatype and GitHub Packages hosts also appear where the build reads dependencies, which
// publishes nothing.
plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven {
        url = uri("https://maven.pkg.github.com/example-org/shared-models")
        credentials {
            username = System.getenv('GITHUB_ACTOR')
            password = System.getenv('GITHUB_TOKEN')
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'corp'
            url = uri('https://nexus.corp.example.com/repository/releases')
        }
        maven {
            name = 'githubPackages'
            url = uri('https://maven.pkg.github.com/acme/billing-internal')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
        mavenLocal()
    }
}
