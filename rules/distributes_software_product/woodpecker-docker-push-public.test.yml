# lexcode-expect: 9
# Woodpecker and Drone steps that push an image to a public registry: Docker Hub (a repo with no
# registry host, or docker.io / index.docker.io), GitHub Container Registry or Quay.
variables:
  - &docker_settings
    username:
      from_secret: docker_username

steps:
  test:
    image: rust:1.92
    commands:
      - cargo test

  publish_release_docker:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: dessalines/lemmy
      dockerfile: docker/Dockerfile
      platforms: linux/amd64
      tag: ${CI_COMMIT_TAG=nightly}
    when:
      - event: tag

  publish_nightly:
    image: plugins/docker:20
    settings:
      registry: ghcr.io
      repo: ghcr.io/example/relay
      tags: nightly

  publish_kaniko:
    image: docker.io/woodpeckerci/plugin-kaniko:2.1
    settings:
      repo: docker.io/example/relay
      tags: latest

  publish_quay:
    image: "plugins/docker"
    settings:
      repo: "quay.io/example/relay"

  publish_index:
    image: 'woodpeckerci/plugin-docker-buildx:5'
    settings:
      repo: index.docker.io/example/relay

  publish_pinned:
    image: plugins/kaniko@sha256:0b4f3c7a1d2e9f8a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a
    settings:
      repo: example/relay
      dry_run: false

  publish_two_registries:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: 123456789012.dkr.ecr.us-east-1.amazonaws.com/relay,example/relay

  publish_list_of_repos:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo:
        - registry.example.com/team/relay
        - ghcr.io/example/relay

  publish_owner_namespace:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ${CI_REPO_OWNER}/relay
