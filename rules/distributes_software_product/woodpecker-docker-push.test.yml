# lexcode-expect: 8
# Woodpecker and Drone steps that push an image to a private registry or to one the file does not
# name: Amazon ECR, Google Container Registry, Artifact Registry, Azure Container Registry, an own
# host, or a registry held in a variable.
steps:
  push_ecr:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/relay
      dockerfile: docker/Dockerfile

  push_gcr:
    image: "plugins/docker:20"
    settings:
      repo: gcr.io/example-project/relay

  push_artifact_registry:
    image: plugins/kaniko@sha256:0b4f3c7a1d2e9f8a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a
    settings:
      repo: europe-west1-docker.pkg.dev/example-project/images/relay

  push_acr:
    image: 'woodpeckerci/plugin-kaniko'
    settings:
      repo: "example.azurecr.io/relay"

  push_own_host:
    image: registry.example.com:5000/plugins/docker
    settings:
      registry: registry.example.com
      repo: registry.example.com/team/relay

  push_localhost_port:
    image: plugins/docker
    settings:
      repo: localhost:5000/relay

  push_unknown_registry:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: ${REGISTRY_HOST}/team/relay
      dry-run: false

  push_private_list:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo:
        - registry.example.com/team/relay
        - 123456789012.dkr.ecr.us-east-1.amazonaws.com/relay
