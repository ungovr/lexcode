# lexcode-expect: 1
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-utils"
version = "2.0.1"
description = "Small helpers for working with coordinates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pyproj>=3.6"]

[project.urls]
Homepage = "https://example.org/geo-utils"
Source = "https://example.org/geo-utils/src"
