rules:
  - id: lexcode.distribute.setup-py-bare
    languages: [python]
    severity: INFO
    message: Calls setuptools setup with a package name, which makes a Python package that may be published for others or may only be installed inside the same repository (distributes_software_product).
    pattern-either:
      - pattern: setuptools.setup(..., name=$NAME, ...)
      - pattern: distutils.core.setup(..., name=$NAME, ...)
      - pattern: setup(..., name=$NAME, ..., version=$VERSION, ...)
    paths:
      include:
        - "setup.py"
        - "setup-py-bare.*"
    metadata:
      activity: distributes_software_product
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/distributes-software-product
      provenance: ungovr-original
      license: MIT
