rules:
  - id: lexcode.distribute.cargo-package
    languages: [generic]
    severity: INFO
    message: Declares a Cargo package with the description and licence cargo publish requires and publishing not switched off, which may be a crate made available for others to install or only a service that builds itself (distributes_software_product).
    # A signal, as pyproject-package and rb-gemspec are: every crate has a [package] table, and a
    # description and a licence are written by hosted services too (and inherited by every member of
    # a workspace that sets them once). Evidence that a crate is listed for others is
    # cargo-published's. One match per [package] header. Not matched when publishing is switched
    # off: `publish = false`, a registry list without crates-io (empty, or a private registry, on one
    # line or several), or `publish.workspace = true` (a workspace sets publish only to turn it off;
    # the default is on). Not matched under a licence or licence file naming a proprietary,
    # unlicensed or commercial grant. Each key is looked for only in the package's own table: the
    # lookaheads walk line by line and stop at the next table header. `\r?$` reads a manifest saved
    # with Windows line endings.
    pattern-regex: '(?m)^[ \t]*\[package\][ \t]*(?:#[^\n]*)?\r?$(?=(?:\n(?![ \t]*\[)[^\n]*)*?\n[ \t]*description(?:\.workspace)?[ \t]*=)(?=(?:\n(?![ \t]*\[)[^\n]*)*?\n[ \t]*license(?:-file)?(?:\.workspace)?[ \t]*=)(?!(?:\n(?![ \t]*\[)[^\n]*)*?\n[ \t]*publish(?:[ \t]*=[ \t]*(?:false\b|\[(?![^\]]*crates-io)|\{[^}\n]*\bworkspace\b)|\.workspace\b))(?!(?:\n(?![ \t]*\[)[^\n]*)*?\n[ \t]*license(?:-file)?[ \t]*=[ \t]*["''][^"''\n]*(?i:proprietary|unlicensed|commercial|all rights reserved))'
    paths:
      include:
        - "Cargo.toml"
        - "cargo-package.*"
      # A crate under an example, sample or demo directory is a worked example, not the product. The
      # fixture runner reads only the files beside this rule, so no fixture can sit under these paths.
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
    metadata:
      activity: distributes_software_product
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/distributes-software-product
      provenance: ungovr-original
      license: MIT
