rules:
  - id: lexcode.distribute.workflow-docker-push-public
    languages: [yaml]
    severity: INFO
    message: A workflow builds a container image and pushes it to a public registry (Docker Hub, GitHub Container Registry or Quay), where others can pull it and run it themselves (distributes_software_product).
    # The product ruling of 2026-11-21 on #13300: an image pushed to a public registry is a server
    # others self-host, so it is evidence; a push to a private registry or to one the file does
    # not name stays the signal lexcode.distribute.workflow-docker-push, which reads the same
    # steps with the opposite registry test.
    #
    # Two step shapes: docker/build-push-action with push: true and a tags input, and a run step
    # that calls docker push, docker image push, or docker buildx build with --push and a -t or
    # --tag (a backslash continuation, or a next line that starts with a flag as in a folded
    # scalar, continues the command). The registry is an image name's first path part, as
    # Docker reads it: a part with no dot or colon (other than localhost) is a Docker Hub
    # namespace (example/relay), and docker.io, index.docker.io, registry-1.docker.io, ghcr.io and
    # quay.io are named. A tag list (one per line, a YAML list or a comma list) counts when any tag
    # is public. A namespace that is an expression counts when it names a user, Docker Hub or the
    # repository owner (${{ secrets.DOCKERHUB_USERNAME }}/x, ${{ github.repository_owner }}/x,
    # ${{ github.repository }} alone); any other expression, such as the docker/metadata-action
    # output ${{ steps.meta.outputs.tags }} or an env value, leaves the registry unknown.
    pattern-either:
      - patterns:
          - pattern: |
              uses: $ACTION
              ...
              with:
                ...
                push: true
                ...
                tags: $TAGS
          - metavariable-regex:
              metavariable: $ACTION
              regex: '^docker/build-push-action(@.*)?$'
          - metavariable-regex:
              metavariable: $TAGS
              regex: '^[\s\S]*?(?<![^,\[\s"''=])(?:(?:docker\.io|index\.docker\.io|registry-1\.docker\.io|ghcr\.io|quay\.io)/|(?!localhost/)[a-z0-9][a-z0-9_-]*/|\$\{\{\s*(?:(?:secrets|vars|env)\.\w*(?:USER|[Uu]ser|DOCKERHUB|[Dd]ocker[Hh]ub)\w*|github\.(?:repository_owner|actor))\s*\}\}/|\$\{\{\s*github\.repository\s*\}\}(?![\w/.-])|\$\{?\w*(?:USER|DOCKERHUB)\w*\}?/)'
      - patterns:
          - pattern: "run: $CMD"
          - metavariable-regex:
              metavariable: $CMD
              regex: '^[\s\S]*?(?:\bdocker\s+(?:image\s+)?push\s+(?:(?:--platform[ =]\S+|-[-\w]+)\s+)*["'']?(?:(?:docker\.io|index\.docker\.io|registry-1\.docker\.io|ghcr\.io|quay\.io)/|(?!localhost/)[a-z0-9][a-z0-9_-]*/|\$\{\{\s*(?:(?:secrets|vars|env)\.\w*(?:USER|[Uu]ser|DOCKERHUB|[Dd]ocker[Hh]ub)\w*|github\.(?:repository_owner|actor))\s*\}\}/|\$\{\{\s*github\.repository\s*\}\}(?![\w/.-])|\$\{?\w*(?:USER|DOCKERHUB)\w*\}?/)|\bdocker\s+buildx\s+build\b(?=(?:[^\n]|\\\n|\n(?=[ \t]*-))*\s--push\b)(?:[^\n]|\\\n|\n(?=[ \t]*-))*?\s(?:-t|--tag)[ =]["'']?(?:(?:docker\.io|index\.docker\.io|registry-1\.docker\.io|ghcr\.io|quay\.io)/|(?!localhost/)[a-z0-9][a-z0-9_-]*/|\$\{\{\s*(?:(?:secrets|vars|env)\.\w*(?:USER|[Uu]ser|DOCKERHUB|[Dd]ocker[Hh]ub)\w*|github\.(?:repository_owner|actor))\s*\}\}/|\$\{\{\s*github\.repository\s*\}\}(?![\w/.-])|\$\{?\w*(?:USER|DOCKERHUB)\w*\}?/))'
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "**/.github/workflows/*.yml"
        - "**/.github/workflows/*.yaml"
        - "workflow-docker-push-public.*"
    metadata:
      activity: distributes_software_product
      mentioned: performs
      definition: https://lexlint.io/activities/distributes-software-product
      provenance: ungovr-original
      license: MIT
