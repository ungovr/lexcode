rules:
  - id: lexcode.distribute.gradle-kts-publishing-plugin
    languages: [kotlin]
    severity: INFO
    message: Applies a Gradle plugin that publishes to Maven Central, a Nexus staging repository, the Gradle plugin portal or a release host (vanniktech, the Gradle Nexus publish plugin, plugin-publish, JReleaser), by id or by a catalog alias named for it, which makes the artifact available for others to depend on (distributes_software_product).
    pattern-regex: '(?m)^[ \t]*(?:(?:id|apply)[ \t]*\([ \t]*(?:plugin[ \t]*=[ \t]*)?"(?:com\.vanniktech\.maven\.publish(?:\.base)?|io\.github\.gradle-nexus\.publish-plugin|com\.gradle\.plugin-publish|org\.jreleaser|com\.jfrog\.bintray)"[ \t]*\)|alias[ \t]*\([ \t]*\w+\.plugins\.(?:\w+\.)*(?:vanniktech(?:\.\w+)*?\.(?i:\w*(?:maven|publish)\w*)(?:\.\w+)*|(?:gradle\.)?nexus\.publish(?:\.plugin)?|plugin\.publish|jreleaser)[ \t]*\)|classpath[ \t]*\([ \t]*"(?:com\.vanniktech:gradle-maven-publish-plugin|io\.github\.gradle-nexus:publish-plugin|org\.jreleaser:jreleaser-gradle-plugin|com\.gradle\.publish:plugin-publish-plugin|com\.jfrog\.bintray\.gradle:gradle-bintray-plugin)[:"])(?![^\n]*\bapply[ \t]+false\b)'
    paths:
      include:
        - "*.gradle.kts"
        - "gradle-kts-publishing-plugin.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
    metadata:
      activity: distributes_software_product
      mentioned: performs
      definition: https://lexlint.io/activities/distributes-software-product
      provenance: ungovr-original
      license: MIT
