rules:
  - id: lexcode.aggregate.cs-news-api-call
    languages: [csharp]
    severity: INFO
    message: Pulls headlines and article snippets from a third-party news API, which is reusing other publishers' content (aggregates_content).
    pattern-either:
      # A news API's address in a string (plain, interpolated or verbatim), whichever client sends
      # it: an HttpClient call, a BaseAddress, a typed client's configuration.
      - pattern-regex: '"https?://(newsapi\.org/(v2|")|newsdata\.io/api|gnews\.io/api|api\.nytimes\.com/svc/(topstories|mostpopular|search|news)|content\.guardianapis\.com|api\.mediastack\.com|api\.thenewsapi\.com|newsapi\.ai/api|api\.worldnewsapi\.com|api\.bing\.microsoft\.com/v7\.0/news)'
      # The News API .NET client (package NewsAPI), its type written in full. The engine resolves
      # C# `using` lines and aliases, and infers a local's type from `new NewsApiClient(...)` and
      # target-typed `new()`, so a project's own `NewsApiClient` in another namespace is not taken
      # for it. A client named only in another file's `global using` is not seen (rules/README.md).
      - patterns:
          - pattern: (NewsAPI.NewsApiClient $N).$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(GetTopHeadlines|GetEverything)(Async)?$
    metadata:
      activity: aggregates_content
      mentioned: performs
      definition: https://lexlint.io/activities/aggregates-content
      provenance: ungovr-original
      license: MIT
