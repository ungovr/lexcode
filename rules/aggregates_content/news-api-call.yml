rules:
  - id: lexcode.aggregate.news-api-call
    languages: [javascript, typescript]
    severity: INFO
    message: Pulls headlines and article snippets from a third-party news API, which is reusing other publishers' content (aggregates_content).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios.get($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: got($URL, ...)
              - pattern: $C.get($URL, ...)
          - metavariable-regex:
              metavariable: $URL
              regex: (?is).*(newsapi\.org/v2|newsdata\.io/api|gnews\.io/api|api\.nytimes\.com/svc/(topstories|mostpopular|search|news)|content\.guardianapis\.com|api\.mediastack\.com|api\.thenewsapi\.com|newsapi\.ai/api|api\.worldnewsapi\.com|api\.bing\.microsoft\.com/v7\.0/news).*
      - pattern: $N.v2.topHeadlines(...)
      - pattern: $N.v2.everything(...)
    metadata:
      activity: aggregates_content
      mentioned: performs
      definition: https://lexlint.io/activities/aggregates-content
      provenance: ungovr-original
      license: MIT
