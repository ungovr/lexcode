rules:
  - id: lexcode.aggregate.rb-feed-fetch-and-parse
    languages: [ruby]
    severity: INFO
    message: Fetches another publisher's RSS or Atom feed and parses it, which is reusing other publishers' content (aggregates_content).
    patterns:
      - pattern-either:
          - pattern: Feedjira::Feed.fetch_and_parse($URL, ...)
          - pattern: Feedzirra::Feed.fetch_and_parse($URL, ...)
          - patterns:
              - pattern: RSS::Parser.parse($URL, ...)
              - metavariable-regex:
                  metavariable: $URL
                  regex: (?s)^["']https?://.*$
          - patterns:
              - pattern-inside: |
                  $RP(...)
              - metavariable-regex:
                  metavariable: $RP
                  regex: ^(RSS::Parser\.parse|SimpleRSS\.parse|FeedNormalizer::FeedNormalizer\.parse)$
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern: $F($URL, ...)
                          - pattern: $F(URI($URL), ...)
                          - pattern: $F(URI.parse($URL), ...)
                      - metavariable-regex:
                          metavariable: $F
                          regex: ^(Net::HTTP\.(get|get_response)|URI\.open|HTTParty\.get|Faraday\.get|RestClient\.get|Typhoeus\.get|HTTP\.get|@{0,2}(?!\w*(redis|cache|dalli|memcache|store|storage|s3|aws))(\w*[cC]lient|conn|\w*[cC]onn(ection)?|\w*[hH]ttp\w*|\w*[sS]ession|agent|\w*[aA]gent|\w*[fF]araday\w*)\.get)$
                  - pattern: URI.parse($URL).open(...)
                  - pattern: URI($URL).open(...)
                  - patterns:
                      - pattern: open($URL, ...)
                      - metavariable-regex:
                          metavariable: $URL
                          regex: (?i)(^["']https?://|url|uri|link|href|feed|site)
      - metavariable-regex:
          metavariable: $URL
          regex: (?s)^(?!URI(\.parse)?\()(?!["']https?://(localhost|127\.|0\.0\.0\.0|\[::1\])).*$
    metadata:
      activity: aggregates_content
      mentioned: performs
      definition: https://lexlint.io/activities/aggregates-content
      provenance: ungovr-original
      license: MIT
      host_metavar: $URL
