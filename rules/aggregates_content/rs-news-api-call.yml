# A third-party news API's endpoint in a string (plain, raw, or the template of `format!`, which
# the regex reads because it reads the source text) is headlines and article snippets pulled from
# other publishers, whichever client sends it. The hosts are the ones the other languages' news
# rules name. A news site's own page, a news API's pricing page, and a news publisher's API that
# is not a news feed (the New York Times' Books API) are not matched; nor is the app's own API.
rules:
  - id: lexcode.aggregate.rs-news-api-call
    languages: [rust]
    severity: INFO
    message: Pulls headlines and article snippets from a third-party news API, which is reusing other publishers' content (aggregates_content).
    pattern-regex: (?:r#*)?"https?://(?:newsapi\.org/(?:v2|")|newsdata\.io/api|gnews\.io/api|api\.nytimes\.com/svc/(?:topstories|mostpopular|search|news)|content\.guardianapis\.com|api\.mediastack\.com|api\.thenewsapi\.com|newsapi\.ai/api|api\.worldnewsapi\.com|api\.bing\.microsoft\.com/v7\.0/news)
    metadata:
      activity: aggregates_content
      mentioned: performs
      definition: https://lexlint.io/activities/aggregates-content
      provenance: ungovr-original
      license: MIT
