# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 18 to 27 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or an expression body in a function whose body makes one of the calls
# below, or a return or expression body that names a val set from one of them, at the top level, in
# a class or in a function, and declared before it. Not followed: a result one function stores at
# run time and another returns, a val derived from such a val, a member declared before the val it
# returns, and a call in a default parameter. The calls are the sources without their argument and
# name checks. How the scope is written, and why, is in CONTRIBUTING.md, Cost. A trailing-lambda
# call such as invokeModel { ... } is in scope through invokeModel(...).
rules:
  - id: lexcode.image.kt-image-result-returned
    languages:
      - kotlin
    severity: INFO
    message: Returns a picture drawn by an image model from a function, which may be generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.openai\.).*
          - pattern-either:
              - pattern: $C.images().generate(...)
              - pattern: $C.images().edit(...)
              - pattern: $C.images().createVariation(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.aallam\.openai\.).*
          - pattern-either:
              - pattern: $O.imageURL(...)
              - pattern: $O.imageJSON(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.genai\.).*
          - pattern-either:
              - pattern: $C.models.generateImages(...)
              - pattern: $C.models.editImage(...)
              - pattern: $C.models.upscaleImage(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.firebase\.vertexai\.).*
          - pattern: $M.generateImages(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.firebase\.ai\.).*
          - pattern: $M.generateImages(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*\.services\.bedrockruntime\.).*
          - pattern-either:
              - pattern: $C.invokeModel { ...; modelId = $ID; ... }
              - pattern: InvokeModelRequest { ...; modelId = $ID; ... }
              - pattern: InvokeModelRequest.builder(). ... .modelId($ID). ... .build()
              - pattern: $C.invokeModelWithResponseStream { ...; modelId = $ID; ... }
              - pattern: InvokeModelWithResponseStreamRequest { ...; modelId = $ID; ... }
              - pattern: InvokeModelWithResponseStreamRequest.builder(). ... .modelId($ID). ... .build()
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(titan-image|nova-canvas|stability|stable-diffusion|stable-image|sd3)[^"]*"$
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.azure\.ai\.openai\.).*
          - pattern-either:
              - pattern: $C.getImageGenerations(...)
              - pattern: $C.getImageGenerationsWithResponse(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*dev\.langchain4j\.).*
          - pattern: $M.generate(...)
          - metavariable-regex:
              metavariable: $M
              regex: (?i)^(this\.)?_?\w*(image|dalle|diffusion)\w*$
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern: ImagePrompt(...)
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      fun $SINKFN(...) {
                        $...SINKBODY
                      }
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKC.images().$SINKM(...)
                        - pattern: $SINKR.imageURL(...)
                        - pattern: $SINKR.imageJSON(...)
                        - pattern: $SINKR.generateImages(...)
                        - pattern: $SINKR.editImage(...)
                        - pattern: $SINKR.upscaleImage(...)
                        - pattern: $SINKR.invokeModel(...)
                        - pattern: $SINKR.invokeModelWithResponseStream(...)
                        - pattern: $SINKR.getImageGenerations(...)
                        - pattern: $SINKR.getImageGenerationsWithResponse(...)
                        - pattern: $SINKR.generate(...)
                        - pattern: 'InvokeModelRequest { ... }'
                        - pattern: 'InvokeModelWithResponseStreamRequest { ... }'
                        - pattern: InvokeModelRequest.builder()
                        - pattern: InvokeModelWithResponseStreamRequest.builder()
                        - pattern: ImagePrompt(...)
              - patterns:
                  - pattern: return $X
                  - pattern-either: &valscopes
                      - pattern-inside: |
                          val $SINKV = <... $SINKC.images().$SINKM(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.imageURL(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.imageJSON(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.generateImages(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.editImage(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.upscaleImage(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.invokeModel(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.invokeModelWithResponseStream(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getImageGenerations(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.getImageGenerationsWithResponse(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... $SINKR.generate(...) ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelRequest { ... } ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelWithResponseStreamRequest { ... } ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelRequest.builder() ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... InvokeModelWithResponseStreamRequest.builder() ...>
                          ...
                      - pattern-inside: |
                          val $SINKV = <... ImagePrompt(...) ...>
                          ...
                  - metavariable-pattern:
                      metavariable: $X
                      pattern-either:
                        - pattern: $SINKV
                        - pattern: this.$SINKV
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R {
                          ...
                        }
                    - pattern: |
                        @$A
                        fun $F(...): $R {
                          ...
                        }
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern-not-inside: |
              { $P -> ... }
          - pattern-not-inside: |
              { $P, $Q -> ... }
          - pattern-not-inside: |
              { $P, $Q, $W -> ... }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $F(...) = $X
              - pattern-inside: |
                  fun $F(...): $R = $X
          - metavariable-pattern:
              metavariable: $X
              pattern-either: *sinkcalls
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
      - patterns:
          - pattern-either:
              - pattern: |
                  fun $F(...) = $X
              - pattern: |
                  fun $F(...): $R = $X
          - pattern-either: *valscopes
          - metavariable-pattern:
              metavariable: $X
              pattern-either:
                - pattern: $SINKV
                - pattern: this.$SINKV
          - focus-metavariable: $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        @$A(...)
                        fun $F(...) = $X
                    - pattern: |
                        @$A(...)
                        fun $F(...): $R = $X
                    - pattern: |
                        @$A
                        fun $F(...) = $X
                    - pattern: |
                        @$A
                        fun $F(...): $R = $X
                - metavariable-regex:
                    metavariable: $A
                    regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
      strength: signal
