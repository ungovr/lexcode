rules:
  - id: lexcode.image.go-image-reply-to-response
    languages: [go]
    severity: INFO
    message: Writes a picture drawn by an image model into an HTTP response, which is generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - pattern: $C.CreateImage(...)
      - pattern: $C.CreateEditImage(...)
      - pattern: $C.Images.Generate(...)
      - pattern: $C.Images.Edit(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $W http.ResponseWriter, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($RECV $T) $F(..., $W http.ResponseWriter, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $W http.ResponseWriter, ...) {
                    ...
                  }
          - pattern-either:
              - pattern: $W.Write(...)
              - pattern: fmt.Fprint($W, ...)
              - pattern: fmt.Fprintf($W, ...)
              - pattern: fmt.Fprintln($W, ...)
              - pattern: io.WriteString($W, ...)
              - pattern: json.NewEncoder($W).Encode(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  func $F(..., $W http.ResponseWriter, ...) {
                    ...
                  }
              - pattern-inside: |
                  func ($RECV $T) $F(..., $W http.ResponseWriter, ...) {
                    ...
                  }
              - pattern-inside: |
                  func(..., $W http.ResponseWriter, ...) {
                    ...
                  }
          - pattern: io.Copy($W, $SRC)
          - focus-metavariable: $SRC
      - patterns:
          - pattern-either:
              - pattern-either:
                  - pattern-inside: |
                      func $F(..., $C *gin.Context, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func ($RECV $T) $F(..., $C *gin.Context, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func(..., $C *gin.Context, ...) {
                        ...
                      }
              - pattern-either:
                  - pattern-inside: |
                      func $F(..., $C echo.Context, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func ($RECV $T) $F(..., $C echo.Context, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func(..., $C echo.Context, ...) {
                        ...
                      }
              - pattern-either:
                  - pattern-inside: |
                      func $F(..., $C *fiber.Ctx, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func ($RECV $T) $F(..., $C *fiber.Ctx, ...) {
                        ...
                      }
                  - pattern-inside: |
                      func(..., $C *fiber.Ctx, ...) {
                        ...
                      }
          - pattern-either:
              - pattern: $C.JSON(...)
              - pattern: $C.String(...)
              - pattern: $C.SendString(...)
              - pattern: $C.Data(...)
              - pattern: $C.Blob(...)
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
