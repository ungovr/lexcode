# The sink is a return in a function that also calls the image model, not every return in the file:
# that made the taint pass grow several times faster than the file, 15 to 25 s on a 900 KB file
# where a scan gives one rule 30 s per file (#13034). The flow this rule follows starts at a call in
# the same function, so the narrower sink keeps its matches. How the scope is written, and why, is
# in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.image.js-image-result-returned
    languages: [javascript, typescript]
    severity: INFO
    message: Returns a picture drawn by an image model from a function, which may be generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - pattern: $C.images.generate(...)
      - pattern: $C.images.edit(...)
      - pattern: $C.images.createVariation(...)
      - pattern: $C.models.generateImages(...)
      - patterns:
          - pattern: experimental_generateImage(...)
          - pattern-inside: |
              import { ..., experimental_generateImage, ... } from "ai";
              ...
      - patterns:
          - pattern: generateImage(...)
          - pattern-inside: |
              import { ..., experimental_generateImage as generateImage, ... } from "ai";
              ...
      - patterns:
          - pattern: generateImage(...)
          - pattern-inside: |
              import { ..., generateImage, ... } from "ai";
              ...
    pattern-sinks:
      - patterns:
          - pattern: return $X
          - pattern-either:
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... $SINKC.images.$SINKM(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function (...) {
                    ...
                    <... $SINKC.images.$SINKM(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... $SINKC.models.generateImages(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function (...) {
                    ...
                    <... $SINKC.models.generateImages(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... experimental_generateImage(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function (...) {
                    ...
                    <... experimental_generateImage(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function $SINKFN(...) {
                    ...
                    <... generateImage(...) ...>;
                    ...
                  }
              - pattern-inside: |
                  function (...) {
                    ...
                    <... generateImage(...) ...>;
                    ...
                  }
    pattern-sanitizers:
      - patterns:
          - pattern: $RES.$M(...)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|resp|response|reply|ctx|c|context)(\s*\.\s*(status|code|type|header|set|setHeader|contentType|append)\([^()]*\))*$
          - metavariable-regex:
              metavariable: $M
              regex: ^(json|send|end|write|text|html|jsonp)$
      - pattern: new Response(...)
      - pattern: new NextResponse(...)
      - pattern: Response.json(...)
      - pattern: NextResponse.json(...)
      - pattern: ctx.body = ...
      - patterns:
          - pattern: $WS.send(...)
          - metavariable-regex:
              metavariable: $WS
              regex: ^(ws|socket|webSocket|websocket|conn|connection)$
      - patterns:
          - pattern: $S.pipe($R)
          - metavariable-regex:
              metavariable: $R
              regex: ^(res|resp|response|reply)$
          - focus-metavariable: $S
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
      strength: signal
