rules:
  - id: lexcode.image.swift-image-reply-to-response
    languages: [swift]
    severity: INFO
    message: Shows a picture made by an image model on screen, or sends it back in an HTTP response or a socket, which is generating images with AI that reaches users (generates_images).
    # Sources: MacPaw OpenAI (images, imageEdits, imageVariations), SwiftOpenAI (createImages and the legacy
    # calls), Firebase AI Logic Imagen (generateImages), Apple Image Playground's ImageCreator
    # (images(for:style:limit:)) and Amazon Bedrock InvokeModel in a file that names an image model
    # (Nova Canvas, Titan Image Generator, Stability).
    # Sinks: a SwiftUI Image or AsyncImage, a UIKit image view or button, a view-model property whose name
    # says it holds a picture, and a Vapor or Hummingbird response or socket.
    # Swift shapes (Opengrep 1.33.1, probed for #13199): the engine does not carry taint through an
    # optional binding (`guard let x = ...`, `if let x = ...`), so a name bound from a model call, or from a
    # value that holds one, is a source of its own; a `for try await` loop variable, a `switch` or `if case`
    # `.success(let x)` binding and the first parameter of a vendor's completion closure are carried. An
    # `if let x = try ...` condition does not parse at all and is a known gap. A local `var` declared in the
    # same function is not a screen, so a state-name sink skips it.
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?ImagePlayground\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAILogic\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseVertexAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bFirebaseAI\.firebaseAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bVertexAI\.vertexAI\b).*'
              - pattern-either: &calls_vendors
                  - pattern: '$C.images(query: $Q)'
                  - pattern: '$C.imageEdits(query: $Q)'
                  - pattern: '$C.imageVariations(query: $Q)'
                  - pattern: '$S.createImages(parameters: $P)'
                  - pattern: '$S.legacyCreateImages(parameters: $P)'
                  - pattern: '$S.legacyEditImage(parameters: $P)'
                  - pattern: '$S.legacyCreateImageVariations(parameters: $P)'
                  - pattern: '$C.images(for: $P, style: $ST, limit: $LM)'
                  - pattern: '$M.generateImages(...)'
          - patterns:
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?AWSBedrockRuntime\b).*'
              - pattern-either:
                  - pattern-regex: '(?s)\A(?=.*"amazon\.nova-canvas).*'
                  - pattern-regex: '(?s)\A(?=.*"amazon\.titan-image-generator).*'
                  - pattern-regex: '(?s)\A(?=.*"stability\.).*'
              - pattern-either:
                  - pattern: '$C.invokeModel(input: $I)'
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?ImagePlayground\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAILogic\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseVertexAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bFirebaseAI\.firebaseAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bVertexAI\.vertexAI\b).*'
              - pattern-either:
                  - pattern: |
                      $C.images(query: $Q) { $R in
                        ...
                      }
                  - pattern: |
                      $C.images(query: $Q) { [weak self] $R in
                        ...
                      }
                  - pattern: |
                      $C.imageEdits(query: $Q) { $R in
                        ...
                      }
                  - pattern: |
                      $C.imageEdits(query: $Q) { [weak self] $R in
                        ...
                      }
                  - pattern: |
                      $C.imageVariations(query: $Q) { $R in
                        ...
                      }
                  - pattern: |
                      $C.imageVariations(query: $Q) { [weak self] $R in
                        ...
                      }
              - focus-metavariable: $R
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?ImagePlayground\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAILogic\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseVertexAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bFirebaseAI\.firebaseAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bVertexAI\.vertexAI\b).*'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          guard let $X = $E0 else { ... }
                          ...
                      - pattern-inside: |
                          guard let $X = $E0, ... else { ... }
                          ...
                  - metavariable-pattern:
                      metavariable: $E0
                      pattern-either: *calls_vendors
                  - pattern: $X
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?ImagePlayground\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseAILogic\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?FirebaseVertexAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bFirebaseAI\.firebaseAI\b).*'
                  - pattern-regex: '(?s)\A(?=.*\bVertexAI\.vertexAI\b).*'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          let $V = $E0
                          ...
                      - pattern-inside: |
                          var $V = $E0
                          ...
                  - metavariable-pattern:
                      metavariable: $E0
                      pattern-either: *calls_vendors
                  - pattern-either:
                      - pattern-inside: |
                          guard let $X = $E1 else { ... }
                          ...
                      - pattern-inside: |
                          guard let $X = $E1, ... else { ... }
                          ...
                      - pattern-inside: |
                          if let $X = $E1 {
                            ...
                          }
                      - pattern-inside: |
                          if let $X = $E1, ... {
                            ...
                          }
                  - metavariable-pattern:
                      metavariable: $E1
                      pattern: $V
                  - pattern: $X
    pattern-propagators:
      - patterns:
          - pattern-inside: |
              for try await $X in $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              for await $X in $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              switch $S {
              case .success(let $X):
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              if case .success(let $X) = $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              guard case .success(let $X) = $S else { ... }
              ...
          - pattern: $X
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - patterns:
              - pattern-either:
                  - pattern: $S = $X
                  - pattern: $S += $X
                  - pattern: $S.append($X)
                  - pattern: '$S.append(contentsOf: $X)'
              - metavariable-regex:
                  metavariable: $S
                  regex: (?i)^(self[?!]?\.)?_?\w*(image|photo|picture|artwork|avatar|illustration|drawing|sticker|images|photos|pictures)\w*$
          - pattern-not-inside: let $S = $E
          - pattern-not-inside: |
              func $F(...) {
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              func $F(...) {
                ...
                var $S: $U = $E
                ...
              }
          - focus-metavariable: $X
      - pattern: $V.image = $X
      - pattern: '$V.setImage($X, for: $ST)'
      - pattern: 'Image(uiImage: $X)'
      - pattern: 'Image(nsImage: $X)'
      - pattern: 'Image(decorative: $X, ...)'
      - pattern: 'Image($X, scale: $SC, ...)'
      - pattern: 'AsyncImage(url: $X, ...)'
      - pattern: 'UIImageView(image: $X)'
      - patterns:
          - pattern-either:
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Vapor\b).*'
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Hummingbird\b).*'
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          $APP.$M(...) { $REQ in
                            ...
                            return $X
                          }
                      - pattern: |
                          $APP.$M(...) { $REQ, $CTX in
                            ...
                            return $X
                          }
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|patch|delete|on)$
              - pattern: |
                  func $F(..., $REQ: Request, ...) -> $T {
                    ...
                    return $X
                  }
              - pattern: |
                  func $F(..., $REQ: HBRequest, ...) -> $T {
                    ...
                    return $X
                  }
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Vapor\b).*'
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Hummingbird\b).*'
          - pattern-either:
              - pattern: 'Response(..., body: $X, ...)'
              - pattern: 'HBResponse(..., body: $X, ...)'
              - pattern: $REQ.eventLoop.makeSucceededFuture($X)
      - patterns:
          - pattern-either:
              - pattern: $WS.send($X, ...)
          - metavariable-regex:
              metavariable: $WS
              regex: (?i)^(self[?!]?\.)?_?\w*(ws|websocket|socket)$
      - pattern: 'APIGatewayV2Response(..., body: $X, ...)'
      - pattern: 'APIGatewayResponse(..., body: $X, ...)'
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
