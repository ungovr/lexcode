rules:
  - id: lexcode.image.py-image-result-returned
    languages: [python]
    severity: INFO
    message: Returns a picture drawn by an image model from a function, which may be generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - pattern: $C.images.generate(...)
      - pattern: $C.images.edit(...)
      - pattern: $C.images.create_variation(...)
      - pattern: $C.models.generate_images(...)
      - pattern: openai.Image.create(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: return $X
              - pattern: yield $X
          - pattern-not-inside: |
              @$A.$M(...)
              def $F(...):
                ...
          - pattern-not-inside: |
              @$A.$M(...)
              async def $F(...):
                ...
          - focus-metavariable: $X
    pattern-sanitizers:
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(\w+\.)*(jsonify|JSONResponse|ORJSONResponse|UJSONResponse|HTMLResponse|PlainTextResponse|StreamingResponse|EventSourceResponse|Response|make_response|HttpResponse|JsonResponse|StreamingHttpResponse|render_template|send_file)$
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
      strength: signal
