# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 48 to 56 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return or a yield in a method whose body makes one of the calls below. Not
# followed: a result one method stores at run time and another returns, and a call in a default
# parameter. The calls are the sources without their argument and name checks. How the scope is
# written, and why, is in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.image.rb-image-result-returned
    languages: [ruby]
    severity: INFO
    message: Returns a picture drawn by an image model from a method, which may be generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - pattern: $C.images.generate(...)
      - pattern: $C.images.edit(...)
      - pattern: $C.images.variations(...)
      - pattern: $C.images.create_variation(...)
      - pattern: RubyLLM.paint(...)
    pattern-propagators:
      - pattern: $OUT = <... $R.dig(...) ...>
        from: $R
        to: $OUT
      - pattern: |
          $S.each do |$X|
            ...
          end
        from: $S
        to: $X
      - pattern: '$S.each { |$X| ... }'
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - pattern: yield $X
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: &sinkcalls
                        - pattern: $SINKC.images.$SINKM(...)
                        - pattern: RubyLLM.paint(...)
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      def $SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
              - patterns:
                  - pattern-inside: |
                      def self.$SINKFN(...)
                        $...SINKBODY
                      end
                  - metavariable-pattern:
                      metavariable: $...SINKBODY
                      pattern-either: *sinkcalls
          - pattern-either:
              - pattern: return $V
              - pattern: return $V.$M(...)
              - pattern: return $V.$M(...).$N
              - pattern: return $V.$M(...).$N(...)
              - pattern: return $V[...]
              - pattern: 'return { ..., $K: $V, ... }'
              - pattern: 'return { ..., $K: $V.$M(...), ... }'
          - metavariable-regex:
              metavariable: $V
              regex: ^@?[a-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*[?!]?)*$
          - focus-metavariable: $V
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
      strength: signal
