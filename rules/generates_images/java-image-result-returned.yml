# The sink is not every return in the file: every return made the taint pass grow several times
# faster than the file, 10 to 14 s on a 900 KB file where a scan gives one rule 30 s per file
# (#13034). It is a return in a method or block lambda that also makes one of the calls below (in a
# statement, a for-each header or an if header), or a return that names a field the class sets from
# one of them. Not followed: a result one method stores at run time and another returns, a field
# derived from such a field, a call in a while header or a for initializer, and a return in a lambda
# nested in a streaming callback. The calls are the sources without their argument and name checks.
# How the scope is written, and why, is in CONTRIBUTING.md, Cost.
rules:
  - id: lexcode.image.java-image-result-returned
    languages: [java]
    severity: INFO
    message: Returns a picture drawn by an image model from a method, which may be generating images with AI that reach users (generates_images).
    mode: taint
    pattern-sources:
      - pattern: $C.images().generate(...)
      - pattern: $C.images().edit(...)
      - pattern: $C.images().createVariation(...)
      - pattern: $C.models.generateImages(...)
      - pattern: $C.models.editImage(...)
      - pattern: $C.models.upscaleImage(...)
      - patterns:
          - pattern-either:
              - pattern: $C.invokeModel(InvokeModelRequest.builder(). ... .modelId($ID). ... .build())
              - pattern: $C.invokeModelWithResponseStream(InvokeModelWithResponseStreamRequest.builder(). ... .modelId($ID). ... .build())
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(titan-image|nova-canvas|stability|stable-diffusion|stable-image|sd3)[^"]*"$
      - patterns:
          - pattern: ($T $M).$F(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^([\w.]+\.)?(\w*ImageModel|OpenAIClient|OpenAIAsyncClient)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(generate|edit|call|getImageGenerations|getImageGenerationsWithResponse)$
      - pattern: $M.call(new ImagePrompt(...))
      - pattern: $M.call((ImagePrompt $P))
    pattern-propagators:
      - pattern: $S.forEach($X -> ...)
        from: $S
        to: $X
      - pattern: $S.forEachOrdered($X -> ...)
        from: $S
        to: $X
      - pattern: $S.subscribe($X -> ...)
        from: $S
        to: $X
      - pattern: $S.map($X -> ...)
        from: $S
        to: $X
      - pattern: $S.flatMap($X -> ...)
        from: $S
        to: $X
      - pattern: $S.doOnNext($X -> ...)
        from: $S
        to: $X
      - pattern: $S.ifPresent($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenApply($X -> ...)
        from: $S
        to: $X
      - pattern: $S.thenAccept($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onPartialResponse($X -> ...)
        from: $S
        to: $X
      - pattern: $S.onNext($X -> ...)
        from: $S
        to: $X
