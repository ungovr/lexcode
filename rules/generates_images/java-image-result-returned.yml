                    ...
                    $SINKC.images().$SINKM(...);
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    for ($SINKT $SINKE : <... $SINKC.images().$SINKM(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
                  $SINKRET $SINKFN(...) {
                    ...
                    if (<... $SINKC.images().$SINKM(...) ...>) $SINKS;
                    ...
                  }
              - pattern-inside: |
