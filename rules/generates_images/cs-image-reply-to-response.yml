rules:
  - id: lexcode.image.cs-image-reply-to-response
    languages: [csharp]
    severity: INFO
    message: Sends a picture an image model made back in an HTTP response, a page or a hub message, which is generating images with AI that reaches users (generates_images).
    mode: taint
    # A library type is written fully qualified: the engine resolves a file's using lines (an
    # alias too), so the pattern also matches the short form under using, and never an app's own
    # class of the same short name. A type reached only through a global using in another file
    # is missed (rules/README.md).
    # Only a call that generates is a source here: a typed client calling its generating method,
    # or the call that sends a request built for a named generation model. A client or request
    # object is not output, and a client obtained from a factory or the service container into a
    # local is the companion signal rule's (the engine cannot type it).
    pattern-sources:
      # The OpenAI .NET SDK: an ImageClient. Generations, edits and variations are all
      # model-made pictures.
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImage(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageAsync(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImages(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImagesAsync(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageEdit(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageEditAsync(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageEdits(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageEditsAsync(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageVariation(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageVariationAsync(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageVariations(...)
      - pattern: (OpenAI.Images.ImageClient $C).GenerateImageVariationsAsync(...)
      # Microsoft.Extensions.AI: an IImageGenerator.
      - pattern: (Microsoft.Extensions.AI.IImageGenerator $C).GenerateAsync(...)
      - pattern: (Microsoft.Extensions.AI.IImageGenerator $C).GenerateImagesAsync(...)
      - pattern: (Microsoft.Extensions.AI.IImageGenerator $C).EditImageAsync(...)
      - pattern: (Microsoft.Extensions.AI.IImageGenerator $C).EditImagesAsync(...)
      # Semantic Kernel: a text-to-image service.
      - pattern: (Microsoft.SemanticKernel.TextToImage.ITextToImageService $C).GenerateImageAsync(...)
      - pattern: (Microsoft.SemanticKernel.TextToImage.ITextToImageService $C).GetImageContentsAsync(...)
      # The Google Gen AI SDK: Imagen.
      - pattern: (Google.GenAI.Client $C).Models.GenerateImagesAsync(...)
      - pattern: (Google.GenAI.Client $C).Models.EditImageAsync(...)
      # AWS Bedrock Runtime: an image model invoked by id.
      # A request object only names the model: it carries the label REQUEST, which no
      # sink accepts, and the source is the result of the call it is sent with. Echoing the
      # request, or the model id it names, generates nothing.
      - label: REQUEST
        patterns:
          - pattern: new Amazon.BedrockRuntime.Model.InvokeModelRequest { ..., ModelId = $ID, ... }
          - metavariable-regex:
              metavariable: $ID
              regex: (?i)^"[^"]*(titan-image|nova-canvas|stability\.|stable-diffusion|stable-image|sd3)[^"]*"$
      - requires: REQUEST
        patterns:
          - pattern: $CLIENT.$SEND(...)
          - metavariable-regex:
              metavariable: $SEND
              regex: ^InvokeModel(Async)?$
    pattern-propagators:
      # Output written to a file carries on in the path, which a file result then hands to the
      # person. System.IO is imported implicitly, so the short form is read as well.
      - pattern: System.IO.File.WriteAllBytes($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllBytes($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllBytesAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllBytesAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllText($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllText($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: System.IO.File.WriteAllTextAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      - pattern: File.WriteAllTextAsync($PATH, $V, ...)
        from: $V
        to: $PATH
        by-side-effect: true
      # A stream copied into another carries on in the copy.
      - pattern: $SRC.CopyToAsync($DEST, ...)
        from: $SRC
        to: $DEST
        by-side-effect: true
      # Output gathered into a builder or a list is sent on with it.
      - pattern: $SB.Append($V)
        from: $V
        to: $SB
        by-side-effect: true
      - pattern: $L.Add($V)
        from: $V
        to: $L
        by-side-effect: true
      - pattern: $L.AddRange($V)
        from: $V
        to: $L
        by-side-effect: true
    pattern-sinks:
      # ASP.NET Core MVC and Web API: a public action of a controller or a view component is the
      # response, whether it returns, streams with yield return, or is written as an expression
      # body. A controller is a class named like one (the framework's own convention, any base),
      # or one marked [ApiController] or [Controller], whatever its name and base. The attribute
      # is read qualified (which also matches it under a using or an alias) and short (a file
      # whose Microsoft.AspNetCore.Mvc using is a global one elsewhere). A private helper's value
      # is not the response.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      class $CTRL : $BASE { ... }
                  - metavariable-regex:
                      metavariable: $CTRL
                      regex: ^\w*(Controller|ViewComponent)$
              - pattern-inside: |
                  [Microsoft.AspNetCore.Mvc.ApiController]
                  class $CTRL { ... }
              - pattern-inside: |
                  [ApiController]
                  class $CTRL { ... }
              - pattern-inside: |
                  [Microsoft.AspNetCore.Mvc.Controller]
                  class $CTRL { ... }
              - pattern-inside: |
                  [Controller]
                  class $CTRL { ... }
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      public $R $ACTION(...) { ... }
                  - pattern-either:
                      - pattern: return $X;
                      - pattern: yield return $X;
              - patterns:
                  - pattern: public $R $ACTION(...) => $X;
                  # The expression-body pattern also binds a block body; only an expression counts.
                  - metavariable-regex:
                      metavariable: $X
                      regex: ^[^{]
                  # It binds a one-statement block too ({ Log(x); } as => Log(x)), so the action
                  # must return a value.
                  - metavariable-regex:
                      metavariable: $R
                      regex: ^(?!(void|Task|ValueTask)$)
          - focus-metavariable: $X
      # Minimal APIs: a route handler's value is the response.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: $APP.$MAP($ROUTE, ...)
                  - pattern: return $X;
              # The engine binds only an expression lambda here, never a block one, which the
              # return branch above reads.
              - pattern: $APP.$MAP($ROUTE, (...) => $X)
          - metavariable-regex:
              metavariable: $MAP
              regex: ^Map(Get|Post|Put|Patch|Delete|Methods)?$
          - focus-metavariable: $X
      # The Results and TypedResults helpers build a response anywhere (Microsoft.AspNetCore.Http
      # is imported implicitly in a web project, so the short form is read as well).
      - patterns:
          - pattern-either:
              - pattern: Microsoft.AspNetCore.Http.Results.$RM(...)
              - pattern: Microsoft.AspNetCore.Http.TypedResults.$RM(...)
              - pattern: Results.$RM(...)
              - pattern: TypedResults.$RM(...)
          - metavariable-regex:
              metavariable: $RM
              regex: ^(Ok|Text|Content|Json|File|Stream|Bytes|Created|Accepted|ServerSentEvents)$
      # Writing the response body directly, from a controller, middleware or a handler.
      - patterns:
          - pattern-either:
              - pattern: $CTX.Response.$W(...)
              - pattern: Response.$W(...)
              - pattern: (Microsoft.AspNetCore.Http.HttpResponse $RESP).$W(...)
              - pattern: (HttpResponse $RESP).$W(...)
              - pattern: $CTX.Response.Body.$W(...)
              - pattern: Response.Body.$W(...)
          - metavariable-regex:
              metavariable: $W
              regex: ^(WriteAsync|WriteAsJsonAsync|SendFileAsync)$
      - patterns:
          - pattern-either:
              - pattern: $SRC.CopyToAsync($CTX.Response.Body, ...)
              - pattern: $SRC.CopyToAsync(Response.Body, ...)
          - focus-metavariable: $SRC
      # MVC view data is rendered by the view.
      - patterns:
          - pattern-either:
              - pattern: ViewBag.$P = $X
              - pattern: ViewData[$K] = $X
              - pattern: TempData[$K] = $X
          - focus-metavariable: $X
      # Razor Pages: a page model's property is rendered by its page. A local is not a property.
      - patterns:
          - pattern-inside: |
              class $PAGE : Microsoft.AspNetCore.Mvc.RazorPages.PageModel { ... }
          - pattern: $P = $X
          - metavariable-regex:
              metavariable: $P
              regex: ^(this\.)?[A-Z]
          - focus-metavariable: $X
      # Blazor: a component's state is rendered by its markup. __RazorCode is the class lexcode
      # writes for the @code blocks of a .razor file (its C# copy).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.ComponentBase { ... }
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.OwningComponentBase { ... }
              - pattern-inside: |
                  class $COMP : Microsoft.AspNetCore.Components.LayoutComponentBase { ... }
              - pattern-inside: |
                  class __RazorCode { ... }
          - pattern-either:
              - pattern: $F = $X
              - pattern: $F.Add($X)
          - focus-metavariable: $X
      # SignalR: a message to connected clients, from a hub (its base may be the app's own) or
      # through a hub context.
      - pattern: Clients.$WHO.SendAsync(...)
      - pattern: Clients.$WHO(...).SendAsync(...)
      - pattern: $HUB.Clients.$WHO.SendAsync(...)
      - pattern: $HUB.Clients.$WHO(...).SendAsync(...)
      # A hub's own methods: a strongly typed client call, or the value a hub method returns or
      # streams to its caller.
      - patterns:
          # Written without its type argument, the base also matches a strongly typed Hub<T>;
          # written with one, it matches nothing.
          - pattern-inside: |
              class $HUBC : Microsoft.AspNetCore.SignalR.Hub { ... }
          - pattern-either:
              - pattern: Clients.$WHO.$CM(...)
              - pattern: Clients.$WHO(...).$CM(...)
              - patterns:
                  - pattern-inside: |
                      public $R $HM(...) { ... }
                  - pattern-either:
                      - pattern: return $X;
                      - pattern: yield return $X;
                  - focus-metavariable: $X
      # .NET MAUI: a control's text on the screen of the person using the app.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  class $SCREEN : Microsoft.Maui.Controls.ContentPage { ... }
              - pattern-inside: |
                  class $SCREEN : ContentPage { ... }
          - pattern: $V.Text = $X
          - focus-metavariable: $X
    metadata:
      activity: generates_images
      mentioned: performs
      definition: https://lexlint.io/activities/generates-images
      provenance: ungovr-original
      license: MIT
