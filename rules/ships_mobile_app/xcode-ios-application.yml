rules:
  - id: lexcode.mobile.xcode-ios-application
    languages: [generic]
    severity: INFO
    message: Declares an application target in an Xcode project built for iPhone and iPad, an iOS app installed from Apple's App Store or directly (ships_mobile_app).
    # One match per application target (`productType = "com.apple.product-type.application";`). A target's
    # build settings sit in other objects of the file (its configuration list, and the project's own
    # configurations it inherits from), so the platform is read from the whole file: a setting line
    # `SDKROOT = iphoneos;`, or a multiplatform target's `SUPPORTED_PLATFORMS` that lists iphoneos. A
    # framework, an app extension, a watch app (`...application.watchapp2`), a test bundle and a Mac-only
    # project are left out. A project holding a Mac app and a separate iOS-only framework target would be
    # matched; the file does not say which target the setting belongs to without following object ids.
    # Beside lexcode.mobile.ios-info-plist, which reads a hand-written Info.plist; a project that
    # generates its Info.plist has only this file.
    #
    # The platform term is a range from the top of the file to the last such setting line, not a
    # whole-file lookahead: Xcode writes a project's sections in name order, so every PBXNativeTarget
    # (its productType) comes before the XCBuildConfiguration section that holds the settings, and the
    # range covers each target. The greedy `.*` searches from the end of the file, where the settings
    # are; only the small XCConfigurationList and package sections follow them, so the engine's
    # backtracking limit (about 1 MB) is not reached (Wikipedia's 1.3 MB project has its last setting
    # 43 KB from the end). A `\A(?=` lookahead in a generic rule would make every file over 1 MB in a
    # repository count in the large-file notice, since a generic rule reads every extension.
    patterns:
      - pattern-either:
          - pattern-regex: '(?s)\A.*\n[ \t]*+SDKROOT[ \t]*+=[ \t]*+iphoneos[\d.]*+;'
          - pattern-regex: '(?s)\A.*\n[ \t]*+SUPPORTED_PLATFORMS[ \t]*+=[ \t]*+"?(?:[\w.]++[ \t]++)*iphoneos\b'
      - pattern-regex: 'productType[ \t]*+=[ \t]*+"com\.apple\.product-type\.application";'
    paths:
      include:
        - "project.pbxproj"
        - "xcode-ios-application.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/Tests/**"
        - "**/UITests/**"
    metadata:
      activity: ships_mobile_app
      mentioned: performs
      definition: https://lexlint.io/activities/ships-mobile-app
      provenance: ungovr-original
      license: MIT
