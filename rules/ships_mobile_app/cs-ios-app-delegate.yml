rules:
  - id: lexcode.mobile.cs-ios-app-delegate
    languages: [csharp]
    severity: INFO
    message: Declares the application delegate of a .NET MAUI, .NET for iOS or Xamarin.Forms iOS app, the class an installable iPhone or iPad app starts from, which is shipping a mobile app (ships_mobile_app).
    pattern-either:
      # MAUI's iOS head. The template reaches MauiUIApplicationDelegate through the MAUI SDK's
      # implicit global usings, so its product-named short form is matched too.
      - pattern: |
          class $C : Microsoft.Maui.MauiUIApplicationDelegate { ... }
      - pattern: |
          class $C : MauiUIApplicationDelegate { ... }
      # A .NET for iOS app with no MAUI, and a Xamarin.Forms iOS head.
      - pattern: |
          class $C : UIKit.UIApplicationDelegate { ... }
      - pattern: |
          class $C : Xamarin.Forms.Platform.iOS.FormsApplicationDelegate { ... }
    # The same delegates serve a MAUI app's Mac Catalyst head, which is a desktop build.
    paths:
      exclude:
        - "**/MacCatalyst/**"
    metadata:
      activity: ships_mobile_app
      mentioned: performs
      definition: https://lexlint.io/activities/ships-mobile-app
      provenance: ungovr-original
      license: MIT
