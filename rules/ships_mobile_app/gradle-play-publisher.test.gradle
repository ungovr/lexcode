// lexcode-expect: 2
// An Android app module that uploads its release to Google Play with the Gradle Play Publisher
// plugin: the plugin id in the plugins block and the plugin's classpath entry.
plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '3.10.1'
}

buildscript {
    dependencies {
        classpath 'com.github.triplet.gradle:play-publisher:3.10.1'
    }
}

play {
    track.set('internal')
    defaultToAppBundles.set(true)
}
