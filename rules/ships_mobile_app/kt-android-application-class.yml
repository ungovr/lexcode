rules:
  - id: lexcode.mobile.kt-android-application-class
    languages: [kotlin]
    severity: INFO
    message: Declares the Application subclass of an Android app (a plain, MultiDex or Dagger Android application), the class an installable app names in its manifest, which is shipping a mobile app (ships_mobile_app).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: 'class $C : Application()'
              - pattern: |
                  class $C : Application() {
                    ...
                  }
              - pattern: 'class $C(...) : Application()'
              - pattern: |
                  class $C(...) : Application() {
                    ...
                  }
              - pattern: 'class $C : Application(), $I'
              - pattern: |
                  class $C : Application(), $I {
                    ...
                  }
              - pattern: 'class $C(...) : Application(), $I'
              - pattern: |
                  class $C(...) : Application(), $I {
                    ...
                  }
              - pattern: 'class $C : Application(), $I, $J'
              - pattern: |
                  class $C : Application(), $I, $J {
                    ...
                  }
              - pattern: 'class $C(...) : Application(), $I, $J'
              - pattern: |
                  class $C(...) : Application(), $I, $J {
                    ...
                  }
          - pattern-either:
              - pattern-inside: |
                  import android.app.Application
                  ...
              - pattern-inside: |
                  import android.app.*
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'class $C : MultiDexApplication()'
              - pattern: |
                  class $C : MultiDexApplication() {
                    ...
                  }
              - pattern: 'class $C(...) : MultiDexApplication()'
              - pattern: |
                  class $C(...) : MultiDexApplication() {
                    ...
                  }
              - pattern: 'class $C : MultiDexApplication(), $I'
              - pattern: |
                  class $C : MultiDexApplication(), $I {
                    ...
                  }
              - pattern: 'class $C(...) : MultiDexApplication(), $I'
              - pattern: |
                  class $C(...) : MultiDexApplication(), $I {
                    ...
                  }
              - pattern: 'class $C : MultiDexApplication(), $I, $J'
              - pattern: |
                  class $C : MultiDexApplication(), $I, $J {
                    ...
                  }
              - pattern: 'class $C(...) : MultiDexApplication(), $I, $J'
              - pattern: |
                  class $C(...) : MultiDexApplication(), $I, $J {
                    ...
                  }
          - pattern-either:
              - pattern-inside: |
                  import androidx.multidex.MultiDexApplication
                  ...
              - pattern-inside: |
                  import android.support.multidex.MultiDexApplication
                  ...
              - pattern-inside: |
                  import androidx.multidex.*
                  ...
      - patterns:
          - pattern-either:
              - pattern: 'class $C : DaggerApplication()'
              - pattern: |
                  class $C : DaggerApplication() {
                    ...
                  }
              - pattern: 'class $C(...) : DaggerApplication()'
              - pattern: |
                  class $C(...) : DaggerApplication() {
                    ...
                  }
              - pattern: 'class $C : DaggerApplication(), $I'
              - pattern: |
                  class $C : DaggerApplication(), $I {
                    ...
                  }
              - pattern: 'class $C(...) : DaggerApplication(), $I'
              - pattern: |
                  class $C(...) : DaggerApplication(), $I {
                    ...
                  }
              - pattern: 'class $C : DaggerApplication(), $I, $J'
              - pattern: |
                  class $C : DaggerApplication(), $I, $J {
                    ...
                  }
              - pattern: 'class $C(...) : DaggerApplication(), $I, $J'
              - pattern: |
                  class $C(...) : DaggerApplication(), $I, $J {
                    ...
                  }
          - pattern-either:
              - pattern-inside: |
                  import dagger.android.DaggerApplication
                  ...
              - pattern-inside: |
                  import dagger.android.*
                  ...
      - pattern-either:
          - pattern: 'class $C : android.app.Application()'
          - pattern: |
              class $C : android.app.Application() {
                ...
              }
          - pattern: 'class $C(...) : android.app.Application()'
          - pattern: |
              class $C(...) : android.app.Application() {
                ...
              }
          - pattern: 'class $C : android.app.Application(), $I'
          - pattern: |
              class $C : android.app.Application(), $I {
                ...
              }
          - pattern: 'class $C(...) : android.app.Application(), $I'
          - pattern: |
              class $C(...) : android.app.Application(), $I {
                ...
              }
          - pattern: 'class $C : android.app.Application(), $I, $J'
          - pattern: |
              class $C : android.app.Application(), $I, $J {
                ...
              }
          - pattern: 'class $C(...) : android.app.Application(), $I, $J'
          - pattern: |
              class $C(...) : android.app.Application(), $I, $J {
                ...
              }
    paths:
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/src/test/**"
        - "**/src/androidTest/**"
        - "**/src/sharedTest/**"
    metadata:
      activity: ships_mobile_app
      mentioned: performs
      definition: https://lexlint.io/activities/ships-mobile-app
      provenance: ungovr-original
      license: MIT
