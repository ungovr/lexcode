rules:
  - id: lexcode.social.home-feed-py
    languages: [python]
    severity: INFO
    message: Selects posts written by the accounts a user follows or befriends, which builds a feed of other users' posts for a social platform (operates_social_platform).
    pattern-either:
      - pattern-regex: '\.objects\.filter\([^)]{0,200}\b(author|user|owner|creator|poster|profile)(_id)?__in\s*=\s*[^,)]{0,80}(follow|friend)'
      - pattern-regex: '\.(author|user|owner|creator|poster)_id\.in_\([^)]{0,80}(follow|friend)'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
