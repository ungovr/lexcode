# Each name check sits in the block that binds its name (CONTRIBUTING.md, Cost): the engine joins the
# terms of one level before it checks names there, and every property joined with every class costs
# time quadratic in the file: 10 to 34 s on a 900 KB file, where a scan gives one rule 30 s per file,
# so a slower machine lost the file's matches (#13009).
rules:
  - id: lexcode.social.java-direct-message
    languages: [java]
    severity: INFO
    message: Stores or sends a message addressed from one user account to another (a direct or private message entity with a sender and a recipient, or a WebSocket send to one named user), which is how people talk on a social platform (operates_social_platform).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*DirectMessage\b).*'
              - pattern-regex: '(?s)\A(?=.*PrivateMessage\b).*'
              - pattern-regex: '(?s)\A(?=.*ChatMessage\b).*'
              - pattern-regex: '(?s)\A(?=.*UserMessage\b).*'
              - pattern-regex: '(?s)\A(?=.*InboxMessage\b).*'
              - pattern-regex: '(?s)\A(?=.*Dm\b).*'
              - pattern-regex: '(?s)\A(?=.*DM\b).*'
          - patterns:
              - pattern-either:
                  - pattern: $T $F;
                  - pattern: $T $F = $V;
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(recipient|receiver|toUser|recipientId|receiverId|toUserId)$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      class $C { ... $T2 $G; ... }
                  - pattern-inside: |
                      class $C { ... $T2 $G = $W; ... }
              - metavariable-regex:
                  metavariable: $C
                  regex: '^(?!.*(Email|Mail|Sms|Notification|Log|Event|Contact|Audit|Queue|Jms|Kafka)).*(DirectMessage|PrivateMessage|ChatMessage|UserMessage|InboxMessage|Dm|DM)$'
              - metavariable-regex:
                  metavariable: $G
                  regex: '^(sender|fromUser|senderId|fromUserId|author|authorId)$'
          - pattern-not-inside: |
              $RET $M(...) { ... }
      - patterns:
          - pattern: $T.convertAndSendToUser($U, $D, ...)
          - metavariable-regex:
              metavariable: $D
              regex: '(?i)^"([^"]*(message|chat|private|direct)[^"]*|([^"]*[/._-])?dms?([/._-][^"]*)?)"$'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
