# The follower and followed regular expressions repeat between the member arms and the query arm.
# Edit every copy together, or an arm drifts from the others. A C# member is a field or a property
# with any of the accessor shapes below; each member pattern is filtered by its own names before
# the two are joined, so a large class is not paired member by member.
rules:
  - id: lexcode.social.cs-follow-relation
    languages: [csharp]
    severity: INFO
    message: Defines a follow or friendship relation between user accounts (a follower and followed pair, an account's followers and following, a friendship or follow entity, or a query keyed on the follower), which is how people connect on a social platform (operates_social_platform).
    pattern-either:
      # A class holding a follower and the account it follows, or an account's followers and
      # following collections.
      - patterns:
          - patterns:
              - pattern-either:
                  - pattern: class $C { ... $T $F; ... }
                  - pattern: class $C { ... $T $F = $V; ... }
                  - pattern: class $C { ... $T $F { get; set; } ... }
                  - pattern: class $C { ... $T $F { get; init; } ... }
                  - pattern: class $C { ... $T $F { get; } ... }
                  - pattern: class $C { ... $T $F { get; set; } = $V; ... }
                  - pattern: class $C { ... $T $F { get; init; } = $V; ... }
                  - pattern: record $C(..., $T $F, ...);
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?i)^_?(followed|followee|followees|following|followings)(User|Users|Account|Accounts|Member|Members|Profile|Profiles)?(Id|Ids)?$'
          - patterns:
              - pattern-either:
                  - pattern: class $C { ... $T2 $G; ... }
                  - pattern: class $C { ... $T2 $G = $W; ... }
                  - pattern: class $C { ... $T2 $G { get; set; } ... }
                  - pattern: class $C { ... $T2 $G { get; init; } ... }
                  - pattern: class $C { ... $T2 $G { get; } ... }
                  - pattern: class $C { ... $T2 $G { get; set; } = $W; ... }
                  - pattern: class $C { ... $T2 $G { get; init; } = $W; ... }
                  - pattern: record $C(..., $T2 $G, ...);
              - metavariable-regex:
                  metavariable: $G
                  regex: '(?i)^_?followers?(User|Account|Member|Profile)?(Id)?$'
          - focus-metavariable: $F
      # A class or record that is the friendship or the follow itself.
      - patterns:
          - pattern-either:
              - pattern: class $C { ... }
              - pattern: record $C(...);
          - metavariable-regex:
              metavariable: $C
              regex: '^(Friendship|FriendRequest|FriendConnection|UserFriend|Follow|UserFollow|Follower|Followership)$'
      # A LINQ or EF Core query keyed on the follower (f => f.FollowerId == id).
      - pattern-regex: '\b(\w+)\s*=>\s*\1\.[Ff]ollower(User|Account|Member|Profile)?(Id)?\s*(==|\.Equals\()'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
