# The follow and friend expression (with its follow-up exclusion) repeats in every arm. Edit every
# copy together, or an arm drifts from the others.
rules:
  - id: lexcode.social.php-home-feed
    languages: [php]
    severity: INFO
    message: Selects posts written by the accounts a user follows or befriends (an Eloquent or Doctrine query, or SQL or DQL text, keyed on followed or friend accounts), which builds a feed of other users' posts for a social platform (operates_social_platform).
    pattern-either:
      # whereIn('user_id', $user->following()->pluck('id')) in Eloquent, and
      # $qb->expr()->in('p.author', ':following') in Doctrine's query builder. The pre-filters keep
      # the engine to files that name both the method and a follow or friend word ("the following"
      # in a comment is in thousands of a large app's files).
      - patterns:
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*whereIn).*'
              - pattern-regex: '(?s)\A(?=.*->in\().*'
          - pattern-either:
              - pattern-regex: '(?is)\A(?=.*follow).*'
              - pattern-regex: '(?is)\A(?=.*friend).*'
          - pattern-either:
              - pattern: $Q->whereIn($K, $V)
              - pattern: $Q->orWhereIn($K, $V)
              - pattern: $Q->in($K, $V)
              - pattern: $CL::whereIn($K, $V)
          - metavariable-regex:
              metavariable: $K
              regex: '^[''"](\w+\.)?(author|user|owner|creator|poster)(_?[Ii]d)?[''"]$'
          - metavariable-regex:
              metavariable: $V
              regex: '(?is).*(follow(?!_?ups?(\b|_|[A-Z]))|friend)'
      # SQL or DQL text: an author IN (... followed or friend accounts ...) condition, or posts
      # joined to the follow or friendship table.
      - pattern-regex: '(?i)[''"][^''"\n]{0,300}\b(author|user|owner|creator|poster)\w*(\.id|_id)?\s+in\s*\([^''"\n]{0,300}\b(follow(?!_?ups?(\b|_|[A-Z]))|friend)'
      - pattern-regex: '(?is)[''"][^''"]{0,300}\bfrom\s+\{?\w*(post|status|tweet)\w*\}?[^''"]{0,300}\bjoin\s+\{?\w*(follow(?!_?ups?(\b|_|[A-Z]))|friend)'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
