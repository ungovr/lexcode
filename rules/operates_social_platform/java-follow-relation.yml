# Each name check sits in the block that binds its name (CONTRIBUTING.md, Cost): the engine joins the
# terms of one level before it checks names there, and every property joined with every class costs
# time quadratic in the file: 10 to 34 s on a 900 KB file, where a scan gives one rule 30 s per file,
# so a slower machine lost the file's matches (#13009).
rules:
  - id: lexcode.social.java-follow-relation
    languages: [java]
    severity: INFO
    message: Defines a follow or friendship relation between user accounts (a follower and followed pair, a friendship entity, or a finder keyed on the follower), which is how people connect on a social platform (operates_social_platform).
    pattern-either:
      - patterns:
          - pattern-regex: '(?s)\A(?=.*\bfollower).*'
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*followed).*'
              - pattern-regex: '(?s)\A(?=.*followee).*'
              - pattern-regex: '(?s)\A(?=.*following).*'
          - patterns:
              - pattern-either:
                  - pattern: $T $F;
                  - pattern: $T $F = $V;
              - metavariable-regex:
                  metavariable: $F
                  regex: '^(followed|followee|following)(User|Account|Member|Profile)?(Id)?$'
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      class $C { ... $T2 $G; ... }
                  - pattern-inside: |
                      class $C { ... $T2 $G = $W; ... }
              - metavariable-regex:
                  metavariable: $G
                  regex: '^follower(User|Account|Member|Profile)?(Id)?$'
          - pattern-not-inside: |
              $RET $M(...) { ... }
      - patterns:
          - pattern-either:
              - pattern-regex: '(?s)\A(?=.*Friendship\b).*'
              - pattern-regex: '(?s)\A(?=.*FriendRequest\b).*'
              - pattern-regex: '(?s)\A(?=.*FriendConnection\b).*'
              - pattern-regex: '(?s)\A(?=.*UserFriend\b).*'
          - pattern: class $C { ... }
          - metavariable-regex:
              metavariable: $C
              regex: '^(Friendship|FriendRequest|FriendConnection|UserFriend)$'
      - pattern-regex: '\b(find|exists|count|delete)\w{0,40}By(Follower|Followee|Following|Followed)(User|Account|Member)?(Id)?(And|Or|In|\()'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
