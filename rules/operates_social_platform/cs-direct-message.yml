# The class, sender and recipient regular expressions repeat across the member arms, and the event
# name expressions across the SignalR arms. Edit every copy together, or an arm drifts. A C# member
# is a field or an auto-property with any of the accessor shapes below; the engine reads a
# record's positional parameters as members, so the class patterns cover records too. Each member
# pattern is filtered by its own names before the two are joined, so a large class is not paired
# member by member.
rules:
  - id: lexcode.social.cs-direct-message
    languages: [csharp]
    severity: INFO
    message: Stores or sends a message addressed from one user account to another (a direct or private message model with a sender and a recipient, or a SignalR hub that sends a chat message to one user, connection or conversation group), which is how people talk on a social platform (operates_social_platform).
    pattern-either:
      # A class or record with a sender and a recipient member.
      - patterns:
          - patterns:
              - pattern-either:
                  - pattern: class $C { ... $T $F; ... }
                  - pattern: class $C { ... $T $F = $V; ... }
                  - pattern: class $C { ... $T $F { get; set; } ... }
                  - pattern: class $C { ... $T $F { get; init; } ... }
                  - pattern: class $C { ... $T $F { get; } ... }
                  - pattern: class $C { ... $T $F { get; set; } = $V; ... }
                  - pattern: class $C { ... $T $F { get; init; } = $V; ... }
                  - pattern: class $C { ... $T $F { get; } = $V; ... }
              - metavariable-regex:
                  metavariable: $C
                  regex: '^(?!.*(Email|Mail|Sms|Notification|Log|Event|Contact|Audit|Queue|Kafka)).*(DirectMessage|PrivateMessage|ChatMessage|UserMessage|InboxMessage|Dm|DM)$'
              - metavariable-regex:
                  metavariable: $F
                  regex: '(?i)^_?(recipient|receiver|recipientId|receiverId|to(User|Customer|Member|Account|Profile)(Id)?)$'
          - patterns:
              - pattern-either:
                  - pattern: class $C { ... $T2 $G; ... }
                  - pattern: class $C { ... $T2 $G = $W; ... }
                  - pattern: class $C { ... $T2 $G { get; set; } ... }
                  - pattern: class $C { ... $T2 $G { get; init; } ... }
                  - pattern: class $C { ... $T2 $G { get; } ... }
                  - pattern: class $C { ... $T2 $G { get; set; } = $W; ... }
                  - pattern: class $C { ... $T2 $G { get; init; } = $W; ... }
                  - pattern: class $C { ... $T2 $G { get; } = $W; ... }
              - metavariable-regex:
                  metavariable: $C
                  regex: '^(?!.*(Email|Mail|Sms|Notification|Log|Event|Contact|Audit|Queue|Kafka)).*(DirectMessage|PrivateMessage|ChatMessage|UserMessage|InboxMessage|Dm|DM)$'
              - metavariable-regex:
                  metavariable: $G
                  regex: '(?i)^_?(sender|senderId|author|authorId|from(User|Customer|Member|Account|Profile)(Id)?)$'
          - focus-metavariable: $F
      # SignalR: a hub, or an injected hub context, sending a chat or direct message to one user,
      # one connection or one conversation group. The engine resolves `using` and aliases for the
      # qualified Hub and IHubContext, so an app's own Hub class in another namespace is not read.
      # The plain forms read Hub<T> and IHubContext<T> written short under a using; the generic
      # forms read them written fully qualified. An alias of the namespace with a type argument
      # (Sig.Hub<T>) is read by neither, a known gap.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: 'class $H : Microsoft.AspNetCore.SignalR.Hub { ... }'
                      - pattern-inside: 'class $H : Microsoft.AspNetCore.SignalR.Hub<$TC> { ... }'
                  - pattern: Clients.$WHO($U).$SEND(...)
              - pattern: (Microsoft.AspNetCore.SignalR.IHubContext $X).Clients.$WHO($U).$SEND(...)
              - pattern: (Microsoft.AspNetCore.SignalR.IHubContext<$TH> $X).Clients.$WHO($U).$SEND(...)
          - metavariable-regex:
              metavariable: $WHO
              regex: '^(User|Users|Client|Group)$'
          - pattern-either:
              # SendAsync with the client method's name first.
              - patterns:
                  - pattern: $Z.SendAsync($D, ...)
                  - metavariable-regex:
                      metavariable: $D
                      regex: '(?i)^"([^"]*(message|chat)[^"]*|dms?)"$'
              # A strongly typed hub's client method.
              - patterns:
                  - pattern: $Z.$SEND(...)
                  - metavariable-regex:
                      metavariable: $SEND
                      regex: '(?i)^(?!Send(Core)?Async$)\w*(message|chat)\w*$'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
