# The regular expressions in this file repeat across its arms (each arm names the same properties,
# classes or paths again). Edit every copy together, or an arm drifts from the others.
# Each name check sits in the block that binds its name (CONTRIBUTING.md, Cost): the engine joins the
# terms of one level before it checks names there, and every property joined with every class costs
# time quadratic in the file: 10 to 34 s on a 900 KB file, where a scan gives one rule 30 s per file,
# so a slower machine lost the file's matches (#13009).
rules:
  - id: lexcode.social.kt-follow-relation
    languages: [kotlin]
    severity: INFO
    message: 'Defines a follow or friendship relation between user accounts (a follower and followed pair, a friendship class, or a finder keyed on the follower), which is how people connect on a social platform (operates_social_platform).'
    patterns:
      - pattern-either:
          - pattern-regex: '(?is)\A(?=.*follow).*'
          - pattern-regex: '(?is)\A(?=.*friend).*'
      - pattern-either:
            - patterns:
                - pattern-either:
                    - pattern: 'class $C(..., val $G: $T2, ..., val $F: $T, ...)'
                    - pattern: 'class $C(..., val $G: $T2, ..., var $F: $T, ...)'
                    - pattern: 'class $C(..., var $G: $T2, ..., val $F: $T, ...)'
                    - pattern: 'class $C(..., var $G: $T2, ..., var $F: $T, ...)'
                    - pattern: 'class $C(..., val $F: $T2, ..., val $G: $T, ...)'
                    - pattern: 'class $C(..., val $F: $T2, ..., var $G: $T, ...)'
                    - pattern: 'class $C(..., var $F: $T2, ..., val $G: $T, ...)'
                    - pattern: 'class $C(..., var $F: $T2, ..., var $G: $T, ...)'
                - metavariable-regex:
                    metavariable: $G
                    regex: '^follower(User|Account|Member|Profile)?(Id)?$'
                - metavariable-regex:
                    metavariable: $F
                    regex: '^(followed|followee|following)(User|Account|Member|Profile)?(Id)?$'
            - patterns:
                - patterns:
                    - pattern-either:
                        - pattern: 'val $G: $T'
                        - pattern: 'var $G: $T'
                        - pattern: 'val $G: $T = $V'
                        - pattern: 'var $G: $T = $V'
                    - metavariable-regex:
                        metavariable: $G
                        regex: '^follower(User|Account|Member|Profile)?(Id)?$'
                - patterns:
                    - pattern-either:
                        - pattern-inside: |
                            class $C(...) {
                              ...
                              val $F: $T2
                              ...
                            }
                        - pattern-inside: |
                            class $C(...) {
                              ...
                              var $F: $T2
                              ...
                            }
                        - pattern-inside: |
                            class $C(...) {
                              ...
                              val $F: $T2 = $W
                              ...
                            }
                        - pattern-inside: |
                            class $C(...) {
                              ...
                              var $F: $T2 = $W
                              ...
                            }
                    - metavariable-regex:
                        metavariable: $F
                        regex: '^(followed|followee|following)(User|Account|Member|Profile)?(Id)?$'
                - pattern-not-inside: |
                    fun $FN(...) {
                      ...
                    }
                - pattern-not-inside: |
                    fun $FN(...) = $FE
            - patterns:
                - pattern-either:
                    - pattern: 'class $C(...)'
                    - pattern: 'class $C'
                - metavariable-regex:
                    metavariable: $C
                    regex: '^(Friendship|FriendRequest|FriendConnection|UserFriend)$'
            - pattern-regex: '\b(find|exists|count|delete)\w{0,40}By(Follower|Followee|Following|Followed)(User|Account|Member)?(Id)?(And|Or|In|\()'
    metadata:
      activity: operates_social_platform
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/operates-social-platform
      provenance: ungovr-original
      license: MIT
