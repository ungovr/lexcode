rules:
  - id: lexcode.audio.py-speech-reply-to-response
    languages: [python]
    severity: INFO
    message: Sends speech synthesized by a text-to-speech model back in an HTTP response, which is generating audio with AI that reaches users (generates_audio).
    mode: taint
    pattern-sources:
      - pattern: $C.audio.speech.create(...)
      - pattern: $C.audio.speech.with_streaming_response.create(...)
      - pattern: $C.text_to_speech.convert(...)
      - pattern: $C.text_to_speech.stream(...)
      - pattern: $C.text_to_speech.convert_as_stream(...)
      - pattern: $C.synthesize_speech(...)
    pattern-sinks:
      - patterns:
          - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(\w+\.)*(jsonify|JSONResponse|ORJSONResponse|UJSONResponse|HTMLResponse|PlainTextResponse|StreamingResponse|EventSourceResponse|Response|make_response|HttpResponse|JsonResponse|StreamingHttpResponse|render_template|send_file)$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A.$M(...)
                  def $F(...):
                    ...
              - pattern-inside: |
                  @$A.$M(...)
                  async def $F(...):
                    ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(get|post|put|patch|delete|route|api_route|head|options)$
          - pattern: return $X
          - focus-metavariable: $X
      - patterns:
          - pattern: $WS.$M(...)
          - metavariable-regex:
              metavariable: $WS
              regex: ^(ws|websocket|socket)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(send_text|send_json|send_bytes)$
    metadata:
      activity: generates_audio
      mentioned: performs
      definition: https://lexlint.io/activities/generates-audio
      provenance: ungovr-original
      license: MIT
