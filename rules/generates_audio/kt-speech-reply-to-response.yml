rules:
  - id: lexcode.audio.kt-speech-reply-to-response
    languages:
      - kotlin
    severity: INFO
    message: Sends speech synthesized by a text-to-speech model back in an HTTP response, a socket or a screen, which is generating audio with AI that reaches users (generates_audio).
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.openai\.).*
          - pattern: $C.audio().speech().create(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.aallam\.openai\.).*
          - pattern: $O.speech(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.azure\.ai\.openai\.).*
          - pattern: $C.generateSpeechFromText(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.google\.cloud\.texttospeech\.).*
          - pattern-either:
              - pattern: $C.synthesizeSpeech(...)
              - pattern: $C.synthesizeSpeech { ... }
      - patterns:
          - pattern-regex: (?s)\A(?=.*\.services\.polly\.).*
          - pattern-either:
              - pattern: $C.synthesizeSpeech(...)
              - pattern: $C.synthesizeSpeech { ... }
      - patterns:
          - pattern-regex: (?s)\A(?=.*com\.microsoft\.cognitiveservices\.speech\.).*
          - pattern-either:
              - pattern: $S.SpeakText(...)
              - pattern: $S.SpeakTextAsync(...)
              - pattern: $S.SpeakSsml(...)
              - pattern: $S.SpeakSsmlAsync(...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.ai\.).*
          - pattern: SpeechPrompt(...)
    pattern-propagators:
      - pattern: $S.$M { $X -> ... }
        from: $S
        to: $X
      - pattern: $S?.$M { $X -> ... }
        from: $S
        to: $X
      - patterns:
          - pattern: $S.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
      - patterns:
          - pattern: $S?.$M { <... $IT ...> }
          - metavariable-regex:
              metavariable: $IT
              regex: ^it$
        from: $S
        to: $IT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A(...)
                  fun $F(...): $R {
                    ...
                  }
              - pattern-inside: |
                  @$A
                  fun $F(...): $R {
                    ...
                  }
          - metavariable-regex:
              metavariable: $A
              regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - pattern: return $X
          - pattern-not-inside: |
              $M { $P -> ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$A(...)
                  fun $F(...) = $X
              - pattern-inside: |
                  @$A(...)
                  fun $F(...): $R = $X
              - pattern-inside: |
                  @$A
                  fun $F(...) = $X
              - pattern-inside: |
                  @$A
                  fun $F(...): $R = $X
          - metavariable-regex:
              metavariable: $A
              regex: ^(GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping|RequestMapping|ResponseBody|SendTo|SendToUser|QueryMapping|MutationMapping|SubscriptionMapping|GET|POST|PUT|DELETE|HEAD|Get|Post|Put|Patch|Delete|Route)$
          - focus-metavariable: $X
      - pattern: ResponseEntity.ok($X)
      - pattern: ResponseEntity.$S(...). ... .body($X)
      - pattern: ResponseEntity($X, ...)
      - pattern: ResponseEntity<$T>($X, ...)
      - pattern: ServerResponse.$S(...). ... .bodyValue($X)
      - pattern: ServerResponse.$S(...). ... .bodyValueAndAwait($X)
      - pattern: ServerResponse.$S(...). ... .body($X, ...)
      - pattern: ServerResponse.$S(...). ... .bodyAndAwait($X, ...)
      - pattern: Response.ok($X)
      - pattern: Response.$S(...). ... .entity($X)
      - pattern: Response(...).body($X)
      - pattern: call.respond(..., $X, ...)
      - pattern: call.respondText(..., $X, ...)
      - pattern: call.respondBytes(..., $X, ...)
      - pattern: Frame.Text($X)
      - pattern: Frame.Binary(..., $X)
      - pattern: $C.response().end($X)
      - pattern: $C.response().write($X)
      - pattern: $C.response().$H(...).end($X)
      - pattern: ctx.result($X)
      - pattern: ctx.json($X)
      - pattern: ctx.html($X)
      - pattern: $S.basicRemote.sendText($X)
      - pattern: $S.asyncRemote.sendText($X)
      - pattern: $S.basicRemote.sendBinary($X)
      - pattern: $S.asyncRemote.sendBinary($X)
      - patterns:
          - pattern: $RESP.writer.$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $RESP
              regex: (?i)^(this\.)?\w*(resp|response|res)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: $RESP.outputStream.$M(..., $X, ...)
          - metavariable-regex:
              metavariable: $RESP
              regex: (?i)^(this\.)?\w*(resp|response|res)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println)$
      - patterns:
          - pattern-either:
              - pattern: out.$M(..., $X, ...)
              - pattern: writer.$M(..., $X, ...)
              - pattern: pw.$M(..., $X, ...)
              - pattern: printWriter.$M(..., $X, ...)
          - pattern-inside: |
              fun $F(..., $RESP: HttpServletResponse, ...) {
                ...
              }
          - metavariable-regex:
              metavariable: $M
              regex: ^(write|print|println|append|printf|format)$
      - patterns:
          - pattern: $SRC.transferTo($RESP.outputStream)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: $SRC.copyTo($RESP.outputStream)
          - focus-metavariable: $SRC
      - patterns:
          - pattern: $U.copy($SRC, $RESP.outputStream)
          - focus-metavariable: $SRC
      - pattern: emitter.send(..., $X, ...)
      - pattern: sseEmitter.send(..., $X, ...)
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.messaging\.simp\.).*
          - pattern-either:
              - pattern: $T.convertAndSend(..., $X, ...)
              - pattern: $T.convertAndSendToUser(..., $X, ...)
      - pattern: $S.sendMessage(TextMessage($X))
      - pattern: $S.sendMessage(BinaryMessage($X))
      - patterns:
          - pattern-regex: (?s)\A(?=.*org\.springframework\.).*
          - pattern-either:
              - pattern: $R.addAttribute(..., $X, ...)
              - pattern: $R.addFlashAttribute(..., $X, ...)
              - pattern: $R.addObject(..., $X, ...)
              - pattern: $R.setAttribute(..., $X, ...)
          - metavariable-regex:
              metavariable: $R
              regex: (?i)^(this\.)?_?(\w*(model|mav|attributes|req|request)|ra)$
      - pattern: ModelAndView(..., $X)
      - pattern: $P.setDataSource($X)
      - patterns:
          - pattern-regex: (?s)\A(?=.*android\.media\.AudioTrack).*
          - pattern: $T.write($X, ...)
          - metavariable-regex:
              metavariable: $T
              regex: (?i)^(this\.)?_?\w*(track|audio)\w*$
      - patterns:
          - pattern-either:
              - pattern: $S.value = $X
              - pattern: $S.postValue($X)
              - pattern: $S.emit($X)
              - pattern: $S.tryEmit($X)
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^(this\.)?_?\w*(state|audio|speech|voice|result|output)\w*$
    metadata:
      activity: generates_audio
      mentioned: performs
      definition: https://lexlint.io/activities/generates-audio
      provenance: ungovr-original
      license: MIT
