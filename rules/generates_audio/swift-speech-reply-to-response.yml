rules:
  - id: lexcode.audio.swift-speech-reply-to-response
    languages: [swift]
    severity: INFO
    message: Plays or sends back speech synthesized by a text-to-speech model, which is generating audio with AI that reaches users (generates_audio).
    # Sources: MacPaw OpenAI audioCreateSpeech, SwiftOpenAI createSpeech and Amazon Polly SynthesizeSpeech.
    # Sinks: an AVAudioPlayer, AVPlayer or AVAudioPlayerNode, a view-model property whose name says it holds
    # audio, and a Vapor or Hummingbird response or socket.
    # Swift shapes (Opengrep 1.33.1, probed for #13199): the engine does not carry taint through an
    # optional binding (`guard let x = ...`, `if let x = ...`), so a name bound from a model call, or from a
    # value that holds one, is a source of its own; a `for try await` loop variable, a `switch` or `if case`
    # `.success(let x)` binding and the first parameter of a vendor's completion closure are carried. An
    # `if let x = try ...` condition does not parse at all and is a known gap. A local `var` declared in the
    # same function is not a screen, so a state-name sink skips it.
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?AWSPolly\b).*'
              - pattern-either: &calls_vendors
                  - pattern: '$C.audioCreateSpeech(query: $Q)'
                  - pattern: '$S.createSpeech(parameters: $P)'
                  - pattern: '$C.synthesizeSpeech(input: $I)'
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?AWSPolly\b).*'
              - pattern-either:
                  - pattern: |
                      $C.audioCreateSpeech(query: $Q) { $R in
                        ...
                      }
                  - pattern: |
                      $C.audioCreateSpeech(query: $Q) { [$CAP] $R in
                        ...
                      }
                  - pattern: |
                      $C.audioCreateSpeech(query: $Q) { [$CAP, $CAP2] $R in
                        ...
                      }
              - focus-metavariable: $R
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?AWSPolly\b).*'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          guard let $X = $E0 else { ... }
                          ...
                      - pattern-inside: |
                          guard let $X = $E0, ... else { ... }
                          ...
                  - metavariable-pattern:
                      metavariable: $E0
                      pattern-either: *calls_vendors
                  - pattern: $X
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?OpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?SwiftOpenAI\b).*'
                  - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?AWSPolly\b).*'
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          let $V = $E0
                          ...
                      - pattern-inside: |
                          var $V = $E0
                          ...
                  - metavariable-pattern:
                      metavariable: $E0
                      pattern-either: *calls_vendors
                  - pattern-either:
                      - pattern-inside: |
                          guard let $X = $E1 else { ... }
                          ...
                      - pattern-inside: |
                          guard let $X = $E1, ... else { ... }
                          ...
                      - pattern-inside: |
                          if let $X = $E1 {
                            ...
                          }
                      - pattern-inside: |
                          if let $X = $E1, ... {
                            ...
                          }
                  - metavariable-pattern:
                      metavariable: $E1
                      pattern: $V
                  - pattern: $X
    pattern-propagators:
      - patterns:
          - pattern-inside: |
              for try await $X in $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              for await $X in $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              switch $S {
              case .success(let $X):
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              if case .success(let $X) = $S {
                ...
              }
          - pattern: $X
        from: $S
        to: $X
      - patterns:
          - pattern-inside: |
              guard case .success(let $X) = $S else { ... }
              ...
          - pattern: $X
        from: $S
        to: $X
    pattern-sinks:
      - patterns:
          - patterns:
              - pattern-either:
                  - pattern: $S = $X
                  - pattern: $S += $X
                  - pattern: $S.append($X)
                  - pattern: '$S.append(contentsOf: $X)'
              - metavariable-regex:
                  metavariable: $S
                  regex: (?i)^(self[?!]?\.)?_?\w*(audio|speech|sound|voice|narration|recordings|clips|results|outputs)\w*$
          - pattern-not-inside: let $S = $E
          - pattern-not-inside: |
              func $F(...) {
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              func $F(...) {
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              var $P: $PT {
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              var $P: $PT {
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              {
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              {
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              { $CP in
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              { $CP in
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              { $CP, $CQ in
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              { $CP, $CQ in
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              { [$CAP] in
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              { [$CAP] in
                ...
                var $S: $U = $E
                ...
              }
          - pattern-not-inside: |
              { [$CAP] $CP in
                ...
                var $S = $E
                ...
              }
          - pattern-not-inside: |
              { [$CAP] $CP in
                ...
                var $S: $U = $E
                ...
              }
          - focus-metavariable: $X
      - pattern: 'AVFoundation.AVAudioPlayer(data: $X, ...)'
      - pattern: 'AVFoundation.AVAudioPlayer(contentsOf: $X, ...)'
      - pattern: '$N.scheduleBuffer($X, ...)'
      - pattern: 'AVFoundation.AVPlayer(url: $X)'
      - pattern: 'AVFoundation.AVPlayerItem(url: $X)'
      - pattern: 'AVFoundation.AVPlayer(playerItem: $X)'
      - patterns:
          - pattern-either:
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Vapor\b).*'
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Hummingbird\b).*'
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          $APP.$M(...) { $REQ in
                            ...
                            return $X
                          }
                      - pattern: |
                          $APP.$M(...) { $REQ, $CTX in
                            ...
                            return $X
                          }
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(get|post|put|patch|delete|on)$
              - pattern: |
                  func $F(..., $REQ: Request, ...) -> $T {
                    ...
                    return $X
                  }
              - pattern: |
                  func $F(..., $REQ: HBRequest, ...) -> $T {
                    ...
                    return $X
                  }
              # a handler of one expression, whose value is its implicit return (a route closure of one
              # expression is already matched by the closure forms above); a handler that returns Void
              # or `()` has no implicit return, so its one statement (`_ = try await ...`, a log line)
              # is not one
              - patterns:
                  - pattern-either:
                      - pattern: |
                          func $F(..., $REQ: Request, ...) -> $T {
                            $X
                          }
                      - pattern: |
                          func $F(..., $REQ: HBRequest, ...) -> $T {
                            $X
                          }
                  # (the engine binds `$T` from the effects on, `async throws(MyError) -> Void` or
                  # `async throws` and `-> ()` on the next line, so the type is read after the last
                  # `->` when there is one, and a type that ends in `(` or `()` is the empty tuple)
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^(?!(?:[\s\S]*->\s*)?\(?\s*(?:(?:Swift\.)?Void)?\s*\)?$|[\s\S]*\(\s*\)?$)
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Vapor\b).*'
              - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:@\w+(?:\([^)]*\))?\s+)*import\s+(?:(?:class|struct|enum|protocol|func|var|let|typealias)\s+)?Hummingbird\b).*'
          - pattern-either:
              - pattern: 'Response(..., body: $X, ...)'
              - pattern: 'HBResponse(..., body: $X, ...)'
              - pattern: $REQ.eventLoop.makeSucceededFuture($X)
      - patterns:
          - pattern-either:
              - pattern: $WS.send($X, ...)
          - metavariable-regex:
              metavariable: $WS
              regex: (?i)^(self[?!]?\.)?_?\w*(ws|websocket|socket)$
      - pattern: 'APIGatewayV2Response(..., body: $X, ...)'
      - pattern: 'APIGatewayResponse(..., body: $X, ...)'
    metadata:
      activity: generates_audio
      mentioned: performs
      definition: https://lexlint.io/activities/generates-audio
      provenance: ungovr-original
      license: MIT
