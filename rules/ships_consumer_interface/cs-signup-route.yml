# The path regular expression is the one after the route arms; the receiver expression repeats
# between the two endpoint arms, and the staff words repeat across the receiver expression and the
# exclusions. Edit every copy together, or an arm drifts from the others. The exclusions are the
# same in cs-signup-screen and cs-signup-flow.
rules:
  - id: lexcode.consumer.cs-signup-route
    languages: [csharp]
    severity: INFO
    message: Routes a public sign-up page or endpoint (an ASP.NET Core route attribute, a Blazor component route, a minimal API or conventional route, or Identity's API endpoints, which include /register), a screen that members of the public use to reach a service (ships_consumer_interface).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  # MVC and Razor route attributes on an action or a controller. The engine
                  # resolves `using` and aliases for the qualified attribute, so an app's own
                  # Route or HttpPost attribute in another namespace is not read. A block-body
                  # method pattern also matches an expression-bodied method.
                  - pattern: |
                      [Microsoft.AspNetCore.Mvc.HttpGet($P, ...)]
                      $RET $M(...) { ... }
                  - pattern: |
                      [Microsoft.AspNetCore.Mvc.HttpPost($P, ...)]
                      $RET $M(...) { ... }
                  - pattern: |
                      [Microsoft.AspNetCore.Mvc.HttpPut($P, ...)]
                      $RET $M(...) { ... }
                  - pattern: |
                      [Microsoft.AspNetCore.Mvc.Route($P, ...)]
                      $RET $M(...) { ... }
                  - pattern: |
                      [Microsoft.AspNetCore.Mvc.Route($P, ...)]
                      class $C { ... }
                  # A Blazor routable component written as a class.
                  - pattern: |
                      [Microsoft.AspNetCore.Components.Route($P)]
                      class $C { ... }
                  # Minimal API and conventional routes, outside a staff route group.
                  - patterns:
                      - pattern-either:
                          - patterns:
                              - pattern: $APP.$MAP($P, ...)
                              - metavariable-regex:
                                  metavariable: $MAP
                                  regex: '^Map(Get|Post|Put|Methods)?$'
                          - pattern: $APP.MapControllerRoute($N, $P, ...)
                          - pattern: '$APP.MapControllerRoute(..., pattern: $P, ...)'
                      - metavariable-regex:
                          metavariable: $APP
                          regex: '(?is)^(?!.*\bMapGroup\(\s*\$?@?"[^"]*(admin|staff|internal|backoffice|manage))(?!\w*(admin|staff|internal|backoffice)\w*$)'
              # A plain, verbatim or interpolated string, which may open with a route parameter or
              # an interpolation hole for the culture ({lang}/register/).
              - metavariable-regex:
                  metavariable: $P
                  regex: '(?i)^(\$@?|@\$?)?"/?(\{[^}/"]*\}/)?(api/)?(\[controller\]/)?(v[0-9]+/)?(accounts?/|auth/|users?/|identity/(account/)?|customers?/|members?/)?(sign-?up|sign_up|register|registration|create-?account)/?"?$'
          # Identity's API endpoints (MapIdentityApi), which map POST /register, outside a staff
          # route group.
          - patterns:
              - pattern: $APP.MapIdentityApi<$U>(...)
              - metavariable-regex:
                  metavariable: $APP
                  regex: '(?is)^(?!.*\bMapGroup\(\s*\$?@?"[^"]*(admin|staff|internal|backoffice|manage))(?!\w*(admin|staff|internal|backoffice)\w*$)'
      # An endpoint that requires a signed-in user, or a staff role, is not a public sign-up.
      - pattern-not-inside: $X.RequireAuthorization(...)
      - pattern-not-inside: |
          [Microsoft.AspNetCore.Authorization.Authorize(...)]
          $RET2 $M2(...) { ... }
      # A staff controller: an admin area, an admin or staff role or policy, an attribute named
      # for admins, a staff namespace or a staff class name.
      - pattern-not-inside:
          patterns:
            - pattern: |
                [$A(...)]
                class $K { ... }
            - metavariable-regex:
                metavariable: $A
                regex: '(?i)^(\w+\.)*\w*(admin|staff|backoffice)\w*$'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    [Microsoft.AspNetCore.Mvc.Area($R)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize($R)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize(..., Roles = $R, ...)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize(..., Policy = $R, ...)]
                    class $K { ... }
            - metavariable-regex:
                metavariable: $R
                regex: '(?i).*(admin|staff|internal|backoffice|manage|employee|operator)'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    namespace $NS;
                    ...
                - pattern: namespace $NS { ... }
            - metavariable-regex:
                metavariable: $NS
                regex: '(?i)^(.*\W)?\w*(admin|staff|internal|backoffice)\w*(\W.*)?$'
      - pattern-not-inside:
          patterns:
            - pattern: class $K { ... }
            - metavariable-regex:
                metavariable: $K
                regex: '(?i).*(admin|staff|internal|backoffice)'
    metadata:
      activity: ships_consumer_interface
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/ships-consumer-interface
      provenance: ungovr-original
      license: MIT
