rules:
  - id: lexcode.consumer.swift-signup-screen
    languages: [swift]
    severity: INFO
    message: Declares a sign-up screen (a SwiftUI view, or a UIKit or AppKit view or view controller, for creating an account), a screen that members of the public use to reach a service (ships_consumer_interface).
    # As in the Kotlin, Java and C# sign-up screen rules: a self-service account creation screen is
    # what an app open to the public has and a staff tool does not. The type is named for sign-up
    # and is a screen type: its first superclass or protocol is named like a view or a controller
    # (SwiftUI's View, UIKit's UIViewController, an app's own base view controller, a
    # UIHostingController). On Opengrep 1.33.1 `class $C: $S { ... }` matches a struct, an actor, an
    # enum and an extension too, binding the first type in the list (probed), so the name of $S is
    # what keeps a delegate extension, a raw-value enum and a model out. A sign-up view model, a
    # sign-up request type and a cash register view are not read.
    patterns:
      # Whole-file anchors (CONTRIBUTING.md, Cost): a file without one of these words is not parsed.
      # Without them every Swift file is parsed, and penny-bot's generated API client (190 KB) took
      # about 80 s to parse in a worker at --jobs 16 (measured).
      - pattern-either:
          - pattern-regex: '(?s)\A(?=.*SignUp).*'
          - pattern-regex: '(?s)\A(?=.*Signup).*'
          - pattern-regex: '(?s)\A(?=.*Register).*'
          - pattern-regex: '(?s)\A(?=.*Registration).*'
          - pattern-regex: '(?s)\A(?=.*CreateAccount).*'
          - pattern-regex: '(?s)\A(?=.*AccountCreation).*'
      - pattern: |
          class $C: $S { ... }
      - metavariable-regex:
          metavariable: $S
          regex: '^((UIKit|AppKit|SwiftUI)\.)?\w*(ViewController|Controller|View)(<.*>)?$'
      # An optional prefix of two to four capitals (WMF, AB), an optional word for who signs up, the
      # sign-up word, then a screen word. The name cannot hold a staff word.
      - metavariable-regex:
          metavariable: $C
          regex: '^([A-Z]{2,4}(?=[A-Z][a-z]))?(User|Customer|Member|New|Self|Email|Phone)?(SignUp|Signup|Register|Registration|CreateAccount|AccountCreation|AccountRegistration)(Form|Flow|Step\w*|Main)?(View|ViewController|Controller|Screen|Page|HostingController)$'
    metadata:
      activity: ships_consumer_interface
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/ships-consumer-interface
      provenance: ungovr-original
      license: MIT
