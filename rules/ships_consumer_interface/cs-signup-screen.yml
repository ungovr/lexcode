# The screen-name expression is one copy, after the base classes; the staff words repeat across the
# exclusions, which are the same in cs-signup-route and cs-signup-flow. Edit every copy together,
# or an arm drifts from the others.
rules:
  - id: lexcode.consumer.cs-signup-screen
    languages: [csharp]
    severity: INFO
    message: Declares a sign-up screen (a Razor page, Blazor component, .NET MAUI page, WPF window, WinForms form or MVC controller for registering an account, or an MVC sign-up action that returns its view), a screen that members of the public use to reach a service (ships_consumer_interface).
    patterns:
      - pattern-either:
          # A UI class named for sign-up. The engine resolves `using` and aliases for the
          # qualified base class, so an app's own PageModel or Window in another namespace is
          # not read.
          - patterns:
              - pattern-either:
                  - pattern: 'class $C : Microsoft.AspNetCore.Mvc.RazorPages.PageModel { ... }'
                  - pattern: 'class $C : Microsoft.AspNetCore.Components.ComponentBase { ... }'
                  - pattern: 'class $C : Microsoft.AspNetCore.Mvc.Controller { ... }'
                  - pattern: 'class $C : Microsoft.Maui.Controls.ContentPage { ... }'
                  - pattern: 'class $C : System.Windows.Window { ... }'
                  - pattern: 'class $C : System.Windows.Controls.Page { ... }'
                  - pattern: 'class $C : System.Windows.Controls.UserControl { ... }'
                  - pattern: 'class $C : System.Windows.Forms.Form { ... }'
                  - pattern: 'class $C : System.Windows.Forms.UserControl { ... }'
                  - pattern: 'class $C : Microsoft.UI.Xaml.Controls.Page { ... }'
              - metavariable-regex:
                  metavariable: $C
                  regex: '^(User|Account|Customer|Member|New|Self)?(SignUp|Signup|Register|Registration|CreateAccount)(Model|PageModel|Page|View|Window|Form|Component|Dialog|Screen|Control|Controller)?$'
          # An MVC action named for sign-up that returns its view to the browser: one match per
          # action, however many of its branches return the view.
          - patterns:
              - pattern-either:
                  - pattern: |
                      $RET $M(...) { ... return View(...); ... }
                  - pattern: $RET $M(...) => View(...);
              - metavariable-regex:
                  metavariable: $M
                  regex: '^(Register|Registration|SignUp|Signup|CreateAccount)(User|Account|Customer|Member)?$'
              - pattern-inside: class $C { ... }
              - metavariable-regex:
                  metavariable: $C
                  regex: '^\w*Controller$'
      # A screen that requires a signed-in user, or a staff role, is not a public sign-up.
      - pattern-not-inside: |
          [Microsoft.AspNetCore.Authorization.Authorize(...)]
          $RET2 $M2(...) { ... }
      # A staff screen: an admin area, an admin or staff role or policy, an attribute named for
      # admins, a staff namespace or a staff class name.
      - pattern-not-inside:
          patterns:
            - pattern: |
                [$A(...)]
                class $K { ... }
            - metavariable-regex:
                metavariable: $A
                regex: '(?i)^(\w+\.)*\w*(admin|staff|backoffice)\w*$'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    [Microsoft.AspNetCore.Mvc.Area($R)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize($R)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize(..., Roles = $R, ...)]
                    class $K { ... }
                - pattern: |
                    [Microsoft.AspNetCore.Authorization.Authorize(..., Policy = $R, ...)]
                    class $K { ... }
            - metavariable-regex:
                metavariable: $R
                regex: '(?i).*(admin|staff|internal|backoffice|manage|employee|operator)'
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    namespace $NS;
                    ...
                - pattern: namespace $NS { ... }
            - metavariable-regex:
                metavariable: $NS
                regex: '(?i)^(.*\W)?\w*(admin|staff|internal|backoffice)\w*(\W.*)?$'
      - pattern-not-inside:
          patterns:
            - pattern: class $K { ... }
            - metavariable-regex:
                metavariable: $K
                regex: '(?i).*(admin|staff|internal|backoffice)'
    metadata:
      activity: ships_consumer_interface
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/ships-consumer-interface
      provenance: ungovr-original
      license: MIT
