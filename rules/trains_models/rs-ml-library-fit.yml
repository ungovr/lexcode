rules:
  - id: lexcode.train.rs-ml-library-fit
    languages: [rust]
    severity: INFO
    message: Fits a classical machine-learning model (linfa or smartcore) to the app's own data, which is training models (trains_models).
    # In both libraries `fit` is the training call: linfa's Fit and FitWith traits, smartcore's
    # associated fit functions. Predicting with a model fitted elsewhere is not matched. `fit` is a
    # common name (an image fitted to a frame, a curve), so each branch is kept to a file with a `use`
    # line naming the library; linfa's own examples reach `fit` through `use linfa::prelude::*`, a
    # glob the engine cannot resolve, so no crate path could be written. `$M.fit(...)` also matches
    # a path call (`RandomForestClassifier::fit(..)`, probed).
    pattern-either:
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+linfa(?:_\w+)?\b).*'
          - pattern-either:
              - pattern: $M.fit(...)
              - pattern: $M.fit_with(...)
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+smartcore\b).*'
          - pattern: $M.fit(...)
    metadata:
      activity: trains_models
      mentioned: performs
      definition: https://lexlint.io/activities/trains-models
      provenance: ungovr-original
      license: MIT
