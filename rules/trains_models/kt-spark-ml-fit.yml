rules:
  - id: lexcode.train.kt-spark-ml-fit
    languages: [kotlin]
    severity: INFO
    message: Fits a Spark MLlib estimator, pipeline or cross-validator to a dataset, or calls an MLlib train method, which is training models (trains_models). Feature transformers such as StringIndexer and StandardScaler are data preparation and are not matched.
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $N.fit(...)
                  - pattern-either:
                      - pattern-inside: |
                          val $N = $T(...)
                          ...
                      - pattern-inside: |
                          var $N = $T(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...).$Y(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...).$Y(...).$Z(...)
                          ...
                      - pattern-inside: |
                          val $N: $T = $E
                          ...
                      - pattern-inside: |
                          fun $F(..., $N: $T, ...) {
                            ...
                          }
                      - pattern-inside: |
                          class $C(..., $N: $T, ...) {
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            lateinit var $N: $T
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N = $T(...)
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N = $T(...).$X(...)
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N: $T = $E
                            ...
                          }
              - pattern: $T(...).fit(...)
              - pattern: $T(...).$X(...).fit(...)
              - pattern: $T(...).$X(...).$Y(...).fit(...)
              - pattern: $T(...).$X(...).$Y(...).$Z(...).fit(...)
          - pattern-either:
              - pattern-inside: |
                  import org.apache.spark.ml.$P.$T
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.$T
                  ...
      
          - pattern-not-inside: |
              import org.apache.spark.ml.feature.$T
              ...
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $N.fit(...)
                  - pattern-either:
                      - pattern-inside: |
                          val $N = $T(...)
                          ...
                      - pattern-inside: |
                          var $N = $T(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...).$Y(...)
                          ...
                      - pattern-inside: |
                          val $N = $T(...).$X(...).$Y(...).$Z(...)
                          ...
                      - pattern-inside: |
                          val $N: $T = $E
                          ...
                      - pattern-inside: |
                          fun $F(..., $N: $T, ...) {
                            ...
                          }
                      - pattern-inside: |
                          class $C(..., $N: $T, ...) {
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            lateinit var $N: $T
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N = $T(...)
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N = $T(...).$X(...)
                            ...
                          }
                      - pattern-inside: |
                          class $C(...) {
                            ...
                            val $N: $T = $E
                            ...
                          }
              - pattern: $T(...).fit(...)
              - pattern: $T(...).$X(...).fit(...)
              - pattern: $T(...).$X(...).$Y(...).fit(...)
              - pattern: $T(...).$X(...).$Y(...).$Z(...).fit(...)
          - pattern-either:
              - pattern-inside: |
                  import org.apache.spark.ml.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.classification.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.regression.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.clustering.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.recommendation.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.fpm.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.ml.tuning.*
                  ...
          - metavariable-regex:
              metavariable: $T
              regex: ^(LogisticRegression|DecisionTreeClassifier|RandomForestClassifier|GBTClassifier|NaiveBayes|LinearSVC|MultilayerPerceptronClassifier|FMClassifier|OneVsRest|LinearRegression|GeneralizedLinearRegression|DecisionTreeRegressor|RandomForestRegressor|GBTRegressor|IsotonicRegression|AFTSurvivalRegression|FMRegressor|KMeans|BisectingKMeans|GaussianMixture|LDA|ALS|FPGrowth|Pipeline|CrossValidator|TrainValidationSplit)$
      
      - patterns:
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^train(Classifier|Regressor)?$
          - pattern-either:
              - pattern-inside: |
                  import org.apache.spark.mllib.$P.$C
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.$C
                  ...
      - patterns:
          - pattern: $C.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^train(Classifier|Regressor)?$
          - pattern-either:
              - pattern-inside: |
                  import org.apache.spark.mllib.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.classification.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.regression.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.clustering.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.recommendation.*
                  ...
              - pattern-inside: |
                  import org.apache.spark.mllib.tree.*
                  ...
          - metavariable-regex:
              metavariable: $C
              regex: ^(NaiveBayes|DecisionTree|RandomForest|GradientBoostedTrees|KMeans|ALS|SVMWithSGD|LogisticRegressionWithSGD|LogisticRegressionWithLBFGS|LinearRegressionWithSGD|RidgeRegressionWithSGD|LassoWithSGD|LDA|GaussianMixture|BisectingKMeans|IsotonicRegression)$
    paths:
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/src/test/**"
    metadata:
      activity: trains_models
      mentioned: performs
      definition: https://lexlint.io/activities/trains-models
      provenance: ungovr-original
      license: MIT
