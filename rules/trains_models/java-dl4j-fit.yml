rules:
  - id: lexcode.train.java-dl4j-fit
    languages: [java]
    severity: INFO
    message: Calls fit on a Deeplearning4j or ND4J SameDiff network, graph or trainer, which trains a neural network on data the app holds (trains_models).
    pattern-either:
      - patterns:
          - pattern: (MultiLayerNetwork $N).fit(...)
          - pattern-inside: |
              import org.deeplearning4j.nn.multilayer.MultiLayerNetwork;
              ...
      - patterns:
          - pattern: (ComputationGraph $N).fit(...)
          - pattern-inside: |
              import org.deeplearning4j.nn.graph.ComputationGraph;
              ...
      - patterns:
          - pattern: (SameDiff $N).fit(...)
          - pattern-inside: |
              import org.nd4j.autodiff.samediff.SameDiff;
              ...
      - patterns:
          - pattern: (EarlyStoppingTrainer $N).fit()
          - pattern-inside: |
              import org.deeplearning4j.earlystopping.trainer.EarlyStoppingTrainer;
              ...
      - patterns:
          - pattern: (SparkDl4jMultiLayer $N).fit(...)
          - pattern-inside: |
              import org.deeplearning4j.spark.impl.multilayer.SparkDl4jMultiLayer;
              ...
    paths:
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/src/test/**"
    metadata:
      activity: trains_models
      mentioned: performs
      definition: https://lexlint.io/activities/trains-models
      provenance: ungovr-original
      license: MIT
