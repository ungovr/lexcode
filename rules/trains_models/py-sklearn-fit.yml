      - pattern: StackingRegressor(...)
      - pattern: VotingClassifier(...)
      - pattern: VotingRegressor(...)
      - pattern: XGBClassifier(...)
      - pattern: XGBRegressor(...)
      - pattern: XGBRanker(...)
      - pattern: LGBMClassifier(...)
      - pattern: LGBMRegressor(...)
      - pattern: LGBMRanker(...)
      - pattern: CatBoostClassifier(...)
      - pattern: CatBoostRegressor(...)
      - pattern: $MOD.XGBClassifier(...)
