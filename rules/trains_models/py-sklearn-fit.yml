      - pattern: AdaBoostClassifier(...)
      - pattern: AdaBoostRegressor(...)
      - pattern: BaggingClassifier(...)
      - pattern: BaggingRegressor(...)
      - pattern: DecisionTreeClassifier(...)
      - pattern: DecisionTreeRegressor(...)
      - pattern: LogisticRegression(...)
      - pattern: LogisticRegressionCV(...)
      - pattern: LinearRegression(...)
      - pattern: Ridge(...)
      - pattern: RidgeClassifier(...)
      - pattern: Lasso(...)
      - pattern: ElasticNet(...)
      - pattern: SGDClassifier(...)
      - pattern: SGDRegressor(...)
