rules:
  - id: lexcode.chat.live-chat-script-src
    languages: [javascript, typescript]
    severity: INFO
    message: Loads a live-chat or help-desk widget script from the vendor's host, so the vendor receives what visitors type to support, which is a text chat that is kept (records_text_chat).
    # A regular expression on the assignment, not a pattern on every `.src =`: the pattern form
    # costs several seconds on a large repository for the same result.
    pattern-regex: |-
      \.src\s*=\s*["'`](https?:)?//(embed\.tawk\.to|widget\.intercom\.io|client\.crisp\.chat|static\.zdassets\.com|js\.driftt\.com|code\.tidio\.co|cdn\.livechatinc\.com|wchat\.freshchat\.com|js\.usemessages\.com)/
    metadata:
      activity: records_text_chat
      mentioned: performs
      definition: https://lexlint.io/activities/records-text-chat
      provenance: ungovr-original
      license: MIT
