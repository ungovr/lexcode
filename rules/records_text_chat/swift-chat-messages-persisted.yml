rules:
  - id: lexcode.chat.swift-chat-messages-persisted
    languages: [swift]
    severity: INFO
    message: Writes the text of a chat to a store as a chat message, conversation turn or transcript, or as a message with a user or assistant role, which is keeping a text chat (records_text_chat).
    # A form the app only saves is not a chat, so the record is named for a chat (ChatMessage,
    # ConversationTurn, ChatTranscript), as in kt-chat-messages-persisted, or it is a message record
    # that carries a literal user, assistant, model, ai or bot role, as in the PHP and Ruby
    # assistant-turns rules (a role kept in a variable, and an inbox message with a sender, do not
    # match). Each store is its own branch under its own import guard (the regular expression is also
    # the pre-filter): SwiftData (`context.insert`), Core Data (a managed object created in a context,
    # or `insertNewObject(forEntityName:)` with a chat entity name), Fluent (`save(on:)` and
    # `create(on:)` on a record built in the same function or in the call), Realm (`realm.add`) and
    # Firestore (`addDocument` or `setData` in a collection named for chat messages, or a `messages`
    # collection under a chats, conversations or chat-rooms document). A Fluent record built in the
    # call is read from the receiver's text, which under `try await` starts with `await`. An
    # in-memory array insert has a second argument (`at:`) and does not match.
    pattern-either:
      # SwiftData
      - patterns:
          - pattern-regex: '(?s)\bimport\s+SwiftData\b.*'
          - pattern-either:
              - patterns:
                  - pattern: $CTX.insert($T(...))
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?$
              - patterns:
                  - pattern: '$CTX.insert($T(..., role: $R, ...))'
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^\w*(Message|Turn|Chat|Conversation|Transcript)\w*$
                  - metavariable-regex:
                      metavariable: $R
                      regex: ^(\.(user|assistant|model|bot)|"(user|assistant|model|ai|bot)")$
      # Core Data
      - patterns:
          - pattern-regex: '(?s)\bimport\s+CoreData\b.*'
          - pattern-either:
              - patterns:
                  - pattern: '$T(context: $CTX)'
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?$
              - patterns:
                  - pattern: 'NSEntityDescription.insertNewObject(forEntityName: $N, into: $CTX)'
                  - metavariable-regex:
                      metavariable: $N
                      regex: ^"\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?"$
      # Fluent
      - patterns:
          - pattern-regex: '(?s)\bimport\s+(Fluent|FluentKit)\b.*'
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: '$V.save(on: $DB)'
                      - pattern: '$V.create(on: $DB)'
                  - pattern-inside: |
                      let $V = $T(...)
                      ...
                  - metavariable-regex:
                      metavariable: $T
                      regex: ^\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?$
              - patterns:
                  - pattern-either:
                      - pattern: '$X.save(on: $DB)'
                      - pattern: '$X.create(on: $DB)'
                  - metavariable-regex:
                      metavariable: $X
                      regex: '(?s)^(await\s+)?(\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?\(.*|\w*(Message|Turn|Chat|Conversation|Transcript)\w*\(.*\brole:\s*(\.(user|assistant|model|bot)|"(user|assistant|model|ai|bot)")(?!\w).*)\)$'
      # Realm
      - patterns:
          - pattern-regex: '(?s)\bimport\s+RealmSwift\b.*'
          - pattern: $R.add($T(...))
          - metavariable-regex:
              metavariable: $T
              regex: ^\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry|Transcript))s?(Entity|Record|Model|Object|MO|Item)?$
      # Firestore. Under `try await` the engine binds a chain with a call in the middle
      # (`db.collection("x").addDocument(...)`) differently from the same chain without it, so the
      # write is matched by its last call and the collection path is read from its receiver's text.
      - patterns:
          - pattern-regex: '(?s)\bimport\s+(FirebaseFirestore|Firebase)\b.*'
          - pattern-either:
              - pattern: $Y.addDocument(...)
              - pattern: $Y.setData(...)
          - metavariable-regex:
              metavariable: $Y
              regex: '(?is)^.*\.collection\(\s*"(\w*(chat_?(message|msg|turn|entr|histor|log|transcript)|conversation_?(message|turn|entr|transcript))\w*|(chats|conversations|chatrooms|chat_rooms)"\s*\)\s*\.document\(.*\)\s*\.collection\(\s*"messages)"\s*\)(\s*\.document\([^()]*\))?$'
    metadata:
      activity: records_text_chat
      mentioned: performs
      definition: https://lexlint.io/activities/records-text-chat
      provenance: ungovr-original
      license: MIT
