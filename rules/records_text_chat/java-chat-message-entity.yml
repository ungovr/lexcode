rules:
  - id: lexcode.chat.java-chat-message-entity
    languages: [java]
    severity: INFO
    message: Maps chat messages or conversation turns to a table or a collection with a persistence annotation, which is keeping a text chat (records_text_chat).
    # The class is named for a chat message (ChatMessage, ConversationTurn, LiveChatTranscript) and
    # carries a persistence annotation (@Entity, @Document, @Table). A transfer object with no
    # annotation stores nothing; a contact message, a ticket and a chat room hold no chat text.
    patterns:
      - pattern-either:
          - pattern: |
              @Entity
              class $K {
                ...
              }
          - pattern: |
              @Document(...)
              class $K {
                ...
              }
          - pattern: |
              @Table(...)
              class $K {
                ...
              }
      - focus-metavariable: $K
      - metavariable-regex:
          metavariable: $K
          regex: ^\w*(Chat(Message|Msg|Turn|Entry|History|Log|Transcript)|Conversation(Message|Turn|Entry)|Transcript(Entry|Line))s?$
    metadata:
      activity: records_text_chat
      mentioned: performs
      definition: https://lexlint.io/activities/records-text-chat
      provenance: ungovr-original
      license: MIT
