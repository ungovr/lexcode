rules:
  - id: lexcode.chat.kt-socket-handler-saves-message
    languages: [kotlin]
    severity: INFO
    message: Writes what a person sent over a websocket to a message or chat record, which is keeping a text chat (records_text_chat).
    # The handler shapes are Spring's @MessageMapping, the Jakarta @OnMessage endpoint, a
    # TextWebSocketHandler's handleTextMessage and a Ktor `webSocket("/path") { ... }` route. A
    # handler that saves something else (a position, a metric) does not match, because the record
    # must be named for a message, chat, conversation, transcript or dialog. Kotlin writes a function
    # in four shapes (block or expression body, with or without a declared return type, plain or
    # suspend), and a pattern for one does not match the others, so each is spelled out.
    patterns:
      - pattern-either:
          - pattern-inside: |
              @MessageMapping(...)
              fun $F(...) { ... }
          - pattern-inside: |
              @MessageMapping(...)
              fun $F(...): $RET { ... }
          - pattern-inside: |
              @MessageMapping(...)
              fun $F(...) = $E
          - pattern-inside: |
              @MessageMapping(...)
              fun $F(...): $RET = $E
          - pattern-inside: |
              @MessageMapping(...)
              suspend fun $F(...) { ... }
          - pattern-inside: |
              @MessageMapping(...)
              suspend fun $F(...): $RET { ... }
          - pattern-inside: |
              @MessageMapping(...)
              suspend fun $F(...) = $E
          - pattern-inside: |
              @MessageMapping(...)
              suspend fun $F(...): $RET = $E
          - pattern-inside: |
              @OnMessage
              fun $F(...) { ... }
          - pattern-inside: |
              @OnMessage
              fun $F(...): $RET { ... }
          - pattern-inside: |
              @OnMessage
              fun $F(...) = $E
          - pattern-inside: |
              @OnMessage
              fun $F(...): $RET = $E
          - pattern-inside: |
              @OnMessage
              suspend fun $F(...) { ... }
          - pattern-inside: |
              @OnMessage
              suspend fun $F(...): $RET { ... }
          - pattern-inside: |
              @OnMessage
              suspend fun $F(...) = $E
          - pattern-inside: |
              @OnMessage
              suspend fun $F(...): $RET = $E
          - pattern-inside: |
              fun handleTextMessage(...) { ... }
          - pattern-inside: |
              fun handleTextMessage(...): $RET { ... }
          - pattern-inside: |
              suspend fun handleTextMessage(...) { ... }
          - pattern-inside: |
              suspend fun handleTextMessage(...): $RET { ... }
          - pattern-inside: |
              webSocket(...) { ... }
          - pattern-inside: |
              webSocket { ... }
      - pattern-either:
          - pattern: $R.save(...)
          - pattern: $R.saveAll(...)
          - pattern: $R.saveAndFlush(...)
          - pattern: $R.insert(...)
          - pattern: $R.persist(...)
          - pattern: $R.addMessage(...)
          - pattern: |
              $R.insert { ... }
          - pattern: |
              $R.batchInsert(...) { ... }
      - metavariable-regex:
          metavariable: $R
          regex: '(?i)^(this\.)?\w*(message|msg|chat|conversation|transcript|dialog)\w*$'
      # Literal anchor inside the match (the write), so the engine skips files with no such call.
      - pattern-regex: '\.(save|saveAll|saveAndFlush|insert|persist|addMessage|batchInsert)\b'
    metadata:
      activity: records_text_chat
      mentioned: performs
      definition: https://lexlint.io/activities/records-text-chat
      provenance: ungovr-original
      license: MIT
