rules:
  - id: lexcode.biometric.java-face-matching-apis
    languages: [java]
    severity: INFO
    message: Calls a face or voice matching service (Azure Face identify, verify or find-similar, Face++ compare or search, VoiceIt), which is recognizing people from face geometry or a voiceprint (processes_biometrics).
    patterns:
      - pattern-either:
          # Azure AI Face SDK: matching a face to a group, to another face, or to candidates (detection is not here)
          - patterns:
              - pattern-either:
                  - pattern: $C.identifyFromPersonGroup(...)
                  - pattern: $C.identifyFromLargePersonGroup(...)
                  - pattern: $C.identifyFromDynamicPersonGroup(...)
                  - pattern: $C.verifyFaceToFace(...)
                  - pattern: $C.verifyFromPersonGroup(...)
                  - pattern: $C.verifyFromLargePersonGroup(...)
                  - pattern: $C.findSimilar(...)
                  - pattern: $C.findSimilarFromFaceList(...)
                  - pattern: $C.findSimilarFromLargeFaceList(...)
              - pattern-either:
                  - pattern-inside: |
                      import com.azure.ai.vision.face.$X;
                      ...
                  - pattern-inside: |
                      import com.azure.ai.vision.face.administration.$X;
                      ...
                  - pattern-inside: |
                      import com.azure.ai.vision.face.*;
                      ...
                  - pattern-inside: |
                      import com.azure.ai.vision.face.administration.*;
                      ...
          # The older Face client library (identity, verify, find-similar on FaceServiceClient)
          - patterns:
              - pattern-either:
                  - pattern: $C.identity(...)
                  - pattern: $C.verify(...)
                  - pattern: $C.findSimilar(...)
              - pattern-either:
                  - pattern-inside: |
                      import com.microsoft.projectoxford.face.FaceServiceClient;
                      ...
                  - pattern-inside: |
                      import com.microsoft.projectoxford.face.*;
                      ...
          # The REST endpoints, named in a string: Azure Face, Face++ and VoiceIt
          - pattern-regex: |-
              "[^"\n]*(/face/v1\.\d+(-preview(\.\d+)?)?/(identify|verify|findsimilars|facelists|largefacelists|persongroups|largepersongroups|dynamicpersongroups)\b|\bfaceplusplus\.com/facepp/v3/(compare|search|faceset)|\bapi\.voiceit\.io/(enrollments|verification|identification)/)
    metadata:
      activity: processes_biometrics
      mentioned: performs
      definition: https://lexlint.io/activities/processes-biometrics
      provenance: ungovr-original
      license: MIT
