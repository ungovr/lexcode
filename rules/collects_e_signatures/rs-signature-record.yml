# A field holding a person's signature on a struct that is the record of an agreement, waiver or
# consent: a database row (sqlx, Diesel, SeaORM) or a request body a drawn-signature pad posts. The
# engine matches each field of a struct, so the field's name and the struct's name are checked on the
# bound text. A field that only marks that the terms were accepted (`terms_accepted: bool`) is
# contract formation and has another name.
rules:
  - id: lexcode.esign.rs-signature-record
    languages: [rust]
    severity: INFO
    message: Stores a signature a person drew or captured on the record of an agreement, waiver or consent, which is collecting electronic signatures (collects_e_signatures).
    patterns:
      - pattern: |
          struct $C { ..., $SIG: $T, ... }
      - focus-metavariable: $SIG
      # A person's signature or an image of one (tenant_signature, signature_image, signature_base64),
      # or the bare name
      - metavariable-regex:
          metavariable: $SIG
          regex: '(?i)^(?:(?:customer|client|guest|patient|participant|signee|signer|tenant|guarantor|applicant|borrower|buyer|seller|witness|guardian|parent|drawn|handwritten|electronic|e)_?)?signature(?:_?(?:image|img|png|svg|data|file|photo|scan|drawing|base64))?$'
      # The struct the signature hangs on must be about an agreement: an agreement word as a CamelCase
      # segment anywhere in its name (LeaseAgreement, EventWaiver, NewConsentForm), never the start of a
      # longer word (ContractorProfile, Leaseholder). A key's signature sits on webhook payloads,
      # callbacks, method descriptors, responses, headers and tokens whose names hold an agreement word
      # too, so a name with any of those segments does not count, and neither does Attestation, nearly
      # always a key's. Authorization and Approval also name HTTP and cloud-signing models, so each
      # counts only in a person's form.
      - metavariable-regex:
          metavariable: $C
          regex: '^(?!.*(?:Webhook|Callback|Payload|Method|Response|Header|Token)).*(?:Waiver|Agreement|Contract|Consent|Lease|Authori[sz]ation(?:Form|Letter)|Acknowledge?ment|Disclosure|Confidentiality|(?:Liability|Medical|Photo)Release|Sign[Oo]ff|E[Ss]ign|SignatureForm|WorkOrder|PermissionSlip|Enrol+ment|(?:Parental|Parent|Guardian|Customer|Client|Patient)Approval|ApprovalForm)s?(?![a-z])'
      # The names a key's signature also goes by (a bare `signature`, `signature_data`, `signature_file`,
      # `client_signature`: an exchange order, a contract call, a device enrollment, a WebAuthn
      # attestation, an ActivityPub activity) count only where the struct is the agreement itself: its
      # name ends in the agreement word, optionally followed by up to two model trailers and a plural
      # (ParentalConsentForm, WaiverRow, LeaseAgreementModel, NewConsent); Request is not a trailer here
      # (DeviceEnrollmentRequest), as in C#. A person's signature or an
      # image of one keeps the wider test above. One comparison reads both names, since a condition in
      # a nested branch cannot see the field's name.
      - metavariable-comparison:
          comparison: not re.match("^(?i:(?:client_?)?signature|signature_?(?:data|file))$", str($SIG)) or re.match("^(?!.*(?:Webhook|Callback|Payload|Method|Response|Header|Token)).*(?:Waiver|Agreement|Contract|Consent|Lease|Authori[sz]ation(?:Form|Letter)|Acknowledge?ment|Disclosure|Confidentiality|(?:Liability|Medical|Photo)Release|Sign[Oo]ff|E[Ss]ign|SignatureForm|WorkOrder|PermissionSlip|Enrol+ment|(?:Parental|Parent|Guardian|Customer|Client|Patient)Approval|ApprovalForm)s?(?:Form|Record|Document|Dto|Model|Row|Entity|Input|Body|Data|Submission|Insert|Update){0,2}s?$", str($C))
    metadata:
      activity: collects_e_signatures
      mentioned: performs
      definition: https://lexlint.io/glossary#collects-electronic-signatures
      provenance: ungovr-original
      license: MIT
