rules:
  - id: lexcode.esign.cs-signature-record
    languages: [csharp]
    severity: INFO
    message: Stores a signature a person drew or captured on the record of an agreement, waiver or consent, which is collecting electronic signatures (collects_e_signatures).
    # No whole-file lookahead pre-filter (the C# rules carry none, so a large file is never past a
    # pre-filter's reach): the member and type-name tests below are exact, and the group's cost run
    # measures the rule without one.
    patterns:
      # A member of the type: a property or a field. A member carries an access modifier and a local
      # variable never does; the engine matches a declaration with more modifiers (`public required`).
      # A record's positional parameter is a member here too, so records need no branch of their own.
      - pattern-inside: |
          class $C {
            ...
          }
      - pattern-either:
          - pattern: public $T $SIG;
          - pattern: public $T $SIG = $V;
          - pattern: protected $T $SIG;
          - pattern: protected $T $SIG = $V;
          - pattern: internal $T $SIG;
          - pattern: internal $T $SIG = $V;
          - pattern: private $T $SIG;
          - pattern: private $T $SIG = $V;
      - focus-metavariable: $SIG
      # The record the signature hangs on must be an agreement of some kind: an agreement word as a
      # CamelCase segment of the type name, never as the start of a longer word (ContractorProfile,
      # Leaseholder). Authorization and Approval also name HTTP and cloud-signing models that carry a
      # key's signature, so each counts only in a person's form.
      # A person's signature or an image of one (TenantSignature, SignatureImage, signature_base64), or
      # the bare name
      - metavariable-regex:
          metavariable: $SIG
          regex: '(?i)^(?:(?:customer|client|guest|patient|participant|signee|signer|tenant|guarantor|applicant|borrower|buyer|seller|witness|guardian|parent|drawn|handwritten|electronic|e)_?)?signature(?:_?(?:image|img|png|svg|data|file|photo|scan|drawing|base64))?$'
      # The agreement word may sit anywhere in the type name (EventWaiver, PhotoReleaseConsent). A
      # webhook's signature request (PayPal's CreateWebhookSignatureRequest) is held out by name, as a
      # signed attestation is.
      - metavariable-regex:
          metavariable: $C
          regex: '(?s).*(?-i:(?:Waiver|Agreement|Contract|Consent|Lease|Authori[sz]ation(?:Form|Letter)|Acknowledg(?:e)?ment|(?<!Signed)Attestation|Disclosure|Confidentiality|(?:Liability|Medical|Photo)Release|Sign[Oo]ff|E[Ss]ign|(?<!Webhook)Signature(?:Request|Form|Pad)|WorkOrder|PermissionSlip|Enrol+ment|(?:Parental|Parent|Guardian|Customer|Client|Patient)Approval|ApprovalForm)s?(?![a-z]))'
      # A bare `Signature` is also what an exchange order, a contract ABI, a device enrollment, a
      # WebAuthn or software attestation, a lock or a webhook payload carries for a key's signature. It
      # counts only where the type is the agreement itself: the name ends in the agreement word
      # (LeaseAgreement, EventWaiver, ParentalConsentForm), with no technical segment anywhere in it
      # (Webhook, Callback, Event, Payload, Method, Response, Header, Token), and Attestation, nearly
      # always a key's, does not count. One comparison reads both names, since a condition in a nested
      # branch cannot see the member's name.
      - metavariable-comparison:
          comparison: not re.match("^[Ss][Ii][Gg][Nn][Aa][Tt][Uu][Rr][Ee]$", str($SIG)) or re.match("^(?!.*(?:Webhook|Callback|Event|Payload|Method|Response|Header|Token)).*(?:Waiver|Agreement|Contract|Consent|Lease|Authori[sz]ation(?:Form|Letter)|Acknowledge?ment|Disclosure|Confidentiality|(?:Liability|Medical|Photo)Release|Sign[Oo]ff|E[Ss]ign|SignatureForm|WorkOrder|PermissionSlip|Enrol+ment|(?:Parental|Parent|Guardian|Customer|Client|Patient)Approval|ApprovalForm)s?(?:Form|Record|Document)?$", str($C))
    metadata:
      activity: collects_e_signatures
      mentioned: performs
      definition: https://lexlint.io/glossary#collects-electronic-signatures
      provenance: ungovr-original
      license: MIT
