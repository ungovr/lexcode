rules:
  - id: lexcode.calls.java-android-call-recording
    languages: [java]
    severity: INFO
    message: Records a phone call through Android's call audio sources, or taps the audio of a WebRTC call, which is recording a call (records_calls).
    patterns:
      - pattern-either:
          # The call audio sources: both sides, the other side, this side
          - patterns:
              - pattern-either:
                  - pattern: $R.setAudioSource($S)
                  - pattern: new AudioRecord($S, ...)
              - metavariable-regex:
                  metavariable: $S
                  regex: ^(MediaRecorder\.)?AudioSource\.(VOICE_CALL|VOICE_DOWNLINK|VOICE_UPLINK)$
          # Android WebRTC: a callback that receives the call's audio samples
          - patterns:
              - pattern-either:
                  - pattern: $B.setSamplesReadyCallback(...)
                  - pattern: $B.setPlaybackSamplesReadyCallback(...)
              - pattern-either:
                  - pattern-inside: |
                      import org.webrtc.audio.JavaAudioDeviceModule;
                      ...
                  - pattern-inside: |
                      import org.webrtc.audio.*;
                      ...
    metadata:
      activity: records_calls
      mentioned: performs
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
