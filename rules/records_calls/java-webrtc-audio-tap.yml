rules:
  - id: lexcode.calls.java-webrtc-audio-tap
    languages: [java]
    severity: INFO
    message: Receives the audio samples of a WebRTC call as they are captured or played, which may be recording a call (records_calls).
    patterns:
      - pattern-either:
          - pattern: $B.setSamplesReadyCallback(...)
          - pattern: $B.setPlaybackSamplesReadyCallback(...)
      - pattern-either:
          - pattern-inside: |
              import org.webrtc.audio.JavaAudioDeviceModule;
              ...
          - pattern-inside: |
              import org.webrtc.audio.*;
              ...
    metadata:
      activity: records_calls
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
