rules:
  - id: lexcode.calls.daily-enable-recording
    languages: [javascript, typescript]
    severity: INFO
    message: Creates a Daily room or meeting token with recording enabled, which is recording a call (records_calls).
    patterns:
      - pattern: |
          {..., enable_recording: $V, ...}
      - metavariable-regex:
          metavariable: $V
          regex: ^['"](cloud|local|raw-tracks|cloud-audio-only|rtp-tracks)['"]$
    metadata:
      activity: records_calls
      mentioned: performs
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
