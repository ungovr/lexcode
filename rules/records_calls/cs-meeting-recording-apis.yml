rules:
  - id: lexcode.calls.cs-meeting-recording-apis
    languages: [csharp]
    severity: INFO
    message: Records a call or meeting through a platform API (Azure Communication Services call recording, an Amazon Chime capture pipeline, Amazon Connect contact recording, a Vonage record action), reads Teams meeting recordings or transcripts, reads recorded Zoom meetings, sends a notetaker bot into video meetings, or turns on Daily cloud recording, which is recording or handling recorded calls (records_calls).
    # Library types are written in full: the engine resolves a file's `using` lines and aliases, so an
    # app's own class of the same short name in another namespace is not taken for them.
    # `new T(...) { ... }` also matches a construction with no initializer, and `T $V = new(...)
    # { ... };` a target-typed one.
    pattern-either:
      # Azure Communication Services Call Automation: the options that start recording a call, and the
      # start call on an injected or constructed client (which finds options passed target-typed). The
      # options are not counted again inside that call.
      - patterns:
          - pattern-either:
              - pattern: new Azure.Communication.CallAutomation.StartRecordingOptions(...) { ... }
              - pattern: Azure.Communication.CallAutomation.StartRecordingOptions $V = new(...) { ... };
          - pattern-not-inside: (Azure.Communication.CallAutomation.CallAutomationClient $X).GetCallRecording().$S(...)
      - patterns:
          - pattern: (Azure.Communication.CallAutomation.CallAutomationClient $C).GetCallRecording().$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^Start(Async)?$
      # Amazon Chime SDK media pipelines (a capture pipeline records a meeting) and Amazon Connect
      # (recording a contact in flight). The vendor-named short forms also find a client whose
      # namespace comes from a `global using` in another file.
      - patterns:
          - pattern-either:
              - pattern: (Amazon.ChimeSDKMediaPipelines.IAmazonChimeSDKMediaPipelines $C).$M(...)
              - pattern: (Amazon.ChimeSDKMediaPipelines.AmazonChimeSDKMediaPipelinesClient $C).$M(...)
              - pattern: (IAmazonChimeSDKMediaPipelines $C).$M(...)
              - pattern: (AmazonChimeSDKMediaPipelinesClient $C).$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^CreateMediaCapturePipeline(Async)?$
      - patterns:
          - pattern-either:
              - pattern: (Amazon.Connect.IAmazonConnect $C).$M(...)
              - pattern: (Amazon.Connect.AmazonConnectClient $C).$M(...)
              - pattern: (IAmazonConnect $C).$M(...)
              - pattern: (AmazonConnectClient $C).$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^StartContactRecording(Async)?$
      # Vonage Voice: the record action of an NCCO
      - pattern: new Vonage.Voice.Nccos.RecordAction(...) { ... }
      - pattern: Vonage.Voice.Nccos.RecordAction $V = new(...) { ... };
      # Microsoft Graph: a Teams meeting's recordings and transcripts, reached from the Graph client (so
      # an app's own object with OnlineMeetings, Recordings and Transcripts properties is not taken for it)
      - patterns:
          - pattern-either:
              - pattern: (Microsoft.Graph.GraphServiceClient $G).Users[$U].OnlineMeetings[$ID].$P
              - pattern: (Microsoft.Graph.GraphServiceClient $G).Me.OnlineMeetings[$ID].$P
          - metavariable-regex:
              metavariable: $P
              regex: ^(Recordings|Transcripts)$
      # Zoom cloud recordings, notetaker bots (Recall.ai, MeetingBaaS, Attendee) and Daily cloud
      # recording, named in a string
      - pattern-regex: |-
          "[^"\n]*\bapi\.zoom\.us/v2/(meetings|users|accounts)/[^"\n]*recordings|"[^"\n]*(\brecall\.ai/api/v\d+|\bapi\.meetingbaas\.com/bots|\bapp\.attendee\.dev/api/v\d+/bots)|\benable_recording\\?"\s*:\s*\\?"(cloud|local|raw-tracks|cloud-audio-only|rtp-tracks)\\?"
    metadata:
      activity: records_calls
      mentioned: performs
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
