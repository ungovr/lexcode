rules:
  - id: lexcode.calls.php-meeting-recording-apis
    languages: [php]
    severity: INFO
    message: Reads recorded Zoom meetings, sends a notetaker bot into video meetings, or turns on Daily cloud recording, which is recording or handling recorded calls (records_calls).
    # The endpoint in a string literal, whichever client sends it. A Zoom recordings path may be
    # interpolated ("{$id}") or concatenated ('...' . $id . '/recordings') on one line.
    pattern-regex: |-
      ["'][^"'\n]*\bapi\.zoom\.us/v2/(meetings|users|accounts)/[^"'\n]*(["']\s*\.[^;\n]*\.\s*["'][^"'\n]*)?/recordings\b|["'][^"'\n]*(\brecall\.ai/api/v\d+|\bapi\.meetingbaas\.com/bots|\bapp\.attendee\.dev/api/v\d+/bots)|\benable_recording["']?\s*(:|=>)\s*["'](cloud|local|raw-tracks|cloud-audio-only|rtp-tracks)["']
    metadata:
      activity: records_calls
      mentioned: performs
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
