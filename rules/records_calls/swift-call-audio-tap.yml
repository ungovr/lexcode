rules:
  - id: lexcode.calls.swift-call-audio-tap
    languages: [swift]
    severity: INFO
    message: Captures call audio (the microphone recorded or tapped in a file that runs calls through CallKit, or a LiveKit room's audio samples handed to the app's own renderer), which may be recording a call (records_calls).
    # A signal: a CallKit call is carried, not kept, and the app's capture in the same file may run
    # outside the call; a LiveKit audio renderer receives the call's samples, which the app may
    # only measure. The capture types are written module-qualified, as in swift-microphone-capture.
    pattern-either:
      - patterns:
          - pattern-regex: '(?sm)^[ \t]*(?:@\w+[ \t]+)*import[ \t]+CallKit\b.*'
          - pattern-either:
              # A recorder made with no URL (an error fallback) records nothing and is left out.
              - patterns:
                  - pattern-either:
                      - pattern: AVFoundation.AVAudioRecorder(...)
                      - pattern: AVFAudio.AVAudioRecorder(...)
                      - pattern: AVFoundation.AVAudioRecorder.init(...)
                      - pattern: AVFAudio.AVAudioRecorder.init(...)
                  - pattern-not: AVFoundation.AVAudioRecorder()
                  - pattern-not: AVFAudio.AVAudioRecorder()
                  - pattern-not: AVFoundation.AVAudioRecorder.init()
                  - pattern-not: AVFAudio.AVAudioRecorder.init()
              - pattern: $E.inputNode.installTap(...)
      # LiveKit's Swift SDK: an audio renderer added to a track gets its PCM buffers.
      - patterns:
          - pattern-regex: '(?sm)^[ \t]*(?:@\w+[ \t]+)*import[ \t]+LiveKit\b.*'
          - pattern: '$T.add(audioRenderer: $R)'
    options:
      symbolic_propagation: true
    metadata:
      activity: records_calls
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/activities/records-calls
      provenance: ungovr-original
      license: MIT
