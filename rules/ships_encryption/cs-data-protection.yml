rules:
  - id: lexcode.crypto.cs-data-protection
    languages: [csharp]
    severity: INFO
    message: Encrypts data with ASP.NET Core Data Protection (a protector the app creates for its own purpose), which is shipping encryption (ships_encryption).
    # The app encrypting its own payloads with the platform's API keeps them confidential, as a bundled
    # library would. Configuring the key ring (AddDataProtection) is the framework protecting its own
    # cookies and antiforgery tokens, and cookie or bearer authentication setup (AddCookie,
    # AddIdentityCookies, AddBearerToken) is access control; neither is read. A protector whose purpose
    # is a string that names a token, a cookie, a session, a password, a one-time code or another
    # sign-in secret protects access-control data, which the export rules count as authentication, so
    # it is not read either; a purpose held in a variable is read. The provider and protector are
    # injected, so they are read by their declared type; the standalone provider by its fully
    # qualified name.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: (Microsoft.AspNetCore.DataProtection.IDataProtectionProvider $P).CreateProtector($S, ...)
              - pattern: (Microsoft.AspNetCore.DataProtection.IDataProtector $P).CreateProtector($S, ...)
          - metavariable-regex:
              metavariable: $S
              regex: (?s)^(?!\$?@?"[^"]*?(?i:token|cookie|session|auth|antiforgery|csrf|xsrf|otp|two.?factor|2fa|mfa|password|passcode|pin\b|login|signin|sign.in|remember|bearer|api.?key|secret|nonce|recovery|reset)).*
      - pattern: Microsoft.AspNetCore.DataProtection.DataProtectionProvider.Create(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
