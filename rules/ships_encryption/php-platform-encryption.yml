rules:
  - id: lexcode.crypto.php-platform-encryption
    languages: [php]
    severity: INFO
    message: Encrypts data or agrees keys with PHP's own openssl, sodium or mcrypt extension, which is shipping encryption (ships_encryption).
    # A cipher, public-key encryption or a key agreement keeps data confidential whoever wrote the code
    # that runs it, so PHP's own extensions (and the retired mcrypt) count as a bundled library does.
    # Each function is written twice, bare and with a leading backslash, since the engine matches
    # neither form with the other's pattern. Hashing (hash, md5), a MAC (hash_hmac, sodium_crypto_auth), password hashing
    # and key derivation (password_hash, sodium_crypto_pwhash, hash_pbkdf2,
    # sodium_crypto_kdf_derive_from_key), signing (openssl_sign, sodium_crypto_sign), random bytes and
    # HTTPS through file_get_contents, curl or Guzzle are not read. Laravel's Crypt facade and its
    # encrypter are php-library-encryption's.
    pattern-either:
      # openssl: symmetric ciphers, RSA, envelopes, S/MIME and CMS, and key agreement
      - pattern: openssl_encrypt(...)
      - pattern: \openssl_encrypt(...)
      - pattern: openssl_decrypt(...)
      - pattern: \openssl_decrypt(...)
      - pattern: openssl_public_encrypt(...)
      - pattern: \openssl_public_encrypt(...)
      - pattern: openssl_private_decrypt(...)
      - pattern: \openssl_private_decrypt(...)
      - pattern: openssl_seal(...)
      - pattern: \openssl_seal(...)
      - pattern: openssl_open(...)
      - pattern: \openssl_open(...)
      - pattern: openssl_pkcs7_encrypt(...)
      - pattern: \openssl_pkcs7_encrypt(...)
      - pattern: openssl_pkcs7_decrypt(...)
      - pattern: \openssl_pkcs7_decrypt(...)
      - pattern: openssl_cms_encrypt(...)
      - pattern: \openssl_cms_encrypt(...)
      - pattern: openssl_cms_decrypt(...)
      - pattern: \openssl_cms_decrypt(...)
      - pattern: openssl_pkey_derive(...)
      - pattern: \openssl_pkey_derive(...)
      - pattern: openssl_dh_compute_key(...)
      - pattern: \openssl_dh_compute_key(...)
      # sodium: secret-key and public-key boxes, sealed boxes, the AEADs, secret streams, stream
      # ciphers and key exchange
      - pattern: sodium_crypto_secretbox(...)
      - pattern: \sodium_crypto_secretbox(...)
      - pattern: sodium_crypto_secretbox_open(...)
      - pattern: \sodium_crypto_secretbox_open(...)
      - pattern: sodium_crypto_box(...)
      - pattern: \sodium_crypto_box(...)
      - pattern: sodium_crypto_box_open(...)
      - pattern: \sodium_crypto_box_open(...)
      - pattern: sodium_crypto_box_seal(...)
      - pattern: \sodium_crypto_box_seal(...)
      - pattern: sodium_crypto_box_seal_open(...)
      - pattern: \sodium_crypto_box_seal_open(...)
      - pattern: sodium_crypto_aead_aes256gcm_encrypt(...)
      - pattern: \sodium_crypto_aead_aes256gcm_encrypt(...)
      - pattern: sodium_crypto_aead_aes256gcm_decrypt(...)
      - pattern: \sodium_crypto_aead_aes256gcm_decrypt(...)
      - pattern: sodium_crypto_aead_chacha20poly1305_encrypt(...)
      - pattern: \sodium_crypto_aead_chacha20poly1305_encrypt(...)
      - pattern: sodium_crypto_aead_chacha20poly1305_decrypt(...)
      - pattern: \sodium_crypto_aead_chacha20poly1305_decrypt(...)
      - pattern: sodium_crypto_aead_chacha20poly1305_ietf_encrypt(...)
      - pattern: \sodium_crypto_aead_chacha20poly1305_ietf_encrypt(...)
      - pattern: sodium_crypto_aead_chacha20poly1305_ietf_decrypt(...)
      - pattern: \sodium_crypto_aead_chacha20poly1305_ietf_decrypt(...)
      - pattern: sodium_crypto_aead_xchacha20poly1305_ietf_encrypt(...)
      - pattern: \sodium_crypto_aead_xchacha20poly1305_ietf_encrypt(...)
      - pattern: sodium_crypto_aead_xchacha20poly1305_ietf_decrypt(...)
      - pattern: \sodium_crypto_aead_xchacha20poly1305_ietf_decrypt(...)
      - pattern: sodium_crypto_aead_aegis128l_encrypt(...)
      - pattern: \sodium_crypto_aead_aegis128l_encrypt(...)
      - pattern: sodium_crypto_aead_aegis128l_decrypt(...)
      - pattern: \sodium_crypto_aead_aegis128l_decrypt(...)
      - pattern: sodium_crypto_aead_aegis256_encrypt(...)
      - pattern: \sodium_crypto_aead_aegis256_encrypt(...)
      - pattern: sodium_crypto_aead_aegis256_decrypt(...)
      - pattern: \sodium_crypto_aead_aegis256_decrypt(...)
      - pattern: sodium_crypto_secretstream_xchacha20poly1305_init_push(...)
      - pattern: \sodium_crypto_secretstream_xchacha20poly1305_init_push(...)
      - pattern: sodium_crypto_secretstream_xchacha20poly1305_init_pull(...)
      - pattern: \sodium_crypto_secretstream_xchacha20poly1305_init_pull(...)
      - pattern: sodium_crypto_stream_xor(...)
      - pattern: \sodium_crypto_stream_xor(...)
      - pattern: sodium_crypto_stream_xchacha20_xor(...)
      - pattern: \sodium_crypto_stream_xchacha20_xor(...)
      - pattern: sodium_crypto_kx_keypair(...)
      - pattern: \sodium_crypto_kx_keypair(...)
      - pattern: sodium_crypto_kx_client_session_keys(...)
      - pattern: \sodium_crypto_kx_client_session_keys(...)
      - pattern: sodium_crypto_kx_server_session_keys(...)
      - pattern: \sodium_crypto_kx_server_session_keys(...)
      - pattern: sodium_crypto_scalarmult(...)
      - pattern: \sodium_crypto_scalarmult(...)
      # mcrypt, removed from PHP in 7.2 and still installed from PECL by old code
      - pattern: mcrypt_encrypt(...)
      - pattern: \mcrypt_encrypt(...)
      - pattern: mcrypt_decrypt(...)
      - pattern: \mcrypt_decrypt(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
