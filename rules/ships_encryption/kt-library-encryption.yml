rules:
  - id: lexcode.crypto.kt-library-encryption
    languages: [kotlin]
    severity: INFO
    message: Encrypts data or agrees keys with a cryptography library the product bundles (Bouncy Castle, Tink or libsodium), which is shipping encryption (ships_encryption).
    # A JCA cipher whose provider is Bouncy Castle by name ("BC" or BouncyCastleProvider.PROVIDER_NAME,
    # imported or fully qualified) is read here; every other Cipher.getInstance, a Bouncy Castle
    # provider object included, is kt-platform-encryption's, so no call is counted twice. Hashing, MACs,
    # signing and key derivation in these libraries are not read.
    pattern-either:
      # Bouncy Castle lightweight API, OpenPGP and CMS
      - pattern: GCMBlockCipher(...)
      - pattern: GCMBlockCipher.newInstance(...)
      - pattern: CCMBlockCipher(...)
      - pattern: EAXBlockCipher(...)
      - pattern: OCBBlockCipher(...)
      - pattern: PaddedBufferedBlockCipher(...)
      - pattern: BufferedBlockCipher(...)
      - pattern: ChaCha20Poly1305()
      - pattern: X25519Agreement()
      - pattern: ECDHBasicAgreement()
      - pattern: PGPEncryptedDataGenerator(...)
      - pattern: CMSEnvelopedDataGenerator()
      # A JCA cipher built through the Bouncy Castle provider named by its name ("BC" or the
      # PROVIDER_NAME constant), imported or fully qualified. A provider object
      # (`new BouncyCastleProvider()`, `Security.getProvider("BC")`) or a variable is not told apart
      # from the platform's provider, so that call is the platform rule's.
      - patterns:
          - pattern-either:
              - pattern: Cipher.getInstance($A, "BC")
              - pattern: Cipher.getInstance($A, BouncyCastleProvider.PROVIDER_NAME)
              - pattern: Cipher.getInstance($A, org.bouncycastle.jce.provider.BouncyCastleProvider.PROVIDER_NAME)
          - pattern-either:
              - pattern-inside: |
                  import javax.crypto.Cipher
                  ...
              - pattern-inside: |
                  import javax.crypto.*
                  ...
      - pattern: javax.crypto.Cipher.getInstance($A, "BC")
      - pattern: javax.crypto.Cipher.getInstance($A, BouncyCastleProvider.PROVIDER_NAME)
      - pattern: javax.crypto.Cipher.getInstance($A, org.bouncycastle.jce.provider.BouncyCastleProvider.PROVIDER_NAME)
      # Google Tink
      - pattern: AeadConfig.register()
      - patterns:
          - pattern: $K.getPrimitive(...)
          - pattern-regex: \b(?:Aead|HybridEncrypt|StreamingAead|DeterministicAead)::class\.java\b
      # libsodium bindings: Lazysodium (distinctive method names), then libsodium-jni and Kalium class by class
      - pattern: $S.cryptoSecretBoxEasy(...)
      - pattern: $S.cryptoBoxEasy(...)
      - pattern: $S.cryptoBoxSealEasy(...)
      - pattern: $S.cryptoAeadXChaCha20Poly1305IetfEncrypt(...)
      - pattern: $S.cryptoAeadChaCha20Poly1305IetfEncrypt(...)
      - pattern: $S.cryptoAeadAES256GCMEncrypt(...)
      - pattern: $S.cryptoSecretStreamInitPush(...)
      - patterns:
          - pattern: SecretBox(...)
          - pattern-either:
              - pattern-inside: |
                  import org.libsodium.jni.crypto.SecretBox
                  ...
              - pattern-inside: |
                  import org.libsodium.jni.crypto.*
                  ...
      - patterns:
          - pattern: Box(...)
          - pattern-either:
              - pattern-inside: |
                  import org.libsodium.jni.crypto.Box
                  ...
              - pattern-inside: |
                  import org.libsodium.jni.crypto.*
                  ...
      - patterns:
          - pattern: SecretBox(...)
          - pattern-either:
              - pattern-inside: |
                  import org.abstractj.kalium.crypto.SecretBox
                  ...
              - pattern-inside: |
                  import org.abstractj.kalium.crypto.*
                  ...
      - patterns:
          - pattern: Box(...)
          - pattern-either:
              - pattern-inside: |
                  import org.abstractj.kalium.crypto.Box
                  ...
              - pattern-inside: |
                  import org.abstractj.kalium.crypto.*
                  ...
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
