rules:
  - id: lexcode.crypto.java-jca-cipher
    languages: [java]
    severity: INFO
    message: Builds a cipher or a key agreement with the JCA (javax.crypto), which is shipping encryption (ships_encryption).
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance(...)
          - pattern: KeyAgreement.getInstance(...)
      - pattern-either:
          - pattern-inside: |
              import javax.crypto.Cipher;
              ...
          - pattern-inside: |
              import javax.crypto.KeyAgreement;
              ...
          - pattern-inside: |
              import javax.crypto.*;
              ...
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
