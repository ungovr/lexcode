rules:
  - id: lexcode.crypto.rb-attribute-encryption
    languages: [ruby]
    severity: INFO
    message: Encrypts model attributes with Rails' Active Record Encryption, Lockbox or attr_encrypted, which is shipping encryption (ships_encryption).
    # Encrypting only access-control data (a password, PIN, token, one-time or two-factor secret,
    # recovery code, API key or session data) is authentication under the export rules (15 C.F.R.
    # 772.1), not confidentiality, so a macro fires only when at least one attribute it names is
    # ordinary data. The name test is case-insensitive on each attribute named before the options:
    # it contains two_factor, recovery_code, backup_code, password, passcode, token, secret,
    # api_key, session or remember; or one of its underscore-separated words is otp, totp, mfa, 2fa,
    # pin or nonce (so shipping_address and footprint are ordinary data); or it is code or
    # login_code. Rails' own encrypted cookies and sessions are the framework's access control and
    # no rule reads them.
    patterns:
      - pattern-either:
          - pattern: encrypts $...ARGS
          - pattern: has_encrypted $...ARGS
          - pattern: encrypts_attached $...ARGS
          - pattern: attr_encrypted $...ARGS
      - metavariable-regex:
          metavariable: $...ARGS
          regex: '(?s)^\(?\s*(?:(?::\w+|"\w+"|''\w+'')\s*,\s*)*(?![:"''](?i:\w*(?:two_?factor|recovery_codes?|backup_codes?|password|passcode|token|secret(?!ar)|api_?key|session|remember)\w*|(?:\w*_)?(?:otp|totp|mfa|2fa|pin|nonce)(?:_\w*)?|code|login_code)["'']?\s*(?:[,)]|$))(?::\w+|"\w+"|''\w+'')\s*(?:[,)]|$)'
      - pattern-inside: |
          class $C
            ...
          end
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
