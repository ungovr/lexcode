rules:
  - id: lexcode.crypto.ios-plist-export-encryption
    languages: [xml]
    severity: INFO
    message: Declares ITSAppUsesNonExemptEncryption true in an Apple app's Info.plist, the developer's own statement to App Store Connect that the app uses encryption outside the export exemptions, which is shipping encryption (ships_encryption).
    # True means the app carries encryption beyond the exempt uses (the system's HTTPS among them). False
    # is the exemption and is left out. The pattern-inside asks for a dict where the key is directly
    # followed by <true/>, and xml patterns do not read comments. A dict that held the key twice would
    # match both copies, which a valid plist cannot do. The export documentation code App Store
    # Connect issues is a separate key that always comes with this one set to true, so it is not matched.
    patterns:
      - pattern: <key>ITSAppUsesNonExemptEncryption</key>
      - pattern-inside: |
          <dict>
          ...
          <key>ITSAppUsesNonExemptEncryption</key>
          <true/>
          ...
          </dict>
    paths:
      # Xcode's older templates name the file <Target>-Info.plist.
      include:
        - "Info.plist"
        - "*-Info.plist"
        - "ios-plist-export-encryption.*"
      exclude:
        - "**/example/**"
        - "**/examples/**"
        - "**/sample/**"
        - "**/samples/**"
        - "**/demo/**"
        - "**/demos/**"
        - "**/Tests/**"
        - "**/UITests/**"
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
