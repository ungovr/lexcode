rules:
  - id: lexcode.crypto.swift-password-hashing
    languages: [swift]
    severity: INFO
    message: Hashes passwords with a bundled library (Vapor's or Hummingbird's bcrypt, Argon2Swift, or CryptoSwift's PBKDF2 or scrypt), which may be shipping encryption and is worth a look (ships_encryption).
    # A password hash is one-way, so it is a signal, as bcrypt and Argon2 are for the other
    # languages. Vapor and Hummingbird compile their own bcrypt into the product. Verifying a
    # password against a stored hash is not read, and neither is the platform's own digest and key
    # derivation (CryptoKit's SHA256 and HKDF, CommonCrypto's PBKDF2). `Bcrypt` names an algorithm,
    # not a vendor, so it is written module-qualified only (Decision 8); the request's hasher is
    # read only in a file that imports Vapor.
    pattern-either:
      - pattern: Vapor.Bcrypt.hash(...)
      - patterns:
          - pattern-either:
              - pattern: $R.password.hash(...)
              - pattern: $R.password.async.hash(...)
          - pattern-inside: |
              import Vapor
              ...
      - pattern: HummingbirdBcrypt.Bcrypt.hash(...)
      - pattern: Argon2Swift.hashPasswordString(...)
      - pattern: Argon2Swift.hashPasswordBytes(...)
      - pattern: CryptoSwift.PKCS5.PBKDF2(...)
      - pattern: CryptoSwift.Scrypt(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
