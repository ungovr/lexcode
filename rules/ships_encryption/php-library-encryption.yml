rules:
  - id: lexcode.crypto.php-library-encryption
    languages: [php]
    severity: INFO
    message: Encrypts data, agrees keys or opens a secure connection with a cryptography library the product bundles (Laravel's encrypter, defuse/php-encryption, Halite, phpseclib or a JWE builder), which is shipping encryption (ships_encryption).
    # The openssl and sodium extensions' ciphers are php-platform-encryption's, and hash_hmac,
    # random_bytes and password_hash are read by neither rule; this rule reads a library the app
    # bundles. The engine does not resolve `use` imports, so each library class is read three ways:
    # fully qualified, by its short name under its own import, and by an alias under an aliased
    # import. One branch per library, so one library's import cannot admit another's call.
    # The engine's `use X;` also matches `use X as Y;`, so each short-name branch steps aside where
    # the class is aliased and the short name may be the app's own.
    pattern-either:
      # Laravel's encrypter: the Crypt facade (also through Laravel's global alias) and the Encrypter class
      - patterns:
          - pattern-either:
              - pattern: \Illuminate\Support\Facades\Crypt::$M(...)
              - pattern: \Crypt::$M(...)
              - patterns:
                  - pattern: Crypt::$M(...)
                  - pattern-inside: |
                      use Illuminate\Support\Facades\Crypt;
                      ...
                  - pattern-not-inside: |
                      use Illuminate\Support\Facades\Crypt as $AL;
                      ...
              - patterns:
                  - pattern: $A::$M(...)
                  - pattern-inside: |
                      use Illuminate\Support\Facades\Crypt as $A;
                      ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:encrypt|encryptString)$
      - pattern: new \Illuminate\Encryption\Encrypter(...)
      - patterns:
          - pattern: new Encrypter(...)
          - pattern-inside: |
              use Illuminate\Encryption\Encrypter;
              ...
          - pattern-not-inside: |
              use Illuminate\Encryption\Encrypter as $AL;
              ...
      - patterns:
          - pattern: new $A(...)
          - pattern-inside: |
              use Illuminate\Encryption\Encrypter as $A;
              ...
      # defuse/php-encryption
      - patterns:
          - pattern-either:
              - pattern: \Defuse\Crypto\$C::$M(...)
              - patterns:
                  - pattern: $C::$M(...)
                  - pattern-inside: |
                      use Defuse\Crypto\$C;
                      ...
                  - pattern-not-inside: |
                      use Defuse\Crypto\$C as $AL;
                      ...
              - patterns:
                  - pattern: $A::$M(...)
                  - pattern-inside: |
                      use Defuse\Crypto\$C as $A;
                      ...
          - metavariable-regex:
              metavariable: $C
              regex: ^(?:Crypto|File|Key|KeyProtectedByPassword)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:encrypt|encryptWithPassword|encryptFile|encryptFileWithPassword|encryptResource|encryptResourceWithPassword|createNewRandomKey|createRandomPasswordProtectedKey)$
      # Halite (paragonie/halite)
      - patterns:
          - pattern-either:
              - pattern: \ParagonIE\Halite\$C::$M(...)
              - pattern: \ParagonIE\Halite\$NS\$C::$M(...)
              - patterns:
                  - pattern: $C::$M(...)
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              use ParagonIE\Halite\$C;
                              ...
                          - pattern-not-inside: |
                              use ParagonIE\Halite\$C as $AL;
                              ...
                      - patterns:
                          - pattern-inside: |
                              use ParagonIE\Halite\$NS\$C;
                              ...
                          - pattern-not-inside: |
                              use ParagonIE\Halite\$NS\$C as $AL;
                              ...
              - patterns:
                  - pattern: $A::$M(...)
                  - pattern-either:
                      - pattern-inside: |
                          use ParagonIE\Halite\$C as $A;
                          ...
                      - pattern-inside: |
                          use ParagonIE\Halite\$NS\$C as $A;
                          ...
          - metavariable-regex:
              metavariable: $C
              regex: ^(?:Crypto|File|KeyFactory)$
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:encrypt|encryptWithAD|seal|generateEncryptionKey|generateEncryptionKeyPair|deriveEncryptionKey)$
      # phpseclib (version 3 and version 2): its ciphers, and its own SSH stack
      - patterns:
          - pattern-either:
              - pattern: new \phpseclib3\$P\$C(...)
              - pattern: new \phpseclib\$P\$C(...)
              - patterns:
                  - pattern: new $C(...)
                  - pattern-either:
                      - patterns:
                          - pattern-inside: |
                              use phpseclib3\$P\$C;
                              ...
                          - pattern-not-inside: |
                              use phpseclib3\$P\$C as $AL;
                              ...
                      - patterns:
                          - pattern-inside: |
                              use phpseclib\$P\$C;
                              ...
                          - pattern-not-inside: |
                              use phpseclib\$P\$C as $AL;
                              ...
              - patterns:
                  - pattern: new $A(...)
                  - pattern-either:
                      - pattern-inside: |
                          use phpseclib3\$P\$C as $A;
                          ...
                      - pattern-inside: |
                          use phpseclib\$P\$C as $A;
                          ...
          - metavariable-regex:
              metavariable: $P
              regex: ^(?:Crypt|Net)$
          - metavariable-regex:
              metavariable: $C
              regex: ^(?:AES|Rijndael|ChaCha20|Salsa20|Twofish|Blowfish|TripleDES|DES|RC2|RC4|SSH2|SFTP|SCP)$
      # phpseclib version 3: its key agreement, read three ways like the classes above
      - patterns:
          - pattern-either:
              - pattern: \phpseclib3\Crypt\DH::computeSecret(...)
              - patterns:
                  - pattern: DH::computeSecret(...)
                  - pattern-inside: |
                      use phpseclib3\Crypt\DH;
                      ...
                  - pattern-not-inside: |
                      use phpseclib3\Crypt\DH as $AL;
                      ...
              - patterns:
                  - pattern: $AL::computeSecret(...)
                  - pattern-inside: |
                      use phpseclib3\Crypt\DH as $AL;
                      ...
      # phpseclib's RSA encryption (version 3 and version 2; its signing is not read). A key's
      # encrypt or decrypt in a file that imports its RSA class or key loader (aliased or not, since
      # version 3 encrypts with OAEP by default), the same on a fully qualified loader or RSA object,
      # and a key set to an encrypting padding, alone or with other flags (the constant names are
      # phpseclib's own)
      - patterns:
          - pattern-either:
              - pattern: $K->encrypt(...)
              - pattern: $K->decrypt(...)
          # The engine's `$K->m(...)` also matches a static `C::m(...)`, another class's (Laravel's
          # Crypt::encrypt); a key is a variable or a call's result, so $K must hold `$` or `(`
          - metavariable-regex:
              metavariable: $K
              regex: ^[^$(]*[$(]
          - pattern-either:
              - pattern-inside: |
                  use phpseclib3\Crypt\$R;
                  ...
              - pattern-inside: |
                  use phpseclib\Crypt\$R;
                  ...
          - metavariable-regex:
              metavariable: $R
              regex: ^(?:RSA|PublicKeyLoader)$
      - patterns:
          - pattern-either:
              - pattern: $K->encrypt(...)
              - pattern: $K->decrypt(...)
          - metavariable-pattern:
              metavariable: $K
              pattern-either:
                - pattern: \phpseclib3\Crypt\PublicKeyLoader::load(...)
                - pattern: \phpseclib3\Crypt\RSA::$F(...)
      - patterns:
          - pattern-either:
              - pattern: $V->encrypt(...)
              - pattern: $V->decrypt(...)
          - pattern-either:
              - pattern-inside: |
                  $V = new \phpseclib\Crypt\RSA(...);
                  ...
              - pattern-inside: |
                  $V = \phpseclib3\Crypt\PublicKeyLoader::load(...);
                  ...
      - pattern: $K->withPadding(<... $C::ENCRYPTION_OAEP ...>)
      - pattern: $K->withPadding(<... $C::ENCRYPTION_PKCS1 ...>)
      # A JWE (an encrypted token) with web-token's builder
      - pattern: new \Jose\Component\Encryption\JWEBuilder(...)
      - patterns:
          - pattern: new JWEBuilder(...)
          - pattern-inside: |
              use Jose\Component\Encryption\JWEBuilder;
              ...
          - pattern-not-inside: |
              use Jose\Component\Encryption\JWEBuilder as $AL;
              ...
      - patterns:
          - pattern: new $A(...)
          - pattern-inside: |
              use Jose\Component\Encryption\JWEBuilder as $A;
              ...
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
