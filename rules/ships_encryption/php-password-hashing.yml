rules:
  - id: lexcode.crypto.php-password-hashing
    languages: [php]
    severity: INFO
    message: Hashes passwords with a framework's hasher (Laravel's Hash or Symfony's PasswordHasher), which may be shipping encryption and is worth a look (ships_encryption).
    # PHP's own password_hash() is the platform's, as the JDK's PBKDF2 is, and is not read.
    # The engine's `use X;` also matches `use X as Y;`, so each short-name branch steps aside where
    # the class is aliased and the short name may be the app's own.
    pattern-either:
      # Laravel's Hash facade (also through Laravel's global alias), its bcrypt() helper and hasher classes
      - pattern: \Illuminate\Support\Facades\Hash::make(...)
      - pattern: \Hash::make(...)
      - patterns:
          - pattern: Hash::make(...)
          - pattern-inside: |
              use Illuminate\Support\Facades\Hash;
              ...
          - pattern-not-inside: |
              use Illuminate\Support\Facades\Hash as $AL;
              ...
      - patterns:
          - pattern: $A::make(...)
          - pattern-inside: |
              use Illuminate\Support\Facades\Hash as $A;
              ...
      - pattern: bcrypt(...)
      - patterns:
          - pattern-either:
              - pattern: new \Illuminate\Hashing\$C(...)
              - patterns:
                  - pattern: new $C(...)
                  - pattern-inside: |
                      use Illuminate\Hashing\$C;
                      ...
                  - pattern-not-inside: |
                      use Illuminate\Hashing\$C as $AL;
                      ...
              - patterns:
                  - pattern: new $A(...)
                  - pattern-inside: |
                      use Illuminate\Hashing\$C as $A;
                      ...
          - metavariable-regex:
              metavariable: $C
              regex: ^(?:BcryptHasher|ArgonHasher|Argon2IdHasher)$
      # Symfony's password hasher service, in a file that names Symfony's hasher interface or class
      # (imported, aliased or fully qualified)
      - patterns:
          - pattern: $H->hashPassword(...)
          - pattern-regex: '(?s)\A(?=.*Symfony\\Component\\PasswordHasher\\Hasher\\UserPasswordHasher).*'
      # Symfony's hasher classes
      - patterns:
          - pattern-either:
              - pattern: new \Symfony\Component\PasswordHasher\Hasher\$C(...)
              - patterns:
                  - pattern: new $C(...)
                  - pattern-inside: |
                      use Symfony\Component\PasswordHasher\Hasher\$C;
                      ...
                  - pattern-not-inside: |
                      use Symfony\Component\PasswordHasher\Hasher\$C as $AL;
                      ...
              - patterns:
                  - pattern: new $A(...)
                  - pattern-inside: |
                      use Symfony\Component\PasswordHasher\Hasher\$C as $A;
                      ...
          - metavariable-regex:
              metavariable: $C
              regex: ^(?:NativePasswordHasher|SodiumPasswordHasher|Pbkdf2PasswordHasher|PasswordHasherFactory)$
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
