rules:
  - id: lexcode.crypto.py-library-encryption
    languages: [python]
    severity: INFO
    message: Encrypts data or agrees keys with a cryptography library the product bundles (cryptography, PyCryptodome, PyNaCl, libnacl, Tink, rsa or PGPy), which is shipping encryption (ships_encryption).
    # The component map has no entry for these libraries: each mixes hashing, MACs or signing with its
    # ciphers, and an app can link one only for a hash or a signature. This rule reads their cipher
    # and key-agreement calls instead. Hashing, MACs, key derivation, signing and a generated key pair
    # are not read.
    pattern-either:
      # cryptography: Fernet, the AEADs, a Cipher, RSA encryption and key agreement
      - pattern: Fernet(...)
      - pattern: MultiFernet(...)
      - pattern: AESGCM(...)
      - pattern: AESGCMSIV(...)
      - pattern: AESOCB3(...)
      - pattern: AESCCM(...)
      - pattern: AESSIV(...)
      - pattern: ChaCha20Poly1305(...)
      - pattern: Cipher(algorithms.$A(...), ...)
      - pattern: $K.encrypt($M, padding.OAEP(...))
      - pattern: $K.encrypt($M, cryptography.hazmat.primitives.asymmetric.padding.OAEP(...))
      - pattern: $K.encrypt($M, padding.PKCS1v15())
      - pattern: $K.decrypt($M, padding.OAEP(...))
      - pattern: $K.decrypt($M, cryptography.hazmat.primitives.asymmetric.padding.OAEP(...))
      - pattern: $K.decrypt($M, padding.PKCS1v15())
      - pattern: $K.exchange(ec.ECDH(), ...)
      - pattern: $K.exchange(cryptography.hazmat.primitives.asymmetric.ec.ECDH(), ...)
      # An X25519, X448 or finite-field Diffie-Hellman key's exchange, in a file that imports one
      - patterns:
          - pattern: $K.exchange(...)
          - pattern-either:
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric import x25519
                  ...
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric import x448
                  ...
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric import dh
                  ...
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric.x25519 import $X
                  ...
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric.x448 import $X
                  ...
              - pattern-inside: |
                  from cryptography.hazmat.primitives.asymmetric.dh import $X
                  ...
      # PyCryptodome and PyCryptodomex: its ciphers, RSA-OAEP and PKCS#1 v1.5 encryption, DH and HPKE
      - pattern: AES.new(...)
      - pattern: ChaCha20.new(...)
      - pattern: ChaCha20_Poly1305.new(...)
      - pattern: Salsa20.new(...)
      - pattern: DES3.new(...)
      - pattern: DES.new(...)
      - pattern: Blowfish.new(...)
      - pattern: CAST.new(...)
      - pattern: ARC2.new(...)
      - pattern: ARC4.new(...)
      - pattern: PKCS1_OAEP.new(...)
      - pattern: Crypto.Cipher.PKCS1_v1_5.new(...)
      - pattern: Cryptodome.Cipher.PKCS1_v1_5.new(...)
      - pattern: Crypto.Protocol.DH.key_agreement(...)
      - pattern: Cryptodome.Protocol.DH.key_agreement(...)
      - pattern: Crypto.Protocol.HPKE.new(...)
      - pattern: Cryptodome.Protocol.HPKE.new(...)
      # PyNaCl
      - pattern: SecretBox(...)
      - pattern: SealedBox(...)
      - pattern: nacl.public.Box(...)
      - pattern: nacl.secret.Aead(...)
      - patterns:
          - pattern: Box(...)
          - pattern-inside: |
              from nacl.public import Box
              ...
      # libnacl
      - pattern: libnacl.public.Box(...)
      - pattern: libnacl.secret.SecretBox(...)
      - pattern: libnacl.sealed.SealedBox(...)
      - pattern: libnacl.crypto_box(...)
      - pattern: libnacl.crypto_box_open(...)
      - pattern: libnacl.crypto_box_beforenm(...)
      - pattern: libnacl.crypto_box_seal(...)
      - pattern: libnacl.crypto_box_seal_open(...)
      - pattern: libnacl.crypto_secretbox(...)
      - pattern: libnacl.crypto_secretbox_open(...)
      - pattern: libnacl.crypto_aead_xchacha20poly1305_ietf_encrypt(...)
      - pattern: libnacl.crypto_aead_xchacha20poly1305_ietf_decrypt(...)
      - pattern: libnacl.crypto_aead_chacha20poly1305_ietf_encrypt(...)
      - pattern: libnacl.crypto_aead_chacha20poly1305_ietf_decrypt(...)
      - pattern: libnacl.crypto_aead_aes256gcm_encrypt(...)
      - pattern: libnacl.crypto_aead_aes256gcm_decrypt(...)
      # Tink: registering or getting an encrypting primitive (not a MAC or a signature)
      - pattern: tink.aead.register()
      - pattern: tink.daead.register()
      - pattern: tink.hybrid.register()
      - pattern: tink.streaming_aead.register()
      - pattern: $H.primitive(tink.aead.Aead)
      - pattern: $H.primitive(tink.daead.DeterministicAead)
      - pattern: $H.primitive(tink.hybrid.HybridEncrypt)
      - pattern: $H.primitive(tink.hybrid.HybridDecrypt)
      - pattern: $H.primitive(tink.streaming_aead.StreamingAead)
      # rsa (python-rsa): encryption and decryption, not its signatures
      - pattern: rsa.encrypt(...)
      - pattern: rsa.decrypt(...)
      # PGPy: an encrypt or decrypt call in a file that imports it (its signing and key protection
      # are not read)
      - patterns:
          - pattern-either:
              - pattern: $K.encrypt(...)
              - pattern: $K.decrypt(...)
          - pattern-either:
              - pattern-inside: |
                  import pgpy
                  ...
              - pattern-inside: |
                  from pgpy import $X
                  ...
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
