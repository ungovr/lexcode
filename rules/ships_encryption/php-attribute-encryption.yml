rules:
  - id: lexcode.crypto.php-attribute-encryption
    languages: [php]
    severity: INFO
    message: Encrypts model attributes with Laravel's encrypted casts, which is shipping encryption (ships_encryption).
    patterns:
      # Every match holds the word (a cast name or an AsEncrypted class), so a whole-file regex on it
      # keeps the engine's pre-filter: the array key pattern below has no literal of its own.
      - pattern-regex: '(?is)\A(?=.*encrypted).*'
      - pattern-either:
          # The encrypted cast names, as a cast's value (never its column name)
          - patterns:
              - pattern: '[..., $K => $V, ...]'
              - focus-metavariable: $V
              - metavariable-regex:
                  metavariable: $V
                  regex: ^(['"])encrypted(?::(?:array|collection|object))?\1$
          # The encrypted cast classes, read only under Laravel's own import or fully qualified
          # The engine's `use X;` also matches `use X as Y;`, so each short-name branch steps aside
          # where the class is aliased and the short name may be the app's own.
          - patterns:
              - pattern-either:
                  - pattern: \Illuminate\Database\Eloquent\Casts\$X::class
                  - pattern: \Illuminate\Database\Eloquent\Casts\$X::$M(...)
                  - patterns:
                      - pattern-either:
                          - pattern: $X::class
                          - pattern: $X::$M(...)
                      - pattern-inside: |
                          use Illuminate\Database\Eloquent\Casts\$X;
                          ...
                      - pattern-not-inside: |
                          use Illuminate\Database\Eloquent\Casts\$X as $AL;
                          ...
                  - patterns:
                      - pattern-either:
                          - pattern: $A::class
                          - pattern: $A::$M(...)
                      - pattern-inside: |
                          use Illuminate\Database\Eloquent\Casts\$X as $A;
                          ...
              - metavariable-regex:
                  metavariable: $X
                  regex: ^AsEncrypted(?:ArrayObject|Collection)$
      # A model's cast list: the $casts property or the casts() method
      - pattern-either:
          - pattern-inside: $casts = [...]
          - pattern-inside: |
              function casts(...) { ... }
      # Encrypting only access-control data (a password, PIN, token, one-time or two-factor secret,
      # recovery code, API key or session data) is authentication under the export rules (15 C.F.R.
      # 772.1), not confidentiality, so a cast is not read when its column is named for one. The
      # name test is case-insensitive on the key: it contains two_factor, recovery_code,
      # backup_code, password, passwd, passcode, passphrase, token, secret, api_key, remember,
      # credential(s), or a verification, invite, access, auth, reset, confirmation or activation
      # code; or one of its underscore-separated words is otp, totp, mfa, 2fa, pin, nonce, pwd or
      # jwt (so shipping_address is ordinary data); or it is session data (session or sessions,
      # alone, after another word, or with an _id, _token, _data, _key, _payload, _cookie or _store
      # suffix; session_notes is ordinary data); or it is code or login_code. The regex covers the
      # key, the arrow and the value, so it removes the value's match. Laravel's cookie encryption
      # (EncryptCookies) is the framework's access control and no rule reads it.
      - pattern-not-regex: (?i)['"](?:\w*(?:two_?factor|recovery_?codes?|backup_?codes?|password|passwd|passcode|passphrase|token|secret(?!ar)|api_?key|remember|credentials?|(?:verification|invite|access|auth|reset|confirmation|activation)_?codes?)\w*|(?:\w*_)?(?:otp|totp|mfa|2fa|pin|nonce|pwd|jwt)(?:_\w*)?|(?:\w*_)?sessions?(?:_?(?:id|ids|token|tokens|data|key|keys|payload|cookie|cookies|store))?|code|login_code)['"]\s*=>\s*(?:[^,\[\]()\n]|\([^()\n]*\))+
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
