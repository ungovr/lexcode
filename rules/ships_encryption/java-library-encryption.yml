rules:
  - id: lexcode.crypto.java-library-encryption
    languages: [java]
    severity: INFO
    message: Encrypts data or agrees keys with a cryptography library the product bundles (Bouncy Castle, Tink, libsodium, Jasypt, Spring Security Crypto, JOSE encryption, the Signal protocol or the AWS Encryption SDK), which is shipping encryption (ships_encryption).
    # A JCA cipher whose provider is Bouncy Castle by name ("BC" or BouncyCastleProvider.PROVIDER_NAME,
    # imported or fully qualified) is read here; every other Cipher.getInstance, a Bouncy Castle
    # provider object included, is java-platform-encryption's, so no call is counted twice. Hashing, MACs,
    # signing and key derivation in these libraries are not read.
    pattern-either:
      # Bouncy Castle lightweight API, OpenPGP and CMS
      - pattern: new GCMBlockCipher(...)
      - pattern: GCMBlockCipher.newInstance(...)
      - pattern: new CCMBlockCipher(...)
      - pattern: new EAXBlockCipher(...)
      - pattern: new OCBBlockCipher(...)
      - pattern: new PaddedBufferedBlockCipher(...)
      - pattern: new BufferedBlockCipher(...)
      - pattern: new ChaCha20Poly1305(...)
      - pattern: new CBCBlockCipher(...)
      - pattern: CBCBlockCipher.newInstance(...)
      - pattern: new SICBlockCipher(...)
      - pattern: SICBlockCipher.newInstance(...)
      - pattern: new CFBBlockCipher(...)
      - pattern: CFBBlockCipher.newInstance(...)
      - pattern: new ChaCha7539Engine()
      - pattern: new ChaChaEngine(...)
      - pattern: new Salsa20Engine(...)
      - pattern: new XSalsa20Engine()
      - pattern: new OAEPEncoding(...)
      - pattern: new X25519Agreement()
      - pattern: new ECDHBasicAgreement()
      - pattern: new PGPEncryptedDataGenerator(...)
      - pattern: new CMSEnvelopedDataGenerator()
      # A JCA cipher built through the Bouncy Castle provider named by its name ("BC" or the
      # PROVIDER_NAME constant), imported or fully qualified. A provider object
      # (`new BouncyCastleProvider()`, `Security.getProvider("BC")`) or a variable is not told apart
      # from the platform's provider, so that call is the platform rule's.
      - patterns:
          - pattern-either:
              - pattern: Cipher.getInstance($A, "BC")
              - pattern: Cipher.getInstance($A, BouncyCastleProvider.PROVIDER_NAME)
              - pattern: Cipher.getInstance($A, org.bouncycastle.jce.provider.BouncyCastleProvider.PROVIDER_NAME)
          - pattern-either:
              - pattern-inside: |
                  import javax.crypto.Cipher;
                  ...
              - pattern-inside: |
                  import javax.crypto.*;
                  ...
      - pattern: javax.crypto.Cipher.getInstance($A, "BC")
      - pattern: javax.crypto.Cipher.getInstance($A, BouncyCastleProvider.PROVIDER_NAME)
      - pattern: javax.crypto.Cipher.getInstance($A, org.bouncycastle.jce.provider.BouncyCastleProvider.PROVIDER_NAME)
      # Google Tink: registering or getting an encrypting primitive (current Tink passes a
      # configuration first), not a MAC or a signature
      - pattern: AeadConfig.register()
      - pattern: DeterministicAeadConfig.register()
      - pattern: HybridConfig.register()
      - pattern: StreamingAeadConfig.register()
      - pattern: $K.getPrimitive(Aead.class)
      - pattern: $K.getPrimitive(HybridEncrypt.class)
      - pattern: $K.getPrimitive(StreamingAead.class)
      - pattern: $K.getPrimitive(DeterministicAead.class)
      - pattern: $K.getPrimitive($C, Aead.class)
      - pattern: $K.getPrimitive($C, HybridEncrypt.class)
      - pattern: $K.getPrimitive($C, StreamingAead.class)
      - pattern: $K.getPrimitive($C, DeterministicAead.class)
      # libsodium bindings: Lazysodium (distinctive method names), libsodium-jni and Kalium
      - pattern: $S.cryptoSecretBoxEasy(...)
      - pattern: $S.cryptoBoxEasy(...)
      - pattern: $S.cryptoBoxSealEasy(...)
      - pattern: $S.cryptoAeadXChaCha20Poly1305IetfEncrypt(...)
      - pattern: $S.cryptoAeadChaCha20Poly1305IetfEncrypt(...)
      - pattern: $S.cryptoAeadAES256GCMEncrypt(...)
      - pattern: $S.cryptoSecretStreamInitPush(...)
      - patterns:
          - pattern-either:
              - pattern: new SecretBox(...)
              - pattern: new Box(...)
          - pattern-inside: |
              import org.libsodium.jni.crypto.$C;
              ...
      - patterns:
          - pattern-either:
              - pattern: new SecretBox(...)
              - pattern: new Box(...)
          - pattern-inside: |
              import org.abstractj.kalium.crypto.$C;
              ...
      # Jasypt and Spring Security Crypto
      - pattern: new StandardPBEStringEncryptor()
      - pattern: new StandardPBEByteEncryptor()
      - pattern: new BasicTextEncryptor()
      - pattern: new StrongTextEncryptor()
      - pattern: new AES256TextEncryptor()
      - pattern: new AesBytesEncryptor(...)
      - pattern: Encryptors.text(...)
      - pattern: Encryptors.queryableText(...)
      - pattern: Encryptors.stronger(...)
      - pattern: Encryptors.standard(...)
      - pattern: Encryptors.delux(...)
      # Nimbus JOSE encryption (a JWE, not a JWS), read only in a file that imports one of its encrypters
      - patterns:
          - pattern-either:
              - pattern: new RSAEncrypter(...)
              - pattern: new DirectEncrypter(...)
              - pattern: new AESEncrypter(...)
              - pattern: new ECDHEncrypter(...)
              - pattern: new X25519Encrypter(...)
              - pattern: new PasswordBasedEncrypter(...)
          - pattern-either:
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.RSAEncrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.DirectEncrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.AESEncrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.ECDHEncrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.X25519Encrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.PasswordBasedEncrypter;
                  ...
              - pattern-inside: |
                  import com.nimbusds.jose.crypto.*;
                  ...
      - patterns:
          - pattern: $B.encryptWith(...)
          - pattern-either:
              - pattern-inside: |
                  import io.jsonwebtoken.Jwts;
                  ...
              - pattern-inside: |
                  import io.jsonwebtoken.JwtBuilder;
                  ...
              - pattern-inside: |
                  import io.jsonwebtoken.*;
                  ...
      # End-to-end messaging: the Signal protocol and Olm
      - pattern: new SessionCipher(...)
      - pattern: new GroupCipher(...)
      - pattern: new OlmAccount()
      - pattern: new OlmSession()
      - pattern: new OlmOutboundGroupSession()
      - pattern: new OlmInboundGroupSession(...)
      # Apache Commons Crypto, the AWS Encryption SDK and PGPainless
      - patterns:
          - pattern: Utils.getCipherInstance(...)
          - pattern-inside: |
              import org.apache.commons.crypto.utils.Utils;
              ...
      - pattern: CryptoCipherFactory.getCryptoCipher(...)
      - patterns:
          - pattern: new CryptoOutputStream(...)
          - pattern-either:
              - pattern-inside: |
                  import org.apache.commons.crypto.stream.CryptoOutputStream;
                  ...
              - pattern-inside: |
                  import org.apache.commons.crypto.stream.*;
                  ...
      - pattern: AwsCrypto.builder()
      - pattern: AwsCrypto.standard()
      # PGPainless: its producer options that encrypt (encryptAndOrSign() alone may only sign)
      - patterns:
          - pattern-either:
              - pattern: ProducerOptions.encrypt(...)
              - pattern: ProducerOptions.signAndEncrypt(...)
          - pattern-either:
              - pattern-inside: |
                  import org.pgpainless.encryption_signing.ProducerOptions;
                  ...
              - pattern-inside: |
                  import org.pgpainless.encryption_signing.*;
                  ...
      - pattern: org.pgpainless.encryption_signing.ProducerOptions.encrypt(...)
      - pattern: org.pgpainless.encryption_signing.ProducerOptions.signAndEncrypt(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
