rules:
  - id: lexcode.crypto.cs-password-hashing
    languages: [csharp]
    severity: INFO
    message: Hashes passwords with a bundled library or the framework's hasher (BCrypt.Net, Konscious or Isopoh Argon2, ASP.NET Core Identity's PasswordHasher or KeyDerivation), which may be shipping encryption and is worth a look (ships_encryption).
    # The platform's own key derivation and hashing (Rfc2898DeriveBytes, SHA256) are not read, as the
    # JDK's PBKDF2 and PHP's password_hash() are not. A generic type is written without its type
    # arguments: the engine then matches `new PasswordHasher<User>()` under a `using`, its target-typed
    # `new()` and a parameter of type `IPasswordHasher<User>`, where the generic form matches none.
    # Two limits follow from that form. A namespace alias used with a generic
    # (`using Ph = Microsoft.AspNetCore.Identity;` then `new Ph.PasswordHasher<User>()`) is missed. And
    # the type is told from an app's own `PasswordHasher<T>` only by the file's imports: an app type of
    # that name is not read in a file without `using Microsoft.AspNetCore.Identity;`, but in a file that
    # has the import the engine reads it as the framework's, where C# binds it to the app's own type.
    pattern-either:
      # ASP.NET Core Identity's hasher, built or injected
      - pattern: 'new Microsoft.AspNetCore.Identity.PasswordHasher(...) { ... }'
      - pattern: 'Microsoft.AspNetCore.Identity.PasswordHasher $V = new(...) { ... };'
      - pattern: (Microsoft.AspNetCore.Identity.IPasswordHasher $H).HashPassword(...)
      - pattern: Microsoft.AspNetCore.Cryptography.KeyDerivation.KeyDerivation.Pbkdf2(...)
      # BCrypt.Net-Next (namespace BCrypt.Net, class BCrypt)
      - pattern: BCrypt.Net.BCrypt.HashPassword(...)
      - pattern: BCrypt.Net.BCrypt.EnhancedHashPassword(...)
      # Argon2: Konscious and Isopoh
      - pattern: 'new Konscious.Security.Cryptography.Argon2id(...) { ... }'
      - pattern: 'Konscious.Security.Cryptography.Argon2id $V = new(...) { ... };'
      - pattern: 'new Konscious.Security.Cryptography.Argon2i(...) { ... }'
      - pattern: 'Konscious.Security.Cryptography.Argon2i $V = new(...) { ... };'
      - pattern: 'new Konscious.Security.Cryptography.Argon2d(...) { ... }'
      - pattern: 'Konscious.Security.Cryptography.Argon2d $V = new(...) { ... };'
      - pattern: Isopoh.Cryptography.Argon2.Argon2.Hash(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
