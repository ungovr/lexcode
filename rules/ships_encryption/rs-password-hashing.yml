# Password hashing with a crate the product compiles in (argon2, scrypt and pbkdf2 through RustCrypto's
# password-hash API, bcrypt, rust-argon2's encoded hashes, password-auth). Every other language reads
# bundled password hashing as a ships_encryption signal (README: "bundled password hashing is a
# signal"), and Rust has no platform hasher, so each of these is bundled. The same calls are read for
# processes_personal_data by rs-password-hash, which keeps the account side; this rule is the
# encryption side, a question rather than evidence.
#
# A key derived from a passphrase to encrypt a file (argon2's hash_password_into, rust-argon2's
# hash_raw) has another name and is not read here. Each item is written by its crate path, which the
# engine resolves through `use`, a grouped `use` and `use ... as`, so an app's own hash or verify
# function is not read as bcrypt's.
rules:
  - id: lexcode.crypto.rs-password-hashing
    languages: [rust]
    severity: INFO
    message: Hashes or checks passwords with a crate the product compiles in (argon2, scrypt or pbkdf2 through the password-hash API, bcrypt, rust-argon2 or password-auth), which may be shipping encryption and is worth a look (ships_encryption).
    pattern-either:
      - pattern: argon2::PasswordHash::generate(...)
      - pattern: argon2::password_hash::PasswordHash::generate(...)
      - pattern: password_hash::PasswordHash::generate(...)
      - pattern: argon2::Argon2::default().hash_password(...)
      - pattern: argon2::Argon2::default().verify_password(...)
      - pattern: argon2::Argon2::new(...).hash_password(...)
      - pattern: argon2::Argon2::new(...).verify_password(...)
      # An Argon2 bound to a local first (`let argon2 = Argon2::default(); argon2.hash_password(..)`):
      # the file is checked for an Argon2 being built, and the method is matched on any receiver there,
      # as rs-password-hash does (a `let ...; ...` sequence scope cost 45 s on an 865 KB file). The
      # password-hash API takes the password and a salt or parsed hash, so an app's own one-argument
      # hash_password beside an Argon2 built for key derivation is not read.
      - patterns:
          - pattern-regex: '(?s)\A(?=.*Argon2::(?:default|new)\b).*'
          - pattern-either:
              - pattern: $A.hash_password($PW, $SALT)
              - pattern: $A.verify_password($PW, $HASH)
      - pattern: scrypt::Scrypt.hash_password(...)
      - pattern: pbkdf2::Pbkdf2.hash_password(...)
      - pattern: bcrypt::hash(...)
      - pattern: bcrypt::hash_with_result(...)
      - pattern: bcrypt::hash_with_salt(...)
      - pattern: bcrypt::verify(...)
      - pattern: argon2::hash_encoded(...)
      - pattern: argon2::verify_encoded(...)
      - pattern: password_auth::generate_hash(...)
      - pattern: password_auth::verify_password(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
