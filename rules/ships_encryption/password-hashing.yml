rules:
  - id: lexcode.crypto.password-hashing
    languages: [javascript, typescript, python, go]
    severity: INFO
    message: Hashes passwords with a bundled library (bcrypt, Argon2 or passlib), which may be shipping encryption and is worth a look (ships_encryption).
    pattern-either:
      - pattern: bcrypt.hash(...)
      - pattern: bcrypt.hashSync(...)
      - pattern: bcrypt.hashpw(...)
      - pattern: bcrypt.GenerateFromPassword(...)
      - pattern: argon2.hash(...)
      - pattern: argon2.IDKey(...)
      - pattern: argon2.Key(...)
      - pattern: PasswordHasher(...)
      - pattern: CryptContext(...)
      - pattern: PasswordHash.recommended()
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
