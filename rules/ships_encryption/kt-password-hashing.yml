rules:
  - id: lexcode.crypto.kt-password-hashing
    languages: [kotlin]
    severity: INFO
    message: Hashes passwords with a bundled library (Spring Security's encoders, bcrypt or Argon2), which may be shipping encryption and is worth a look (ships_encryption).
    pattern-either:
      - pattern: BCryptPasswordEncoder(...)
      - pattern: Argon2PasswordEncoder(...)
      - pattern: Argon2PasswordEncoder.$M(...)
      - pattern: SCryptPasswordEncoder(...)
      - pattern: SCryptPasswordEncoder.$M(...)
      - pattern: Pbkdf2PasswordEncoder(...)
      - pattern: Pbkdf2PasswordEncoder.$M(...)
      - pattern: PasswordEncoderFactories.createDelegatingPasswordEncoder()
      # jBCrypt
      - patterns:
          - pattern: BCrypt.hashpw(...)
          - pattern-either:
              - pattern-inside: |
                  import org.mindrot.jbcrypt.BCrypt
                  ...
              - pattern-inside: |
                  import org.mindrot.jbcrypt.*
                  ...
      # Favre bcrypt
      - patterns:
          - pattern-either:
              - pattern: BCrypt.withDefaults()
              - pattern: BCrypt.with(...)
          - pattern-either:
              - pattern-inside: |
                  import at.favre.lib.crypto.bcrypt.BCrypt
                  ...
              - pattern-inside: |
                  import at.favre.lib.crypto.bcrypt.*
                  ...
      - pattern: org.mindrot.jbcrypt.BCrypt.hashpw(...)
      - pattern: Argon2Factory.create(...)
    metadata:
      activity: ships_encryption
      mentioned: performs
      strength: signal
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
