# rustls is a TLS stack written in Rust and compiled into the app's own binary, with its cryptography
# from a provider crate (ring or aws-lc-rs) compiled in beside it. The definition counts code that
# bundles a cryptography library that encrypts, and leaves out HTTPS through the stock client. So the
# app's own code choosing rustls is read: building a rustls client or server configuration (directly or
# through tokio-rustls's re-export), installing its cryptography provider, serving TLS through
# axum-server's, Poem's or warp's rustls listener, hyper-rustls's connector, and asking reqwest for its
# rustls backend.
#
# Not read: native-tls and openssl's SslConnector and SslAcceptor, which hand TLS to the operating
# system's stack (SChannel, Security.framework) or the system's OpenSSL, the nearest thing Rust has to
# the platform's own; and a plain reqwest, hyper or sqlx call over HTTPS, whose TLS backend is a Cargo
# feature this rule cannot see. That leaves an asymmetry, a known gap: an app that calls
# `use_rustls_tls()` or builds hyper-rustls's connector is read, and one that gets the same rustls
# through reqwest's `rustls-tls` feature (or reqwest 0.13's default) with no call is not.
#
# tokio-rustls's and Poem's own examples import the config through a nested group
# (`use tokio_rustls::{rustls::{ClientConfig, ..}, TlsConnector}`,
# `use poem::{listener::{RustlsConfig, ..}, ..}`), which the engine does not resolve, so those carry
# short forms, each read only in a file whose `use` line for the crate names the item.
rules:
  - id: lexcode.crypto.rs-bundled-tls
    languages: [rust]
    severity: INFO
    message: Builds or serves TLS with rustls, a secure-connection stack the product compiles in, which is shipping encryption (ships_encryption).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: rustls::ServerConfig::$M(...)
              - pattern: rustls::ClientConfig::$M(...)
              - pattern: tokio_rustls::rustls::ServerConfig::$M(...)
              - pattern: tokio_rustls::rustls::ClientConfig::$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:builder|builder_with_provider|builder_with_protocol_versions|new)$
      - pattern: rustls::crypto::ring::default_provider()
      - pattern: rustls::crypto::aws_lc_rs::default_provider()
      - pattern: rustls::crypto::CryptoProvider::install_default(...)
      - patterns:
          - pattern: axum_server::tls_rustls::RustlsConfig::$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^from_(?:pem|pem_file|pem_chain_file|der|config)$
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+tokio_rustls::[^;]*\bServerConfig\b).*'
          - pattern: ServerConfig::$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:builder|builder_with_provider|builder_with_protocol_versions|new)$
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+tokio_rustls::[^;]*\bClientConfig\b).*'
          - pattern: ClientConfig::$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(?:builder|builder_with_provider|builder_with_protocol_versions|new)$
      - pattern: poem::listener::RustlsConfig::new()
      - patterns:
          - pattern-regex: '(?ms)\A(?=.*^\x{FEFF}?[ \t]*(?:pub(?:\([^)]*\))?\s+)?use\s+poem::[^;]*\bRustlsConfig\b).*'
          - pattern: RustlsConfig::new()
      - pattern: warp::serve($R).tls()
      - pattern: hyper_rustls::HttpsConnectorBuilder::new()
      - pattern: $B.use_rustls_tls()
    metadata:
      activity: ships_encryption
      mentioned: performs
      definition: https://lexlint.io/glossary#ships-encryption
      provenance: ungovr-original
      license: MIT
