# Publishes lexcode to npm by trusted publishing when a version tag is pushed.
#
# Two jobs, so the publishing credential is minted only where the repository's
# own code never runs: `build` checks out, tests and packs with read-only
# access; `publish` downloads the packed tarball and hands it to npm. `publish`
# waits for the `npm` environment, whose required reviewer approves each
# release. No npm token is stored anywhere: npm exchanges the job's OIDC token
# for a short-lived publish credential and records provenance.
#
# A prerelease tag (v1.0.0-rc.1) publishes under the `next` dist-tag, never
# `latest`. Rollback levers are in RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The tag is the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG is not v$version, the version in package.json" >&2
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install
        run: npm ci
      - name: Test
        env:
          LEXCODE_GATE: "1"
        run: |
          npm run build
          node dist/cli.js engine fetch
          npm test
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: lexcode-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/lexcode
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm new enough for trusted publishing
        run: npm install -g npm@11.6.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish ./lexcode-*.tgz --access public --provenance --tag "$DIST_TAG"
