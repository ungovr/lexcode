# Builds and tests lexcode on every branch push and pull request. The fixture
# tests download the pinned engine once per runner and cache it.
#
# A tag push runs only release.yml, which tests the tagged commit itself; a
# second full run here would only compete for macOS runners
# (ungovr/ungovr#13493).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  socket:
    # Every OS in the test matrix below installs its own native bindings.
    uses: ./.github/workflows/socket.yml
    with:
      runners: '["ubuntu-24.04", "macos-15"]'

  test:
    needs: socket
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    env:
      LEXCODE_CACHE_DIR: ${{ github.workspace }}/.lexcode-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Engine cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.LEXCODE_CACHE_DIR }}
          key: lexcode-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/engine/pin.ts') }}
      - name: Engine
        run: node dist/cli.js engine fetch
      - name: Test
        run: npm test
